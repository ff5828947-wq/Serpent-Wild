<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JKS to Base64</title>
  <style>
    body { font-family: sans-serif; padding: 16px; background: #0f172a; color: #fff; }
    textarea { width: 100%; height: 180px; margin-top: 12px; padding: 10px; border-radius: 8px; background: #1e293b; color: #86efac; border: 1px solid #475569; }
    button { margin-top: 10px; padding: 10px 16px; border-radius: 8px; border: none; background: #22c55e; color: #052e16; font-weight: bold; }
  </style>
</head>
<body>
  <h2>serpent-release.jks → Base64</h2>
  <input type="file" id="fileInput" />
  <br />
  <button id="copyBtn" type="button">Copy Base64 Text</button>
  <textarea id="output" readonly placeholder="Yahan Base64 text aayega..."></textarea>
  <script>
    const input = document.getElementById('fileInput');
    const out = document.getElementById('output');
    const copyBtn = document.getElementById('copyBtn');
    input.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const bytes = new Uint8Array(await file.arrayBuffer());
      let bin = '';
      for (let i = 0; i < bytes.length; i += 0x8000) {
        bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      }
      out.value = btoa(bin);
    });
    copyBtn.addEventListener('click', () => {
      out.select();
      navigator.clipboard?.writeText(out.value);
      copyBtn.textContent = 'Copied ✅';
    });
  </script>
</body>
</html>
