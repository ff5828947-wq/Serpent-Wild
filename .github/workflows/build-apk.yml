                        c.beginPath(); c.moveTo(-hr * 0.55, k * hr * 0.34); c.quadraticCurveTo(-hr * 1.15, k * hr * 0.55 + wig, -hr * 1.48, k * hr * 0.44 - wig); c.stroke();
                      }
                    } else if (acc === 'spider') {
