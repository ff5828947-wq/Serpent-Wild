                      c.beginPath(); c.moveTo(hr * 1.36, s * hr * 0.08); c.quadraticCurveTo(hr * 0.82, s * hr * 0.56, hr * 0.04, s * hr * 0.84); c.stroke();
                    }
                    if (jawOpen > 0.15 || sp.anim >= 2) {
                      c.fillStyle = '#ffffff';
                      for (const s of [-1, 1]) { c.beginPath(); c.moveTo(hr * 1.05, s * hr * 0.32); c.lineTo(hr * 1.44, s * hr * 0.22); c.lineTo(hr * 1.02, s * hr * 0.12); c.closePath(); c.fill(); }
                    }
                  }

                  // Unique Eyes (Visor, Panda Patch, Hollow, Glowing Animated, Slit, Big)
                  if (sp.eyeStyle === 'visor') {
