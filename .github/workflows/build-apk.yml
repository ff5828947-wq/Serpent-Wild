                    this.turnDelta = lerp(this.turnDelta, clamp(diff * 2.5, -1, 1), dt * 10);
                    this.angle += clamp(diff, -turnRate * dt, turnRate * dt);
                    this.slitherPhase += dt * (canBoost ? 14 : 9.2);
                    const sAng = this.angle + Math.sin(this.slitherPhase) * 0.08;
                    this.x += Math.cos(sAng) * spd * dt;
                    this.y += Math.sin(sAng) * spd * dt;

                    const r = this.getRadius();
                    if (dist(this.x, this.y, WORLD_CENTER, WORLD_CENTER) + r > ARENA_RADIUS) { killSnake(this, null, 'Jungle Cliff'); return; }
                    if (safeZone.active && dist(this.x, this.y, safeZone.cx, safeZone.cy) > safeZone.r) {
                      this.mass -= (2.5 + (safeZone.stage - 1) * 1.2) * dt;
                      if (this.mass < 9) { killSnake(this, null, 'Storm Zone'); return; }
                    }

                    this.segments[0].x = this.x; this.segments[0].y = this.y;
                    const extraStretch = this.mass > 350 ? clamp((this.mass - 350) * 0.0007, 0, 0.22) : 0;
                    const spc = r * (0.40 + extraStretch);
                    for (let i = 1; i < this.segments.length; i++) {
                      const p = this.segments[i - 1], c = this.segments[i];
                      if (i === 1) {
                        c.x = lerp(c.x, p.x - Math.cos(this.angle) * spc, clamp(dt * 12, 0, 0.55));
                        c.y = lerp(c.y, p.y - Math.sin(this.angle) * spc, clamp(dt * 12, 0, 0.55));
                      }
                      const dx = c.x - p.x, dy = c.y - p.y, d = Math.hypot(dx, dy) || 0.001;
                      if (d > spc) { const rt = spc / d; c.x = p.x + dx * rt; c.y = p.y + dy * rt; }
                    }
                    const tLen = this.getSegCount();
                    while (this.segments.length < tLen) { const tl = this.segments[this.segments.length - 1]; this.segments.push({ x: tl.x, y: tl.y }); }
                    while (this.segments.length > tLen && this.segments.length > 14) this.segments.pop();

                    if (near) {
                      const wantHood = this.species.hood ? (canBoost ? 1.0 : 0.48) : 0;
                      this.hoodFlare = lerp(this.hoodFlare, wantHood, dt * 6);
                      this.tongueTimer -= dt;
                      if (this.tongueTimer <= 0) {
                        const p = -this.tongueTimer / 0.4;
                        if (p < 1) this.tongueExt = Math.sin(p * Math.PI);
                        else { this.tongueExt = 0; this.tongueTimer = rand(1.0, 2.4); }
                      } else this.tongueExt = 0;

                      this.rippleCd -= dt;
                      if (this.terrain === 'water' && this.rippleCd <= 0 && ripples.length < 36) { ripples.push({ x: this.x, y: this.y, r: r * 0.7, maxR: r * 3.0, life: 0.7, maxLife: 0.7 }); this.rippleCd = 0.18; }
                      this.trackCd -= dt;
                      if (this.terrain === 'mud' && this.trackCd <= 0 && tracks.length < 70) { tracks.push({ x: this.segments[3].x, y: this.segments[3].y, r: r * 0.85, ang: this.angle, life: 3.0, maxLife: 3.0 }); this.trackCd = 0.12; }

                      this.trailCd -= dt;
                      if ((canBoost || this.species.curr !== 'free') && this.trailCd <= 0) {
                        const sIdx = Math.floor(rand(2, Math.max(3, this.segments.length - 1)));
                        const sg = this.segments[sIdx], ang = rand(0, Math.PI * 2);
                        const edgeX = sg.x + Math.cos(ang) * (r * 0.95), edgeY = sg.y + Math.sin(ang) * (r * 0.95);
                        const pCol = this.species.fx === 'prism' ? `hsl(${(globalTime * 180) % 360}, 100%, 62%)` : (this.species.glow || '#ffe45c');
                        if (particles.length < 180) {
                          particles.push({ x: edgeX, y: edgeY, vx: Math.cos(ang) * (35 + this.species.fxPower * 45), vy: Math.sin(ang) * (35 + this.species.fxPower * 45), life: 0.42, maxLife: 0.42, size: 2.2 + this.species.fxPower * 2.2, color: pCol });
                        }
                        this.trailCd = canBoost ? 0.06 : Math.max(0.08, 0.28 - this.species.fxPower * 0.14);
                      }
                    }
                  }

                  draw(c, showLabel = true) {
                    if (!this.alive || this.segments.length < 4) return;
                    const baseR = this.getRadius(), len = this.segments.length;
                    const detail = profile.settings.gfx !== 'low';
                    const fx = this.species.fx, pwr = this.species.fxPower, seed = this.species.fxSeed;
                    const fxStep = len > 130 ? 4 : 2;

                    const pts = new Array(len);
                    for (let i = 0; i < len; i++) {
                      const seg = this.segments[i];
                      const prev = this.segments[Math.max(0, i - 1)], next = this.segments[Math.min(len - 1, i + 1)];
                      const ang = i === 0 ? Math.atan2(seg.y - this.segments[1].y, seg.x - this.segments[1].x) : Math.atan2(prev.y - next.y, prev.x - next.x);
                      const nx = -Math.sin(ang), ny = Math.cos(ang);
                      const mask = i < 3 ? 0 : Math.min(1, (i - 2) / 4) * (1 - (i / len) * 0.2);
                      const wave = Math.sin(this.slitherPhase - i * 0.36) * (baseR * 0.14 * mask);
                      pts[i] = { x: seg.x + nx * wave, y: seg.y + ny * wave, ang, nx, ny, w: this.getHalfWidth(i, len, baseR) };
                    }

                    c.save();
                    c.globalAlpha = 1.0;

                    if (detail) {
                      c.fillStyle = 'rgba(0,0,0,0.4)';
                      for (let i = len - 1; i >= 0; i -= fxStep) { const p = pts[i]; c.beginPath(); c.arc(p.x + 5, p.y + 8, p.w * 1.04, 0, Math.PI * 2); c.fill(); }
                    }

                    const glowCol = this.species.glow || (this.boosting ? '#ffe45c' : null);
                    if (detail && (fx !== 'none' || this.boosting) && glowCol) {
                      for (let i = len - 1; i >= 1; i -= fxStep) {
                        const p = pts[i], w = p.w;
                        const tCol = fx === 'prism' ? `hsl(${(globalTime * 160 + i * 14 + seed * 30) % 360}, 100%, 62%)` : glowCol;
                        const pulse = 0.65 + 0.35 * Math.sin(globalTime * (4 + pwr * 4) - i * 0.35 + seed);

                        c.fillStyle = tCol; c.globalAlpha = clamp(0.16 + pwr * 0.15, 0.14, 0.32) * pulse;
                        c.beginPath(); c.arc(p.x, p.y, w * (1.2 + pwr * 0.28 + (this.boosting ? 0.14 : 0)), 0, Math.PI * 2); c.fill();

                        c.globalAlpha = 0.85;
                        if (fx === 'fire') {
                          const fl = 0.5 + 0.5 * Math.sin(globalTime * 16 + i * 1.9 + seed);
                          const side = (i % 4 === 0 ? 1 : -1) * w * (1.05 + fl * 0.35 * pwr);
                          c.fillStyle = tCol; c.beginPath(); c.arc(p.x + p.nx * side, p.y + p.ny * side, 3 + pwr * 3 * fl, 0, Math.PI * 2); c.fill();
                        } else if (fx === 'ice') {
                          const spk = Math.sin(globalTime * 8 + i * 2.7 + seed);
                          if (spk > 0.15) {
                            const side = (i % 4 === 0 ? 1 : -1) * w * 1.18, sr = (4 + pwr * 4) * spk;
                            const sx = p.x + p.nx * side, sy = p.y + p.ny * side;
                            c.fillStyle = '#ffffff'; c.beginPath(); c.moveTo(sx, sy - sr); c.lineTo(sx + sr * 0.4, sy); c.lineTo(sx, sy + sr); c.lineTo(sx - sr * 0.4, sy); c.closePath(); c.fill();
                          }
                        } else if (fx === 'elec' && i > 2) {
                          const nxt = pts[i - 2];
                          if (Math.sin(globalTime * 20 + i * 3.1 + seed) > 0) {
                            const side = (i % 4 === 0 ? 1 : -1) * w * 1.2;
                            c.strokeStyle = tCol; c.lineWidth = 1.6 + pwr;
                            c.beginPath(); c.moveTo(p.x + p.nx * w * 0.9, p.y + p.ny * w * 0.9);
                            c.lineTo((p.x + nxt.x) * 0.5 + p.nx * side * 1.35, (p.y + nxt.y) * 0.5 + p.ny * side * 1.35);
                            c.lineTo(nxt.x + nxt.nx * w * 0.9, nxt.y + nxt.ny * w * 0.9); c.stroke();
                          }
                        } else if (fx === 'helix') {
                          const side = Math.sin(globalTime * 6 - i * 0.45 + seed) * w * (1.28 + pwr * 0.25);
                          c.fillStyle = tCol; c.beginPath(); c.arc(p.x + p.nx * side, p.y + p.ny * side, 2.5 + pwr * 2.4, 0, Math.PI * 2); c.fill();
                        } else if (fx === 'rings' && i % 4 === 0) {
                          const rw = 1.05 + (0.45 + pwr * 0.35) * ((globalTime * 1.8 + i * 0.2) % 1);
                          c.strokeStyle = tCol; c.lineWidth = 1.5 + pwr; c.globalAlpha = 1 - ((globalTime * 1.8 + i * 0.2) % 1);
                          c.beginPath(); c.arc(p.x, p.y, w * rw, 0, Math.PI * 2); c.stroke();
                        } else if (fx === 'orbit' && i % 4 === 0) {
                          const oa = globalTime * (4.5 + pwr * 2) + i + seed;
                          c.fillStyle = tCol; c.beginPath(); c.arc(p.x + Math.cos(oa) * w * 1.35, p.y + Math.sin(oa) * w * 1.35, 2.5 + pwr * 2.2, 0, Math.PI * 2); c.fill();
                        } else if (fx === 'cosmic' || fx === 'prism' || fx === 'royal') {
                          const side = (i % 4 === 0 ? 1 : -1) * w * (1.25 + pwr * 0.25);
                          c.fillStyle = fx === 'royal' ? '#fff9c4' : tCol;
                          c.beginPath(); c.arc(p.x + p.nx * side, p.y + p.ny * side, 2.2 + pwr * 2.2 * pulse, 0, Math.PI * 2); c.fill();
                        }
                      }
                      c.globalAlpha = 1.0;
                    }

                    const pat = this.species.pat;
                    c.fillStyle = this.species.dark;
                    for (let i = len - 1; i >= 1; i--) {
                      const p = pts[i];
                      c.beginPath(); c.arc(p.x, p.y, p.w * 1.04, 0, Math.PI * 2); c.fill();
                    }
                    for (let i = len - 1; i >= 1; i--) {
                      const p = pts[i], w = p.w;
                      const sg = c.createRadialGradient(p.x - w * 0.24, p.y - w * 0.24, w * 0.08, p.x, p.y, w);
                      sg.addColorStop(0, this.species.base);
                      sg.addColorStop(0.72, this.species.mid);
                      sg.addColorStop(1, this.species.dark);
                      c.fillStyle = sg;
                      c.beginPath(); c.arc(p.x, p.y, w, 0, Math.PI * 2); c.fill();

                      if (i % 3 === 0) {
                        c.save(); c.translate(p.x, p.y); c.rotate(p.ang);
                        if (this.species.id === 'tiger') { c.fillStyle = '#121010'; c.fillRect(-w * 0.2, -w * 0.9, w * 0.4, w * 1.8); }
                        else if (this.species.id === 'panda') { c.fillStyle = (i % 6 === 0) ? '#14171a' : '#ffffff'; c.beginPath(); c.arc(0, 0, w * 0.72, 0, Math.PI * 2); c.fill(); }
                        else if (pat === 'skeleton') { c.strokeStyle = '#f2f7ff'; c.lineWidth = Math.max(1.8, w * 0.18); c.beginPath(); c.moveTo(0, -w * 0.75); c.lineTo(0, w * 0.75); c.stroke(); c.fillStyle = '#ffffff'; c.beginPath(); c.arc(0, 0, w * 0.24, 0, Math.PI * 2); c.fill(); }
                        else if (pat === 'racer') { c.fillStyle = '#ffffff'; c.fillRect(-w * 0.45, -w * 0.22, w * 0.9, w * 0.44); }
                        else if (pat === 'plasma') { c.strokeStyle = '#00f7ff'; c.lineWidth = 1.6; c.beginPath(); c.arc(0, 0, w * 0.45, 0, Math.PI * 2); c.stroke(); c.fillStyle = this.species.accent; c.beginPath(); c.arc(0, 0, w * 0.24, 0, Math.PI * 2); c.fill(); }
                        else {
                          c.fillStyle = this.species.accent; c.globalAlpha = 0.82;
                          c.beginPath(); c.moveTo(w * 0.44, 0); c.lineTo(0, -w * 0.5); c.lineTo(-w * 0.44, 0); c.lineTo(0, w * 0.5); c.closePath(); c.fill();
                          c.globalAlpha = 1.0;
                        }
                        c.restore();
                      }
                      if (detail && i % 2 === 0) {
                        c.fillStyle = 'rgba(255,255,255,0.14)';
                        c.beginPath(); c.arc(p.x - w * 0.22, p.y - w * 0.22, w * 0.34, 0, Math.PI * 2); c.fill();
                      }
                    }

                    if (this.species.rattle) {
                      const tl = pts[len - 1];
                      c.save(); c.translate(tl.x, tl.y); c.rotate(tl.ang + Math.sin(globalTime * 52) * 0.16);
                      for (let b = 0; b < 5; b++) { c.fillStyle = b % 2 === 0 ? '#dec08e' : '#967442'; c.beginPath(); c.ellipse(-b * 4.2 - 4, 0, 3.8 - b * 0.35, 3.3 - b * 0.28, 0, 0, Math.PI * 2); c.fill(); }
                      c.restore();
                    }

                    const neckAng = pts[0].ang;
                    const headAng = neckAng + angleDiff(this.angle, neckAng) * 0.55;
                    const hr = baseR * this.species.girth * 1.06;
                    c.save(); c.translate(pts[0].x, pts[0].y); c.rotate(headAng);
                    if (detail) { c.fillStyle = 'rgba(0,0,0,0.4)'; c.beginPath(); c.ellipse(4, 6, hr * 1.25, hr * 0.9, 0, 0, Math.PI * 2); c.fill(); }
                    drawSpeciesHead(c, this.species, hr, this.tongueExt, Math.max(this.jawOpen, this.boosting ? 0.28 : 0), this.turnDelta);
                    if (this.spawnShield > 0) { c.strokeStyle = 'rgba(77, 226, 240, 0.85)'; c.lineWidth = 2.5; c.beginPath(); c.arc(0, 0, hr * 1.85, 0, Math.PI * 2); c.stroke(); }
                    if (this.isPlayer && showLabel) { c.fillStyle = 'rgba(255, 148, 36, 0.9)'; c.beginPath(); c.moveTo(hr * 2.55, 0); c.lineTo(hr * 2.0, -hr * 0.42); c.lineTo(hr * 2.15, 0); c.lineTo(hr * 2.0, hr * 0.42); c.closePath(); c.fill(); }
                    c.restore();

                    // LIVE #1 APEX KING CROWN!
                    if (showLabel && this === leaderSnake) {
                      const bob = Math.sin(globalTime * 5) * 3;
                      c.save();
                      c.font = `${Math.round(clamp(hr * 0.95, 16, 30))}px sans-serif`;
                      c.textAlign = 'center'; c.textBaseline = 'middle';
                      c.shadowColor = '#ffe047'; c.shadowBlur = 12;
                      c.fillText('👑', this.x, this.y - hr - 22 + bob);
                      c.restore();
                    }

                    if (showLabel && !this.isPlayer) {
                      c.font = 'bold 10.5px sans-serif'; c.textAlign = 'center';
                      c.fillStyle = 'rgba(0,0,0,0.78)'; c.fillText(this.name, this.x + 1, this.y - hr - 11);
                      c.fillStyle = this === leaderSnake ? '#ffe45c' : '#eef7eb'; c.fillText(this.name, this.x, this.y - hr - 12);
                    }
                    c.restore();
                  }
                }

                function showStreakBanner(txt) {
                  const el = document.getElementById('streakBanner');
                  if (!el) return;
                  el.textContent = txt; el.style.display = 'block';
                  setTimeout(() => { el.style.display = 'none'; }, 2400);
                }

                function killSnake(victim, killer, cause) {
                  if (!victim.alive) return;
                  victim.alive = false;
                  spawnParticles(victim.x, victim.y, '#e82534', 18, 160);
                  const mStep = Math.max(3, Math.floor(victim.segments.length / 26));
                  for (let i = 0; i < victim.segments.length; i += mStep) {
                    meatList.push({ x: victim.segments[i].x + rand(-12, 12), y: victim.segments[i].y + rand(-12, 12), r: rand(12, 16), mass: 14.0, rot: rand(0, 6.28), life: 34 });
                  }
                  if (killer && killer !== victim) {
                    killer.kills++;
                    if (killer.isPlayer) {
                      matchStats.kills++; Sound.kill(); vibrate(60);
                      killStreak = streakTimer > 0 ? killStreak + 1 : 1;
                      streakTimer = 8.0;
                      if (killStreak === 2) showStreakBanner('🔥 DOUBLE KILL!');
                      else if (killStreak === 3) showStreakBanner('⚡ TRIPLE KILL!');
                      else if (killStreak >= 4) showStreakBanner('👑 RAMPAGE!');
                      floatTexts.push({ x: victim.x, y: victim.y - 20, text: `KILL! +25 🪙 +1 💎`, color: '#ffe45c', life: 1.3, maxLife: 1.3 });
                    }
                    pushKillFeed(`${killer.name} [${cause}] ${victim.name}`);
                  } else {
                    pushKillFeed(`${victim.name} (${cause})`);
                  }
                  if (!victim.isPlayer && profile.selectedMode === 'infinity') {
                    const sp = SPECIES[Math.floor(Math.random() * SPECIES.length)];
                    const pt = randInCircle(WORLD_CENTER, WORLD_CENTER, ARENA_RADIUS, 340);
                    snakes.push(new Snake({ name: victim.name, species: sp, x: pt.x, y: pt.y, mass: rand(14, 24) }));
                    return;
                  }
                  const aliveCount = snakes.filter(s => s.alive).length;
                  if (victim.isPlayer) {
                    matchStats.rank = aliveCount + 1;
                    matchStats.reason = killer ? `Your head crashed into ${killer.name}!` : `Eliminated by ${cause}`;
                    endMatch(false);
                  } else if (player && player.alive && aliveCount === 1) {
                    matchStats.rank = 1;
                    matchStats.reason = 'Last Beast Standing — 50-Player Champion!';
                    endMatch(true);
                  }
                }

                function spawnPrey(count = 1) {
                  for (let i = 0; i < count; i++) {
                    const t = PREY_TYPES[Math.floor(Math.random() * PREY_TYPES.length)];
                    const pt = randInCircle(safeZone.cx, safeZone.cy, Math.min(safeZone.r, ARENA_RADIUS), 200);
                    preyList.push({ ...t, x: pt.x, y: pt.y, angle: rand(0, Math.PI * 2), timer: rand(0.5, 2.5) });
                  }
                }
                function spawnPotions(count = 1) {
                  for (let i = 0; i < count; i++) {
                    const t = POTION_TYPES[Math.floor(Math.random() * POTION_TYPES.length)];
                    const pt = randInCircle(safeZone.cx, safeZone.cy, Math.min(safeZone.r, ARENA_RADIUS), 280);
                    potions.push({ ...t, x: pt.x, y: pt.y, r: 18, life: 45 });
                  }
                }
                function spawnGoldenDrop() {
                  const pt = randInCircle(safeZone.cx, safeZone.cy, Math.min(safeZone.r * 0.8, ARENA_RADIUS - 400), 220);
                  feastDrops.push({ x: pt.x, y: pt.y, r: 24, life: 50 });
                  Sound.drop();
                  const al = document.getElementById('dropAlert');
                  al.style.display = 'block';
                  setTimeout(() => { al.style.display = 'none'; }, 4500);
                }
                function refreshQuickPotions() {
                  ['magnet', 'turbo', 'zoom', 'double'].forEach(id => {
                    const el = document.getElementById(`qpc_${id}`);
                    if (el) el.textContent = profile.potionInv[id] || 0;
                  });
                }

                function startMatch() {
                  screenState = 'playing'; tacMapOpen = false;
                  activePotion = { id: null, label: '', timer: 0 };
                  mission = { goal: 40, done: false };
                  killStreak = 0; streakTimer = 0; leaderSnake = null;
                  document.getElementById('tacMapOverlay').classList.remove('open');
                  document.getElementById('lobbyScreen').style.display = 'none';
                  document.getElementById('resultsScreen').classList.remove('open');
                  document.getElementById('hud').style.display = 'block';
                  document.getElementById('killFeed').innerHTML = '';

                  generateWorld(profile.selectedBiome);
                  snakes = []; preyList = []; meatList = []; potions = []; feastDrops = []; particles = []; floatTexts = [];
                  safeZone.active = profile.selectedMode === 'br';
                  safeZone.cx = WORLD_CENTER; safeZone.cy = WORLD_CENTER;
                  safeZone.r = ARENA_RADIUS; safeZone.targetR = ARENA_RADIUS * 0.78;
                  safeZone.stage = 1; safeZone.timer = 85; safeZone.shrinking = false;
                  dayCycle = 0; weatherRain = false; weatherTimer = 36; dropTimer = profile.selectedMode === 'treasure' ? 6 : 20;

                  matchStats.kills = 0; matchStats.prey = 0; matchStats.xp = 0; matchStats.maxLen = 21; matchStats.rank = TOTAL_SNAKES; matchStats.reason = '';

                  const pSpec = SPECIES.find(s => s.id === profile.selectedSnake) || SPECIES[0];
                  const pSpawn = randInCircle(WORLD_CENTER, WORLD_CENTER, ARENA_RADIUS * 0.55, 350);
                  player = new Snake({ name: profile.name, species: pSpec, x: pSpawn.x, y: pSpawn.y, isPlayer: true, mass: 16 });
                  snakes.push(player);

                  for (let i = 1; i < TOTAL_SNAKES; i++) {
                    const sp = SPECIES[Math.floor(Math.random() * SPECIES.length)];
                    let pt = randInCircle(WORLD_CENTER, WORLD_CENTER, ARENA_RADIUS, 360);
                    if (dist(pt.x, pt.y, player.x, player.y) < 650) pt = randInCircle(WORLD_CENTER, WORLD_CENTER, ARENA_RADIUS, 360);
                    const nm = AI_PREFIX[i % AI_PREFIX.length] + AI_SUFFIX[Math.floor(i / 3) % AI_SUFFIX.length];
                    snakes.push(new Snake({ name: nm, species: sp, x: pt.x, y: pt.y, mass: rand(14, 26) }));
                  }

                  spawnPrey(480);
                  spawnPotions(34);
                  if (profile.selectedMode === 'treasure') { spawnGoldenDrop(); spawnGoldenDrop(); }
                  camera.x = player.x; camera.y = player.y; camera.lookX = 0; camera.lookY = 0;
                  camera.zoom = profile.settings.zoom;
                  applySettingsToDOM();
                  refreshQuickPotions();
                }

                function endMatch(isWin) {
                  screenState = 'results';
                  document.getElementById('hud').style.display = 'none';
                  document.getElementById('tacMapOverlay').classList.remove('open');
                  const gold = (isWin ? 120 : Math.max(15, Math.floor((TOTAL_SNAKES - matchStats.rank) * 2))) + matchStats.kills * 25 + (mission.done ? 60 : 0);
                  const dias = (isWin ? 5 : (matchStats.rank <= 5 ? 2 : 0)) + matchStats.kills * 1;
                  const totalXp = matchStats.xp;

                  profile.coins += gold; profile.diamonds += dias; profile.xp += totalXp;
                  profile.stats.matches++;
                  if (isWin) profile.stats.wins++;
                  profile.stats.kills += matchStats.kills;
                  profile.stats.prey += matchStats.prey;
                  if (matchStats.maxLen > profile.stats.bestLength) profile.stats.bestLength = matchStats.maxLen;
                  while (profile.xp >= getXpNeed(profile.level)) { profile.xp -= getXpNeed(profile.level); profile.level++; }
                  saveProfile();

                  document.getElementById('resTitle').textContent = isWin ? '#1 APEX PREDATOR!' : `RANK #${matchStats.rank} / ${TOTAL_SNAKES}`;
                  document.getElementById('resSub').textContent = matchStats.reason;
                  document.getElementById('resRank').textContent = `#${matchStats.rank}`;
                  document.getElementById('resKills').textContent = matchStats.kills;
                  document.getElementById('resLen').textContent = `${matchStats.maxLen}m`;
                  document.getElementById('resPrey').textContent = matchStats.prey;
                  document.getElementById('resGold').textContent = `+${gold} 🪙 Coins`;
                  document.getElementById('resDia').textContent = `+${dias} 💎 Diamonds`;
                  document.getElementById('resXp').textContent = `+${totalXp.toLocaleString()} XP`;
                  document.getElementById('resultsScreen').classList.add('open');
                  isWin ? Sound.win() : Sound.over();
                }

                function enterLobby() {
                  screenState = 'lobby';
                  document.getElementById('hud').style.display = 'none';
                  document.getElementById('resultsScreen').classList.remove('open');
                  document.getElementById('lobbyScreen').style.display = 'block';
                  generateWorld(profile.selectedBiome);
                  const sp = SPECIES.find(s => s.id === profile.selectedSnake) || SPECIES[0];
                  lobbySnake = new Snake({ name: profile.name, species: sp, x: appW * 0.5, y: appH * 0.5, isPlayer: true, mass: 16 });
                  lobbySnake.spawnShield = 0; lobbySnake.hoodFlare = sp.hood ? 0.9 : 0;
                  refreshLobbyUI();
                }

                function updateGame(dt) {
                  dayCycle = (dayCycle + dt) % 120;
                  weatherTimer -= dt;
                  if (weatherTimer <= 0) { weatherRain = !weatherRain; weatherTimer = rand(28, 48); }
                  dropTimer -= dt;
                  const maxDrops = profile.selectedMode === 'treasure' ? 5 : 2;
                  if (dropTimer <= 0 && feastDrops.length < maxDrops) { spawnGoldenDrop(); dropTimer = profile.selectedMode === 'treasure' ? 14 : 36; }
                  if (streakTimer > 0) streakTimer = Math.max(0, streakTimer - dt);
                  if (activePotion.timer > 0) { activePotion.timer = Math.max(0, activePotion.timer - dt); if (activePotion.timer <= 0) activePotion.id = null; }

                  if (player && player.alive) {
                    let kx = (ctrl.keys.right ? 1 : 0) - (ctrl.keys.left ? 1 : 0);
                    let ky = (ctrl.keys.down ? 1 : 0) - (ctrl.keys.up ? 1 : 0);
                    if (kx !== 0 || ky !== 0) player.targetAngle = Math.atan2(ky, kx);
                    else if (ctrl.joyActive && ctrl.joyMag > 8) player.targetAngle = ctrl.joyAngle;
                    player.boosting = ctrl.boostHeld || ctrl.keys.boost;
                    matchStats.maxLen = Math.max(matchStats.maxLen, player.getLen());
                  }

                  if (safeZone.active) {
                    safeZone.timer -= dt;
                    if (!safeZone.shrinking && safeZone.timer <= 0) { safeZone.shrinking = true; safeZone.timer = 65; safeZone.targetR = Math.max(700, safeZone.r * 0.72); }
                    else if (safeZone.shrinking) {
                      safeZone.r = Math.max(safeZone.targetR, safeZone.r - (ARENA_RADIUS * 0.0042) * dt);
                      if (safeZone.timer <= 0 || safeZone.r <= safeZone.targetR) { safeZone.shrinking = false; safeZone.stage = Math.min(6, safeZone.stage + 1); safeZone.timer = 75; }
                    }
                  }

                  rebuildGrids();
                  for (const s of snakes) s.update(dt);

                  for (const s of snakes) {
                    if (!s.alive || s.spawnShield > 0) continue;
                    const hr = s.getRadius() * 0.85;
                    const near = queryGrid(snakeGrid, s.x, s.y, hr + 90);
                    for (const o of near) {
                      if (o === s || !o.alive || o.spawnShield > 0) continue;
                      const oR = o.getRadius() * 0.85;
                      let crashed = false;
                      const cStep = o.segments.length > 140 ? 2 : 1;
                      for (let k = 1; k < o.segments.length; k += cStep) {
                        if (distSq(s.x, s.y, o.segments[k].x, o.segments[k].y) < (hr + oR) ** 2) { crashed = true; break; }
                      }
                      if (crashed) { killSnake(s, o, 'Cut-Off'); break; }
                      if (distSq(s.x, s.y, o.x, o.y) < (hr + oR) ** 2 && s.mass < o.mass) { killSnake(s, o, 'Head Clash'); break; }
                    }
                  }

                  for (let i = potions.length - 1; i >= 0; i--) {
                    const po = potions[i]; po.life -= dt;
                    if (po.life <= 0) { potions.splice(i, 1); continue; }
                    if (player && player.alive && distSq(player.x, player.y, po.x, po.y) < (player.getRadius() + po.r + 12) ** 2) {
                      activePotion = { id: po.id, label: po.label, timer: po.dur };
                      matchStats.xp += 250; Sound.potion(); vibrate(30);
                      spawnParticles(po.x, po.y, po.col, 14, 130);
                      if (profile.settings.xpPopups) floatTexts.push({ x: po.x, y: po.y - 20, text: `${po.label} +250 XP!`, color: po.col, life: 1.2, maxLife: 1.2 });
                      potions.splice(i, 1);
                    }
                  }
                  if (potions.length < 24) spawnPotions(2);

                  for (let i = feastDrops.length - 1; i >= 0; i--) {
                    const f = feastDrops[i]; f.life -= dt;
                    if (f.life <= 0) { feastDrops.splice(i, 1); continue; }
                    const nearS = queryGrid(snakeGrid, f.x, f.y, 70);
                    for (const s of nearS) {
                      if (!s.alive) continue;
                      if (distSq(s.x, s.y, f.x, f.y) < (s.getRadius() + f.r) ** 2) {
                        s.mass += 45; spawnParticles(f.x, f.y, '#ffe45c', 18, 150);
                        if (s.isPlayer) { Sound.win(); vibrate(40); profile.coins += 50; profile.diamonds += 2; matchStats.xp += 250; saveProfile(); floatTexts.push({ x: f.x, y: f.y - 20, text: 'TREASURE! +50 🪙 +250 XP', color: '#9cf4ff', life: 1.4, maxLife: 1.4 }); }
                        pushKillFeed(`${s.name} found Golden Treasure!`);
                        feastDrops.splice(i, 1); break;
                      }
                    }
                  }

                  const magBoost = (activePotion.id === 'magnet' && activePotion.timer > 0) ? 185 : 0;
                  const magR = player && player.alive ? (45 + profile.upgrades.magnet * 28 + magBoost) : 0;
                  const dblMult = (activePotion.id === 'double' && activePotion.timer > 0) ? 2.0 : 1.0;

                  for (let i = preyList.length - 1; i >= 0; i--) {
                    const p = preyList[i];
                    if (p.speed > 0 && profile.selectedFood === 'prey') {
                      p.timer -= dt;
                      if (p.timer <= 0) { p.angle += rand(-1.3, 1.3); p.timer = rand(0.8, 2.2); }
                      p.x += Math.cos(p.angle) * p.speed * dt; p.y += Math.sin(p.angle) * p.speed * dt;
                      if (dist(p.x, p.y, WORLD_CENTER, WORLD_CENTER) > ARENA_RADIUS - 200) p.angle = Math.atan2(WORLD_CENTER - p.y, WORLD_CENTER - p.x);
                    }
                    if (magR > 50 && player && player.alive && distSq(player.x, player.y, p.x, p.y) < magR * magR) { p.x = lerp(p.x, player.x, dt * 6.5); p.y = lerp(p.y, player.y, dt * 6.5); }
                    const nearS = queryGrid(snakeGrid, p.x, p.y, 65);
                    for (const s of nearS) {
                      if (!s.alive) continue;
                      if (distSq(s.x, s.y, p.x, p.y) < (s.getRadius() * 1.25 + p.r) ** 2) {
                        s.mass += p.mass * (s.isPlayer ? dblMult : 1.0); s.jawOpen = 0.6;
                        if (s.isPlayer) {
                          matchStats.prey++; matchStats.xp += 100; Sound.eat();
                          if (profile.settings.xpPopups) floatTexts.push({ x: p.x, y: p.y - 14, text: '+100 XP', color: '#a8ff78', life: 0.75, maxLife: 0.75 });
                          if (!mission.done && matchStats.prey >= mission.goal) { mission.done = true; Sound.win(); floatTexts.push({ x: player.x, y: player.y - 30, text: 'MISSION DONE! +60 🪙', color: '#8cff6e', life: 1.5, maxLife: 1.5 }); }
                        }
                        preyList.splice(i, 1); break;
                      }
                    }
                  }
                  if (preyList.length < 440) spawnPrey(10);

                  for (let i = meatList.length - 1; i >= 0; i--) {
                    const m = meatList[i]; m.life -= dt;
                    if (m.life <= 0) { meatList.splice(i, 1); continue; }
                    if (magR > 50 && player && player.alive && distSq(player.x, player.y, m.x, m.y) < magR * magR) { m.x = lerp(m.x, player.x, dt * 7.5); m.y = lerp(m.y, player.y, dt * 7.5); }
                    const nearS = queryGrid(snakeGrid, m.x, m.y, 65);
                    for (const s of nearS) {
                      if (!s.alive) continue;
                      if (distSq(s.x, s.y, m.x, m.y) < (s.getRadius() * 1.25 + m.r) ** 2) {
                        s.mass += m.mass * (s.isPlayer ? dblMult : 1.0); s.jawOpen = 0.55;
                        if (s.isPlayer) {
                          matchStats.xp += 500; Sound.eat();
                          if (profile.settings.xpPopups) floatTexts.push({ x: m.x, y: m.y - 16, text: '+500 XP', color: '#ffe45c', life: 0.9, maxLife: 0.9 });
                        }
                        meatList.splice(i, 1); break;
                      }
                    }
                  }

                  for (let i = tracks.length - 1; i >= 0; i--) { tracks[i].life -= dt; if (tracks[i].life <= 0) tracks.splice(i, 1); }
                  for (let i = ripples.length - 1; i >= 0; i--) { const rp = ripples[i]; rp.life -= dt; rp.r = lerp(rp.r, rp.maxR, dt * 3.5); if (rp.life <= 0) ripples.splice(i, 1); }
                  for (let i = particles.length - 1; i >= 0; i--) { const pt = particles[i]; pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.life -= dt; if (pt.life <= 0) particles.splice(i, 1); }
                  for (let i = floatTexts.length - 1; i >= 0; i--) { const ft = floatTexts[i]; ft.y -= 28 * dt; ft.life -= dt; if (ft.life <= 0) floatTexts.splice(i, 1); }

                  if (camera.shake > 0) camera.shake = Math.max(0, camera.shake - dt * 24);
                  if (player && player.alive) {
                    camera.x = lerp(camera.x, player.x, clamp(dt * 8, 0, 1));
                    camera.y = lerp(camera.y, player.y, clamp(dt * 8, 0, 1));
                    const targetZoom = (activePotion.id === 'zoom' && activePotion.timer > 0) ? Math.max(0.58, profile.settings.zoom - 0.2) : profile.settings.zoom;
                    camera.zoom = lerp(camera.zoom, targetZoom, clamp(dt * 5, 0, 1));
                    if (!ctrl.lookActive && profile.settings.autoCenter) {
                      camera.lookX = lerp(camera.lookX, 0, clamp(dt * 7, 0, 1));
                      camera.lookY = lerp(camera.lookY, 0, clamp(dt * 7, 0, 1));
                    }
                    document.getElementById('btnRecenter').style.display = Math.hypot(camera.lookX, camera.lookY) > 35 ? 'flex' : 'none';
                  }

                  hudTick -= dt;
                  if (hudTick <= 0 && player) {
                    hudTick = 0.12;
                    const aliveArr = snakes.filter(s => s.alive);
                    document.getElementById('hudAlive').textContent = `${aliveArr.length}/${TOTAL_SNAKES}`;
                    document.getElementById('hudKills').textContent = matchStats.kills;
                    document.getElementById('hudLen').textContent = `${player.getLen()}m`;
                    document.getElementById('hudXp').textContent = matchStats.xp;
                    document.getElementById('missionProg').textContent = mission.done ? 'DONE ✅' : `${matchStats.prey}/${mission.goal}`;

                    if (safeZone.active) {
                      document.getElementById('hudZoneStage').textContent = safeZone.stage;
                      const zt = Math.max(0, Math.ceil(safeZone.timer));
                      document.getElementById('hudZoneTimer').textContent = `${Math.floor(zt / 60)}:${String(zt % 60).padStart(2, '0')}`;
                    } else {
                      document.getElementById('hudZoneStage').textContent = '∞';
                      document.getElementById('hudZoneTimer').textContent = profile.selectedMode === 'treasure' ? 'TREASURE' : 'ENDLESS';
                    }
                    document.getElementById('shieldBadge').style.display = player.spawnShield > 0 ? 'block' : 'none';

                    const pb = document.getElementById('potionBadge');
                    if (activePotion.id && activePotion.timer > 0) { pb.style.display = 'block'; pb.textContent = `${activePotion.label} ${Math.ceil(activePotion.timer)}s`; }
                    else pb.style.display = 'none';

                    aliveArr.sort((a, b) => b.mass - a.mass);
                    leaderSnake = aliveArr[0] || null;
                    const lb = document.getElementById('leaderBox');
                    lb.innerHTML = aliveArr.slice(0, 5).map((s, idx) =>
                      `<div class="lb-row${s.isPlayer ? ' me' : ''}"><span>${idx === 0 ? '👑 ' : (idx + 1) + '. '}${s.name.slice(0, 9)}</span><span>${s.getLen()}m</span></div>`
                    ).join('');

                    const stRing = document.getElementById('staminaRing');
                    if (stRing) stRing.style.strokeDashoffset = String(220 * (1 - player.stamina / 100));
                    document.getElementById('stormVignette').style.opacity = (safeZone.active && dist(player.x, player.y, safeZone.cx, safeZone.cy) > safeZone.r) ? '1' : '0';

                    document.getElementById('regionPill').textContent = getRegionAt(player.x, player.y).name;
                    if (profile.settings.showFps) document.getElementById('fpsPill').textContent = `${fpsVal} FPS`;

                    const biome = BIOMES.find(b => b.id === profile.selectedBiome) || BIOMES[0];
                    const tTag = document.getElementById('terrainTag');
                    if (player.inBush) { tTag.style.display = 'block'; tTag.style.background = 'rgba(34,115,44,0.88)'; tTag.textContent = '🌿 CANOPY SHADE'; }
                    else if (player.terrain === 'water') { tTag.style.display = 'block'; tTag.style.background = biome.id === 'volcano' ? 'rgba(210,60,18,0.88)' : 'rgba(26,136,148,0.85)'; tTag.textContent = biome.id === 'volcano' ? '🔥 LAVA BOOST' : '🌊 RIVER BOOST'; }
                    else if (player.terrain === 'mud') { tTag.style.display = 'block'; tTag.style.background = 'rgba(84,54,28,0.88)'; tTag.textContent = '🟤 MUD SLOW'; }
                    else tTag.style.display = 'none';

                    if (profile.settings.showMinimap) drawRadar(miniCtx, miniCanvas.width, miniCanvas.height, false);
                    if (tacMapOpen) drawRadar(tacCtx, tacCanvas.width, tacCanvas.height, true);
                  }
                }

                function drawRadar(rc, w, h, showLabels) {
                  const biome = BIOMES.find(b => b.id === profile.selectedBiome) || BIOMES[0];
                  const sc = (w * 0.45) / ARENA_RADIUS, cx = w / 2, cy = h / 2;
                  rc.clearRect(0, 0, w, h); rc.fillStyle = '#0c180d'; rc.fillRect(0, 0, w, h);
                  for (const r of REGIONS) { const rx = cx + (r.x - WORLD_CENTER) * sc, ry = cy + (r.y - WORLD_CENTER) * sc; rc.fillStyle = r.col; rc.beginPath(); rc.arc(rx, ry, r.r * sc, 0, Math.PI * 2); rc.fill(); }
                  rc.strokeStyle = biome.water; rc.globalAlpha = 0.65; rc.lineCap = 'round'; rc.lineJoin = 'round';
                  for (const rv of rivers) {
                    rc.lineWidth = Math.max(2, rv.width * sc);
                    rc.beginPath();
                    rv.pts.forEach((pt, idx) => { const px = cx + (pt.x - WORLD_CENTER) * sc, py = cy + (pt.y - WORLD_CENTER) * sc; idx === 0 ? rc.moveTo(px, py) : rc.lineTo(px, py); });
                    rc.stroke();
                  }
                  rc.globalAlpha = 1;
                  rc.strokeStyle = 'rgba(255,75,58,0.5)'; rc.lineWidth = showLabels ? 2.5 : 1.5; rc.beginPath(); rc.arc(cx, cy, ARENA_RADIUS * sc, 0, Math.PI * 2); rc.stroke();
                  if (safeZone.active) { rc.strokeStyle = '#4de2f0'; rc.lineWidth = showLabels ? 3 : 2; rc.beginPath(); rc.arc(cx + (safeZone.cx - WORLD_CENTER) * sc, cy + (safeZone.cy - WORLD_CENTER) * sc, safeZone.r * sc, 0, Math.PI * 2); rc.stroke(); }
                  if (showLabels) { rc.font = 'bold 10px sans-serif'; rc.textAlign = 'center'; rc.fillStyle = 'rgba(255,235,160,0.88)'; for (const r of REGIONS) rc.fillText(r.name.toUpperCase(), cx + (r.x - WORLD_CENTER) * sc, cy + (r.y - WORLD_CENTER) * sc); }
                  rc.fillStyle = '#ffe44d';
                  for (const f of feastDrops) { rc.beginPath(); rc.arc(cx + (f.x - WORLD_CENTER) * sc, cy + (f.y - WORLD_CENTER) * sc, showLabels ? 5 : 3.5, 0, Math.PI * 2); rc.fill(); }
                  rc.fillStyle = 'rgba(255,90,78,0.85)';
                  for (const s of snakes) { if (!s.alive || s.isPlayer) continue; rc.beginPath(); rc.arc(cx + (s.x - WORLD_CENTER) * sc, cy + (s.y - WORLD_CENTER) * sc, showLabels ? 3 : 1.7, 0, Math.PI * 2); rc.fill(); }
                  if (player && player.alive) { const px = cx + (player.x - WORLD_CENTER) * sc, py = cy + (player.y - WORLD_CENTER) * sc; rc.fillStyle = '#7ce846'; rc.beginPath(); rc.arc(px, py, showLabels ? 6 : 4, 0, Math.PI * 2); rc.fill(); rc.strokeStyle = '#fff'; rc.lineWidth = 1.5; rc.stroke(); }
                }

                function drawSmoothRivers(biome) {
                  ctx.save();
                  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                  const traceRiver = rv => {
                    ctx.beginPath();
                    ctx.moveTo(rv.pts[0].x, rv.pts[0].y);
                    for (let i = 1; i < rv.pts.length - 1; i++) {
                      const xc = (rv.pts[i].x + rv.pts[i + 1].x) * 0.5;
                      const yc = (rv.pts[i].y + rv.pts[i + 1].y) * 0.5;
                      ctx.quadraticCurveTo(rv.pts[i].x, rv.pts[i].y, xc, yc);
                    }
                    const last = rv.pts[rv.pts.length - 1];
                    ctx.lineTo(last.x, last.y);
                  };
                  for (const rv of rivers) {
                    traceRiver(rv); ctx.strokeStyle = biome.shore; ctx.lineWidth = rv.width + 38; ctx.stroke();
                    traceRiver(rv); ctx.strokeStyle = biome.water; ctx.lineWidth = rv.width; ctx.stroke();
                    traceRiver(rv); ctx.strokeStyle = biome.waterDeep; ctx.lineWidth = rv.width * 0.58; ctx.stroke();
                    ctx.save(); ctx.setLineDash([45, 75]); ctx.lineDashOffset = -globalTime * 48;
                    traceRiver(rv); ctx.strokeStyle = biome.id === 'volcano' ? 'rgba(255,245,140,0.42)' : 'rgba(200,248,255,0.18)'; ctx.lineWidth = 10; ctx.stroke();
                    ctx.restore();
                  }
                  ctx.restore();
                }

                function renderGame(dt) {
                  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                  ctx.fillStyle = '#060b07'; ctx.fillRect(0, 0, appW, appH);

                  if (document.getElementById('profileModal').classList.contains('open') && document.getElementById('tabSnakes').classList.contains('active') && previewSnake) {
                    const pw = wsCanvas.width, ph = wsCanvas.height;
                    wsCtx.clearRect(0, 0, pw, ph);
                    previewSnake.slitherPhase += dt * 7;
                    const t = globalTime * 1.1;
                    const nx = pw * 0.5 + Math.cos(t) * 54, ny = ph * 0.5 + Math.sin(t) * 58;
                    previewSnake.angle = Math.atan2(ny - previewSnake.y, nx - previewSnake.x);
                    previewSnake.x = nx; previewSnake.y = ny; previewSnake.segments[0].x = nx; previewSnake.segments[0].y = ny;
                    for (let i = 1; i < previewSnake.segments.length; i++) {
                      const p = previewSnake.segments[i - 1], c = previewSnake.segments[i], dx = c.x - p.x, dy = c.y - p.y, d = Math.hypot(dx, dy) || 1;
                      if (d > 5.5) { c.x = p.x + (dx / d) * 5.5; c.y = p.y + (dy / d) * 5.5; }
                    }
                    previewSnake.draw(wsCtx, false);
                  }

                  const biome = BIOMES.find(b => b.id === profile.selectedBiome) || BIOMES[0];

                  if (screenState !== 'playing') {
                    if (groundPattern) { ctx.fillStyle = groundPattern; ctx.fillRect(0, 0, appW, appH); }
                    else { ctx.fillStyle = biome.floor; ctx.fillRect(0, 0, appW, appH); }
                    const g = ctx.createRadialGradient(appW * 0.5, appH * 0.48, 20, appW * 0.5, appH * 0.48, Math.max(appW, appH) * 0.56);
                    g.addColorStop(0, 'rgba(180, 235, 110, 0.14)'); g.addColorStop(1, 'rgba(4,9,5,0.68)');
                    ctx.fillStyle = g; ctx.fillRect(0, 0, appW, appH);

                    if (lobbySnake) {
                      lobbySnake.slitherPhase += dt * 7.5;
                      const rx = Math.min(appW * 0.22, 165), ry = Math.min(appH * 0.2, 85);
                      const t = globalTime * 0.85;
                      const nx = appW * 0.5 + Math.cos(t) * rx, ny = appH * 0.48 + Math.sin(t) * ry;
                      lobbySnake.angle = Math.atan2(ny - lobbySnake.y, nx - lobbySnake.x);
                      lobbySnake.x = nx; lobbySnake.y = ny; lobbySnake.segments[0].x = nx; lobbySnake.segments[0].y = ny;
                      const spc = lobbySnake.getRadius() * 0.42;
                      for (let i = 1; i < lobbySnake.segments.length; i++) {
                        const p = lobbySnake.segments[i - 1], c = lobbySnake.segments[i], dx = c.x - p.x, dy = c.y - p.y, d = Math.hypot(dx, dy) || 1;
                        if (d > spc) { c.x = p.x + (dx / d) * spc; c.y = p.y + (dy / d) * spc; }
                      }
                      lobbySnake.draw(ctx, false);
                    }
                    for (const ff of fireflies) {
                      ff.x = (ff.x + ff.vx * dt + appW) % appW; ff.y = (ff.y + ff.vy * dt + appH) % appH;
                      ctx.fillStyle = `rgba(190, 255, 120, ${0.2 + 0.5 * (0.5 + 0.5 * Math.sin(globalTime * 3.5 + ff.ph))})`;
                      ctx.beginPath(); ctx.arc(ff.x, ff.y, 2, 0, Math.PI * 2); ctx.fill();
                    }
                    return;
                  }

                  const shX = camera.shake > 0 ? rand(-camera.shake, camera.shake) : 0;
                  const shY = camera.shake > 0 ? rand(-camera.shake, camera.shake) : 0;

                  ctx.save();
                  ctx.translate(appW / 2 + shX, appH / 2 + shY);
                  ctx.scale(camera.zoom, camera.zoom);
                  ctx.translate(-(camera.x + camera.lookX), -(camera.y + camera.lookY));

                  if (groundPattern) { ctx.fillStyle = groundPattern; ctx.fillRect(0, 0, WORLD_SIZE, WORLD_SIZE); }
                  for (const r of REGIONS) { if (!isNearCam(r.x, r.y, r.r)) continue; ctx.fillStyle = r.col; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.fill(); }
                  for (const m of mudZones) { if (!isNearCam(m.x, m.y, m.r + 80)) continue; ctx.fillStyle = biome.mud; ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill(); }

                  drawSmoothRivers(biome);

                  for (const lp of lilyPads) {
                    if (!isNearCam(lp.x, lp.y, 50)) continue;
                    ctx.save(); ctx.translate(lp.x, lp.y); ctx.rotate(lp.rot);
                    ctx.fillStyle = '#2d7a2d'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, lp.r, 0.25, Math.PI * 2 - 0.25); ctx.closePath(); ctx.fill();
                    if (lp.lotus) { ctx.fillStyle = '#ff85b3'; for (let p = 0; p < 5; p++) { ctx.rotate((Math.PI * 2) / 5); ctx.beginPath(); ctx.ellipse(4, 0, 5, 2.5, 0, 0, Math.PI * 2); ctx.fill(); } ctx.fillStyle = '#ffe552'; ctx.beginPath(); ctx.arc(0, 0, 2.2, 0, Math.PI * 2); ctx.fill(); }
                    ctx.restore();
                  }
                  for (const tr of tracks) {
                    if (!isNearCam(tr.x, tr.y, 40)) continue;
                    ctx.save(); ctx.translate(tr.x, tr.y); ctx.rotate(tr.ang); ctx.globalAlpha = clamp(tr.life / tr.maxLife, 0, 1) * 0.42;
                    ctx.fillStyle = '#170d05'; ctx.beginPath(); ctx.ellipse(0, 0, tr.r * 0.5, tr.r * 0.9, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
                  }
                  for (const rp of ripples) {
                    if (!isNearCam(rp.x, rp.y, rp.maxR)) continue;
                    ctx.strokeStyle = biome.id === 'volcano' ? `rgba(255,215,90,${(rp.life / rp.maxLife) * 0.5})` : `rgba(195,245,255,${(rp.life / rp.maxLife) * 0.42})`;
                    ctx.lineWidth = 1.8; ctx.beginPath(); ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2); ctx.stroke();
                  }
                  for (const pr of worldProps) {
                    if (!isNearCam(pr.x, pr.y, pr.sz + 50)) continue;
                    ctx.save(); ctx.translate(pr.x, pr.y); ctx.rotate(pr.rot);
                    if (pr.kind === 'log') {
                      ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(-pr.sz + 4, -pr.sz * 0.24 + 5, pr.sz * 2, pr.sz * 0.48);
                      ctx.fillStyle = biome.id === 'volcano' ? '#2e2522' : '#4a3019'; ctx.fillRect(-pr.sz, -pr.sz * 0.24, pr.sz * 2, pr.sz * 0.48);
                      ctx.strokeStyle = '#1a0f07'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(-pr.sz * 0.8, -3); ctx.lineTo(pr.sz * 0.7, -3); ctx.moveTo(-pr.sz * 0.5, 4); ctx.lineTo(pr.sz * 0.9, 4); ctx.stroke();
                      ctx.fillStyle = biome.id === 'tundra' ? 'rgba(235,245,255,0.85)' : 'rgba(76,138,44,0.78)'; ctx.beginPath(); ctx.ellipse(-pr.sz * 0.2, -3, pr.sz * 0.36, pr.sz * 0.19, 0.2, 0, Math.PI * 2); ctx.fill();
                    } else if (pr.kind === 'rock') {
                      ctx.fillStyle = 'rgba(0,0,0,0.42)'; ctx.beginPath(); ctx.ellipse(4, 6, pr.sz * 0.78, pr.sz * 0.62, 0, 0, Math.PI * 2); ctx.fill();
                      ctx.fillStyle = biome.id === 'sahara' ? '#a67b46' : (biome.id === 'volcano' ? '#362e2c' : '#5c6358');
                      ctx.beginPath(); ctx.moveTo(pr.sz * 0.75, 0); ctx.lineTo(pr.sz * 0.42, -pr.sz * 0.56); ctx.lineTo(-pr.sz * 0.38, -pr.sz * 0.52); ctx.lineTo(-pr.sz * 0.76, -pr.sz * 0.08); ctx.lineTo(-pr.sz * 0.46, pr.sz * 0.54); ctx.lineTo(pr.sz * 0.36, pr.sz * 0.5); ctx.closePath(); ctx.fill();
                      ctx.fillStyle = biome.id === 'tundra' ? 'rgba(240,248,255,0.8)' : (biome.id === 'volcano' ? 'rgba(255,95,20,0.45)' : 'rgba(68,122,42,0.66)');
                      ctx.beginPath(); ctx.arc(-pr.sz * 0.24, -pr.sz * 0.2, pr.sz * 0.28, 0, Math.PI * 2); ctx.fill();
                    } else if (pr.kind === 'ruin') {
                      ctx.fillStyle = 'rgba(0,0,0,0.42)'; ctx.fillRect(-pr.sz * 0.8 + 5, -pr.sz * 0.55 + 6, pr.sz * 1.6, pr.sz * 1.1);
                      ctx.fillStyle = biome.id === 'sahara' ? '#ba935a' : '#6c7065'; ctx.fillRect(-pr.sz * 0.8, -pr.sz * 0.55, pr.sz * 1.6, pr.sz * 1.1);
                      ctx.strokeStyle = 'rgba(28,32,26,0.75)'; ctx.lineWidth = 2; ctx.strokeRect(-pr.sz * 0.68, -pr.sz * 0.44, pr.sz * 1.36, pr.sz * 0.88);
                    } else {
                      for (let f = 0; f < 6; f++) { ctx.rotate(Math.PI / 3); ctx.fillStyle = f % 2 === 0 ? biome.tree1 : biome.tree2; ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(pr.sz * 0.45, -pr.sz * 0.22, pr.sz * 0.85, 0); ctx.quadraticCurveTo(pr.sz * 0.45, pr.sz * 0.22, 0, 0); ctx.fill(); }
                    }
                    ctx.restore();
                  }

                  ctx.strokeStyle = 'rgba(255,75,58,0.6)'; ctx.lineWidth = 18; ctx.beginPath(); ctx.arc(WORLD_CENTER, WORLD_CENTER, ARENA_RADIUS, 0, Math.PI * 2); ctx.stroke();
                  if (safeZone.active) { ctx.strokeStyle = 'rgba(77,226,240,0.88)'; ctx.lineWidth = 10; ctx.beginPath(); ctx.arc(safeZone.cx, safeZone.cy, safeZone.r, 0, Math.PI * 2); ctx.stroke(); }

                  for (const tr of trees) { if (!isNearCam(tr.x, tr.y, tr.r + 40)) continue; ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.beginPath(); ctx.arc(tr.x + 12, tr.y + 16, tr.r * 0.9, 0, Math.PI * 2); ctx.fill(); }

                  for (const po of potions) {
                    if (!isNearCam(po.x, po.y, 70)) continue;
                    const pu = 1 + Math.sin(globalTime * 5 + po.x) * 0.15;
                    ctx.save(); ctx.translate(po.x, po.y);
                    ctx.fillStyle = po.col; ctx.globalAlpha = 0.25; ctx.beginPath(); ctx.arc(0, 0, 26 * pu, 0, Math.PI * 2); ctx.fill();
                    ctx.globalAlpha = 1; ctx.fillStyle = '#0e1726'; ctx.strokeStyle = po.col; ctx.lineWidth = 2.5;
                    ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                    ctx.font = '14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(po.icon, 0, 1); ctx.restore();
                  }

                  for (const f of feastDrops) {
                    if (!isNearCam(f.x, f.y, 120)) continue;
                    const pulse = 1 + Math.sin(globalTime * 6) * 0.16;
                    ctx.fillStyle = 'rgba(255,224,82,0.32)'; ctx.beginPath(); ctx.arc(f.x, f.y, 40 * pulse, 0, Math.PI * 2); ctx.fill();
                    ctx.font = '26px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('💰', f.x, f.y);
                  }
                  for (const p of preyList) { if (isNearCam(p.x, p.y, 65)) drawPrey(ctx, p); }
                  for (const m of meatList) { if (isNearCam(m.x, m.y, 50)) drawMeatChunk(ctx, m); }
                  for (const pt of particles) { ctx.globalAlpha = clamp(pt.life / pt.maxLife, 0, 1); ctx.fillStyle = pt.color; ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2); ctx.fill(); }
                  ctx.globalAlpha = 1;
                  for (const s of snakes) { if (s.alive && isSnakeVisible(s)) s.draw(ctx, true); }

                  if (player && player.alive && safeZone.active && dist(player.x, player.y, safeZone.cx, safeZone.cy) > safeZone.r - 120) {
                    const za = Math.atan2(safeZone.cy - player.y, safeZone.cx - player.x);
                    ctx.save(); ctx.translate(player.x + Math.cos(za) * 58, player.y + Math.sin(za) * 58); ctx.rotate(za);
                    ctx.fillStyle = '#4de2f0'; ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-6, -8); ctx.lineTo(-3, 0); ctx.lineTo(-6, 8); ctx.closePath(); ctx.fill(); ctx.restore();
                  }

                  // BIOME-THEMED TREE CANOPIES (Emerald, Snowy Pine, Pink Sakura, Volcanic, Palm!)
                  for (const tr of trees) {
                    if (!isNearCam(tr.x, tr.y, tr.r + 40)) continue;
                    const pUnder = player && player.alive && distSq(player.x, player.y, tr.x, tr.y) < (tr.r * 1.15) ** 2;
                    ctx.save(); ctx.translate(tr.x + Math.sin(globalTime * 1.3 + tr.ph) * 3, tr.y);
                    ctx.globalAlpha = pUnder ? 0.16 : 0.74;
                    for (let l = 0; l < 5; l++) { const a = (l / 5) * Math.PI * 2 + tr.ph; ctx.fillStyle = l % 2 === 0 ? biome.tree1 : biome.tree2; ctx.beginPath(); ctx.arc(Math.cos(a) * tr.r * 0.36, Math.sin(a) * tr.r * 0.36, tr.r * 0.56, 0, Math.PI * 2); ctx.fill(); }
                    ctx.fillStyle = biome.tree3; ctx.beginPath(); ctx.arc(-tr.r * 0.1, -tr.r * 0.1, tr.r * 0.42, 0, Math.PI * 2); ctx.fill(); ctx.restore();
                  }

                  ctx.globalAlpha = 1; ctx.font = '900 14px sans-serif'; ctx.textAlign = 'center';
                  for (const ft of floatTexts) { ctx.globalAlpha = clamp(ft.life / ft.maxLife, 0, 1); ctx.fillStyle = ft.color; ctx.fillText(ft.text, ft.x, ft.y); }
                  ctx.restore();

                  // BIOME-SPECIFIC LIVING WEATHER (Snow, Fire Embers, Sakura Petals, Sand, Butterflies!)
                  if (profile.settings.gfx !== 'low') {
                    ctx.fillStyle = 'rgba(0, 12, 4, 0.07)';
                    for (const cl of clouds) {
                      cl.x += cl.vx * dt; if (cl.x - cl.r > appW) cl.x = -cl.r;
                      ctx.beginPath(); ctx.ellipse(cl.x, cl.y, cl.r, cl.r * 0.52, 0.15, 0, Math.PI * 2); ctx.fill();
                    }
                    for (const af of ambientFx) {
                      if (biome.fx === 'snow') {
                        af.x = (af.x + Math.sin(globalTime + af.ph) * 18 * dt + appW) % appW;
                        af.y = (af.y + af.vy * dt) % appH;
                        ctx.fillStyle = 'rgba(255,255,255,0.82)'; ctx.beginPath(); ctx.arc(af.x, af.y, af.sz * 0.65, 0, Math.PI * 2); ctx.fill();
                      } else if (biome.fx === 'embers') {
                        af.x = (af.x + Math.sin(globalTime * 2 + af.ph) * 24 * dt + appW) % appW;
                        af.y = (af.y - af.vy * 1.15 * dt + appH) % appH;
                        ctx.fillStyle = af.ph > 3 ? '#ff5e1a' : '#ffe047'; ctx.globalAlpha = 0.78;
                        ctx.beginPath(); ctx.arc(af.x, af.y, af.sz * 0.55, 0, Math.PI * 2); ctx.fill();
                      } else if (biome.fx === 'petals') {
                        af.x = (af.x + (22 + Math.sin(globalTime + af.ph) * 16) * dt) % appW;
                        af.y = (af.y + af.vy * 0.75 * dt) % appH;
                        ctx.fillStyle = '#ffb8d6'; ctx.globalAlpha = 0.82;
                        ctx.beginPath(); ctx.ellipse(af.x, af.y, af.sz, af.sz * 0.5, globalTime + af.ph, 0, Math.PI * 2); ctx.fill();
                      } else if (biome.fx === 'sand') {
                        af.x = (af.x + 85 * dt) % appW; af.y = (af.y + 10 * dt) % appH;
                        ctx.fillStyle = 'rgba(245,212,140,0.35)'; ctx.fillRect(af.x, af.y, af.sz * 2.5, 1.5);
                      } else {
                        af.x = (af.x + af.vx * dt + appW) % appW; af.y = (af.y + Math.sin(globalTime + af.ph) * 18 * dt + appH) % appH;
                        const fl = Math.abs(Math.sin(globalTime * 16 + af.ph));
                        ctx.fillStyle = af.col; ctx.globalAlpha = 0.7;
                        ctx.beginPath(); ctx.ellipse(af.x - 3, af.y, 4 * fl + 1, 2.5, -0.3, 0, Math.PI * 2); ctx.ellipse(af.x + 3, af.y, 4 * fl + 1, 2.5, 0.3, 0, Math.PI * 2); ctx.fill();
                      }
                    }
                    ctx.globalAlpha = 1;
                  }
                  if (player && player.alive && player.boosting && player.stamina > 6) {
                    ctx.strokeStyle = 'rgba(255, 240, 160, 0.18)'; ctx.lineWidth = 2;
                    ctx.beginPath();
                    for (let i = 0; i < 12; i++) {
                      const a = (i / 12) * Math.PI * 2 + (globalTime * 4) % 0.5;
                      const r1 = Math.min(appW, appH) * 0.42, r2 = Math.max(appW, appH) * 0.65;
                      ctx.moveTo(appW / 2 + Math.cos(a) * r1, appH / 2 + Math.sin(a) * r1);
                      ctx.lineTo(appW / 2 + Math.cos(a) * r2, appH / 2 + Math.sin(a) * r2);
                    }
                    ctx.stroke();
                  }
                  if (dayCycle < 48 && profile.settings.gfx === 'ultra') {
                    const sg = ctx.createLinearGradient(0, 0, appW * 0.6, appH * 0.7);
                    sg.addColorStop(0, 'rgba(255,245,180,0.09)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = sg; ctx.fillRect(0, 0, appW, appH);
                  } else if (dayCycle >= 48) {
                    const dusk = dayCycle < 78 ? Math.sin(((dayCycle - 48) / 30) * Math.PI) : 0;
                    const night = dayCycle >= 78 ? Math.sin(((dayCycle - 78) / 42) * Math.PI) : 0;
                    if (dusk > 0.02) { ctx.fillStyle = `rgba(180, 90, 25, ${dusk * 0.14})`; ctx.fillRect(0, 0, appW, appH); }
                    if (night > 0.02) { ctx.fillStyle = `rgba(6, 14, 30, ${night * 0.28})`; ctx.fillRect(0, 0, appW, appH); }
                  }
                  if (profile.settings.gfx !== 'low' && weatherRain && biome.id !== 'volcano' && biome.id !== 'sahara') {
                    ctx.strokeStyle = 'rgba(180, 225, 255, 0.25)'; ctx.lineWidth = 1.2; ctx.beginPath();
                    for (const rd of rainDrops) { rd.x -= rd.v * 0.2 * dt; rd.y += rd.v * dt; if (rd.y > appH) { rd.y = -20; rd.x = rand(0, appW + 100); } ctx.moveTo(rd.x, rd.y); ctx.lineTo(rd.x - 4, rd.y + rd.l); }
                    ctx.stroke();
                  }
                }

                function mainLoop(ts) {
                  const dt = Math.min(0.05, (ts - (lastFrame || ts)) / 1000);
                  lastFrame = ts; globalTime += dt;
                  fpsCount++; fpsTimer += dt;
                  if (fpsTimer >= 0.5) { fpsVal = Math.round(fpsCount / fpsTimer); fpsCount = 0; fpsTimer = 0; }
                  if (screenState === 'playing') updateGame(dt);
                  renderGame(dt);
                  requestAnimationFrame(mainLoop);
                }

                function refreshLobbyUI() {
                  document.getElementById('lbAvatar').textContent = profile.avatar;
                  document.getElementById('lbLvl').textContent = `LV.${profile.level}`;
                  document.getElementById('lbName').textContent = profile.name;
                  document.getElementById('lbRank').textContent = getRank(profile.level);
                  document.getElementById('lbTitle').textContent = profile.title;
                  document.getElementById('lbCoins').textContent = profile.coins.toLocaleString();
                  document.getElementById('lbDiamonds').textContent = profile.diamonds.toLocaleString();
                  document.getElementById('mCoins').textContent = profile.coins.toLocaleString();
                  document.getElementById('mDias').textContent = profile.diamonds.toLocaleString();
                  const sp = SPECIES.find(s => s.id === profile.selectedSnake) || SPECIES[0];
                  const bi = BIOMES.find(b => b.id === profile.selectedBiome) || BIOMES[0];
                  const mo = MODES.find(m => m.id === profile.selectedMode) || MODES[0];
                  document.getElementById('scSnake').textContent = sp.name;
                  document.getElementById('scBiome').textContent = bi.name;
                  document.getElementById('modeLabel').textContent = mo.label;
                  const muteIcon = profile.settings.muted ? '🔇' : '🔊';
                  document.getElementById('btnLobbyAudio').textContent = muteIcon;
                  document.getElementById('hudAudioBtn').textContent = muteIcon;
                }

                function selectWorkshopPreview(spId) {
                  previewSnakeId = spId;
                  const sp = SPECIES.find(s => s.id === spId) || SPECIES[0];
                  previewSnake = new Snake({ name: sp.name, species: sp, x: 105, y: 115, isPlayer: true, mass: 16 });
                  previewSnake.spawnShield = 0; previewSnake.hoodFlare = sp.hood ? 0.9 : 0;

                  const owned = profile.ownedSnakes.includes(sp.id) || sp.curr === 'free';
                  const eq = profile.selectedSnake === sp.id;
                  document.getElementById('wsName').textContent = sp.name;
                  document.getElementById('wsTier').textContent = `${sp.tier} • ${sp.curr === 'free' ? 'FREE' : sp.price.toLocaleString() + (sp.curr === 'dia' ? ' 💎' : ' 🪙')}`;
                  document.getElementById('wsTrait').textContent = sp.trait;

                  const btn = document.getElementById('wsActionBtn');
                  btn.className = (!owned && sp.curr === 'dia') ? 'btn-dia' : 'btn-gold';
                  btn.textContent = eq ? 'EQUIPPED ✅' : (owned ? 'EQUIP BEAST' : `BUY ${sp.price.toLocaleString()} ${sp.curr === 'dia' ? '💎' : '🪙'}`);
                  btn.onclick = () => {
                    if (owned) profile.selectedSnake = sp.id;
                    else if (sp.curr === 'coin' && profile.coins >= sp.price) { profile.coins -= sp.price; profile.ownedSnakes.push(sp.id); profile.selectedSnake = sp.id; Sound.buy(); }
                    else if (sp.curr === 'dia' && profile.diamonds >= sp.price) { profile.diamonds -= sp.price; profile.ownedSnakes.push(sp.id); profile.selectedSnake = sp.id; Sound.buy(); }
                    else { Sound.over(); return; }
                    saveProfile(); Sound.click(); renderProfileModal(); enterLobby();
                  };
                }

                function applySettingsToDOM() {
                  const nt = document.getElementById('btnNotif'); nt.textContent = profile.settings.notifs ? 'ON' : 'OFF'; nt.classList.toggle('selected', profile.settings.notifs);
                  const bg = document.getElementById('btnBgm'); bg.textContent = profile.settings.bgm ? 'ON' : 'OFF'; bg.classList.toggle('selected', profile.settings.bgm);
                  document.getElementById('setBgmVol').value = Math.round((profile.settings.bgmVol ?? 0.65) * 100);
                  document.getElementById('setSfxVol').value = Math.round(profile.settings.sfxVol * 100);
                  document.getElementById('setZoom').value = Math.round(profile.settings.zoom * 100);
                  document.getElementById('setSens').value = Math.round((profile.settings.lookSens ?? 1.35) * 100);
                  const ac = document.getElementById('btnAutoCenter'); ac.textContent = profile.settings.autoCenter ? 'ON' : 'OFF'; ac.classList.toggle('selected', profile.settings.autoCenter);
                  const xp = document.getElementById('btnXpPop'); xp.textContent = profile.settings.xpPopups ? 'ON' : 'OFF'; xp.classList.toggle('selected', profile.settings.xpPopups);
                  const mp = document.getElementById('btnShowMap'); mp.textContent = profile.settings.showMinimap ? 'ON' : 'OFF'; mp.classList.toggle('selected', profile.settings.showMinimap);
                  document.getElementById('minimapBox').style.display = profile.settings.showMinimap ? 'block' : 'none';
                  const vb = document.getElementById('btnVib'); vb.textContent = profile.settings.vib ? 'ON' : 'OFF'; vb.classList.toggle('selected', profile.settings.vib);
                  const fp = document.getElementById('btnFps'); fp.textContent = profile.settings.showFps ? 'ON' : 'OFF'; fp.classList.toggle('selected', profile.settings.showFps);
                  document.getElementById('fpsPill').style.display = profile.settings.showFps ? 'block' : 'none';
                  document.getElementById('floatingJoy').classList.toggle('fixed-mode', profile.settings.joyMode === 'fixed');
                  Sound.updateVol();

                  const gr = document.getElementById('setGfxRow'); gr.innerHTML = '';
                  ['low', 'high', 'ultra'].forEach(q => {
                    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip' + (profile.settings.gfx === q ? ' selected' : '');
                    b.textContent = q.toUpperCase(); b.onclick = () => { profile.settings.gfx = q; saveProfile(); resizeCanvas(); applySettingsToDOM(); Sound.click(); }; gr.appendChild(b);
                  });
                  const jr = document.getElementById('setJoyRow'); jr.innerHTML = '';
                  ['floating', 'fixed'].forEach(m => {
                    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip' + (profile.settings.joyMode === m ? ' selected' : '');
                    b.textContent = m.toUpperCase(); b.onclick = () => { profile.settings.joyMode = m; saveProfile(); applySettingsToDOM(); Sound.click(); }; jr.appendChild(b);
                  });
                }

                function renderProfileModal() {
                  refreshLobbyUI();
                  document.getElementById('prAv').textContent = profile.avatar;
                  document.getElementById('prLv').textContent = `LV.${profile.level}`;
                  document.getElementById('prNameIn').value = profile.name;
                  document.getElementById('prRankTxt').textContent = getRank(profile.level);
                  const need = getXpNeed(profile.level);
                  document.getElementById('prXpTxt').textContent = `${profile.xp} / ${need} XP`;
                  document.getElementById('prXpBar').style.width = `${Math.min(100, (profile.xp / need) * 100)}%`;

                  const avWrap = document.getElementById('avatarChips'); avWrap.innerHTML = '';
                  AVATARS.forEach(a => {
                    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip' + (profile.avatar === a ? ' selected' : '');
                    b.textContent = a; b.onclick = () => { profile.avatar = a; saveProfile(); renderProfileModal(); Sound.click(); }; avWrap.appendChild(b);
                  });

                  document.getElementById('careerGrid').innerHTML = `
                    <div class="stat-box"><div class="stat-val">${profile.stats.matches}</div><div class="stat-lbl">Matches</div></div>
                    <div class="stat-box"><div class="stat-val" style="color:var(--gold);">${profile.stats.wins}</div><div class="stat-lbl">Wins</div></div>
                    <div class="stat-box"><div class="stat-val">${profile.stats.kills}</div><div class="stat-lbl">Kills</div></div>
                    <div class="stat-box"><div class="stat-val">${profile.stats.bestLength}m</div><div class="stat-lbl">Max Len</div></div>`;

                  const pg = document.getElementById('potionShopGrid'); pg.innerHTML = '';
                  POTION_TYPES.forEach(po => {
                    const cnt = profile.potionInv[po.id] || 0;
                    const card = document.createElement('div'); card.className = 'card-item';
                    card.innerHTML = `
                      <div style="display:flex;justify-content:space-between;align-items:center;"><strong style="color:${po.col};">${po.icon} ${po.name}</strong><span class="tier-badge" style="background:rgba(255,255,255,0.12);color:#fff;">OWNED: ${cnt}</span></div>
                      <div style="font-size:10px;color:#b8d1b4;">Lasts ${po.dur}s • +250 XP</div>
                      <button type="button" class="btn-gold" style="padding:7px;font-size:10.5px;">BUY +1 (${po.cost} 🪙)</button>`;
                    card.onclick = () => {
                      if (profile.coins < po.cost) { Sound.over(); return; }
                      profile.coins -= po.cost; profile.potionInv[po.id] = cnt + 1;
                      saveProfile(); Sound.buy(); renderProfileModal(); refreshQuickPotions();
                    };
                    pg.appendChild(card);
                  });

                  const ug = document.getElementById('upgradesGrid'); ug.innerHTML = '';
                  UPGRADE_LIST.forEach(u => {
                    const lv = profile.upgrades[u.id] || 0;
                    const cost = u.baseCost * (lv + 1);
                    const card = document.createElement('div'); card.className = 'card-item';
                    card.innerHTML = `
                      <div style="display:flex;justify-content:space-between;align-items:center;"><strong style="color:var(--gold);">${u.icon} ${u.name}</strong><span class="tier-badge" style="background:rgba(124,232,70,0.2);color:#95f54c;">LV ${lv}/${u.max}</span></div>
                      <div style="font-size:10px;color:#b8d1b4;">${u.desc}</div>
                      <button type="button" class="btn-gold" style="padding:7px;font-size:10.5px;">${lv >= u.max ? 'MAX LEVEL ✅' : `UPGRADE ${cost.toLocaleString()} 🪙`}</button>`;
                    card.onclick = () => {
                      if (lv >= u.max || profile.coins < cost) { Sound.over(); return; }
                      profile.coins -= cost; profile.upgrades[u.id] = lv + 1;
                      saveProfile(); Sound.buy(); renderProfileModal();
                    };
                    ug.appendChild(card);
                  });

                  const fg = document.getElementById('foodStyleGrid'); fg.innerHTML = '';
                  FOOD_STYLES.forEach(fs => {
                    const sel = profile.selectedFood === fs.id;
                    const card = document.createElement('div'); card.className = 'card-item' + (sel ? ' selected' : '');
                    card.innerHTML = `<strong style="color:var(--gold);">${fs.icon} ${fs.name}</strong><div style="font-size:10px;color:#b8d1b4;">${fs.desc}</div><div style="font-size:10px;color:var(--green);font-weight:800;">${sel ? 'ACTIVE STYLE' : 'TAP TO SELECT'}</div>`;
                    card.onclick = () => { profile.selectedFood = fs.id; saveProfile(); Sound.click(); renderProfileModal(); };
                    fg.appendChild(card);
                  });

                  const ag = document.getElementById('achGrid'); ag.innerHTML = '';
                  ACHIEVEMENTS.forEach(a => {
                    const cur = profile.stats[a.stat] || 0;
                    const claimed = profile.claimedAch.includes(a.id);
                    const ready = !claimed && cur >= a.goal;
                    const card = document.createElement('div'); card.className = 'card-item' + (ready ? ' selected' : '');
                    card.innerHTML = `
                      <strong style="color:var(--gold);">🏆 ${a.name}</strong>
                      <div style="font-size:10px;color:#b8d1b4;">${a.desc} (${Math.min(cur, a.goal)}/${a.goal})</div>
                      <button type="button" class="${ready ? 'btn-inr' : 'btn-ghost'}" style="padding:7px;font-size:10.5px;">${claimed ? 'CLAIMED ✅' : (ready ? `CLAIM +${a.coins} 🪙 +${a.dias} 💎` : `REWARD: ${a.coins} 🪙 + ${a.dias} 💎`)}</button>`;
                    card.onclick = () => {
                      if (!ready) return;
                      profile.claimedAch.push(a.id); profile.coins += a.coins; profile.diamonds += a.dias;
                      saveProfile(); Sound.buy(); renderProfileModal();
                    };
                    ag.appendChild(card);
                  });

                  const stg = document.getElementById('storeGrid'); stg.innerHTML = '';
                  STORE_PACKS.forEach(pk => {
                    const card = document.createElement('div'); card.className = 'card-item inr-card';
                    card.innerHTML = `<strong style="color:#a8ff8a;font-size:13px;">${pk.title}</strong><div style="font-size:10px;color:#c2dbb8;">${pk.desc}</div><button type="button" class="btn-inr">BUY ₹${pk.inr}</button>`;
                    card.onclick = () => {
                      pendingPack = pk;
                      document.getElementById('payTitle').textContent = pk.title;
                      document.getElementById('payPrice').textContent = `₹${pk.inr}`;
                      document.getElementById('btnPayConfirm').textContent = `PAY ₹${pk.inr}`;
                      document.getElementById('payModal').classList.add('open'); Sound.click();
                    };
                    stg.appendChild(card);
                  });

                  const sg = document.getElementById('snakesGrid'); sg.innerHTML = '';
                  SPECIES.forEach(s => {
                    const owned = profile.ownedSnakes.includes(s.id) || s.curr === 'free';
                    const sel = previewSnakeId === s.id;
                    const card = document.createElement('div');
                    card.className = `snake-card t-${s.tier}` + (sel ? ' selected' : '');
                    const priceText = profile.selectedSnake === s.id ? 'EQUIPPED ✅' : (owned ? (s.curr === 'free' ? 'FREE' : 'OWNED') : `${s.price.toLocaleString()} ${s.curr === 'dia' ? '💎' : '🪙'}`);
                    const priceCol = s.curr === 'free' || owned ? '#8cff6e' : (s.curr === 'dia' ? '#9cf4ff' : '#ffe47a');

                    const thumb = document.createElement('canvas');
                    thumb.className = 'snake-thumb'; thumb.width = 80; thumb.height = 80;
                    drawSnakeCardThumb(thumb, s);

                    const nm = document.createElement('div'); nm.className = 'sc-name'; nm.textContent = s.name;
                    const pr = document.createElement('div'); pr.className = 'sc-price'; pr.style.color = priceCol; pr.textContent = priceText;
                    card.appendChild(thumb); card.appendChild(nm); card.appendChild(pr);
                    card.onclick = () => { Sound.click(); selectWorkshopPreview(s.id); document.querySelectorAll('.snake-card').forEach(el => el.classList.remove('selected')); card.classList.add('selected'); };
                    sg.appendChild(card);
                  });
                  selectWorkshopPreview(previewSnakeId);

                  const bg = document.getElementById('biomeGrid'); bg.innerHTML = '';
                  BIOMES.forEach(b => {
                    const sel = profile.selectedBiome === b.id;
                    const card = document.createElement('div'); card.className = 'card-item' + (sel ? ' selected' : '');
                    card.innerHTML = `
                      <strong style="color:var(--gold);font-size:12px;">${b.name}</strong>
                      <div style="font-size:9.5px;color:#b8d1b4;">${b.desc}</div>
                      <div style="height:22px;border-radius:8px;background:linear-gradient(90deg, ${b.floor} 0%, ${b.water} 55%, ${b.tree3} 100%);border:1px solid rgba(255,255,255,0.28);"></div>
                      <div style="font-size:10px;color:var(--green);font-weight:800;">${sel ? 'ACTIVE MAP ✅' : 'TAP TO SELECT'}</div>`;
                    card.onclick = () => { profile.selectedBiome = b.id; saveProfile(); Sound.click(); renderProfileModal(); enterLobby(); };
                    bg.appendChild(card);
                  });
                }

                function openProfileModal(tabId) {
                  previewSnakeId = profile.selectedSnake;
                  renderProfileModal();
                  document.querySelectorAll('#profileTabs .tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
                  document.querySelectorAll('#profileModal .tab-pane').forEach(p => p.classList.toggle('active', p.id === tabId));
                  document.querySelector('#profileModal .modal-body').scrollTop = 0;
                  document.getElementById('profileModal').classList.add('open');
                  Sound.click();
                }

                document.querySelectorAll('[data-qp]').forEach(btn => {
                  btn.addEventListener('click', () => {
                    const pid = btn.dataset.qp;
                    if (!player || !player.alive || (profile.potionInv[pid] || 0) <= 0) { Sound.over(); return; }
                    const po = POTION_TYPES.find(p => p.id === pid);
                    if (!po) return;
                    profile.potionInv[pid]--;
                    activePotion = { id: po.id, label: po.label, timer: po.dur };
                    matchStats.xp += 250;
                    saveProfile(); refreshQuickPotions(); Sound.potion(); vibrate(25);
                    if (profile.settings.xpPopups) floatTexts.push({ x: player.x, y: player.y - 24, text: `${po.label} +250 XP!`, color: po.col, life: 1.2, maxLife: 1.2 });
                  });
                });

                document.getElementById('hudEmojiBtn').addEventListener('click', () => {
                  if (!player || !player.alive) return;
                  const em = EMOJIS[emojiIdx % EMOJIS.length]; emojiIdx++;
                  floatTexts.push({ x: player.x, y: player.y - 34, text: em, color: '#ffffff', life: 1.4, maxLife: 1.4 });
                  Sound.click();
                });

                document.getElementById('btnPayCancel').addEventListener('click', () => { pendingPack = null; document.getElementById('payModal').classList.remove('open'); Sound.click(); });
                document.getElementById('btnPayConfirm').addEventListener('click', () => {
                  if (!pendingPack) return;
                  profile.coins += pendingPack.coins; profile.diamonds += pendingPack.dias;
                  pendingPack = null; document.getElementById('payModal').classList.remove('open');
                  saveProfile(); Sound.buy(); renderProfileModal();
                });

                const doExchange = (coinsCost, diaGain) => {
                  if (profile.coins < coinsCost) { Sound.over(); return; }
                  profile.coins -= coinsCost; profile.diamonds += diaGain;
                  saveProfile(); Sound.buy(); renderProfileModal();
                };
                document.getElementById('btnEx100').addEventListener('click', () => doExchange(5000, 100));
                document.getElementById('btnEx500').addEventListener('click', () => doExchange(20000, 500));
                document.getElementById('btnDailyBonus').addEventListener('click', e => {
                  const now = Date.now();
                  if (now - profile.lastDaily < 18000000) { e.target.textContent = 'CLAIMED TODAY ✅'; Sound.click(); return; }
                  profile.lastDaily = now; profile.coins += 500; profile.diamonds += 10;
                  e.target.textContent = 'CLAIMED +500 🪙 +10 💎!';
                  saveProfile(); Sound.buy(); renderProfileModal();
                });

                document.getElementById('btnTapEnter').addEventListener('click', e => {
                  e.stopPropagation();
                  if (splashEntered) return;
                  splashEntered = true;
                  Sound.init(); Sound.click();
                  document.getElementById('tapEnterWrap').style.display = 'none';
                  document.getElementById('loaderWrap').style.display = 'flex';
                  let pct = 0;
                  const fill = document.getElementById('loaderFill'), txt = document.getElementById('loaderPct');
                  const iv = setInterval(() => {
                    pct = Math.min(100, pct + rand(16, 26));
                    fill.style.width = `${pct}%`; txt.textContent = `${Math.floor(pct)}%`;
                    if (pct >= 100) {
                      clearInterval(iv);
                      const sp = document.getElementById('splashScreen');
                      sp.classList.add('fade-out');
                      setTimeout(() => { sp.style.display = 'none'; enterLobby(); }, 300);
                    }
                  }, 80);
                });

                document.getElementById('profileBadge').addEventListener('click', () => openProfileModal('tabProfile'));
                document.getElementById('showcasePill').addEventListener('click', () => openProfileModal('tabSnakes'));
                document.getElementById('btnCoinShop').addEventListener('click', () => openProfileModal('tabShop'));
                document.getElementById('btnDiaShop').addEventListener('click', () => openProfileModal('tabShop'));
                document.querySelectorAll('[data-open-prof]').forEach(b => b.addEventListener('click', () => openProfileModal(b.dataset.openProf)));
                document.querySelectorAll('#profileTabs .tab-btn').forEach(b => b.addEventListener('click', () => openProfileModal(b.dataset.tab)));
                document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => { document.getElementById(b.dataset.close).classList.remove('open'); Sound.click(); }));
                document.getElementById('prNameIn').addEventListener('input', e => { profile.name = e.target.value.trim() || 'ApexHunter'; saveProfile(); refreshLobbyUI(); });
                document.getElementById('modePill').addEventListener('click', () => {
                  const idx = MODES.findIndex(m => m.id === profile.selectedMode);
                  profile.selectedMode = MODES[(idx + 1) % MODES.length].id;
                  saveProfile(); refreshLobbyUI(); Sound.click();
                });

                document.getElementById('btnStartMatch').addEventListener('click', () => {
                  Sound.init(); Sound.click();
                  const mm = document.getElementById('matchmakingOverlay'), mt = document.getElementById('mmText');
                  mm.classList.add('open');
                  let cnt = 8;
                  const iv = setInterval(() => {
                    cnt = Math.min(TOTAL_SNAKES, cnt + Math.floor(rand(8, 15)));
                    mt.textContent = `${cnt} / ${TOTAL_SNAKES} BEASTS READY`;
                    if (cnt >= TOTAL_SNAKES) { clearInterval(iv); setTimeout(() => { mm.classList.remove('open'); startMatch(); }, 200); }
                  }, 110);
                });

                document.getElementById('minimapBox').addEventListener('click', () => { tacMapOpen = true; document.getElementById('tacMapOverlay').classList.add('open'); drawRadar(tacCtx, tacCanvas.width, tacCanvas.height, true); Sound.click(); });
                const closeTacMap = () => { tacMapOpen = false; document.getElementById('tacMapOverlay').classList.remove('open'); };
                document.getElementById('btnCloseTacMap').addEventListener('click', closeTacMap);
                document.getElementById('tacMapOverlay').addEventListener('click', e => { if (e.target.id === 'tacMapOverlay') closeTacMap(); });

                const toggleMute = () => { profile.settings.muted = !profile.settings.muted; saveProfile(); Sound.updateVol(); refreshLobbyUI(); Sound.click(); };
                const openSettings = () => { applySettingsToDOM(); document.getElementById('settingsModal').classList.add('open'); Sound.click(); };
                document.getElementById('btnLobbyAudio').addEventListener('click', toggleMute);
                document.getElementById('hudAudioBtn').addEventListener('click', toggleMute);
                document.getElementById('hudLobbyBtn').addEventListener('click', () => { Sound.click(); enterLobby(); });
                document.getElementById('btnLobbySettings').addEventListener('click', openSettings);
                document.getElementById('hudSetBtn').addEventListener('click', openSettings);

                document.getElementById('btnNotif').addEventListener('click', () => {
                  profile.settings.notifs = !profile.settings.notifs; saveProfile(); applySettingsToDOM(); Sound.click();
                  if (window.AndroidAudio) window.AndroidAudio.setNotifications(profile.settings.notifs);
                });
                document.getElementById('btnTestNotif').addEventListener('click', () => {
                  Sound.click();
                  if (window.AndroidAudio) window.AndroidAudio.testNotification();
                });
                document.getElementById('btnBgm').addEventListener('click', () => { profile.settings.bgm = !profile.settings.bgm; saveProfile(); applySettingsToDOM(); Sound.click(); });
                document.getElementById('setBgmVol').addEventListener('input', e => { profile.settings.bgmVol = e.target.value / 100; saveProfile(); Sound.updateVol(); });
                document.getElementById('setSfxVol').addEventListener('input', e => { profile.settings.sfxVol = e.target.value / 100; saveProfile(); Sound.updateVol(); });
                document.getElementById('setZoom').addEventListener('input', e => { profile.settings.zoom = e.target.value / 100; saveProfile(); });
                document.getElementById('setSens').addEventListener('input', e => { profile.settings.lookSens = e.target.value / 100; saveProfile(); });
                document.getElementById('btnAutoCenter').addEventListener('click', () => { profile.settings.autoCenter = !profile.settings.autoCenter; saveProfile(); applySettingsToDOM(); Sound.click(); });
                document.getElementById('btnXpPop').addEventListener('click', () => { profile.settings.xpPopups = !profile.settings.xpPopups; saveProfile(); applySettingsToDOM(); Sound.click(); });
                document.getElementById('btnShowMap').addEventListener('click', () => { profile.settings.showMinimap = !profile.settings.showMinimap; saveProfile(); applySettingsToDOM(); Sound.click(); });
                document.getElementById('btnVib').addEventListener('click', () => { profile.settings.vib = !profile.settings.vib; saveProfile(); applySettingsToDOM(); Sound.click(); });
                document.getElementById('btnFps').addEventListener('click', () => { profile.settings.showFps = !profile.settings.showFps; saveProfile(); applySettingsToDOM(); Sound.click(); });
                document.getElementById('btnResetSet').addEventListener('click', () => { profile.settings = { ...DEFAULT_SETTINGS }; saveProfile(); resizeCanvas(); applySettingsToDOM(); Sound.click(); });
                document.getElementById('btnResLobby').addEventListener('click', () => { Sound.click(); enterLobby(); });
                document.getElementById('btnResAgain').addEventListener('click', () => { Sound.click(); startMatch(); });
                document.getElementById('btnRecenter').addEventListener('click', () => { camera.lookX = 0; camera.lookY = 0; Sound.click(); });

                const joyEl = document.getElementById('floatingJoy'), joyKnob = document.getElementById('floatingJoyKnob');
                function updateJoyVisual(x, y) {
                  const dx = x - ctrl.joyOx, dy = y - ctrl.joyOy, d = Math.hypot(dx, dy);
                  ctrl.joyMag = d; ctrl.joyAngle = Math.atan2(dy, dx);
                  const cl = Math.min(d, 38);
                  joyKnob.style.transform = `translate(calc(-50% + ${Math.cos(ctrl.joyAngle) * cl}px), calc(-50% + ${Math.sin(ctrl.joyAngle) * cl}px))`;
                }

                canvas.addEventListener('touchstart', e => {
                  if (screenState !== 'playing') return;
                  e.preventDefault();
                  for (const t of e.changedTouches) {
                    if (t.clientX < appW * 0.5 && ctrl.joyTouchId === null) {
                      ctrl.joyTouchId = t.identifier; ctrl.joyActive = true;
                      if (profile.settings.joyMode === 'fixed') { ctrl.joyOx = 82; ctrl.joyOy = appH - 82; }
                      else { ctrl.joyOx = t.clientX; ctrl.joyOy = t.clientY; joyEl.style.left = `${t.clientX}px`; joyEl.style.top = `${t.clientY}px`; }
                      joyEl.classList.add('visible'); updateJoyVisual(t.clientX, t.clientY);
                    } else if (t.clientX >= appW * 0.5 && ctrl.lookTouchId === null) {
                      ctrl.lookTouchId = t.identifier; ctrl.lookActive = true; ctrl.lookLastX = t.clientX; ctrl.lookLastY = t.clientY;
                    }
                  }
                }, { passive: false });

                canvas.addEventListener('touchmove', e => {
                  if (screenState !== 'playing') return;
                  e.preventDefault();
                  for (const t of e.changedTouches) {
                    if (t.identifier === ctrl.joyTouchId) {
                      updateJoyVisual(t.clientX, t.clientY);
                    } else if (t.identifier === ctrl.lookTouchId) {
                      const sens = profile.settings.lookSens || 1.35;
                      camera.lookX = clamp(camera.lookX - (t.clientX - ctrl.lookLastX) * sens, -FREE_LOOK_MAX, FREE_LOOK_MAX);
                      camera.lookY = clamp(camera.lookY - (t.clientY - ctrl.lookLastY) * sens, -FREE_LOOK_MAX, FREE_LOOK_MAX);
                      ctrl.lookLastX = t.clientX; ctrl.lookLastY = t.clientY;
                    }
                  }
                }, { passive: false });

                const endTouch = e => {
                  for (const t of e.changedTouches) {
                    if (t.identifier === ctrl.joyTouchId) { ctrl.joyTouchId = null; ctrl.joyActive = false; ctrl.joyMag = 0; joyEl.classList.remove('visible'); joyKnob.style.transform = 'translate(-50%,-50%)'; }
                    if (t.identifier === ctrl.lookTouchId) { ctrl.lookTouchId = null; ctrl.lookActive = false; }
                  }
                };
                canvas.addEventListener('touchend', endTouch);
                canvas.addEventListener('touchcancel', endTouch);

                canvas.addEventListener('mousedown', e => { if (screenState !== 'playing') return; ctrl.joyMouse = true; ctrl.joyActive = true; ctrl.joyOx = appW / 2; ctrl.joyOy = appH / 2; updateJoyVisual(e.clientX, e.clientY); });
                window.addEventListener('mousemove', e => { if (ctrl.joyMouse && screenState === 'playing') updateJoyVisual(e.clientX, e.clientY); });
                window.addEventListener('mouseup', () => { ctrl.joyMouse = false; ctrl.joyActive = false; ctrl.joyMag = 0; });

                const btnBoost = document.getElementById('btnBoost');
                const setBoost = on => { ctrl.boostHeld = on; btnBoost.classList.toggle('active', on); };
                btnBoost.addEventListener('touchstart', e => { e.preventDefault(); setBoost(true); }, { passive: false });
                btnBoost.addEventListener('touchend', e => { e.preventDefault(); setBoost(false); });
                btnBoost.addEventListener('mousedown', () => setBoost(true));
                window.addEventListener('mouseup', () => setBoost(false));

                window.addEventListener('keydown', e => {
                  if (e.code === 'KeyW' || e.code === 'ArrowUp') ctrl.keys.up = true;
                  if (e.code === 'KeyS' || e.code === 'ArrowDown') ctrl.keys.down = true;
                  if (e.code === 'KeyA' || e.code === 'ArrowLeft') ctrl.keys.left = true;
                  if (e.code === 'KeyD' || e.code === 'ArrowRight') ctrl.keys.right = true;
                  if (e.code === 'Space') ctrl.keys.boost = true;
                  if (e.code === 'KeyM' && screenState === 'playing') { tacMapOpen ? closeTacMap() : document.getElementById('minimapBox').click(); }
                });
                window.addEventListener('keyup', e => {
                  if (e.code === 'KeyW' || e.code === 'ArrowUp') ctrl.keys.up = false;
                  if (e.code === 'KeyS' || e.code === 'ArrowDown') ctrl.keys.down = false;
                  if (e.code === 'KeyA' || e.code === 'ArrowLeft') ctrl.keys.left = false;
                  if (e.code === 'KeyD' || e.code === 'ArrowRight') ctrl.keys.right = false;
                  if (e.code === 'Space') ctrl.keys.boost = false;
                });

                window.addEventListener('resize', resizeCanvas);
                resizeCanvas();
                generateWorld(profile.selectedBiome);
                const initSpec = SPECIES.find(s => s.id === profile.selectedSnake) || SPECIES[0];
                lobbySnake = new Snake({ name: profile.name, species: initSpec, x: appW * 0.5, y: appH * 0.48, isPlayer: true, mass: 16 });
                lobbySnake.spawnShield = 0; lobbySnake.hoodFlare = initSpec.hood ? 0.9 : 0;
                requestAnimationFrame(mainLoop);
              })();
            </script>
          </body>
          </html>
          GAMEHTML

      - name: Generate Release Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/serpent-release.jks \
            -alias serpentkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "Serpent@2026" -keypass "Serpent@2026" \
            -dname "CN=Apex Wild Studios, OU=Games, O=SerpentWild, L=India, S=IN, C=IN"

      - name: Build Signed Release APK & AAB
        run: gradle assembleRelease bundleRelease

      - name: Upload Serpent-Wild Android APK & AAB
        uses: actions/upload-artifact@v4
        with:
          name: Serpent-Wild-Android-APK
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
