                const snakeGrid = new Map(), preyGrid = new Map();
                const cellKey = (cx, cy) => ((cx & 0xFFFF) << 16) | (cy & 0xFFFF);

                function rebuildGrids() {
                  snakeGrid.clear();
                  for (const s of snakes) {
                    if (!s.alive) continue;
                    const step = Math.max(1, Math.floor(s.segments.length / 8));
                    const seen = new Set();
                    for (let i = 0; i < s.segments.length; i += step) {
                      const k = cellKey(Math.floor(s.segments[i].x / CELL_SIZE), Math.floor(s.segments[i].y / CELL_SIZE));
                      if (seen.has(k)) continue;
                      seen.add(k);
                      let arr = snakeGrid.get(k); if (!arr) { arr = []; snakeGrid.set(k, arr); }
                      arr.push(s);
                    }
                  }
                  preyGrid.clear();
                  for (let i = 0; i < preyList.length; i++) {
                    const p = preyList[i];
                    const k = cellKey(Math.floor(p.x / CELL_SIZE), Math.floor(p.y / CELL_SIZE));
                    let arr = preyGrid.get(k); if (!arr) { arr = []; preyGrid.set(k, arr); }
                    arr.push(i);
                  }
                }

                function queryGrid(grid, x, y, r) {
                  const x0 = Math.floor((x - r) / CELL_SIZE), x1 = Math.floor((x + r) / CELL_SIZE);
                  const y0 = Math.floor((y - r) / CELL_SIZE), y1 = Math.floor((y + r) / CELL_SIZE);
                  const out = [];
                  for (let cx = x0; cx <= x1; cx++) for (let cy = y0; cy <= y1; cy++) {
                    const arr = grid.get(cellKey(cx, cy));
                    if (arr) for (let i = 0; i < arr.length; i++) out.push(arr[i]);
                  }
                  return out;
                }

                function isNearCam(x, y, pad = 720) {
                  const cx = camera.x + camera.lookX, cy = camera.y + camera.lookY;
                  return Math.abs(x - cx) < (appW / camera.zoom) * 0.6 + pad && Math.abs(y - cy) < (appH / camera.zoom) * 0.6 + pad;
                }

                // FIXED: CHECK HEAD + MID + TAIL SO ENEMY SNAKES NEVER DISAPPEAR MID-SCREEN!
                function isSnakeVisible(s) {
                  if (s.isPlayer) return true;
                  const segs = s.segments, len = segs.length;
                  if (isNearCam(s.x, s.y, 480)) return true;
                  if (len > 4 && isNearCam(segs[Math.floor(len * 0.5)].x, segs[Math.floor(len * 0.5)].y, 480)) return true;
                  if (len > 2 && isNearCam(segs[len - 1].x, segs[len - 1].y, 480)) return true;
                  return false;
                }

                function generateWorld(biomeId) {
                  const biome = BIOMES.find(b => b.id === biomeId) || BIOMES[0];
                  const tile = document.createElement('canvas');
                  tile.width = 512; tile.height = 512;
                  const t = tile.getContext('2d');
                  t.fillStyle = biome.floor; t.fillRect(0, 0, 512, 512);
                  for (let i = 0; i < 120; i++) {
                    const x = rand(0, 512), y = rand(0, 512), r = rand(24, 96);
                    const col = Math.random() < 0.55 ? biome.moss : biome.soil;
                    const g = t.createRadialGradient(x, y, 2, x, y, r);
                    g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
                    t.fillStyle = g; t.beginPath(); t.arc(x, y, r, 0, Math.PI * 2); t.fill();
                  }
                  for (let i = 0; i < 520; i++) {
                    t.fillStyle = Math.random() < 0.5 ? 'rgba(0,0,0,0.22)' : 'rgba(190,200,150,0.1)';
                    t.fillRect(rand(0, 512), rand(0, 512), rand(1.2, 2.8), rand(1.2, 2.8));
                  }
                  for (let i = 0; i < 75; i++) {
                    const gx = rand(0, 512), gy = rand(0, 512);
                    t.strokeStyle = 'rgba(78, 148, 46, 0.38)'; t.lineWidth = 1.3;
                    for (let b = -1; b <= 1; b++) {
                      t.beginPath(); t.moveTo(gx, gy); t.quadraticCurveTo(gx + b * 4, gy - 6, gx + b * 7, gy - 11); t.stroke();
                    }
                  }
                  const fCols = ['#ffe866', '#ff85a8', '#85e3ff', '#ffffff'];
                  for (let i = 0; i < 28; i++) {
                    t.fillStyle = fCols[i % fCols.length];
                    t.beginPath(); t.arc(rand(0, 512), rand(0, 512), rand(1.8, 3.2), 0, Math.PI * 2); t.fill();
                  }
                  groundPattern = ctx.createPattern(tile, 'repeat');

                  waterZones = []; lilyPads = []; mudZones = []; worldProps = []; trees = []; tracks = []; ripples = [];
                  const addRiver = (sx, sy, ang, steps, baseR) => {
                    let rx = sx, ry = sy, a = ang;
                    for (let s = 0; s < steps; s++) {
                      const rad = baseR + rand(-30, 40);
                      if (dist(rx, ry, WORLD_CENTER, WORLD_CENTER) < ARENA_RADIUS - 360) {
                        waterZones.push({ x: rx, y: ry, r: rad });
                        if (Math.random() < 0.72) {
                          for (let l = 0; l < 3; l++) {
                            const la = rand(0, 6.28), ld = rand(18, rad * 0.65);
                            lilyPads.push({ x: rx + Math.cos(la) * ld, y: ry + Math.sin(la) * ld, r: rand(14, 24), rot: rand(0, 6.28), lotus: Math.random() < 0.45 });
                          }
                        }
                      }
                      a += rand(-0.35, 0.35); rx += Math.cos(a) * rad * 1.1; ry += Math.sin(a) * rad * 1.1;
                    }
                  };
                  addRiver(2400, 6600, 0.42, 26, 210);
                  addRiver(9200, 12800, -1.25, 22, 185);
                  addRiver(13400, 13200, -2.3, 20, 180);

                  for (let i = 0; i < 52; i++) {
                    const pt = i < 16 ? randInCircle(13000, 5200, 2200, 160) : randInCircle(WORLD_CENTER, WORLD_CENTER, ARENA_RADIUS, 420);
                    const rad = rand(140, 240);
                    if (!waterZones.some(w => distSq(pt.x, pt.y, w.x, w.y) < (w.r + rad) ** 2)) mudZones.push({ x: pt.x, y: pt.y, r: rad });
                  }

                  for (let i = 0; i < 340; i++) {
                    const pt = randInCircle(WORLD_CENTER, WORLD_CENTER, ARENA_RADIUS, 280);
                    if (waterZones.some(w => distSq(pt.x, pt.y, w.x, w.y) < (w.r + 70) ** 2)) continue;
                    const nearRuins = dist(pt.x, pt.y, 5000, 5000) < 2500;
                    const r = Math.random();
                    const kind = (nearRuins && r < 0.55) ? 'ruin' : (r < 0.28 ? 'log' : r < 0.56 ? 'rock' : r < 0.68 ? 'ruin' : 'fern');
                    worldProps.push({ x: pt.x, y: pt.y, kind, sz: rand(28, 56), rot: rand(0, 6.28) });
                  }

                  for (let i = 0; i < 140; i++) {
                    const pt = randInCircle(WORLD_CENTER, WORLD_CENTER, ARENA_RADIUS, 360);
                    if (waterZones.some(w => distSq(pt.x, pt.y, w.x, w.y) < (w.r + 100) ** 2)) continue;
                    trees.push({ x: pt.x, y: pt.y, r: rand(95, 148), ph: rand(0, 6.28) });
                  }
                }

                function getRegionAt(x, y) {
                  let best = REGIONS[0], bd = Infinity;
                  for (const r of REGIONS) { const d = dist(x, y, r.x, r.y); if (d < bd) { bd = d; best = r; } }
                  return best;
                }

                function getTerrainAt(x, y) {
                  for (const w of waterZones) if (distSq(x, y, w.x, w.y) < w.r * w.r) return 'water';
                  for (const m of mudZones) if (distSq(x, y, m.x, m.y) < m.r * m.r) return 'mud';
                  return 'ground';
                }

                function isUnderTree(x, y) {
                  for (const tr of trees) if (distSq(x, y, tr.x, tr.y) < (tr.r * 0.78) ** 2) return true;
                  return false;
                }

                function spawnParticles(x, y, color, count = 6, spd = 90) {
                  if (particles.length > 160) return;
                  for (let i = 0; i < count; i++) {
                    const a = rand(0, Math.PI * 2), v = rand(spd * 0.3, spd);
                    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.25, 0.55), maxLife: 0.55, size: rand(2.5, 5.5), color });
                  }
                }

                function pushKillFeed(text) {
                  const feed = document.getElementById('killFeed');
                  if (!feed) return;
                  const div = document.createElement('div');
                  div.className = 'kf-entry';
                  div.textContent = text;
                  feed.prepend(div);
                  while (feed.children.length > 4) feed.lastChild.remove();
                  setTimeout(() => div.remove(), 4200);
                }

                // REALISTIC RED BONE-IN MEAT CHUNKS (DROPPED WHEN SNAKE IS KILLED!)
                function drawMeatChunk(c, m) {
                  c.save();
                  c.translate(m.x, m.y);
                  c.rotate(m.rot || 0);
                  const r = m.r;
                  // Shadow
                  c.fillStyle = 'rgba(0,0,0,0.42)';
                  c.beginPath(); c.ellipse(2, 4, r * 1.15, r * 0.82, 0, 0, Math.PI * 2); c.fill();
                  // Outer cooked/fatty rim
                  c.fillStyle = '#ffe5cc';
                  c.beginPath(); c.ellipse(0, 0, r * 1.12, r * 0.82, 0, 0, Math.PI * 2); c.fill();
                  // Deep Red Raw Steak Flesh
                  c.fillStyle = '#c91c22';
                  c.beginPath(); c.ellipse(0, 0, r * 0.94, r * 0.66, 0, 0, Math.PI * 2); c.fill();
                  // Marbling highlight
                  c.strokeStyle = 'rgba(255,215,200,0.55)'; c.lineWidth = 1.4;
                  c.beginPath(); c.moveTo(-r * 0.5, -r * 0.2); c.quadraticCurveTo(0, r * 0.2, r * 0.5, -r * 0.1); c.stroke();
                  // White Center Bone
                  c.fillStyle = '#fffdf7'; c.strokeStyle = '#998b78'; c.lineWidth = 1;
                  c.beginPath(); c.arc(-r * 0.28, 0, r * 0.26, 0, Math.PI * 2); c.fill(); c.stroke();
                  c.restore();
                }

