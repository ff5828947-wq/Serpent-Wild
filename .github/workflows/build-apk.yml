                // 50 UNIQUE ANIMATED ANIMAL FACES, EYES & LIPS!
                function drawSpeciesHead(c, sp, hr, tongueExt = 0, jawOpen = 0, lookShift = 0) {
                  const pat = sp.pat;
                  const pShift = clamp(lookShift, -1, 1) * hr * 0.08;
                  const pulse = sp.anim >= 2 ? (0.85 + Math.sin(globalTime * (sp.anim * 2.5)) * 0.15) : 1;

                  // Animated Mythic/Legendary Glow Halo on Head
                  if (sp.glow && sp.anim >= 2) {
                    c.save(); c.shadowColor = sp.glow; c.shadowBlur = 14 * pulse;
                    c.strokeStyle = sp.glow; c.lineWidth = 2; c.beginPath(); c.arc(0, 0, hr * 1.15, 0, Math.PI * 2); c.stroke(); c.restore();
                  }

                  // Ears / Horns / Antlers / Manes / Crowns (Behind Head)
                  if (pat === 'cat' || pat === 'bear' || pat === 'ape') {
                    for (const s of [-1, 1]) {
                      c.fillStyle = pat === 'bear' && sp.id === 'panda' ? '#14171a' : sp.mid;
                      c.beginPath(); c.arc(-hr * 0.46, s * hr * 0.88, hr * 0.34, 0, Math.PI * 2); c.fill();
                      if (sp.id !== 'panda') { c.fillStyle = sp.accent; c.beginPath(); c.arc(-hr * 0.46, s * hr * 0.88, hr * 0.16, 0, Math.PI * 2); c.fill(); }
                    }
                  } else if (pat === 'canine' || pat === 'fox' || pat === 'bat') {
                    const eLen = pat === 'bat' ? 1.5 : (pat === 'fox' ? 1.32 : 1.18);
                    for (const s of [-1, 1]) {
                      c.fillStyle = sp.mid; c.beginPath(); c.moveTo(-hr * 0.08, s * hr * 0.7); c.lineTo(-hr * 0.95, s * hr * eLen); c.lineTo(-hr * 0.78, s * hr * 0.38); c.closePath(); c.fill();
                      c.fillStyle = sp.accent; c.beginPath(); c.moveTo(-hr * 0.25, s * hr * 0.68); c.lineTo(-hr * 0.72, s * hr * (eLen * 0.82)); c.lineTo(-hr * 0.65, s * hr * 0.5); c.closePath(); c.fill();
                    }
                  } else if (pat === 'lion') {
                    c.fillStyle = sp.accent; c.strokeStyle = sp.dark; c.lineWidth = 1.4;
                    c.beginPath();
                    for (let k = 0; k < 14; k++) {
                      const a = (k / 14) * Math.PI * 2, rad = (k % 2 === 0 ? 1.34 : 1.02) * hr;
                      if (k === 0) c.moveTo(Math.cos(a) * rad, Math.sin(a) * rad); else c.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
                    }
                    c.closePath(); c.fill(); c.stroke();
                  } else if (pat === 'eleph') {
                    c.fillStyle = sp.mid; c.strokeStyle = sp.dark; c.lineWidth = 1.2;
                    for (const s of [-1, 1]) { c.beginPath(); c.ellipse(-hr * 0.25, s * hr * 1.12, hr * 0.52, hr * 0.42, s * 0.3, 0, Math.PI * 2); c.fill(); c.stroke(); }
                  } else if (pat === 'bull') {
                    c.fillStyle = '#f2e8cf'; c.strokeStyle = '#5c4b32'; c.lineWidth = 1.3;
                    for (const s of [-1, 1]) { c.beginPath(); c.moveTo(0, s * hr * 0.72); c.quadraticCurveTo(hr * 0.45, s * hr * 1.55, hr * 1.12, s * hr * 1.15); c.quadraticCurveTo(hr * 0.45, s * hr * 1.15, -hr * 0.35, s * hr * 0.55); c.closePath(); c.fill(); c.stroke(); }
                  } else if (pat === 'antler' || pat === 'd_jade') {
                    c.strokeStyle = pat === 'd_jade' ? '#ffd84d' : sp.accent; c.lineWidth = Math.max(2, hr * 0.14); c.lineCap = 'round';
                    for (const s of [-1, 1]) { c.beginPath(); c.moveTo(-hr * 0.2, s * hr * 0.55); c.lineTo(-hr * 1.25, s * hr * 1.18); c.moveTo(-hr * 0.72, s * hr * 0.85); c.lineTo(-hr * 1.02, s * hr * 1.42); c.stroke(); }
                  } else if (pat === 'tricera' || pat === 'dilo' || pat === 'd_sea' || pat === 'banshee') {
                    c.fillStyle = sp.accent; c.strokeStyle = sp.dark; c.lineWidth = 1.3;
                    for (const s of [-1, 1]) { c.beginPath(); c.moveTo(hr * 0.12, s * hr * 0.8); c.lineTo(-hr * 0.88, s * hr * 1.48); c.lineTo(-hr * 1.12, s * hr * 0.55); c.closePath(); c.fill(); c.stroke(); }
                  } else if (pat === 'd_emp' || pat === 'd_thunder' || pat === 'd_void') {
                    c.fillStyle = sp.accent; c.strokeStyle = sp.dark; c.lineWidth = 1.1;
                    c.beginPath(); c.moveTo(-hr * 0.22, -hr * 0.68); c.lineTo(-hr * 1.12, -hr * 1.05); c.lineTo(-hr * 0.55, -hr * 0.28); c.lineTo(-hr * 1.34, 0); c.lineTo(-hr * 0.55, hr * 0.28); c.lineTo(-hr * 1.12, hr * 1.05); c.lineTo(-hr * 0.22, hr * 0.68); c.closePath(); c.fill(); c.stroke();
                  } else if (pat === 'plasma') {
