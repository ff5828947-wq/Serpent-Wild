                const mergeUnique = (a, b) => Array.from(new Set([...(Array.isArray(a) ? a : []), ...(Array.isArray(b) ? b : [])]));

                let _cloudReady = false, _lastCloudSnap = '';
                async function syncProfileToCloud() {
                  if (!_cloudReady || !profile.playerId || !FIREBASE_DB_URL) return;
                  const snap = JSON.stringify(profile);
                  if (snap === _lastCloudSnap) return;
                  _lastCloudSnap = snap;
                  try {
                    await fetch(`${FIREBASE_DB_URL}/players/${profile.playerId}.json`, {
                      method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: snap
                    });
                  } catch (e) {}
                }

                async function restoreProfileFromCloud() {
                  if (!profile.playerId || !FIREBASE_DB_URL) { _cloudReady = true; return; }
                  try {
                    const r = await fetch(`${FIREBASE_DB_URL}/players/${profile.playerId}.json`);
                    const cd = r.ok ? await r.json() : null;
                    if (cd && typeof cd === 'object') {
                      const localBest = Math.max(0, ...Object.values(profile.bestScores || {}).map(Number));
                      const cloudBest = Math.max(0, ...Object.values(cd.bestScores || {}).map(Number));
                      const isFreshInstall = (profile.stats?.games || 0) === 0 && localBest === 0;
                      if (isFreshInstall || cloudBest >= localBest) {
                        profile = {
                          ...profile, ...cd, playerId: profile.playerId,
                          googleUid: profile.googleUid || cd.googleUid || '',
                          googleEmail: profile.googleEmail || cd.googleEmail || '',
                          potions: { ...(profile.potions || {}), ...(cd.potions || {}) },
                          bestScores: { ...(profile.bestScores || {}), ...(cd.bestScores || {}) },
                          stats: { ...(profile.stats || {}), ...(cd.stats || {}) },
                          settings: { ...(profile.settings || {}), ...(cd.settings || {}) }
                        };
                        saveProfile();
                        if (typeof refreshLobbyUI === 'function') refreshLobbyUI();
                        if (typeof spawnLobbyWorm === 'function') spawnLobbyWorm();
                      }
                    }
                  } catch (e) {}
                  _lastCloudSnap = JSON.stringify(profile);
                  _cloudReady = true;
                  updateGoogleUi();
                }

