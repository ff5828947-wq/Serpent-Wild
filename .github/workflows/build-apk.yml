                  } else if (sp.dragon) {
                    c.fillStyle = sp.dark; c.strokeStyle = sp.accent; c.lineWidth = 1.5;
                    for (const s of [-1, 1]) { c.beginPath(); c.moveTo(-hr * 0.15, s * hr * 0.6); c.quadraticCurveTo(-hr * 0.95, s * hr * 1.32, -hr * 1.6, s * hr * 1.1); c.quadraticCurveTo(-hr * 0.9, s * hr * 0.88, -hr * 0.55, s * hr * 0.42); c.closePath(); c.fill(); c.stroke(); }
                  }

                  // Front Tusks / Pincers / Teeth / Tongue
                  if (sp.lip === 'tusk' || sp.lip === 'pinc') {
                    c.fillStyle = sp.lip === 'tusk' ? '#fff7e0' : sp.accent;
                    for (const s of [-1, 1]) { c.beginPath(); c.moveTo(hr * 0.95, s * hr * 0.35); c.quadraticCurveTo(hr * 1.55, s * hr * 0.58, hr * 1.72, s * hr * 0.15); c.lineTo(hr * 1.15, s * hr * 0.18); c.closePath(); c.fill(); }
                  } else if (sp.lip === 'teeth' && pat === 'croco') {
                    c.fillStyle = '#ffffff';
                    for (const s of [-1, 1]) for (let tx = 0.55; tx <= 1.35; tx += 0.26) { c.beginPath(); c.moveTo(hr * tx, s * hr * 0.44); c.lineTo(hr * (tx + 0.08), s * hr * 0.68); c.lineTo(hr * (tx + 0.18), s * hr * 0.42); c.closePath(); c.fill(); }
                  } else if (tongueExt > 0.05 && (pat === 'cobra' || pat === 'viper' || sp.dragon)) {
                    const tl = hr * 1.08 + tongueExt * hr * 1.05;
                    c.strokeStyle = sp.id === 'frost' ? '#70f3ff' : '#e82534'; c.lineWidth = Math.max(1.5, hr * 0.1); c.lineCap = 'round';
                    c.beginPath(); c.moveTo(hr * 0.92, 0); c.lineTo(tl, 0); c.lineTo(tl + hr * 0.32, -hr * 0.22); c.moveTo(tl, 0); c.lineTo(tl + hr * 0.32, hr * 0.22); c.stroke();
                  }

                  // Main Sculpted Head Shape
                  const hg = c.createRadialGradient(hr * 0.18, -hr * 0.22, 1, 0, 0, hr * 1.55);
                  hg.addColorStop(0, pat === 'skeleton' ? '#f2f7ff' : sp.base);
                  hg.addColorStop(0.68, pat === 'skeleton' ? '#cad6e6' : sp.mid);
                  hg.addColorStop(1, pat === 'skeleton' ? '#6d7a8c' : sp.dark);
                  c.fillStyle = hg; c.strokeStyle = 'rgba(0,0,0,0.68)'; c.lineWidth = 1.4;
                  c.beginPath();
                  if (pat === 'croco' || pat === 'shark') {
                    c.moveTo(hr * 1.68, -hr * 0.2); c.quadraticCurveTo(hr * 1.82, 0, hr * 1.68, hr * 0.2); c.lineTo(hr * 0.55, hr * 0.58);
                    c.quadraticCurveTo(0, hr * 1.05, -hr * 0.85, hr * 0.85); c.quadraticCurveTo(-hr * 1.05, 0, -hr * 0.85, -hr * 0.85);
                    c.quadraticCurveTo(0, -hr * 1.05, hr * 0.55, -hr * 0.58);
                  } else if (pat === 'cat' || pat === 'bear' || pat === 'racer' || pat === 'octo' || pat === 'frog') {
                    c.ellipse(hr * 0.12, 0, hr * 1.14, hr * 1.0, 0, 0, Math.PI * 2);
                  } else if (pat === 'plasma' || pat === 'bull' || pat === 'hippo') {
                    c.moveTo(hr * 1.38, -hr * 0.42); c.lineTo(hr * 1.38, hr * 0.42); c.lineTo(hr * 0.45, hr * 0.94);
                    c.lineTo(-hr * 0.85, hr * 0.85); c.lineTo(-hr * 1.02, 0); c.lineTo(-hr * 0.85, -hr * 0.85); c.lineTo(hr * 0.45, -hr * 0.94);
                  } else {
                    c.moveTo(hr * 1.46, 0); c.quadraticCurveTo(hr * 0.88, -hr * 0.68, hr * 0.12, -hr * 0.98);
                    c.quadraticCurveTo(-hr * 0.74, -hr * 0.98, -hr * 0.92, -hr * 0.76); c.quadraticCurveTo(-hr * 1.06, 0, -hr * 0.92, hr * 0.76);
                    c.quadraticCurveTo(-hr * 0.74, hr * 0.98, hr * 0.12, hr * 0.98); c.quadraticCurveTo(hr * 0.88, hr * 0.68, hr * 1.46, 0);
                  }
                  c.closePath(); c.fill(); c.stroke();

                  // Unique Lips / Beak / Nose / Whiskers / Rhino Horn
                  if (sp.lip === 'beak') {
                    c.fillStyle = '#ffbe24'; c.strokeStyle = '#6e4204'; c.lineWidth = 1.2;
                    c.beginPath(); c.moveTo(hr * 1.65, 0); c.quadraticCurveTo(hr * 1.1, -hr * 0.42, hr * 0.82, -hr * 0.38); c.lineTo(hr * 0.82, hr * 0.38); c.quadraticCurveTo(hr * 1.1, hr * 0.42, hr * 1.65, 0); c.fill(); c.stroke();
                  } else if (sp.lip === 'ring') {
                    c.strokeStyle = '#ffe45c'; c.lineWidth = 2.4; c.beginPath(); c.arc(hr * 1.38, 0, hr * 0.24, -Math.PI * 0.6, Math.PI * 0.6); c.stroke();
                  } else if (sp.lip === 'snout' || sp.lip === 'cute' || sp.lip === 'whisk') {
                    c.fillStyle = sp.belly; c.beginPath(); c.ellipse(hr * 0.95, 0, hr * 0.32, hr * 0.42, 0, 0, Math.PI * 2); c.fill();
                    c.fillStyle = pat === 'cat' ? '#ff6b81' : '#14171a'; c.beginPath(); c.arc(hr * 1.22, 0, hr * 0.16, 0, Math.PI * 2); c.fill();
                    if (sp.lip === 'whisk') {
                      const ww = Math.sin(globalTime * 7) * hr * 0.1;
                      c.strokeStyle = sp.accent; c.lineWidth = 1.3;
                      for (const s of [-1, 1]) { c.beginPath(); c.moveTo(hr * 0.9, s * hr * 0.32); c.lineTo(hr * 0.65, s * hr * 1.15 + ww); c.stroke(); }
                    }
                  } else if (pat === 'rhino') {
                    c.fillStyle = '#f2e8cf'; c.beginPath(); c.moveTo(hr * 1.0, -hr * 0.24); c.lineTo(hr * 1.78, 0); c.lineTo(hr * 1.0, hr * 0.24); c.closePath(); c.fill();
                  } else if (sp.lip === 'fang' || sp.lip === 'wide') {
                    // Realistic Upper & Lower Lip Crease + Animated Fangs!
