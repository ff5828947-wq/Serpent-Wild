                    c.beginPath(); c.arc(0, 0, rr, 0, Math.PI * 2); c.stroke();
                    c.globalAlpha = 1;
                  }

                  if (aura.orbs > 0 && idx % 3 === 0) {
                    const spd = aura.level === 6 ? 5.8 : (aura.level === 5 ? 4.2 : 3.2);
                    for (let o = 0; o < aura.orbs; o++) {
                      const dir = o === 0 ? 1 : -1;
                      const orbA = t * spd * dir + idx * 1.1 + o * Math.PI;
                      const distR = sr * (1.22 + o * 0.24);
                      c.fillStyle = o === 0 ? '#ffffff' : aura.col;
                      c.globalAlpha = aura.level >= 5 ? 0.92 : 0.75;
                      c.beginPath(); c.arc(Math.cos(orbA) * distR, Math.sin(orbA) * distR, sr * (aura.level === 6 ? 0.24 : 0.18), 0, Math.PI * 2); c.fill();
