name: Build Serpent-Wild v20 7-Maps & Giant Growth APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Accept Android SDK Licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Generate Crystal-Clear Native BGM WAV
        run: |
          mkdir -p app/src/main/res/raw
          python3 - << 'PYEOF'
          import math, wave, struct
          sr = 44100
          bpm = 100
          step = 60.0 / bpm / 2.0
          melody = [
              293.66, 0, 349.23, 440.0, 392.0, 0, 349.23, 329.63,
              293.66, 0, 261.63, 293.66, 349.23, 0, 329.63, 0,
              293.66, 0, 349.23, 440.0, 523.25, 0, 440.0, 392.0,
              349.23, 0, 329.63, 293.66, 293.66, 0, 0, 0
          ]
          chords = [
              (146.83, 220.0, 293.66),
              (174.61, 220.0, 261.63),
              (130.81, 196.0, 261.63),
              (146.83, 220.0, 293.66)
          ]
          total_sec = step * len(melody)
          n_samples = int(sr * total_sec)
          buf = [0.0] * n_samples
          pad_ph = [0.0, 0.0, 0.0]
          for i in range(n_samples):
              t = i / sr
              c_idx = min(3, int(t / (total_sec / 4.0)))
              cf = chords[c_idx]
              c_local = (t % (total_sec / 4.0)) / (total_sec / 4.0)
              c_env = math.sin(math.pi * c_local) ** 0.5
              s = 0.0
              for k in range(3):
                  pad_ph[k] += 2.0 * math.pi * cf[k] / sr
                  s += math.sin(pad_ph[k]) * (0.065 if k == 0 else 0.04)
              buf[i] += s * c_env
          for idx, freq in enumerate(melody):
              if freq <= 0:
                  continue
              start = int(idx * step * sr)
              dur_s = int(step * 1.45 * sr)
              for j in range(dur_s):
                  if start + j >= n_samples:
                      break
                  u = j / dur_s
                  env = min(1.0, j / (sr * 0.015)) * ((1.0 - u) ** 2.2)
                  val = math.sin(2.0 * math.pi * freq * j / sr) * 0.16 + math.sin(4.0 * math.pi * freq * j / sr) * 0.03
                  buf[start + j] += val * env
          fade = int(sr * 0.08)
          for i in range(fade):
              buf[i] *= (i / fade)
              buf[n_samples - 1 - i] *= (i / fade)
          with wave.open("app/src/main/res/raw/bgm.wav", "w") as wf:
              wf.setnchannels(1)
              wf.setsampwidth(2)
              wf.setframerate(sr)
              data = bytearray()
              for sample in buf:
                  clamped = max(-0.85, min(0.85, sample))
                  data += struct.pack("<h", int(clamped * 32767))
              wf.writeframes(data)
          PYEOF

      - name: Generate Serpent-Wild v20 Android Project
        run: |
          mkdir -p app/src/main/java/com/apexwild/serpent app/src/main/assets app/src/main/res/values

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SerpentWild"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.9.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.apexwild.serpent"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.apexwild.serpent.royale"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 20
                  versionName = "20.0.0"
              }
              signingConfigs {
                  create("release") {
                      storeFile = file("serpent-release.jks")
                      storePassword = System.getenv("SERPENT_STORE_PASS").orEmpty().ifBlank { "Serpent@2026" }
                      keyAlias = System.getenv("SERPENT_KEY_ALIAS").orEmpty().ifBlank { "serpentkey" }
                      keyPassword = System.getenv("SERPENT_KEY_PASS").orEmpty().ifBlank { "Serpent@2026" }
                  }
              }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.SerpentWild" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">#060b07</item>
                  <item name="android:colorBackground">#060b07</item>
                  <item name="android:statusBarColor">#060b07</item>
                  <item name="android:navigationBarColor">#060b07</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="Serpent Wild: Apex"
                  android:theme="@style/Theme.SerpentWild"
                  android:usesCleartextTraffic="true">

                  <receiver android:name=".ReminderReceiver" android:exported="false" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:hardwareAccelerated="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          LOGO_FILE=$(find . -maxdepth 1 \( -iname "wild.png" -o -iname "logo.png" -o -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" \) | head -n 1)
          if [ -n "$LOGO_FILE" ]; then
            mkdir -p app/src/main/res/mipmap-xxxhdpi
            if command -v convert >/dev/null 2>&1; then
              convert "$LOGO_FILE" -resize 512x512^ -gravity center -extent 512x512 PNG32:app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            else
              cp "$LOGO_FILE" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            fi
            sed -i 's/android:label="Serpent Wild: Apex"/android:label="Serpent Wild: Apex" android:icon="@mipmap\/ic_launcher" android:roundIcon="@mipmap\/ic_launcher"/' app/src/main/AndroidManifest.xml
          fi

          cat << 'EOF' > app/src/main/java/com/apexwild/serpent/ReminderReceiver.kt
          package com.apexwild.serpent

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import androidx.core.app.NotificationCompat

          class ReminderReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  showNotification(context)
              }

              companion object {
                  const val CHANNEL_ID = "serpent_wild_reminders"

                  fun showNotification(context: Context) {
                      val nm = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          val ch = NotificationChannel(CHANNEL_ID, "Serpent Wild Reminders", NotificationManager.IMPORTANCE_DEFAULT)
                          ch.description = "Daily jungle battle & reward reminders"
                          nm.createNotificationChannel(ch)
                      }
                      val openIntent = Intent(context, MainActivity::class.java).apply {
                          flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                      }
                      val pi = PendingIntent.getActivity(
                          context, 1001, openIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )
                      val iconRes = context.applicationInfo.icon.takeIf { it != 0 } ?: android.R.drawable.sym_def_app_icon
                      val notif = NotificationCompat.Builder(context, CHANNEL_ID)
                          .setSmallIcon(iconRes)
                          .setContentTitle("🐍 Serpent Wild: Apex Awaits!")
                          .setContentText("7 Ultra-Realistic Maps & Daily Rewards are ready! Become the #1 Apex King!")
                          .setPriority(NotificationCompat.PRIORITY_DEFAULT)
                          .setAutoCancel(true)
                          .setContentIntent(pi)
                          .build()
                      nm.notify(2026, notif)
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/apexwild/serpent/MainActivity.kt
          package com.apexwild.serpent

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ActivityInfo
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.media.MediaPlayer
          import android.os.Build
          import android.os.Bundle
          import android.view.View
          import android.view.WindowManager
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView
              private var bgmPlayer: MediaPlayer? = null
              private var bgmEnabled = true
              private var bgmVolume = 0.65f
              private var notifEnabled = true
              private var userStarted = false
              private var lastBackPressMs = 0L

              inner class AudioBridge {
                  @JavascriptInterface
                  fun startBgm(enabled: Boolean, vol: Float) {
                      runOnUiThread {
                          userStarted = true
                          bgmEnabled = enabled
                          bgmVolume = vol.coerceIn(0f, 1f)
                          syncNativeBgm()
                      }
                  }

                  @JavascriptInterface
                  fun updateBgm(enabled: Boolean, vol: Float) {
                      runOnUiThread {
                          bgmEnabled = enabled
                          bgmVolume = vol.coerceIn(0f, 1f)
                          syncNativeBgm()
                      }
                  }

                  @JavascriptInterface
                  fun setNotifications(enabled: Boolean) {
                      runOnUiThread {
                          notifEnabled = enabled
                          if (enabled) {
                              requestNotifPermission()
                              scheduleReminder(6L * 60L * 60L * 1000L)
                          } else {
                              cancelReminder()
                          }
                      }
                  }

                  @JavascriptInterface
                  fun testNotification() {
                      runOnUiThread {
                          requestNotifPermission()
                          ReminderReceiver.showNotification(this@MainActivity)
                          Toast.makeText(this@MainActivity, "Notification Sent! Check status bar.", Toast.LENGTH_SHORT).show()
                      }
                  }
              }

              private fun requestNotifPermission() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.POST_NOTIFICATIONS), 101)
                      }
                  }
              }

              private fun scheduleReminder(delayMs: Long) {
                  val am = getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val intent = Intent(this, ReminderReceiver::class.java)
                  val pi = PendingIntent.getBroadcast(
                      this, 3001, intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  am.setInexactRepeating(
                      AlarmManager.RTC_WAKEUP,
                      System.currentTimeMillis() + delayMs,
                      AlarmManager.INTERVAL_HALF_DAY,
                      pi
                  )
              }

              private fun cancelReminder() {
                  val am = getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val intent = Intent(this, ReminderReceiver::class.java)
                  val pi = PendingIntent.getBroadcast(
                      this, 3001, intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  am.cancel(pi)
              }

              private fun ensureBgm() {
                  if (bgmPlayer == null) {
                      bgmPlayer = MediaPlayer.create(this, R.raw.bgm)?.apply {
                          isLooping = true
                      }
                  }
              }

              private fun syncNativeBgm() {
                  if (!userStarted) return
                  ensureBgm()
                  bgmPlayer?.let { mp ->
                      val v = if (bgmEnabled) bgmVolume else 0f
                      mp.setVolume(v, v)
                      if (bgmEnabled && v > 0.01f) {
                          if (!mp.isPlaying) mp.start()
                      } else {
                          if (mp.isPlaying) mp.pause()
                      }
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  hideSystemBars()
                  requestNotifPermission()
                  scheduleReminder(6L * 60L * 60L * 1000L)

                  webView = WebView(this).apply {
                      setBackgroundColor(Color.parseColor("#060b07"))
                      overScrollMode = View.OVER_SCROLL_NEVER
                      isHorizontalScrollBarEnabled = false
                      isVerticalScrollBarEnabled = false
                      settings.apply {
                          javaScriptEnabled = true
                          domStorageEnabled = true
                          databaseEnabled = true
                          allowFileAccess = true
                          allowContentAccess = true
                          mediaPlaybackRequiresUserGesture = false
                          cacheMode = WebSettings.LOAD_DEFAULT
                          useWideViewPort = true
                          loadWithOverviewMode = true
                          mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                      }
                      addJavascriptInterface(AudioBridge(), "AndroidAudio")
                      webViewClient = WebViewClient()
                      webChromeClient = WebChromeClient()
                  }

                  setContentView(webView)
                  webView.loadUrl("file:///android_asset/index.html")
              }

              private fun hideSystemBars() {
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  val controller = WindowInsetsControllerCompat(window, window.decorView)
                  controller.hide(WindowInsetsCompat.Type.systemBars())
                  controller.systemBarsBehavior =
                      WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) hideSystemBars()
              }

              override fun onPause() {
                  super.onPause()
                  bgmPlayer?.let { if (it.isPlaying) it.pause() }
                  webView.evaluateJavascript("window.pauseGameAudio && window.pauseGameAudio();", null)
                  webView.onPause()
                  webView.pauseTimers()
              }

              override fun onStop() {
                  super.onStop()
                  bgmPlayer?.let { if (it.isPlaying) it.pause() }
              }

              override fun onResume() {
                  super.onResume()
                  hideSystemBars()
                  webView.resumeTimers()
                  webView.onResume()
                  syncNativeBgm()
                  webView.evaluateJavascript("window.resumeGameAudio && window.resumeGameAudio();", null)
              }

              override fun onDestroy() {
                  bgmPlayer?.stop()
                  bgmPlayer?.release()
                  bgmPlayer = null
                  webView.destroy()
                  super.onDestroy()
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  val now = System.currentTimeMillis()
                  if (now - lastBackPressMs < 2000L) {
                      bgmPlayer?.stop()
                      super.onBackPressed()
                  } else {
                      lastBackPressMs = now
                      Toast.makeText(this, "Press back again to exit Serpent Wild", Toast.LENGTH_SHORT).show()
                  }
              }
          }
          EOF

          cat << 'GAMEHTML' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
            <title>SERPENT WILD: APEX — v20 7-Maps &amp; Giant Growth</title>
            <style>
              :root {
