                const vibrate = ms => { try { if (profile.settings.vib && navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };
                const fmtSec = s => { const m = Math.floor(s / 60), r = Math.floor(s % 60); return `${m}m ${String(r).padStart(2, '0')}s`; };

                const Sound = {
                  ctx: null, sfxGain: null, bufs: {}, lastEatMs: 0,
                  init() {
                    try {
                      if (window.AndroidAudio) {
                        window.AndroidAudio.startBgm(!profile.settings.muted && profile.settings.bgm, 0.72);
                        window.AndroidAudio.setNotifications(profile.settings.notifs);
                      }
                      if (!this.ctx) {
                        const AC = window.AudioContext || window.webkitAudioContext;
                        if (!AC) return;
                        this.ctx = new AC();
                        this.sfxGain = this.ctx.createGain();
                        this.sfxGain.connect(this.ctx.destination);
                        this.bufs.click  = this.makeBuf(520, 760, 0.05, 0.14);
                        this.bufs.eat    = this.makeBuf(420, 680, 0.05, 0.12);
                        this.bufs.potion = this.makeBuf(480, 920, 0.16, 0.18);
                        this.bufs.kill   = this.makeBuf(380, 880, 0.18, 0.2);
                        this.bufs.buy    = this.makeBuf(540, 1020, 0.16, 0.18);
                        this.bufs.over   = this.makeBuf(260, 90, 0.32, 0.2);
                      }
                      if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
                      this.updateVol();
                    } catch (e) {}
                  },
                  makeBuf(f1, f2, dur, vol) {
                    const sr = this.ctx.sampleRate, len = Math.floor(sr * dur);
                    const b = this.ctx.createBuffer(1, len, sr), ch = b.getChannelData(0);
                    let ph = 0;
                    for (let i = 0; i < len; i++) {
                      const t = i / len;
                      ph += (2 * Math.PI * (f1 + (f2 - f1) * t)) / sr;
                      ch[i] = Math.sin(ph) * Math.sin(Math.PI * t) * vol;
                    }
                    return b;
                  },
                  updateVol() {
                    try {
                      if (window.AndroidAudio) window.AndroidAudio.updateBgm(!profile.settings.muted && profile.settings.bgm, 0.72);
                      if (this.ctx && this.sfxGain) this.sfxGain.gain.setTargetAtTime((profile.settings.muted || !profile.settings.sfx) ? 0 : 0.55, this.ctx.currentTime, 0.03);
                    } catch (e) {}
                  },
                  play(n) {
                    if (!this.ctx || !this.bufs[n] || profile.settings.muted || !profile.settings.sfx) return;
                    try { const s = this.ctx.createBufferSource(); s.buffer = this.bufs[n]; s.connect(this.sfxGain); s.start(0); } catch (e) {}
                  },
                  eat() { const now = performance.now(); if (now - this.lastEatMs < 65) return; this.lastEatMs = now; this.play('eat'); }
                };
