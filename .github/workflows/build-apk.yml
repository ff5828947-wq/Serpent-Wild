                    c.strokeStyle = sp.accent; c.lineWidth = 1.4;
                    c.beginPath(); c.moveTo(hr * 0.9, -hr * 0.6); c.quadraticCurveTo(hr * 1.24, 0, hr * 0.9, hr * 0.6); c.lineTo(hr * 0.38, hr * 0.74); c.quadraticCurveTo(hr * 0.65, 0, hr * 0.38, -hr * 0.74); c.closePath(); c.fill(); c.stroke();
                  } else if (sp.eyeStyle === 'panda') {
                    for (const s of [-1, 1]) {
                      c.fillStyle = '#14171a'; c.beginPath(); c.ellipse(hr * 0.36, s * hr * 0.48, hr * 0.35, hr * 0.27, s * 0.25, 0, Math.PI * 2); c.fill();
                      c.fillStyle = '#ffffff'; c.beginPath(); c.arc(hr * 0.42, s * hr * 0.46 + pShift, hr * 0.11, 0, Math.PI * 2); c.fill();
                      c.fillStyle = '#050505'; c.beginPath(); c.arc(hr * 0.45, s * hr * 0.46 + pShift, hr * 0.06, 0, Math.PI * 2); c.fill();
                    }
                  } else if (sp.eyeStyle === 'hollow') {
