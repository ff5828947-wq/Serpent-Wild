                  }

                  updateAI(dt, near) {
                    this.aiTimer -= dt;
                    if (this.aiBoost > 0) this.aiBoost -= dt;
                    const dZone = dist(this.x, this.y, safeZone.cx, safeZone.cy);
                    if (safeZone.active && dZone > safeZone.r - 240) { this.targetAngle = Math.atan2(safeZone.cy - this.y, safeZone.cx - this.x); this.boosting = dZone > safeZone.r; return; }
                    if (dist(this.x, this.y, WORLD_CENTER, WORLD_CENTER) > ARENA_RADIUS - 360) { this.targetAngle = Math.atan2(WORLD_CENTER - this.y, WORLD_CENTER - this.x); this.boosting = false; return; }
