                    c.fillStyle = '#ffe552'; c.beginPath(); c.arc(10, -6, 4, 0, Math.PI * 2); c.arc(10, 6, 4, 0, Math.PI * 2); c.fill();
                    c.fillStyle = '#111'; c.beginPath(); c.arc(11, -6, 2, 0, Math.PI * 2); c.arc(11, 6, 2, 0, Math.PI * 2); c.fill();
                  } else if (p.id === 'rabbit') {
                    // Realistic Forest Rabbit with long ears & fluffy tail!
