                  const oc = document.createElement('canvas');
                  oc.width = s; oc.height = s;
                  const g = oc.getContext('2d');
                  const sh = g.createRadialGradient(r + r * 0.18, r - r * 0.36, r * 0.06, r, r, r);
                  sh.addColorStop(0, maxQ ? 'rgba(255,255,255,0.44)' : 'rgba(255,255,255,0.32)');
