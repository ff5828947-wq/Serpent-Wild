                      }
                      if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
                      this.updateVol();
                    } catch (e) {}
                  },
                  makeBuf(f1, f2, dur, vol) {
                    const sr = this.ctx.sampleRate, len = Math.floor(sr * dur);
                    const b = this.ctx.createBuffer(1, len, sr), ch = b.getChannelData(0);
                    let ph = 0;
                    for (let i = 0; i < len; i++) { ph += (2 * Math.PI * (f1 + (f2 - f1) * (i / len))) / sr; ch[i] = Math.sin(ph) * Math.sin(Math.PI * (i / len)) * vol; }
                    return b;
                  },
                  updateVol() {
                    try {
                      if (window.AndroidAudio) window.AndroidAudio.updateBgm(!profile.settings.muted && profile.settings.bgm, 0.65);
                      if (this.ctx && this.sfxGain) this.sfxGain.gain.setTargetAtTime((profile.settings.muted || !profile.settings.sfx) ? 0 : 0.55, this.ctx.currentTime, 0.03);
