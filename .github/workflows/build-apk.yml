                function buildFloorPattern(floorId) {
                  const fl = ARENA_FLOORS.find(f => f.id === floorId) || ARENA_FLOORS[0];
                  const t = document.createElement('canvas'); t.width = 160; t.height = 160;
                  const c = t.getContext('2d');
                  c.fillStyle = fl.bg; c.fillRect(0, 0, 160, 160);
                  c.strokeStyle = fl.line; c.lineWidth = 2;
                  for (let y = 0; y <= 160; y += 69) {
                    for (let x = 0; x <= 160; x += 80) {
                      const ox = (Math.floor(y / 69) % 2) * 40;
                      c.beginPath();
                      for (let i = 0; i < 6; i++) {
                        const a = (Math.PI / 3) * i, px = x + ox + Math.cos(a) * 40, py = y + Math.sin(a) * 40;
                        i === 0 ? c.moveTo(px, py) : c.lineTo(px, py);
                      }
                      c.closePath(); c.stroke();
                    }
                  }
                  if (fl.id === 'clover') {
                    for (let i = 0; i < 14; i++) {
                      const cx = rand(14, 146), cy = rand(14, 146), sz = rand(4, 7);
                      c.fillStyle = i % 2 === 0 ? 'rgba(115, 240, 75, 0.22)' : 'rgba(20, 96, 28, 0.3)';
                      for (let k = 0; k < 4; k++) {
                        const a = (Math.PI / 2) * k + 0.4;
                        c.beginPath(); c.arc(cx + Math.cos(a) * sz * 0.7, cy + Math.sin(a) * sz * 0.7, sz * 0.65, 0, Math.PI * 2); c.fill();
                      }
                    }
                  }
                  floorPattern = ctx.createPattern(t, 'repeat');
                }

                // BRIGHT GLOSSY WORMS-ZONE HEAD + 13 CUSTOM COSTUME HATS/ACCESSORIES!
                function drawWormHead(c, skin, eyeId, lipId, hr, blinkAmt, mouthOpen, lookAng) {
                  const isRain = skin.body === 'rainbow';
                  const headCol = isRain ? `hsl(${(globalTime * 150) % 360}, 95%, 60%)` : skin.base;
                  const headMid = isRain ? `hsl(${(globalTime * 150 + 35) % 360}, 90%, 48%)` : skin.mid;

                  // Ears / Elf Ears / Horns behind head
                  if (skin.hat === 'ears') {
                    for (const s of [-1, 1]) {
                      c.fillStyle = skin.id === 'panda' ? '#222831' : skin.mid;
                      c.beginPath(); c.arc(-hr * 0.35, s * hr * 0.92, hr * 0.42, 0, Math.PI * 2); c.fill();
                      c.fillStyle = skin.id === 'panda' ? '#3d4554' : skin.accent;
                      c.beginPath(); c.arc(-hr * 0.35, s * hr * 0.92, hr * 0.2, 0, Math.PI * 2); c.fill();
                    }
                  } else if (skin.hat === 'elf') {
                    for (const s of [-1, 1]) {
                      c.fillStyle = '#ffd5b8'; c.strokeStyle = 'rgba(0,0,0,0.35)'; c.lineWidth = 1.2;
                      c.beginPath(); c.moveTo(-hr * 0.1, s * hr * 0.85); c.lineTo(-hr * 0.95, s * hr * 1.45); c.lineTo(-hr * 0.65, s * hr * 0.55); c.closePath(); c.fill(); c.stroke();
                    }
                  } else if (skin.hat === 'horns') {
                    for (const s of [-1, 1]) {
                      c.fillStyle = skin.accent; c.strokeStyle = 'rgba(0,0,0,0.45)'; c.lineWidth = 1.3;
                      c.beginPath(); c.moveTo(-hr * 0.1, s * hr * 0.72); c.quadraticCurveTo(-hr * 0.85, s * hr * 1.48, -hr * 1.38, s * hr * 1.15); c.lineTo(-hr * 0.6, s * hr * 0.42); c.closePath(); c.fill(); c.stroke();
                    }
                  }

                  // Main glossy head (Square for Choco Toby/Quadro, plump round for others)
                  const hg = c.createRadialGradient(hr * 0.2, -hr * 0.28, hr * 0.12, 0, 0, hr * 1.35);
                  hg.addColorStop(0, headCol);
                  hg.addColorStop(0.78, headMid);
                  hg.addColorStop(1, headMid);
                  c.fillStyle = hg;
                  c.strokeStyle = 'rgba(0,0,0,0.38)'; c.lineWidth = 1.6;
                  c.beginPath();
                  if (skin.body === 'square') {
                    const sz = hr * 1.95;
                    c.roundRect ? c.roundRect(-sz * 0.48, -sz * 0.5, sz, sz, hr * 0.35) : c.rect(-sz * 0.48, -sz * 0.5, sz, sz);
                  } else {
                    c.ellipse(hr * 0.08, 0, hr * 1.16, hr * 1.04, 0, 0, Math.PI * 2);
                  }
                  c.fill(); c.stroke();

                  // Glossy top highlight & rosy cheeks
                  c.fillStyle = 'rgba(255,255,255,0.32)';
                  c.beginPath(); c.ellipse(-hr * 0.12, -hr * 0.44, hr * 0.46, hr * 0.2, -0.2, 0, Math.PI * 2); c.fill();
                  c.fillStyle = 'rgba(255, 110, 150, 0.34)';
                  c.beginPath(); c.arc(hr * 0.34, -hr * 0.66, hr * 0.2, 0, Math.PI * 2); c.arc(hr * 0.34, hr * 0.66, hr * 0.2, 0, Math.PI * 2); c.fill();

                  // Beak costume (Duck / Owl) OR Custom Lips
                  const mx = hr * 0.85;
                  if (skin.hat === 'beak') {
                    c.fillStyle = '#ff9518'; c.strokeStyle = '#7a3b00'; c.lineWidth = 1.4;
                    c.beginPath(); c.moveTo(hr * 1.58, 0); c.quadraticCurveTo(hr * 1.1, -hr * 0.42, hr * 0.78, -hr * 0.36); c.lineTo(hr * 0.78, hr * 0.36); c.quadraticCurveTo(hr * 1.1, hr * 0.42, hr * 1.58, 0); c.fill(); c.stroke();
                  } else {
                    if (mouthOpen > 0.08) {
                      c.fillStyle = '#63081a';
                      c.beginPath(); c.ellipse(mx, 0, hr * (0.18 + mouthOpen * 0.24), hr * (0.28 + mouthOpen * 0.22), 0, 0, Math.PI * 2); c.fill();
                      c.fillStyle = '#ff6b81';
                      c.beginPath(); c.arc(mx - hr * 0.04, 0, hr * 0.14 * mouthOpen, 0, Math.PI * 2); c.fill();
                    }
                    if (lipId === 'redlips' || lipId === 'pink') {
                      c.fillStyle = lipId === 'redlips' ? '#ff2442' : '#ff69b4';
                      c.beginPath(); c.ellipse(mx + hr * 0.06, -hr * 0.14, hr * 0.16, hr * 0.24, 0.15, 0, Math.PI * 2); c.fill();
                      c.beginPath(); c.ellipse(mx + hr * 0.06, hr * 0.14, hr * 0.16, hr * 0.24, -0.15, 0, Math.PI * 2); c.fill();
                    } else if (lipId === 'fangs') {
                      c.strokeStyle = '#1b090c'; c.lineWidth = 2; c.beginPath(); c.arc(mx - hr * 0.15, 0, hr * 0.3, -0.75, 0.75); c.stroke();
                      c.fillStyle = '#fff';
                      for (const s of [-1, 1]) { c.beginPath(); c.moveTo(mx + hr * 0.08, s * hr * 0.24); c.lineTo(mx + hr * 0.34, s * hr * 0.16); c.lineTo(mx + hr * 0.08, s * hr * 0.08); c.closePath(); c.fill(); }
                    } else if (lipId === 'tongue') {
                      c.fillStyle = '#ff4d79'; c.strokeStyle = '#9e1338'; c.lineWidth = 1.2;
                      c.beginPath(); c.ellipse(mx + hr * 0.22, hr * 0.08, hr * 0.24, hr * 0.15, 0.2, 0, Math.PI * 2); c.fill(); c.stroke();
                    } else if (lipId === 'gold') {
                      c.fillStyle = '#ffd23f'; c.strokeStyle = '#7a4b00'; c.lineWidth = 1.4;
                      c.beginPath(); c.rect(mx - hr * 0.04, -hr * 0.26, hr * 0.24, hr * 0.52); c.fill(); c.stroke();
                    } else if (mouthOpen <= 0.08) {
                      c.strokeStyle = '#1a1a1a'; c.lineWidth = Math.max(1.8, hr * 0.11); c.lineCap = 'round';
                      c.beginPath(); c.arc(mx - hr * 0.18, 0, hr * 0.3, -0.72, 0.72); c.stroke();
                    }
                  }

                  // Eyes (Custom + Food Tracking + Blink)
                  const px = Math.cos(lookAng) * hr * 0.11, py = Math.sin(lookAng) * hr * 0.11;
                  if (eyeId === 'visor' || skin.hat === 'visor') {
                    c.fillStyle = '#0d1b36'; c.strokeStyle = '#59f4ff'; c.lineWidth = 2;
                    c.beginPath(); c.ellipse(hr * 0.34, 0, hr * 0.32, hr * 0.78, 0, 0, Math.PI * 2); c.fill(); c.stroke();
                  } else {
                    for (const s of [-1, 1]) {
                      const ex = hr * 0.32, ey = s * hr * 0.46, er = hr * 0.34;
                      if (blinkAmt > 0.85 || (eyeId === 'wink' && s === 1)) {
                        c.strokeStyle = '#111'; c.lineWidth = Math.max(2, hr * 0.12); c.lineCap = 'round';
                        c.beginPath(); c.arc(ex, ey, er * 0.7, -0.9, 0.9); c.stroke(); continue;
                      }
                      c.fillStyle = '#ffffff'; c.strokeStyle = 'rgba(0,0,0,0.4)'; c.lineWidth = 1.4;
                      c.beginPath(); c.arc(ex, ey, er, 0, Math.PI * 2); c.fill(); c.stroke();
                      if (eyeId === 'heart') {
                        c.fillStyle = '#ff2e63';
                        c.beginPath(); c.arc(ex + px - er * 0.15, ey + py - er * 0.1, er * 0.28, 0, Math.PI * 2); c.arc(ex + px + er * 0.15, ey + py - er * 0.1, er * 0.28, 0, Math.PI * 2); c.fill();
                        c.beginPath(); c.moveTo(ex + px - er * 0.4, ey + py); c.lineTo(ex + px, ey + py + er * 0.45); c.lineTo(ex + px + er * 0.4, ey + py); c.fill();
                      } else if (eyeId === 'star') {
                        c.fillStyle = '#ffb800'; c.beginPath();
                        for (let k = 0; k < 10; k++) { const a = (k * Math.PI) / 5 + globalTime * 2, rd = k % 2 === 0 ? er * 0.62 : er * 0.28; k === 0 ? c.moveTo(ex + px + Math.cos(a) * rd, ey + py + Math.sin(a) * rd) : c.lineTo(ex + px + Math.cos(a) * rd, ey + py + Math.sin(a) * rd); }
                        c.closePath(); c.fill();
                      } else if (eyeId === 'hypno') {
                        c.strokeStyle = '#7b38ff'; c.lineWidth = 1.8;
                        c.beginPath(); c.arc(ex, ey, er * 0.65, globalTime * 6, globalTime * 6 + 4.4); c.stroke();
                      } else {
                        c.fillStyle = '#111524'; c.beginPath(); c.arc(ex + px, ey + py, er * 0.56, 0, Math.PI * 2); c.fill();
                        c.fillStyle = '#ffffff'; c.beginPath(); c.arc(ex + px - er * 0.18, ey + py - er * 0.18, er * 0.22, 0, Math.PI * 2); c.fill();
                      }
                      if (eyeId === 'angry') {
                        c.strokeStyle = '#141414'; c.lineWidth = Math.max(2.2, hr * 0.14); c.lineCap = 'round';
                        c.beginPath(); c.moveTo(ex + er * 0.7, ey - s * er * 0.9); c.lineTo(ex - er * 0.4, ey - s * er * 0.2); c.stroke();
                      }
                    }
                  }

                  // FRONT HEAD COSTUMES (Crown, Pirate Hat, Rose, Leaf, Clover, Santa, Helmet, Hood, Unicorn)
                  if (skin.hat === 'crown') {
                    c.fillStyle = '#ffd23f'; c.strokeStyle = '#8a5200'; c.lineWidth = 1.4;
                    c.beginPath(); c.moveTo(-hr * 0.45, -hr * 0.55); c.lineTo(-hr * 1.05, -hr * 0.68); c.lineTo(-hr * 0.72, -hr * 0.2); c.lineTo(-hr * 1.15, 0); c.lineTo(-hr * 0.72, hr * 0.2); c.lineTo(-hr * 1.05, hr * 0.68); c.lineTo(-hr * 0.45, hr * 0.55); c.closePath(); c.fill(); c.stroke();
                    c.fillStyle = '#ff2e63'; c.beginPath(); c.arc(-hr * 0.68, 0, hr * 0.14, 0, Math.PI * 2); c.fill();
                  } else if (skin.hat === 'pirate') {
                    c.fillStyle = '#1f232e'; c.strokeStyle = '#ffd23f'; c.lineWidth = 1.6;
                    c.beginPath(); c.ellipse(-hr * 0.42, 0, hr * 0.62, hr * 1.12, 0, 0, Math.PI * 2); c.fill(); c.stroke();
                    c.fillStyle = '#ffffff'; c.beginPath(); c.arc(-hr * 0.45, 0, hr * 0.22, 0, Math.PI * 2); c.fill();
                  } else if (skin.hat === 'rose') {
                    c.fillStyle = '#ff2457';
                    for (let k = 0; k < 5; k++) { const a = (k / 5) * Math.PI * 2; c.beginPath(); c.arc(-hr * 0.45 + Math.cos(a) * hr * 0.28, Math.sin(a) * hr * 0.28, hr * 0.28, 0, Math.PI * 2); c.fill(); }
                    c.fillStyle = '#ffd23f'; c.beginPath(); c.arc(-hr * 0.45, 0, hr * 0.16, 0, Math.PI * 2); c.fill();
                  } else if (skin.hat === 'leaf' || skin.hat === 'clover') {
                    c.fillStyle = '#4be33b'; c.strokeStyle = '#186b11'; c.lineWidth = 1.2;
                    for (let k = -1; k <= 1; k++) { c.beginPath(); c.ellipse(-hr * 0.65, k * hr * 0.34, hr * 0.45, hr * 0.22, k * 0.4, 0, Math.PI * 2); c.fill(); c.stroke(); }
                  } else if (skin.hat === 'santa') {
                    c.fillStyle = '#e82534'; c.beginPath(); c.moveTo(-hr * 0.25, -hr * 0.78); c.quadraticCurveTo(-hr * 1.25, -hr * 0.4, -hr * 1.38, hr * 0.45); c.lineTo(-hr * 0.25, hr * 0.78); c.closePath(); c.fill();
                    c.fillStyle = '#ffffff'; c.beginPath(); c.ellipse(-hr * 0.25, 0, hr * 0.24, hr * 0.88, 0, 0, Math.PI * 2); c.fill();
                    c.beginPath(); c.arc(-hr * 1.38, hr * 0.45, hr * 0.26, 0, Math.PI * 2); c.fill();
                  } else if (skin.hat === 'unicorn') {
                    c.fillStyle = '#ffe259'; c.strokeStyle = '#ff6be6'; c.lineWidth = 1.4;
                    c.beginPath(); c.moveTo(hr * 0.65, -hr * 0.22); c.lineTo(hr * 1.75, 0); c.lineTo(hr * 0.65, hr * 0.22); c.closePath(); c.fill(); c.stroke();
                  } else if (skin.hat === 'helmet') {
                    c.strokeStyle = '#ffffff'; c.lineWidth = hr * 0.22; c.beginPath(); c.arc(-hr * 0.05, 0, hr * 1.08, Math.PI * 0.55, Math.PI * 1.45); c.stroke();
                    c.fillStyle = 'rgba(0,247,255,0.45)'; c.beginPath(); c.arc(hr * 0.3, 0, hr * 0.85, -0.7, 0.7); c.fill();
                  } else if (skin.hat === 'hood') {
                    c.fillStyle = skin.mid; c.strokeStyle = skin.accent; c.lineWidth = 1.5;
                    c.beginPath(); c.moveTo(-hr * 0.1, -hr * 1.05); c.lineTo(-hr * 1.45, 0); c.lineTo(-hr * 0.1, hr * 1.05); c.quadraticCurveTo(-hr * 0.55, 0, -hr * 0.1, -hr * 1.05); c.fill(); c.stroke();
                  }
                }

                function drawSkinThumb(thumbCvs, skin) {
                  const tc = thumbCvs.getContext('2d');
                  const w = thumbCvs.width, h = thumbCvs.height;
                  tc.clearRect(0, 0, w, h);
                  tc.save(); tc.translate(w * 0.56, h * 0.52);
                  for (let i = 3; i >= 1; i--) {
                    tc.fillStyle = i % 2 === 0 ? skin.base : skin.mid;
                    if (skin.body === 'square') { tc.fillRect(-i * 10 - 11, -11, 22, 22); }
                    else { tc.beginPath(); tc.arc(-i * 9, Math.sin(i) * 4, 13 - i * 1.1, 0, Math.PI * 2); tc.fill(); }
                  }
                  drawWormHead(tc, skin, profile.eye, profile.lip, 14, 0, 0, 0);
                  tc.restore();
                }

                class Worm {
                  constructor({ name, skin, eye, lip, x, y, isPlayer = false, score = 100, isChamp = false }) {
                    this.name = name; this.skin = skin; this.eye = eye || 'cute'; this.lip = lip || 'smile';
                    this.isPlayer = isPlayer; this.isChamp = isChamp; this.alive = true;
                    this.x = x; this.y = y; this.angle = rand(0, Math.PI * 2); this.targetAngle = this.angle;
                    this.score = score; this.kills = 0; this.boosting = false;
                    this.spawnShield = isPlayer ? 3.5 : 1.5;
                    this.mouthOpen = 0; this.blinkTimer = rand(1.5, 4.5); this.blinkAmt = 0;
                    this.lookAng = 0; this.bubbleText = ''; this.bubbleTimer = 0;
                    this.aiTimer = rand(0, 0.5); this.aiWander = this.angle; this.aiBoost = 0;
                    this.segments = [];
                    const cnt = this.getSegCount();
                    for (let i = 0; i < cnt; i++) this.segments.push({ x: x - Math.cos(this.angle) * i * 5, y: y - Math.sin(this.angle) * i * 5 });
                  }

                  getRadius() { return clamp(13 + Math.pow(Math.max(10, this.score), 0.27) * 2.15, 14, 52); }
                  getSegCount() { return clamp(Math.floor(14 + Math.pow(Math.max(10, this.score), 0.44) * 1.45), 16, 220); }
                  say(txt) { this.bubbleText = txt; this.bubbleTimer = 2.6; }

                  updateAI(dt) {
                    this.aiTimer -= dt;
                    if (this.aiBoost > 0) this.aiBoost -= dt;
                    if (dist(this.x, this.y, WORLD_CENTER, WORLD_CENTER) > ARENA_RADIUS - 450) {
                      this.targetAngle = Math.atan2(WORLD_CENTER - this.y, WORLD_CENTER - this.x);
                      this.boosting = false; return;
                    }
                    let avX = 0, avY = 0, danger = false;
                    for (const o of worms) {
                      if (o === this || !o.alive) continue;
                      if (distSq(this.x, this.y, o.x, o.y) > 420 * 420) continue;
                      const step = Math.max(1, Math.floor(o.segments.length / 10));
                      for (let k = 0; k < o.segments.length; k += step) {
                        const sg = o.segments[k], d2 = distSq(this.x, this.y, sg.x, sg.y);
                        if (d2 < 145 * 145) { const d = Math.sqrt(d2) || 1; avX += (this.x - sg.x) / d; avY += (this.y - sg.y) / d; danger = true; }
                      }
                    }
                    if (danger) { this.targetAngle = Math.atan2(avY, avX); this.boosting = this.score > 160; return; }
                    if (this.aiTimer <= 0) {
                      this.aiTimer = rand(0.35, 0.9); this.aiWander += rand(-1.1, 1.1); this.targetAngle = this.aiWander;
                      let bestF = null, bestD = 360 * 360;
                      for (let i = 0; i < foods.length; i += 2) { const f = foods[i], d2 = distSq(this.x, this.y, f.x, f.y); if (d2 < bestD) { bestD = d2; bestF = f; } }
                      if (bestF) { this.targetAngle = Math.atan2(bestF.y - this.y, bestF.x - this.x); if (bestF.big && this.score > 200 && Math.random() < 0.35) this.aiBoost = 0.6; }
                    }
                    this.boosting = this.aiBoost > 0 && this.score > 140;
                  }

                  update(dt) {
                    if (!this.alive) return;
                    if (this.spawnShield > 0) this.spawnShield = Math.max(0, this.spawnShield - dt);
                    if (this.mouthOpen > 0) this.mouthOpen = Math.max(0, this.mouthOpen - dt * 3.8);
                    if (this.bubbleTimer > 0) this.bubbleTimer = Math.max(0, this.bubbleTimer - dt);
                    this.blinkTimer -= dt;
                    if (this.blinkTimer <= 0) { this.blinkAmt = 1; if (this.blinkTimer < -0.14) { this.blinkAmt = 0; this.blinkTimer = rand(2.2, 5.2); } }
                    if (!this.isPlayer) this.updateAI(dt);

                    const speedBuff = this.isPlayer && (buffs.speed || 0) > 0;
                    const canBoost = (this.boosting || speedBuff) && (this.score > 120 || speedBuff);
                    if (this.boosting && !speedBuff && canBoost) {
                      this.score = Math.max(100, this.score - dt * 16);
                      if (Math.random() < 0.14 && foods.length < 750) {
                        const tail = this.segments[this.segments.length - 1];
                        foods.push({ x: tail.x, y: tail.y, val: 6, r: 9, icon: '✨', col: this.skin.base, orb: true, big: false });
                      }
                    }

                    const spd = canBoost ? 215 * (speedBuff ? 1.82 : 1.65) : 215;
                    this.angle += clamp(angleDiff(this.targetAngle, this.angle), -5.8 * dt, 5.8 * dt);
                    this.x += Math.cos(this.angle) * spd * dt;
                    this.y += Math.sin(this.angle) * spd * dt;

                    const r = this.getRadius();
                    if (dist(this.x, this.y, WORLD_CENTER, WORLD_CENTER) + r > ARENA_RADIUS) { killWorm(this, null, 'Arena Wall'); return; }

                    this.segments[0].x = this.x; this.segments[0].y = this.y;
                    const spc = r * 0.46;
                    for (let i = 1; i < this.segments.length; i++) {
                      const p = this.segments[i - 1], c = this.segments[i], dx = c.x - p.x, dy = c.y - p.y, d = Math.hypot(dx, dy) || 0.001;
                      if (d > spc) { const rt = spc / d; c.x = p.x + dx * rt; c.y = p.y + dy * rt; }
                    }
                    const tLen = this.getSegCount();
                    while (this.segments.length < tLen) { const tl = this.segments[this.segments.length - 1]; this.segments.push({ x: tl.x, y: tl.y }); }
                    while (this.segments.length > tLen && this.segments.length > 14) this.segments.pop();
                  }

                  draw(c, showUi = true) {
                    if (!this.alive || this.segments.length < 4) return;
                    const r = this.getRadius(), len = this.segments.length, bType = this.skin.body;
                    const isRain = bType === 'rainbow';

                    c.save();
                    // Soft drop shadow
                    c.fillStyle = 'rgba(0,0,0,0.22)';
                    for (let i = len - 1; i >= 0; i -= 2) {
                      const seg = this.segments[i], tp = i > len - 6 ? lerp(1, 0.58, (i - (len - 6)) / 6) : 1;
                      c.beginPath(); c.arc(seg.x + 4, seg.y + 6, r * tp, 0, Math.PI * 2); c.fill();
                    }

                    // Glow aura for glow/rainbow/garland or Boost
                    if (bType === 'glow' || isRain || bType === 'garland' || this.boosting) {
                      c.fillStyle = isRain ? `hsl(${(globalTime * 150) % 360},100%,62%)` : (this.boosting ? '#ffe259' : this.skin.accent);
                      c.globalAlpha = 0.24;
                      for (let i = len - 1; i >= 0; i -= 3) { c.beginPath(); c.arc(this.segments[i].x, this.segments[i].y, r * 1.3, 0, Math.PI * 2); c.fill(); }
                      c.globalAlpha = 1;
                    }

                    // BRIGHT GLOSSY CUSTOM BODY SHAPES (NO MORE BLACK OVERLAP!)
                    for (let i = len - 1; i >= 1; i--) {
                      const seg = this.segments[i], prev = this.segments[i - 1];
                      const ang = Math.atan2(prev.y - seg.y, prev.x - seg.x);
                      const tp = i > len - 6 ? lerp(1, 0.58, (i - (len - 6)) / 6) : 1;
                      const sr = r * tp;

                      let col1 = this.skin.base, col2 = this.skin.mid;
                      if (isRain) { col1 = `hsl(${(globalTime * 150 + i * 11) % 360}, 95%, 60%)`; col2 = `hsl(${(globalTime * 150 + i * 11 + 25) % 360}, 90%, 48%)`; }
                      else if (bType === 'band' && (Math.floor(i / 3) % 2 === 1)) { col1 = this.skin.accent; col2 = this.skin.accent; }
                      else if (bType === 'stripe' && i % 4 === 0) { col1 = this.skin.mid; col2 = this.skin.base; }

                      // Side attachments (Spider legs, Dragon fins, Angel wings, Rose leaves)
                      if (bType === 'spider' && i % 5 === 0) {
                        c.save(); c.translate(seg.x, seg.y); c.rotate(ang);
                        c.strokeStyle = '#1b1429'; c.lineWidth = Math.max(2, sr * 0.18); c.lineCap = 'round';
                        const wig = Math.sin(globalTime * 12 + i) * sr * 0.22;
                        for (const s of [-1, 1]) { c.beginPath(); c.moveTo(0, s * sr * 0.8); c.lineTo(wig, s * sr * 1.65); c.stroke(); }
                        c.restore();
                      } else if (bType === 'dragon' && i % 4 === 0) {
                        c.save(); c.translate(seg.x, seg.y); c.rotate(ang);
                        c.fillStyle = this.skin.accent;
                        for (const s of [-1, 1]) { c.beginPath(); c.moveTo(sr * 0.3, s * sr * 0.85); c.lineTo(-sr * 0.45, s * sr * 1.48); c.lineTo(-sr * 0.55, s * sr * 0.72); c.closePath(); c.fill(); }
                        c.restore();
                      } else if (bType === 'wings' && i === 4) {
                        c.save(); c.translate(seg.x, seg.y); c.rotate(ang);
                        const fl = Math.sin(globalTime * 10) * 0.25;
                        c.fillStyle = this.skin.accent; c.strokeStyle = '#fff'; c.lineWidth = 1.5;
                        for (const s of [-1, 1]) { c.save(); c.rotate(s * fl); c.beginPath(); c.ellipse(-sr * 0.3, s * sr * 1.65, sr * 0.65, sr * 1.15, s * 0.35, 0, Math.PI * 2); c.fill(); c.stroke(); c.restore(); }
                        c.restore();
                      } else if (bType === 'vine' && i % 5 === 0) {
                        c.save(); c.translate(seg.x, seg.y); c.rotate(ang);
                        c.fillStyle = '#4be33b';
                        const s = (i % 10 === 0) ? 1 : -1;
                        c.beginPath(); c.ellipse(0, s * sr * 1.28, sr * 0.55, sr * 0.28, s * 0.45, 0, Math.PI * 2); c.fill();
                        c.restore();
                      }

                      // Segment Shape (Square vs Lantern vs Glossy Round)
                      const g = c.createRadialGradient(seg.x - sr * 0.26, seg.y - sr * 0.28, sr * 0.08, seg.x, seg.y, sr * 1.05);
                      g.addColorStop(0, col1); g.addColorStop(1, col2);
                      c.fillStyle = g;
                      if (bType === 'square') {
                        c.save(); c.translate(seg.x, seg.y); c.rotate(ang);
                        c.strokeStyle = 'rgba(0,0,0,0.28)'; c.lineWidth = 1.4;
                        c.beginPath(); c.roundRect ? c.roundRect(-sr, -sr, sr * 2, sr * 2, sr * 0.32) : c.rect(-sr, -sr, sr * 2, sr * 2);
                        c.fill(); c.stroke(); c.restore();
                      } else if (bType === 'lantern') {
                        c.beginPath(); c.arc(seg.x, seg.y, sr * (i % 3 === 0 ? 1.12 : 0.88), 0, Math.PI * 2); c.fill();
                        if (i % 3 === 0) { c.strokeStyle = '#ffe875'; c.lineWidth = 1.5; c.stroke(); }
                      } else {
                        c.beginPath(); c.arc(seg.x, seg.y, sr, 0, Math.PI * 2); c.fill();
                      }

                      // Special Surface Patterns (Donut Sprinkles, Garland Lights, Hearts, Stitches, Waffle, Dots)
                      if (bType === 'donut' && i % 3 === 0) {
                        const spCols = ['#ff4757','#ffe259','#59f4ff','#ffffff'];
                        c.fillStyle = spCols[i % spCols.length];
                        c.fillRect(seg.x - sr * 0.3, seg.y - sr * 0.2, sr * 0.36, sr * 0.16);
                      } else if (bType === 'garland' && i % 4 === 0) {
                        const lCols = ['#ff3864','#ffe259','#4de2f0','#ff9524'];
                        c.fillStyle = lCols[(i + Math.floor(globalTime * 4)) % lCols.length];
                        c.beginPath(); c.arc(seg.x, seg.y, sr * 0.42, 0, Math.PI * 2); c.fill();
                      } else if (bType === 'hearts' && i % 5 === 0) {
                        c.fillStyle = this.skin.accent; c.beginPath(); c.arc(seg.x, seg.y, sr * 0.36, 0, Math.PI * 2); c.fill();
                      } else if (bType === 'stitch' && i % 4 === 0) {
                        c.save(); c.translate(seg.x, seg.y); c.rotate(ang);
                        c.strokeStyle = '#1b1b1b'; c.lineWidth = 1.8;
                        c.beginPath(); c.moveTo(-sr * 0.35, -sr * 0.35); c.lineTo(sr * 0.35, sr * 0.35); c.moveTo(sr * 0.35, -sr * 0.35); c.lineTo(-sr * 0.35, sr * 0.35); c.stroke();
                        c.restore();
                      } else if (bType === 'waffle' && i % 3 === 0) {
                        c.strokeStyle = 'rgba(120,65,10,0.32)'; c.lineWidth = 1.2;
                        c.beginPath(); c.moveTo(seg.x - sr * 0.6, seg.y); c.lineTo(seg.x + sr * 0.6, seg.y); c.stroke();
                      } else if (bType === 'dots' && i % 4 === 0) {
                        c.fillStyle = this.skin.accent; c.beginPath(); c.arc(seg.x, seg.y, sr * 0.34, 0, Math.PI * 2); c.fill();
                      }

                      if (i % 2 === 0 && bType !== 'square') {
                        c.fillStyle = 'rgba(255,255,255,0.24)';
                        c.beginPath(); c.arc(seg.x - sr * 0.25, seg.y - sr * 0.26, sr * 0.3, 0, Math.PI * 2); c.fill();
                      }
                    }

                    // Head
                    c.save(); c.translate(this.x, this.y); c.rotate(this.angle);
                    drawWormHead(c, this.skin, this.eye, this.lip, r * 1.08, this.blinkAmt, this.mouthOpen, this.lookAng);
                    if (this.spawnShield > 0) { c.strokeStyle = 'rgba(89, 244, 255, 0.85)'; c.lineWidth = 3; c.beginPath(); c.arc(0, 0, r * 1.65, 0, Math.PI * 2); c.stroke(); }
                    c.restore();

                    // Non-Overlapping Nameplate & Speech Bubble
                    if (showUi) {
                      c.font = '900 11px sans-serif'; c.textAlign = 'center';
                      const lbl = this.isChamp ? `👑 ${this.name}` : this.name;
                      c.fillStyle = 'rgba(0,0,0,0.65)'; c.fillText(lbl, this.x + 1, this.y - r - 18);
                      c.fillStyle = this.isChamp ? '#ffe259' : '#ffffff'; c.fillText(lbl, this.x, this.y - r - 19);
                    }
                    if (this.bubbleTimer > 0 && this.bubbleText) {
                      c.save(); c.font = '900 12px sans-serif';
                      const tw = c.measureText(this.bubbleText).width + 18;
                      const bx = this.x - tw / 2, by = this.y - r - (showUi ? 58 : 48);
                      c.fillStyle = '#ffffff'; c.strokeStyle = '#1b3554'; c.lineWidth = 2;
                      c.beginPath(); c.roundRect ? c.roundRect(bx, by, tw, 24, 12) : c.rect(bx, by, tw, 24); c.fill(); c.stroke();
                      c.fillStyle = '#11223a'; c.textAlign = 'center'; c.textBaseline = 'middle';
                      c.fillText(this.bubbleText, this.x, by + 12);
                      c.restore();
                    }
                    c.restore();
                  }
                }
                function spawnFood(count = 1, nearPlayer = false) {
                  const fv = FOOD_VARIETIES.find(f => f.id === profile.food) || FOOD_VARIETIES[0];
                  const vals = [3, 6, 12, 22, 36, 54];
                  const cols = ['#ff4757','#ffe259','#69f03a','#4de2f0','#ff6be6','#ff9f43'];
                  for (let i = 0; i < count; i++) {
                    const pt = (nearPlayer && player && player.alive)
                      ? { x: clamp(player.x + rand(-1800, 1800), WORLD_CENTER - ARENA_RADIUS + 200, WORLD_CENTER + ARENA_RADIUS - 200),
                          y: clamp(player.y + rand(-1800, 1800), WORLD_CENTER - ARENA_RADIUS + 200, WORLD_CENTER + ARENA_RADIUS - 200) }
                      : randInArena(240);
                    const v = vals[Math.floor(Math.random() * vals.length)];
                    const icon = fv.items[Math.floor(Math.random() * fv.items.length)];
                    foods.push({ x: pt.x, y: pt.y, val: v, r: v >= 36 ? 17 : (v >= 12 ? 14 : 11), icon, col: cols[i % cols.length], orb: icon === 'orb', big: false });
                  }
                }

                function spawnMapPotion(count = 1) {
                  for (let i = 0; i < count; i++) {
                    const po = POTIONS[Math.floor(Math.random() * POTIONS.length)];
                    const pt = randInArena(360);
                    potions.push({ ...po, x: pt.x, y: pt.y, r: 19, life: 55 });
                  }
                }

                function spawnChest(count = 1) {
                  for (let i = 0; i < count; i++) {
                    const pt = randInArena(450);
                    chests.push({ x: pt.x, y: pt.y, r: 24, life: 65 });
                  }
                }

                function showDefeatBanner(txt) {
                  const el = document.getElementById('defeatBanner');
                  el.textContent = txt; el.style.display = 'block';
                  clearTimeout(el.__t);
                  el.__t = setTimeout(() => { el.style.display = 'none'; }, 2400);
                }

                function killWorm(victim, killer, reason) {
                  if (!victim.alive) return;
                  victim.alive = false;
                  const fv = FOOD_VARIETIES.find(f => f.id === profile.food) || FOOD_VARIETIES[0];
                  const dropStep = Math.max(2, Math.floor(victim.segments.length / 24));
                  const chunkVal = Math.max(22, Math.min(480, Math.round(victim.score * 0.08)));
                  for (let i = 0; i < victim.segments.length; i += dropStep) {
                    const sg = victim.segments[i];
                    const icon = fv.items[i % fv.items.length];
                    foods.push({ x: sg.x + rand(-14, 14), y: sg.y + rand(-14, 14), val: chunkVal, r: 19, icon, col: victim.skin.base, orb: icon === 'orb', big: true });
                  }
                  for (let i = 0; i < 16; i++) {
                    const a = rand(0, 6.28), sp = rand(40, 170);
                    particles.push({ x: victim.x, y: victim.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.55, maxLife: 0.55, r: rand(3, 6), col: victim.skin.base });
                  }

                  if (killer && killer !== victim) {
                    killer.kills++;
                    if (killer.isPlayer) {
                      matchKills++;
                      const killBonus = Math.max(231, Math.min(3022, Math.round(victim.score * 0.35)));
                      killer.score += killBonus;
                      matchCoins += 15;
                      Sound.play('kill'); vibrate(55);
                      showDefeatBanner(`+1 You defeated ${victim.name}! (+${killBonus})`);
                      floatTexts.push({ x: victim.x, y: victim.y - 24, text: `+${killBonus}`, color: '#ffe259', life: 1.3, maxLife: 1.3, big: true });
                    }
                  }

                  if (victim.isPlayer) {
                    if (!reviveUsed) openReviveModal();
                    else finishMatch(reason || 'Defeated in Arena');
                  } else {
                    setTimeout(() => {
                      if (screenState !== 'playing') return;
                      const pt = randInArena(450);
                      const sk = SKINS[Math.floor(Math.random() * SKINS.length)];
                      const ey = EXTRA_EYES[Math.floor(Math.random() * EXTRA_EYES.length)].id;
                      const lp = EXTRA_LIPS[Math.floor(Math.random() * EXTRA_LIPS.length)].id;
                      worms.push(new Worm({ name: victim.name, skin: sk, eye: ey, lip: lp, x: pt.x, y: pt.y, score: Math.floor(rand(120, 4200)) }));
                    }, 900);
                  }
                }

                function openReviveModal() {
                  screenState = 'revive';
                  ctrl.joyActive = false; ctrl.joyTouchId = null; ctrl.boostHeld = false;
                  document.getElementById('revScoreTxt').textContent = Math.floor(player.score).toLocaleString();
                  let left = 5;
                  document.getElementById('revCountTxt').textContent = left;
                  document.getElementById('reviveModal').classList.add('open');
                  clearInterval(reviveIv);
                  reviveIv = setInterval(() => {
                    left--;
                    document.getElementById('revCountTxt').textContent = left;
                    if (left <= 0) {
                      clearInterval(reviveIv);
                      document.getElementById('reviveModal').classList.remove('open');
                      finishMatch('Defeated in Arena');
                    }
                  }, 1000);
                }

                function revivePlayer() {
                  clearInterval(reviveIv);
                  reviveUsed = true;
                  document.getElementById('reviveModal').classList.remove('open');
                  const pt = randInArena(700);
                  player.x = pt.x; player.y = pt.y; player.alive = true; player.spawnShield = 4.0;
                  player.segments.forEach((s, i) => { s.x = pt.x - i * 5; s.y = pt.y; });
                  screenState = 'playing';
                  player.say('I am back! ⚡');
                }

                function startMatch(bonusScore = 0) {
                  recordPlayToday();
                  screenState = 'playing';
                  reviveUsed = false;
                  matchKills = 0; matchCoins = 0; matchTimer = 300; buffs = {};
                  ctrl.joyActive = false; ctrl.joyTouchId = null; ctrl.boostHeld = false;
                  document.getElementById('lobbyScreen').style.display = 'none';
                  document.getElementById('resultsModal').classList.remove('open');
                  document.getElementById('hud').style.display = 'block';
                  document.getElementById('modeTimerPill').style.display = profile.mode === 'time' ? 'block' : 'none';

                  buildFloorPattern(profile.floor);
                  worms = []; foods = []; potions = []; chests = []; particles = []; floatTexts = [];

                  const pSkin = SKINS.find(s => s.id === profile.skin) || SKINS[0];
                  player = new Worm({
                    name: profile.name, skin: pSkin, eye: profile.eye, lip: profile.lip,
                    x: WORLD_CENTER, y: WORLD_CENTER, isPlayer: true, score: 100 + bonusScore, isChamp: isWorldChampion()
                  });
                  const exprObj = EXPRESSIONS.find(e => e.id === profile.expr) || EXPRESSIONS[0];
                  player.say(exprObj.text);
                  worms.push(player);

                  for (let i = 1; i < TOTAL_WORMS; i++) {
                    const pt = randInArena(450);
                    const sk = SKINS[Math.floor(Math.random() * SKINS.length)];
                    const ey = EXTRA_EYES[Math.floor(Math.random() * EXTRA_EYES.length)].id;
                    const lp = EXTRA_LIPS[Math.floor(Math.random() * EXTRA_LIPS.length)].id;
                    const sc = i < 5 ? Math.floor(rand(8000, 38000)) : Math.floor(rand(140, 4500));
                    worms.push(new Worm({ name: AI_NAMES[i % AI_NAMES.length] + (i > 25 ? i : ''), skin: sk, eye: ey, lip: lp, x: pt.x, y: pt.y, score: sc }));
                  }

                  spawnFood(320, true);
                  spawnFood(340, false);
                  spawnMapPotion(18);
                  spawnChest(profile.mode === 'treasure' ? 12 : 4);
                  camera.x = player.x; camera.y = player.y; camera.zoom = 0.92;
                  syncQuickPotions();
                  saveProfile();
                }

                function finishMatch(subText) {
                  screenState = 'results';
                  document.getElementById('hud').style.display = 'none';
                  const finalScore = Math.floor(player ? player.score : 0);
                  const earnedGold = Math.max(25, Math.floor(finalScore / 85) + matchCoins);
                  const wasChamp = isWorldChampion();

                  profile.coins += earnedGold;
                  if (finalScore > (profile.bestScores[profile.mode] || 0)) {
                    profile.bestScores[profile.mode] = finalScore;
                  }
                  if (finalScore > 10000) profile.level = Math.max(profile.level, Math.floor(finalScore / 8000) + 1);
                  saveProfile();

                  document.getElementById('resTitle').textContent = (profile.mode === 'time' && matchTimer <= 0) ? 'TIME UP!' : 'GAME OVER!';
                  document.getElementById('resSub').textContent = subText;
                  document.getElementById('resScore').textContent = finalScore.toLocaleString();
                  document.getElementById('resKills').textContent = matchKills;
                  document.getElementById('resGold').textContent = `+${earnedGold} 🪙`;
                  document.getElementById('resChampNotice').style.display = (!wasChamp && isWorldChampion()) ? 'block' : 'none';
                  document.getElementById('resultsModal').classList.add('open');
                  Sound.play('over');
                }

                function updateGame(dt) {
                  if (profile.mode === 'time') {
                    matchTimer -= dt;
                    if (matchTimer <= 0) { finishMatch('5-Minute Time Battle Completed!'); return; }
                  }

                  Object.keys(buffs).forEach(k => { if (buffs[k] > 0) buffs[k] = Math.max(0, buffs[k] - dt); });

                  if (player && player.alive) {
                    const kx = (ctrl.keys.right ? 1 : 0) - (ctrl.keys.left ? 1 : 0);
                    const ky = (ctrl.keys.down ? 1 : 0) - (ctrl.keys.up ? 1 : 0);
                    if (kx !== 0 || ky !== 0) player.targetAngle = Math.atan2(ky, kx);
                    else if (ctrl.joyActive && ctrl.joyMag > 8) player.targetAngle = ctrl.joyAngle;
                    player.boosting = ctrl.boostHeld || ctrl.keys.boost;
                  }

                  for (const w of worms) w.update(dt);

                  // FAIR 0.68 HITBOX SO CLOSE TURNS FEEL SMOOTH & FAIR
                  for (const w of worms) {
                    if (!w.alive || w.spawnShield > 0) continue;
                    const hr = w.getRadius() * 0.68;
                    for (const o of worms) {
                      if (o === w || !o.alive || o.spawnShield > 0) continue;
                      if (distSq(w.x, w.y, o.x, o.y) > 950 * 950) continue;
                      const oR = o.getRadius() * 0.68;
                      let hit = false;
                      const step = o.segments.length > 100 ? 2 : 1;
                      for (let k = 1; k < o.segments.length; k += step) {
                        if (distSq(w.x, w.y, o.segments[k].x, o.segments[k].y) < (hr + oR) ** 2) { hit = true; break; }
                      }
                      if (hit) { killWorm(w, o, `Crashed into ${o.name}`); break; }
                    }
                  }

                  const magR = (buffs.magnet || 0) > 0 ? 260 : 85;
                  const mult = (buffs.x5 || 0) > 0 ? 5 : 1;
                  let nearFoodAng = 0, nearFoodD = 220 * 220;

                  for (let i = foods.length - 1; i >= 0; i--) {
                    const f = foods[i];
                    if (player && player.alive) {
                      const d2 = distSq(player.x, player.y, f.x, f.y);
                      if (d2 < nearFoodD) { nearFoodD = d2; nearFoodAng = Math.atan2(f.y - player.y, f.x - player.x) - player.angle; }
                      if (d2 < magR * magR) { f.x = lerp(f.x, player.x, dt * 8.5); f.y = lerp(f.y, player.y, dt * 8.5); }
                    }
                    for (const w of worms) {
                      if (!w.alive) continue;
                      const er = w.getRadius() * 1.25 + f.r;
                      if (distSq(w.x, w.y, f.x, f.y) < er * er) {
                        const gain = f.val * (w.isPlayer ? mult : 1);
                        w.score += gain;
                        w.mouthOpen = 0.85;
                        if (w.isPlayer) {
                          Sound.eat();
                          if (gain >= 12 || Math.random() < 0.35) {
                            floatTexts.push({ x: f.x, y: f.y - 12, text: `+${gain}`, color: gain >= 50 ? '#ffe259' : '#a8ff78', life: 0.72, maxLife: 0.72, big: gain >= 50 });
                          }
                        }
                        foods.splice(i, 1); break;
                      }
                    }
                  }
                  if (player && player.alive) player.lookAng = lerp(player.lookAng, nearFoodAng, dt * 10);
                  if (foods.length < 580) spawnFood(10, true);

                  for (let i = potions.length - 1; i >= 0; i--) {
                    const p = potions[i]; p.life -= dt;
                    if (p.life <= 0) { potions.splice(i, 1); continue; }
                    if (player && player.alive && distSq(player.x, player.y, p.x, p.y) < (player.getRadius() + p.r + 12) ** 2) {
                      buffs[p.id] = p.dur;
                      Sound.play('potion'); vibrate(30);
                      floatTexts.push({ x: p.x, y: p.y - 18, text: `${p.icon} ${p.name}!`, color: p.col, life: 1.2, maxLife: 1.2, big: true });
                      potions.splice(i, 1);
                    }
                  }
                  if (potions.length < 14) spawnMapPotion(2);

                  for (let i = chests.length - 1; i >= 0; i--) {
                    const ch = chests[i]; ch.life -= dt;
                    if (ch.life <= 0) { chests.splice(i, 1); continue; }
                    if (player && player.alive && distSq(player.x, player.y, ch.x, ch.y) < (player.getRadius() + ch.r + 14) ** 2) {
                      const bonus = 1500 * mult;
                      player.score += bonus; matchCoins += 60;
                      Sound.play('buy'); vibrate(45);
                      floatTexts.push({ x: ch.x, y: ch.y - 20, text: `💰 +${bonus} & +60 🪙`, color: '#ffe259', life: 1.4, maxLife: 1.4, big: true });
                      chests.splice(i, 1);
                    }
                  }
                  if (chests.length < (profile.mode === 'treasure' ? 10 : 3)) spawnChest(1);

                  for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; if (p.life <= 0) particles.splice(i, 1); }
                  for (let i = floatTexts.length - 1; i >= 0; i--) { const ft = floatTexts[i]; ft.y -= 34 * dt; ft.life -= dt; if (ft.life <= 0) floatTexts.splice(i, 1); }

                  if (player && player.alive) {
                    camera.x = lerp(camera.x, player.x, clamp(dt * 8, 0, 1));
                    camera.y = lerp(camera.y, player.y, clamp(dt * 8, 0, 1));
                    const sizeZoom = clamp(1.02 - Math.pow(player.score, 0.16) * 0.06, 0.56, 0.96);
                    const targetZoom = (buffs.zoom || 0) > 0 ? Math.max(0.46, sizeZoom - 0.18) : sizeZoom;
                    camera.zoom = lerp(camera.zoom, targetZoom, clamp(dt * 4, 0, 1));
                  }

                  hudTick -= dt;
                  if (hudTick <= 0 && player) {
                    hudTick = 0.14;
                    document.getElementById('hudScoreBig').textContent = Math.floor(player.score).toLocaleString();
                    document.getElementById('hudKillsPill').textContent = `💀 ${matchKills}`;
                    document.getElementById('hudCoinsRun').textContent = `🪙 ${matchCoins}`;

                    if (profile.mode === 'time') {
                      const t = Math.max(0, Math.ceil(matchTimer));
                      document.getElementById('modeTimerPill').textContent = `⏱️ ${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
                    }

                    const bRow = document.getElementById('activeBuffRow');
                    bRow.innerHTML = POTIONS.filter(p => (buffs[p.id] || 0) > 0)
                      .map(p => `<span class="buff-tag">${p.icon} ${Math.ceil(buffs[p.id])}s</span>`).join('');

                    const sorted = worms.filter(w => w.alive).sort((a, b) => b.score - a.score);
                    const top10 = sorted.slice(0, 10);
                    document.getElementById('arenaLeaderBox').innerHTML = top10.map((w, i) =>
                      `<div class="alb-row${w.isPlayer ? ' me' : ''}"><span>${i === 0 ? '👑' : (i + 1) + '.'} ${w.name.slice(0, 10)}</span><span>${Math.floor(w.score).toLocaleString()}</span></div>`
                    ).join('');

                    drawMinimap();
                  }
                }

                function drawMinimap() {
                  const w = miniCanvas.width, h = miniCanvas.height, cx = w / 2, cy = h / 2;
                  const sc = (w * 0.45) / ARENA_RADIUS;
                  miniCtx.clearRect(0, 0, w, h);
                  miniCtx.fillStyle = '#0c2b12'; miniCtx.fillRect(0, 0, w, h);
                  miniCtx.strokeStyle = 'rgba(255,80,80,0.65)'; miniCtx.lineWidth = 2;
                  miniCtx.beginPath(); miniCtx.arc(cx, cy, ARENA_RADIUS * sc, 0, Math.PI * 2); miniCtx.stroke();

                  const radarOn = (buffs.radar || 0) > 0;
                  miniCtx.fillStyle = '#ffe259';
                  for (const ch of chests) { miniCtx.beginPath(); miniCtx.arc(cx + (ch.x - WORLD_CENTER) * sc, cy + (ch.y - WORLD_CENTER) * sc, radarOn ? 4 : 2.5, 0, Math.PI * 2); miniCtx.fill(); }
                  for (const wm of worms) {
                    if (!wm.alive || wm.isPlayer) continue;
                    miniCtx.fillStyle = (radarOn && wm.score > 5000) ? '#ff4757' : 'rgba(255,140,140,0.65)';
                    miniCtx.beginPath(); miniCtx.arc(cx + (wm.x - WORLD_CENTER) * sc, cy + (wm.y - WORLD_CENTER) * sc, (radarOn && wm.score > 5000) ? 3.2 : 1.6, 0, Math.PI * 2); miniCtx.fill();
                  }
                  if (player && player.alive) {
                    miniCtx.fillStyle = '#69f03a';
                    miniCtx.beginPath(); miniCtx.arc(cx + (player.x - WORLD_CENTER) * sc, cy + (player.y - WORLD_CENTER) * sc, 4, 0, Math.PI * 2); miniCtx.fill();
                    miniCtx.strokeStyle = '#fff'; miniCtx.lineWidth = 1.5; miniCtx.stroke();
                  }
                }

                function renderGame(dt) {
                  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                  if (floorPattern) { ctx.fillStyle = floorPattern; ctx.fillRect(0, 0, appW, appH); }
                  else { ctx.fillStyle = '#1a7322'; ctx.fillRect(0, 0, appW, appH); }

                  if (document.getElementById('workshopModal').classList.contains('open') && wsPreviewWorm) {
                    wsCtx.clearRect(0, 0, wsCanvas.width, wsCanvas.height);
                    const t = globalTime * 1.4;
                    const nx = wsCanvas.width * 0.5 + Math.cos(t) * 52, ny = wsCanvas.height * 0.56 + Math.sin(t) * 46;
                    wsPreviewWorm.angle = Math.atan2(ny - wsPreviewWorm.y, nx - wsPreviewWorm.x);
                    wsPreviewWorm.x = nx; wsPreviewWorm.y = ny; wsPreviewWorm.segments[0].x = nx; wsPreviewWorm.segments[0].y = ny;
                    for (let i = 1; i < wsPreviewWorm.segments.length; i++) {
                      const p = wsPreviewWorm.segments[i - 1], c = wsPreviewWorm.segments[i], dx = c.x - p.x, dy = c.y - p.y, d = Math.hypot(dx, dy) || 1;
                      if (d > 6) { c.x = p.x + (dx / d) * 6; c.y = p.y + (dy / d) * 6; }
                    }
                    wsPreviewWorm.draw(wsCtx, false);
                  }

                  if (screenState !== 'playing') {
                    if (lobbyWorm) {
                      const t = globalTime * 0.95;
                      const rx = Math.min(appW * 0.16, 125), ry = Math.min(appH * 0.15, 68);
                      const nx = appW * 0.5 + Math.cos(t) * rx, ny = appH * 0.52 + Math.sin(t * 2) * (ry * 0.55);
                      lobbyWorm.angle = Math.atan2(ny - lobbyWorm.y, nx - lobbyWorm.x);
                      lobbyWorm.x = nx; lobbyWorm.y = ny; lobbyWorm.segments[0].x = nx; lobbyWorm.segments[0].y = ny;
                      lobbyWorm.blinkTimer -= dt;
                      if (lobbyWorm.blinkTimer <= 0) {
                        lobbyWorm.blinkAmt = 1;
                        if (lobbyWorm.blinkTimer < -0.14) { lobbyWorm.blinkAmt = 0; lobbyWorm.blinkTimer = rand(2.2, 4.5); }
                      }
                      if (Math.random() < 0.005 && lobbyWorm.bubbleTimer <= 0) {
                        const ex = EXPRESSIONS.find(e => e.id === profile.expr) || EXPRESSIONS[0];
                        lobbyWorm.say(ex.text);
                      }
                      if (lobbyWorm.bubbleTimer > 0) lobbyWorm.bubbleTimer -= dt;
                      for (let i = 1; i < lobbyWorm.segments.length; i++) {
                        const p = lobbyWorm.segments[i - 1], c = lobbyWorm.segments[i], dx = c.x - p.x, dy = c.y - p.y, d = Math.hypot(dx, dy) || 1;
                        if (d > 7) { c.x = p.x + (dx / d) * 7; c.y = p.y + (dy / d) * 7; }
                      }
                      lobbyWorm.draw(ctx, false);
                    }
                    return;
                  }

                  ctx.save();
                  ctx.translate(appW / 2, appH / 2);
                  ctx.scale(camera.zoom, camera.zoom);
                  ctx.translate(-camera.x, -camera.y);

                  if (floorPattern) { ctx.fillStyle = floorPattern; ctx.fillRect(0, 0, WORLD_SIZE, WORLD_SIZE); }

                  ctx.strokeStyle = '#ff4757'; ctx.lineWidth = 24;
                  ctx.beginPath(); ctx.arc(WORLD_CENTER, WORLD_CENTER, ARENA_RADIUS, 0, Math.PI * 2); ctx.stroke();

                  const vx = (appW / camera.zoom) * 0.62 + 120, vy = (appH / camera.zoom) * 0.62 + 120;
                  const near = (x, y) => Math.abs(x - camera.x) < vx && Math.abs(y - camera.y) < vy;

                  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                  for (const f of foods) {
                    if (!near(f.x, f.y)) continue;
                    if (f.big) { ctx.fillStyle = 'rgba(255, 226, 89, 0.28)'; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 1.25, 0, Math.PI * 2); ctx.fill(); }
                    if (f.orb) {
                      ctx.fillStyle = f.col; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 0.72, 0, Math.PI * 2); ctx.fill();
                      ctx.fillStyle = 'rgba(255,255,255,0.65)'; ctx.beginPath(); ctx.arc(f.x - 3, f.y - 3, f.r * 0.25, 0, Math.PI * 2); ctx.fill();
                    } else {
                      ctx.font = `${Math.round(f.r * 1.65)}px sans-serif`;
                      ctx.fillText(f.icon, f.x, f.y);
                    }
                  }

                  for (const p of potions) {
                    if (!near(p.x, p.y)) continue;
                    ctx.fillStyle = p.col; ctx.globalAlpha = 0.26;
                    ctx.beginPath(); ctx.arc(p.x, p.y, 26 + Math.sin(globalTime * 6) * 3, 0, Math.PI * 2); ctx.fill();
                    ctx.globalAlpha = 1; ctx.fillStyle = '#0e2448'; ctx.strokeStyle = p.col; ctx.lineWidth = 2.5;
                    ctx.beginPath(); ctx.arc(p.x, p.y, 17, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                    ctx.font = '16px sans-serif'; ctx.fillText(p.icon, p.x, p.y + 1);
                  }
                  for (const ch of chests) {
                    if (!near(ch.x, ch.y)) continue;
                    ctx.fillStyle = 'rgba(255,210,63,0.32)';
                    ctx.beginPath(); ctx.arc(ch.x, ch.y, 34 + Math.sin(globalTime * 5) * 4, 0, Math.PI * 2); ctx.fill();
                    ctx.font = '28px sans-serif'; ctx.fillText('🧰', ch.x, ch.y);
                  }

                  for (const pt of particles) {
                    ctx.globalAlpha = clamp(pt.life / pt.maxLife, 0, 1);
                    ctx.fillStyle = pt.col; ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2); ctx.fill();
                  }
                  ctx.globalAlpha = 1;

                  for (const w of worms) {
                    if (!w.alive) continue;
                    if (w.isPlayer || near(w.x, w.y) || near(w.segments[w.segments.length - 1].x, w.segments[w.segments.length - 1].y)) {
                      w.draw(ctx, true);
                    }
                  }

                  for (const ft of floatTexts) {
                    ctx.globalAlpha = clamp(ft.life / ft.maxLife, 0, 1);
                    ctx.font = ft.big ? '900 18px sans-serif' : '900 13px sans-serif';
                    ctx.fillStyle = '#000'; ctx.fillText(ft.text, ft.x + 1, ft.y + 1);
                    ctx.fillStyle = ft.color; ctx.fillText(ft.text, ft.x, ft.y);
                  }
                  ctx.globalAlpha = 1;
                  ctx.restore();
                }

                function mainLoop(ts) {
                  const dt = Math.min(0.05, (ts - (lastFrame || ts)) / 1000);
                  lastFrame = ts; globalTime += dt;
                  if (screenState === 'playing') updateGame(dt);
                  renderGame(dt);
                  requestAnimationFrame(mainLoop);
                }

                function syncQuickPotions() {
                  ['magnet', 'x5', 'speed', 'zoom', 'radar'].forEach(id => {
                    const el = document.getElementById(`qpc_${id}`);
                    if (el) el.textContent = profile.potions[id] || 0;
                  });
                }

                function refreshLobbyUI() {
                  document.getElementById('lbAvatar').textContent = profile.avatar;
                  document.getElementById('lbName').textContent = profile.name;
                  document.getElementById('lbCoins').textContent = profile.coins.toLocaleString();
                  document.getElementById('lbDias').textContent = profile.diamonds.toLocaleString();
                  document.getElementById('wsCoins').textContent = profile.coins.toLocaleString();
                  document.getElementById('wsDias').textContent = profile.diamonds.toLocaleString();
                  document.getElementById('shCoins').textContent = profile.coins.toLocaleString();
                  document.getElementById('shDias').textContent = profile.diamonds.toLocaleString();

                  const bestInf = Math.max(profile.bestScores.infinity || 0, profile.bestScores.time || 0, profile.bestScores.treasure || 0);
                  const champHtml = isWorldChampion() ? ` <span class="world-champ-title">👑 WORLD CHAMPION</span>` : '';
                  document.getElementById('lbChampWrap').innerHTML = `LV.${profile.level} • Best: ${bestInf.toLocaleString()}${champHtml}`;

                  const netBtn = document.getElementById('btnNetToggle');
                  const hasNet = window.AndroidAudio ? window.AndroidAudio.isOnline() : navigator.onLine;
                  const onlineNow = profile.onlineMode && hasNet;
                  netBtn.textContent = onlineNow ? '🟢 ONLINE' : '🟠 OFFLINE';
                  netBtn.classList.toggle('offline', !onlineNow);

                  const mo = MODES.find(m => m.id === profile.mode) || MODES[0];
                  document.getElementById('btnModeCycle').innerHTML = `<span>${mo.icon}</span><span id="modeLabel">${mo.label}</span><span>▾</span>`;

                  const muteIcon = profile.settings.muted ? '🔇' : '🔊';
                  document.getElementById('btnLobbyAudio').textContent = muteIcon;
                  document.getElementById('hudAudioBtn').textContent = muteIcon;
                  document.getElementById('floatingJoy').classList.toggle('fixed-mode', profile.settings.joy === 'fixed');
                }

                function spawnLobbyWorm() {
                  const sk = SKINS.find(s => s.id === profile.skin) || SKINS[0];
                  lobbyWorm = new Worm({
                    name: profile.name, skin: sk, eye: profile.eye, lip: profile.lip,
                    x: appW * 0.5, y: appH * 0.52, isPlayer: true, score: 120, isChamp: isWorldChampion()
                  });
                  lobbyWorm.spawnShield = 0;
                  const ex = EXPRESSIONS.find(e => e.id === profile.expr) || EXPRESSIONS[0];
                  lobbyWorm.say(ex.text);
                }

                function enterLobby() {
                  screenState = 'lobby';
                  ctrl.joyActive = false; ctrl.joyTouchId = null; ctrl.boostHeld = false;
                  document.getElementById('hud').style.display = 'none';
                  document.getElementById('resultsModal').classList.remove('open');
                  document.getElementById('reviveModal').classList.remove('open');
                  document.getElementById('lobbyScreen').style.display = 'block';
                  buildFloorPattern(profile.floor);
                  spawnLobbyWorm();
                  refreshLobbyUI();
                }

                function watchRewardAd(desc, onReward) {
                  const modal = document.getElementById('adModal');
                  const bar = document.getElementById('adProgress');
                  const txt = document.getElementById('adTimerTxt');
                  document.getElementById('adDesc').textContent = desc;
                  bar.style.width = '0%';
                  modal.classList.add('open');
                  let elapsed = 0;
                  const dur = 3.0;
                  const iv = setInterval(() => {
                    elapsed += 0.1;
                    bar.style.width = `${Math.min(100, (elapsed / dur) * 100)}%`;
                    txt.textContent = `${Math.max(0, Math.ceil(dur - elapsed))}s remaining`;
                    if (elapsed >= dur) {
                      clearInterval(iv);
                      modal.classList.remove('open');
                      Sound.play('buy');
                      onReward();
                    }
                  }, 100);
                }

                let wsTab = 'skins';
                let wsSelSkin = profile.skin;

                function syncWsPreview() {
                  const sk = SKINS.find(s => s.id === wsSelSkin) || SKINS[0];
                  wsPreviewWorm = new Worm({
                    name: sk.name, skin: sk, eye: profile.eye, lip: profile.lip,
                    x: 105, y: 115, isPlayer: true, score: 140
                  });
                  wsPreviewWorm.spawnShield = 0;
                  const owned = profile.ownedSkins.includes(sk.id) || sk.curr === 'free';
                  const eq = profile.skin === sk.id;
                  const ex = EXPRESSIONS.find(e => e.id === profile.expr) || EXPRESSIONS[0];
                  document.getElementById('wsName').textContent = sk.name;
                  document.getElementById('wsMeta').textContent = `${sk.tier} • ${sk.curr === 'free' ? 'FREE' : sk.price.toLocaleString() + (sk.curr === 'dia' ? ' 💎' : ' 🪙')}`;
                  document.getElementById('wsExprPreview').textContent = `Expression: "${ex.text}"`;
                  wsPreviewWorm.say(ex.text);

                  const btn = document.getElementById('wsActionBtn');
                  btn.className = (!owned && sk.curr === 'dia') ? 'btn-blue' : 'btn-gold';
                  btn.textContent = eq ? 'EQUIPPED ✅' : (owned ? 'EQUIP SKIN' : `BUY ${sk.price.toLocaleString()} ${sk.curr === 'dia' ? '💎' : '🪙'}`);
                  btn.onclick = () => {
                    if (owned) profile.skin = sk.id;
                    else if (sk.curr === 'coin' && profile.coins >= sk.price) { profile.coins -= sk.price; profile.ownedSkins.push(sk.id); profile.skin = sk.id; Sound.play('buy'); }
