                      const owned = profile.ownedFloors.includes(fl.id) || fl.cost === 0;
                      const eq = profile.floor === fl.id;
                      const c = document.createElement('div'); c.className = 'item-card' + (eq ? ' selected' : '');
                      c.innerHTML = `<strong style="color:#fff;font-size:11.5px;">${fl.name}</strong><div style="height:22px;border-radius:7px;background:${fl.bg};border:2px solid ${fl.hex};"></div><button class="${eq ? 'btn-ghost' : 'btn-gold'}" style="padding:5px;font-size:9.5px;">${eq ? 'ACTIVE ✅' : (owned ? 'SELECT' : `BUY ${fl.cost} 🪙`)}</button>`;
                      c.onclick = () => {
                        if (owned) profile.floor = fl.id;
                        else if (profile.coins >= fl.cost) { profile.coins -= fl.cost; profile.ownedFloors.push(fl.id); profile.floor = fl.id; Sound.play('buy'); }
                        else { Sound.play('over'); return; }
                        buildFloorPattern(profile.floor); saveProfile(); Sound.play('click'); renderWorkshop();
                      };
                      aGrid.appendChild(c);
                    });
                    pane.appendChild(aGrid);
                  }
                }

                // SHOP (ONLY WATCH AD + EXACT INR PACKS, NO EXCHANGE!)
                let pendingPack = null;
                function renderShop() {
                  refreshLobbyUI();
                  const pk = document.getElementById('shopPacksGrid'); pk.innerHTML = '';
                  SHOP_PACKS.forEach(item => {
                    const c = document.createElement('div'); c.className = 'item-card';
                    c.innerHTML = `<strong style="color:#ffe259;font-size:12.5px;">${item.title}</strong><div style="font-size:9.5px;color:#b8d8f8;">${item.desc}</div><button class="btn-inr">BUY ₹${item.inr}</button>`;
                    c.onclick = () => {
                      pendingPack = item;
                      document.getElementById('payTitle').textContent = item.title;
                      document.getElementById('payPrice').textContent = `₹${item.inr}`;
                      document.getElementById('btnPayConfirm').textContent = `PAY ₹${item.inr}`;
                      document.getElementById('payModal').classList.add('open'); Sound.play('click');
                    };
                    pk.appendChild(c);
                  });

                  const pg = document.getElementById('shopPotionsGrid'); pg.innerHTML = '';
                  POTIONS.forEach(po => {
                    const cnt = profile.potions[po.id] || 0;
                    const c = document.createElement('div'); c.className = 'item-card';
                    c.innerHTML = `<strong style="color:${po.col};">${po.icon} ${po.name} (x${cnt})</strong><div style="font-size:9.5px;color:#b8d8f8;">${po.desc}</div><button class="btn-gold" style="padding:6px;font-size:10px;">BUY ${po.cost} 🪙</button>`;
                    c.onclick = () => {
                      if (profile.coins < po.cost) { Sound.play('over'); return; }
                      profile.coins -= po.cost; profile.potions[po.id] = cnt + 1;
                      saveProfile(); Sound.play('buy'); renderShop(); syncQuickPotions();
                    };
                    pg.appendChild(c);
                  });
                }

                function openCalendar() {
                  const now = new Date();
                  const y = now.getFullYear(), m = now.getMonth(), todayD = now.getDate();
                  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
                  document.getElementById('calMonthLbl').textContent = `${months[m]} ${y}`;
                  let streak = 0;
                  for (let i = 0; i < 60; i++) {
                    const d = new Date(y, m, todayD - i);
                    const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                    if (profile.playedDates.includes(iso)) streak++; else break;
                  }
                  document.getElementById('calStreakLbl').textContent = `🔥 Streak: ${streak} Day${streak === 1 ? '' : 's'}`;
                  const grid = document.getElementById('calGrid');
                  grid.innerHTML = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<div class="cal-hdr">${d}</div>`).join('');
                  const firstDay = new Date(y, m, 1).getDay(), daysInMonth = new Date(y, m + 1, 0).getDate();
                  for (let i = 0; i < firstDay; i++) grid.innerHTML += '<div></div>';
                  for (let d = 1; d <= daysInMonth; d++) {
                    const iso = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    const played = profile.playedDates.includes(iso), isToday = d === todayD, isPast = d < todayD;
                    const cls = played ? 'played' : (isPast ? 'missed' : ''), mark = played ? '✅' : (isPast ? '❌' : '');
                    grid.innerHTML += `<div class="cal-day ${cls}${isToday ? ' today' : ''}"><span>${d}</span>${mark ? `<span style="font-size:9px;">${mark}</span>` : ''}</div>`;
                  }
                  document.getElementById('calendarModal').classList.add('open'); Sound.play('click');
                }

                let wlMode = 'infinity';
                function renderWorldLeaderboard() {
                  document.querySelectorAll('[data-wlm]').forEach(b => b.classList.toggle('selected', b.dataset.wlm === wlMode));
                  const bots = WORLD_BOTS[wlMode] || WORLD_BOTS.infinity;
                  const entries = bots.map(b => ({ ...b, isMe: false }));
                  entries.push({ name: profile.name, score: profile.bestScores[wlMode] || 0, country: '🇮🇳', isMe: true });
                  entries.sort((a, b) => b.score - a.score);
                  document.getElementById('worldList').innerHTML = entries.map((e, idx) => {
                    const isTop1 = idx === 0;
                    const badge = isTop1 ? `<span class="world-champ-title">👑 WORLD CHAMPION</span>` : '';
                    return `<div class="wl-row${isTop1 ? ' top1' : ''}${e.isMe ? ' me' : ''}"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;"><strong style="width:24px;color:${isTop1 ? '#ffe259' : '#9cd6ff'};">#${idx + 1}</strong><span>${e.country}</span><strong style="font-size:12px;">${e.name}${e.isMe ? ' (YOU)' : ''}</strong>${badge}</div><strong style="color:#ffe259;font-size:12.5px;">${e.score.toLocaleString()}</strong></div>`;
                  }).join('');
                }

                // EVENTS
                document.getElementById('btnProfileOpen').addEventListener('click', () => { profTab = 'dossier'; renderProfileModal(); document.getElementById('profileModal').classList.add('open'); Sound.play('click'); });
                document.querySelectorAll('[data-pt]').forEach(b => b.addEventListener('click', () => { profTab = b.dataset.pt; renderProfileModal(); Sound.play('click'); }));
                document.getElementById('btnLobbySettings').addEventListener('click', () => { setTab = 'general'; renderSettingsModal(); document.getElementById('settingsModal').classList.add('open'); Sound.play('click'); });
                document.querySelectorAll('[data-st]').forEach(b => b.addEventListener('click', () => { setTab = b.dataset.st; renderSettingsModal(); Sound.play('click'); }));
                document.getElementById('btnNetToggle').addEventListener('click', () => { profile.onlineMode = !profile.onlineMode; saveProfile(); refreshLobbyUI(); Sound.play('click'); });
                document.getElementById('btnModeCycle').addEventListener('click', () => { const idx = MODES.findIndex(m => m.id === profile.mode); profile.mode = MODES[(idx + 1) % MODES.length].id; saveProfile(); refreshLobbyUI(); Sound.play('click'); });
                document.getElementById('btnStartMatch').addEventListener('click', () => { Sound.init(); Sound.play('click'); startMatch(0); });
                document.getElementById('btnOpenWorkshop').addEventListener('click', () => { wsTab = 'skins'; wsSelSkin = profile.skin; document.querySelectorAll('.ws-ico-tab').forEach(b => b.classList.toggle('active', b.dataset.wst === 'skins')); renderWorkshop(); document.getElementById('workshopModal').classList.add('open'); Sound.play('click'); });
                const openShop = () => { renderShop(); document.getElementById('shopModal').classList.add('open'); Sound.play('click'); };
                document.getElementById('btnOpenShop').addEventListener('click', openShop);
                document.getElementById('btnTopCoins').addEventListener('click', openShop);
                document.getElementById('btnTopGems').addEventListener('click', openShop);
                document.getElementById('btnEnergyPill').addEventListener('click', () => watchRewardAd('Refill +20 Energy!', () => { profile.energy += 20; saveProfile(); refreshLobbyUI(); }));
                document.getElementById('btnOpenCal').addEventListener('click', openCalendar);
                document.getElementById('btnOpenWorld').addEventListener('click', () => { renderWorldLeaderboard(); document.getElementById('worldModal').classList.add('open'); Sound.play('click'); });
                document.getElementById('btnOpenSpin').addEventListener('click', () => { drawSpinWheel(); document.getElementById('spinModal').classList.add('open'); Sound.play('click'); });
                document.getElementById('btnSpinFree').addEventListener('click', () => {
                  const now = Date.now();
                  if (now - profile.lastSpinMs < 14400000) { document.getElementById('spinResult').textContent = 'Free Spin already used! Try Extra Ad Spin 🎬'; Sound.play('click'); return; }
                  profile.lastSpinMs = now; saveProfile(); doSpin();
                });
                document.getElementById('btnSpinAd').addEventListener('click', () => watchRewardAd('Unlock Extra Lucky Wheel Spin!', () => doSpin()));

                document.getElementById('btnOpenGift').addEventListener('click', () => {
                  const now = Date.now();
                  if (now - profile.lastGiftMs < 43200000) { Sound.play('click'); return; }
                  profile.lastGiftMs = now; saveProfile();
                  openRewardPopup('🎁', 'DAILY GIFT OPENED!', 400, 5, null);
                });
                document.getElementById('btnReadyChest').addEventListener('click', () => {
                  const now = Date.now();
                  if (now - profile.lastChestMs < 10800000) { Sound.play('click'); return; }
                  profile.lastChestMs = now; saveProfile();
                  openRewardPopup('🧰', 'TREASURE CHEST!', 250, 0, 'x5');
                });

                document.getElementById('btnAdGold').addEventListener('click', () => watchRewardAd('Earn +300 Free Gold Coins!', () => { profile.coins += 300; saveProfile(); refreshLobbyUI(); }));
                document.getElementById('btnShopWatchAd').addEventListener('click', () => watchRewardAd('Earn +300 Free Gold Coins!', () => { profile.coins += 300; saveProfile(); renderShop(); }));
                document.getElementById('btnAd10k').addEventListener('click', () => watchRewardAd('Start Battle with +10,000 Score!', () => { Sound.init(); startMatch(10000); }));

                document.getElementById('btnPayCancel').addEventListener('click', () => { pendingPack = null; document.getElementById('payModal').classList.remove('open'); Sound.play('click'); });
                document.getElementById('btnPayConfirm').addEventListener('click', () => {
                  if (!pendingPack) return;
                  profile.coins += pendingPack.coins; profile.diamonds += pendingPack.dias;
                  if (pendingPack.potions > 0) ['magnet','x5','speed','zoom','radar'].forEach(k => profile.potions[k] = (profile.potions[k] || 0) + pendingPack.potions);
                  pendingPack = null; document.getElementById('payModal').classList.remove('open');
                  saveProfile(); Sound.play('buy'); renderShop(); syncQuickPotions();
                });

                document.getElementById('btnRevSkip').addEventListener('click', () => { clearInterval(reviveIv); document.getElementById('reviveModal').classList.remove('open'); finishMatch('Defeated in Arena'); });
                document.getElementById('btnRevWatch').addEventListener('click', () => { clearInterval(reviveIv); document.getElementById('reviveModal').classList.remove('open'); watchRewardAd('Revive with Full Score & Shield!', () => revivePlayer()); });

                document.querySelectorAll('.ws-ico-tab').forEach(b => b.addEventListener('click', () => { wsTab = b.dataset.wst; document.querySelectorAll('.ws-ico-tab').forEach(x => x.classList.toggle('active', x === b)); renderWorkshop(); Sound.play('click'); }));
                document.querySelectorAll('[data-wlm]').forEach(b => b.addEventListener('click', () => { wlMode = b.dataset.wlm; renderWorldLeaderboard(); Sound.play('click'); }));
                document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => { document.getElementById(b.dataset.close).classList.remove('open'); Sound.play('click'); }));

                document.getElementById('hudAudioBtn').addEventListener('click', () => { profile.settings.muted = !profile.settings.muted; saveProfile(); Sound.updateVol(); refreshLobbyUI(); Sound.play('click'); });
                document.getElementById('hudExitBtn').addEventListener('click', () => { Sound.play('click'); enterLobby(); });
                document.getElementById('hudExprBtn').addEventListener('click', () => { if (!player || !player.alive) return; const ex = EXPRESSIONS.find(e => e.id === profile.expr) || EXPRESSIONS[0]; player.say(ex.text); Sound.play('click'); });

                document.querySelectorAll('[data-qp]').forEach(btn => btn.addEventListener('click', () => {
                  const id = btn.dataset.qp;
                  if (!player || !player.alive || (profile.potions[id] || 0) <= 0) { Sound.play('over'); return; }
                  const po = POTIONS.find(p => p.id === id); if (!po) return;
                  profile.potions[id]--; buffs[id] = po.dur;
                  saveProfile(); syncQuickPotions(); Sound.play('potion'); vibrate(25);
                  floatTexts.push({ x: player.x, y: player.y - 24, text: `${po.icon} ${po.name}!`, color: po.col, life: 1.2, maxLife: 1.2, big: true });
                }));

                document.getElementById('btnResLobby').addEventListener('click', () => { Sound.play('click'); enterLobby(); });
                document.getElementById('btnResAgain').addEventListener('click', () => { Sound.play('click'); startMatch(0); });

                const joyEl = document.getElementById('floatingJoy'), joyKnob = document.getElementById('floatingJoyKnob');
                function updateJoy(x, y) {
                  const dx = x - ctrl.joyOx, dy = y - ctrl.joyOy, d = Math.hypot(dx, dy);
                  ctrl.joyMag = d; ctrl.joyAngle = Math.atan2(dy, dx);
                  const cl = Math.min(d, 36);
                  joyKnob.style.transform = `translate(calc(-50% + ${Math.cos(ctrl.joyAngle) * cl}px), calc(-50% + ${Math.sin(ctrl.joyAngle) * cl}px))`;
                }

                canvas.addEventListener('touchstart', e => {
                  if (screenState !== 'playing') return;
                  e.preventDefault();
                  for (const t of e.changedTouches) {
                    if (ctrl.joyTouchId === null) {
                      ctrl.joyTouchId = t.identifier; ctrl.joyActive = true;
                      if (profile.settings.joy === 'fixed') { ctrl.joyOx = 146; ctrl.joyOy = appH - 76; }
                      else { ctrl.joyOx = t.clientX; ctrl.joyOy = t.clientY; joyEl.style.left = `${t.clientX}px`; joyEl.style.top = `${t.clientY}px`; }
                      joyEl.classList.add('visible'); updateJoy(t.clientX, t.clientY);
                    }
                  }
                }, { passive: false });
                canvas.addEventListener('touchmove', e => {
                  if (screenState !== 'playing') return;
                  e.preventDefault();
                  for (const t of e.changedTouches) if (t.identifier === ctrl.joyTouchId) updateJoy(t.clientX, t.clientY);
                }, { passive: false });
                const stopJoy = e => {
                  for (const t of e.changedTouches) {
                    if (t.identifier === ctrl.joyTouchId) {
                      ctrl.joyTouchId = null; ctrl.joyActive = false; ctrl.joyMag = 0;
                      joyEl.classList.remove('visible'); joyKnob.style.transform = 'translate(-50%,-50%)';
                    }
                  }
                };
                canvas.addEventListener('touchend', stopJoy);
                canvas.addEventListener('touchcancel', stopJoy);

                canvas.addEventListener('mousedown', e => { if (screenState !== 'playing') return; ctrl.joyMouse = true; ctrl.joyActive = true; ctrl.joyOx = appW / 2; ctrl.joyOy = appH / 2; updateJoy(e.clientX, e.clientY); });
                window.addEventListener('mousemove', e => { if (ctrl.joyMouse && screenState === 'playing') updateJoy(e.clientX, e.clientY); });
                window.addEventListener('mouseup', () => { ctrl.joyMouse = false; ctrl.joyActive = false; ctrl.joyMag = 0; });

                const btnBoost = document.getElementById('btnBoost');
                const setBoost = on => { ctrl.boostHeld = on; btnBoost.classList.toggle('active', on); };
                btnBoost.addEventListener('touchstart', e => { e.preventDefault(); setBoost(true); }, { passive: false });
                btnBoost.addEventListener('touchend', () => setBoost(false));
                btnBoost.addEventListener('mousedown', () => setBoost(true));
                window.addEventListener('mouseup', () => setBoost(false));

                window.addEventListener('keydown', e => {
                  if (e.code === 'KeyW' || e.code === 'ArrowUp') ctrl.keys.up = true;
                  if (e.code === 'KeyS' || e.code === 'ArrowDown') ctrl.keys.down = true;
                  if (e.code === 'KeyA' || e.code === 'ArrowLeft') ctrl.keys.left = true;
                  if (e.code === 'KeyD' || e.code === 'ArrowRight') ctrl.keys.right = true;
                  if (e.code === 'Space') ctrl.keys.boost = true;
                });
                window.addEventListener('keyup', e => {
                  if (e.code === 'KeyW' || e.code === 'ArrowUp') ctrl.keys.up = false;
                  if (e.code === 'KeyS' || e.code === 'ArrowDown') ctrl.keys.down = false;
                  if (e.code === 'KeyA' || e.code === 'ArrowLeft') ctrl.keys.left = false;
                  if (e.code === 'KeyD' || e.code === 'ArrowRight') ctrl.keys.right = false;
                  if (e.code === 'Space') ctrl.keys.boost = false;
                });

                window.addEventListener('resize', resizeCanvas);
                resizeCanvas();
                buildFloorPattern(profile.floor);
                spawnLobbyWorm();
                runIntroAnimation();
                requestAnimationFrame(mainLoop);
              })();
            </script>
          </body>
          </html>
          GAMEHTML

      - name: Setup Release Signing Keystore
        env:
          SERPENT_KEYSTORE_B64: ${{ secrets.SERPENT_KEYSTORE_B64 }}
          SERPENT_STORE_PASS: ${{ secrets.SERPENT_STORE_PASS }}
          SERPENT_KEY_ALIAS: ${{ secrets.SERPENT_KEY_ALIAS }}
          SERPENT_KEY_PASS: ${{ secrets.SERPENT_KEY_PASS }}
        run: |
          STORE_PASS="${SERPENT_STORE_PASS:-Serpent@2026}"
          KEY_ALIAS="${SERPENT_KEY_ALIAS:-serpentkey}"
          KEY_PASS="${SERPENT_KEY_PASS:-Serpent@2026}"
          if [ -n "$SERPENT_KEYSTORE_B64" ]; then
            echo "$SERPENT_KEYSTORE_B64" | base64 -d > app/serpent-release.jks
          else
            keytool -genkeypair -v \
              -keystore app/serpent-release.jks \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=Apex Wild Studios, OU=Games, O=SerpentWild, L=India, S=IN, C=IN"
          fi

      - name: Build Signed Release APK & AAB
        env:
          SERPENT_STORE_PASS: ${{ secrets.SERPENT_STORE_PASS }}
          SERPENT_KEY_ALIAS: ${{ secrets.SERPENT_KEY_ALIAS }}
          SERPENT_KEY_PASS: ${{ secrets.SERPENT_KEY_PASS }}
        run: gradle assembleRelease bundleRelease

      - name: Upload Serpent-Wild v24 Ultimate APK & AAB
        uses: actions/upload-artifact@v4
        with:
          name: Serpent-Wild-v24-Ultimate-APK
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
