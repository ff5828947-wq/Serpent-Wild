                filter: drop-shadow(0 4px 8px rgba(0,0,0,0.55));
              }
              .intro-bar { position: relative; z-index: 2; width: 250px; height: 10px; border-radius: 999px; background: rgba(0,0,0,0.4); border: 2px solid #ffd23f; overflow: hidden; }
              #introFill { width: 0%; height: 100%; background: linear-gradient(90deg, #7cff3b, #ffd23f); transition: width 0.12s linear; }

              #lobbyScreen { position: fixed; inset: 0; z-index: 30; display: none; pointer-events: none; }
              #lobbyTopBar {
                position: absolute; top: 8px; left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right));
                display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
              }
              .top-left-grp, .top-right-grp { pointer-events: auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
              .prof-card { display: flex; align-items: center; gap: 8px; padding: 5px 10px 5px 6px; border-radius: 14px; cursor: pointer; }
              .lvl-badge {
                position: relative; overflow: hidden;
                width: 34px; height: 34px; border-radius: 10px;
                background: linear-gradient(180deg, #42c6ff, #0c4894);
                border: 2px solid #fff;
                display: flex; align-items: center; justify-content: center;
                font-size: 13px; font-weight: 900; color: #fff;
              }

              @keyframes lvlGlossSweep {
                0%        { transform: translateX(-160%) skewX(-24deg); }
                45%, 100% { transform: translateX(260%) skewX(-24deg); }
              }

              @keyframes lvlTop1Flow {
                0%   { background-position: 0% 50%; border-color: #fff8b8; }
                25%  { background-position: 50% 100%; border-color: #aef8ff; }
                50%  { background-position: 100% 50%; border-color: #a8ff78; }
                75%  { background-position: 50% 0%; border-color: #ff9ef2; }
                100% { background-position: 0% 50%; border-color: #fff8b8; }
              }
              @keyframes lvlTop1Aura {
                0%, 100% {
                  transform: scale(1);
                  box-shadow:
                    0 0 10px rgba(255, 226, 89, 0.98),
                    0 0 20px rgba(89, 244, 255, 0.85),
                    0 0 32px rgba(255, 79, 216, 0.55),
                    inset 0 2px 3px rgba(255, 255, 255, 0.96),
                    inset 0 -3px 6px rgba(10, 18, 45, 0.35);
                }
                33% {
                  transform: scale(1.06);
                  box-shadow:
                    0 0 12px rgba(105, 255, 122, 0.98),
                    0 0 24px rgba(255, 210, 63, 0.88),
                    0 0 36px rgba(89, 244, 255, 0.6),
                    inset 0 2px 3px rgba(255, 255, 255, 0.98),
                    inset 0 -3px 6px rgba(10, 18, 45, 0.35);
                }
                66% {
                  transform: scale(1.03);
                  box-shadow:
                    0 0 12px rgba(255, 94, 214, 0.98),
                    0 0 24px rgba(155, 92, 255, 0.88),
                    0 0 34px rgba(255, 196, 61, 0.58),
                    inset 0 2px 3px rgba(255, 255, 255, 0.98),
                    inset 0 -3px 6px rgba(10, 18, 45, 0.35);
                }
              }

              @keyframes lvlTop2Flow {
                0%   { background-position: 0% 50%; border-color: #d6fcff; }
                50%  { background-position: 100% 50%; border-color: #c4a6ff; }
                100% { background-position: 0% 50%; border-color: #d6fcff; }
              }
              @keyframes lvlTop2Aura {
                0%, 100% {
                  box-shadow:
                    0 0 7px rgba(89, 244, 255, 0.85),
                    0 0 15px rgba(120, 110, 255, 0.55),
                    inset 0 1.5px 2px rgba(255, 255, 255, 0.82),
                    inset 0 -2px 5px rgba(8, 22, 54, 0.32);
                }
                50% {
                  box-shadow:
                    0 0 11px rgba(150, 248, 255, 0.95),
                    0 0 21px rgba(164, 110, 255, 0.7),
                    inset 0 1.5px 2px rgba(255, 255, 255, 0.9),
                    inset 0 -2px 5px rgba(8, 22, 54, 0.32);
                }
              }

              @keyframes lvlTop3Flow {
                0%   { background-position: 0% 50%; border-color: #ffd0c2; }
                50%  { background-position: 100% 50%; border-color: #ffe28a; }
                100% { background-position: 0% 50%; border-color: #ffd0c2; }
              }
              @keyframes lvlTop3Aura {
                0%, 100% {
                  box-shadow:
                    0 0 6px rgba(255, 86, 86, 0.72),
                    0 0 11px rgba(255, 152, 48, 0.42),
                    inset 0 1px 2px rgba(255, 255, 255, 0.68);
                }
                50% {
                  box-shadow:
                    0 0 9px rgba(255, 120, 72, 0.85),
                    0 0 15px rgba(255, 198, 72, 0.52),
                    inset 0 1px 2px rgba(255, 255, 255, 0.78);
                }
              }

              .prof-rank-1 .lvl-badge {
                font-size: 14px;
                text-shadow: 0 1px 3px rgba(0, 0, 0, 0.78), 0 0 8px rgba(255, 255, 255, 0.75);
                background: linear-gradient(135deg, #ff5ee0, #ffe259, #69ff7a, #4de8ff, #9b6bff, #ff5ee0);
                background-size: 340% 340%;
                animation: lvlTop1Flow 2.8s linear infinite, lvlTop1Aura 2.8s ease-in-out infinite;
              }
              .prof-rank-1 .lvl-badge::before {
                content: ''; position: absolute; left: 3px; right: 3px; top: 2px; height: 48%;
                border-radius: 7px 7px 14px 14px;
                background: linear-gradient(180deg, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.1));
                pointer-events: none;
              }
              .prof-rank-1 .lvl-badge::after {
                content: ''; position: absolute; top: -30%; left: 0; width: 48%; height: 160%;
                background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.92), transparent);
                animation: lvlGlossSweep 2.0s ease-in-out infinite;
                pointer-events: none;
              }

              .prof-rank-2 .lvl-badge {
                text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7), 0 0 5px rgba(174, 248, 255, 0.6);
                background: linear-gradient(135deg, #aef8ff, #2ec6ff, #8a5cff, #4de8ff, #aef8ff);
                background-size: 280% 280%;
                animation: lvlTop2Flow 3.4s linear infinite, lvlTop2Aura 3.0s ease-in-out infinite;
              }
              .prof-rank-2 .lvl-badge::before {
                content: ''; position: absolute; left: 3px; right: 3px; top: 2px; height: 44%;
                border-radius: 7px 7px 12px 12px;
                background: linear-gradient(180deg, rgba(255, 255, 255, 0.58), rgba(255, 255, 255, 0.05));
                pointer-events: none;
              }
              .prof-rank-2 .lvl-badge::after {
                content: ''; position: absolute; top: -30%; left: 0; width: 40%; height: 160%;
                background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.68), transparent);
                animation: lvlGlossSweep 2.9s ease-in-out infinite;
                pointer-events: none;
              }

              .prof-rank-3 .lvl-badge {
                text-shadow: 0 1px 2px rgba(0, 0, 0, 0.72);
                background: linear-gradient(135deg, #ff3855, #ff7e29, #ffd25c, #ff3855);
                background-size: 240% 240%;
                animation: lvlTop3Flow 4.0s linear infinite, lvlTop3Aura 3.4s ease-in-out infinite;
              }
              .prof-rank-3 .lvl-badge::before {
                content: ''; position: absolute; left: 3px; right: 3px; top: 2px; height: 40%;
                border-radius: 7px 7px 10px 10px;
                background: linear-gradient(180deg, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0.03));
                pointer-events: none;
              }
              .prof-rank-3 .lvl-badge::after {
                content: ''; position: absolute; top: -30%; left: 0; width: 34%; height: 160%;
                background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.48), transparent);
                animation: lvlGlossSweep 3.8s ease-in-out infinite;
                pointer-events: none;
              }

