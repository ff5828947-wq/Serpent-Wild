                    c.fillStyle = rg; c.strokeStyle = '#403022'; c.lineWidth = 1.4; c.beginPath(); c.ellipse(0, 0, 18.5, 12.8, 0, 0, Math.PI * 2); c.fill(); c.stroke();
                    for (const s of [-1, 1]) { c.fillStyle = '#bfa68e'; c.beginPath(); c.ellipse(-2, s * (11.5 + wig * 0.3), 12.5, 4.2, s * 0.35, 0, Math.PI * 2); c.fill(); c.fillStyle = '#f2b8c6'; c.beginPath(); c.ellipse(-2, s * (11.5 + wig * 0.3), 8.2, 2.1, s * 0.35, 0, Math.PI * 2); c.fill(); }
                    c.fillStyle = '#ff859b'; c.beginPath(); c.arc(17.5, 0, 3.2, 0, Math.PI * 2); c.fill();
                    c.fillStyle = '#111'; c.beginPath(); c.arc(11, -5.5, 2.3, 0, Math.PI * 2); c.arc(11, 5.5, 2.3, 0, Math.PI * 2); c.fill();
