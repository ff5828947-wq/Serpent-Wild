                  canvas.width = Math.max(1, Math.floor(appW * dpr));
                  canvas.height = Math.max(1, Math.floor(appH * dpr));
                  rainDrops = Array.from({ length: 42 }, () => ({ x: rand(0, appW), y: rand(0, appH), l: rand(12, 22), v: rand(420, 600) }));
                  fireflies = Array.from({ length: 22 }, () => ({ x: rand(0, appW), y: rand(0, appH), ph: rand(0, 6.28), vx: rand(-14, 14), vy: rand(-14, 14) }));
                }

                const snakeGrid = new Map(), preyGrid = new Map();
                const cellKey = (cx, cy) => ((cx & 0xFFFF) << 16) | (cy & 0xFFFF);

                function rebuildGrids() {
                  snakeGrid.clear();
                  for (const s of snakes) {
                    if (!s.alive) continue;
                    const step = Math.max(1, Math.floor(s.segments.length / 8));
                    const seen = new Set();
                    for (let i = 0; i < s.segments.length; i += step) {
                      const k = cellKey(Math.floor(s.segments[i].x / CELL_SIZE), Math.floor(s.segments[i].y / CELL_SIZE));
                      if (seen.has(k)) continue;
                      seen.add(k);
                      let arr = snakeGrid.get(k); if (!arr) { arr = []; snakeGrid.set(k, arr); }
                      arr.push(s);
                    }
                  }
                  preyGrid.clear();
                  for (let i = 0; i < preyList.length; i++) {
                    const p = preyList[i];
                    const k = cellKey(Math.floor(p.x / CELL_SIZE), Math.floor(p.y / CELL_SIZE));
                    let arr = preyGrid.get(k); if (!arr) { arr = []; preyGrid.set(k, arr); }
                    arr.push(i);
                  }
                }

                function queryGrid(grid, x, y, r) {
                  const x0 = Math.floor((x - r) / CELL_SIZE), x1 = Math.floor((x + r) / CELL_SIZE);
                  const y0 = Math.floor((y - r) / CELL_SIZE), y1 = Math.floor((y + r) / CELL_SIZE);
                  const out = [];
                  for (let cx = x0; cx <= x1; cx++) for (let cy = y0; cy <= y1; cy++) {
                    const arr = grid.get(cellKey(cx, cy));
                    if (arr) for (let i = 0; i < arr.length; i++) out.push(arr[i]);
                  }
                  return out;
                }

                function isNearCam(x, y, pad = 720) {
                  const cx = camera.x + camera.lookX, cy = camera.y + camera.lookY;
                  return Math.abs(x - cx) < (appW / camera.zoom) * 0.6 + pad && Math.abs(y - cy) < (appH / camera.zoom) * 0.6 + pad;
                }

                function generateWorld(biomeId) {
                  const biome = BIOMES.find(b => b.id === biomeId) || BIOMES[0];
                  const tile = document.createElement('canvas');
                  tile.width = 512; tile.height = 512;
                  const t = tile.getContext('2d');
                  t.fillStyle = biome.floor; t.fillRect(0, 0, 512, 512);
                  for (let i = 0; i < 95; i++) {
                    const x = rand(0, 512), y = rand(0, 512), r = rand(24, 90);
                    const col = Math.random() < 0.55 ? biome.moss : biome.soil;
                    const g = t.createRadialGradient(x, y, 2, x, y, r);
                    g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
                    t.fillStyle = g; t.beginPath(); t.arc(x, y, r, 0, Math.PI * 2); t.fill();
                  }
                  for (let i = 0; i < 420; i++) {
                    t.fillStyle = Math.random() < 0.5 ? 'rgba(0,0,0,0.18)' : 'rgba(180,190,140,0.08)';
                    t.fillRect(rand(0, 512), rand(0, 512), rand(1.2, 2.6), rand(1.2, 2.6));
                  }
                  for (let i = 0; i < 55; i++) {
                    const gx = rand(0, 512), gy = rand(0, 512);
                    t.strokeStyle = 'rgba(72, 130, 44, 0.32)'; t.lineWidth = 1.2;
                    for (let b = -1; b <= 1; b++) {
                      t.beginPath(); t.moveTo(gx, gy); t.quadraticCurveTo(gx + b * 4, gy - 6, gx + b * 7, gy - 10); t.stroke();
                    }
                  }
                  for (let i = 0; i < 40; i++) {
                    t.save(); t.translate(rand(0, 512), rand(0, 512)); t.rotate(rand(0, 6.28));
                    t.fillStyle = Math.random() < 0.5 ? 'rgba(138,98,42,0.36)' : 'rgba(64,116,38,0.34)';
                    t.beginPath(); t.ellipse(0, 0, rand(5, 10), rand(2, 3.8), 0, 0, Math.PI * 2); t.fill();
                    t.restore();
                  }
                  groundPattern = ctx.createPattern(tile, 'repeat');

                  waterZones = []; lilyPads = []; mudZones = []; worldProps = []; trees = []; tracks = []; ripples = [];
                  const addRiver = (sx, sy, ang, steps, baseR) => {
                    let rx = sx, ry = sy, a = ang;
                    for (let s = 0; s < steps; s++) {
                      const rad = baseR + rand(-25, 35);
                      if (dist(rx, ry, WORLD_CENTER, WORLD_CENTER) < ARENA_RADIUS - 320) {
                        waterZones.push({ x: rx, y: ry, r: rad });
                        if (Math.random() < 0.7) {
                          for (let l = 0; l < 3; l++) {
                            const la = rand(0, 6.28), ld = rand(18, rad * 0.65);
                            lilyPads.push({ x: rx + Math.cos(la) * ld, y: ry + Math.sin(la) * ld, r: rand(12, 22), rot: rand(0, 6.28), lotus: Math.random() < 0.42 });
                          }
                        }
                      }
                      a += rand(-0.35, 0.35); rx += Math.cos(a) * rad * 1.1; ry += Math.sin(a) * rad * 1.1;
                    }
                  };
                  addRiver(1800, 4400, 0.42, 20, 180);
                  addRiver(6200, 8600, -1.25, 15, 160);
                  addRiver(8800, 8800, -2.3, 14, 155);

                  for (let i = 0; i < 36; i++) {
                    const pt = i < 12 ? randInCircle(8600, 3500, 1500, 140) : randInCircle(WORLD_CENTER, WORLD_CENTER, ARENA_RADIUS, 400);
                    const rad = rand(130, 225);
                    if (!waterZones.some(w => distSq(pt.x, pt.y, w.x, w.y) < (w.r + rad) ** 2)) mudZones.push({ x: pt.x, y: pt.y, r: rad });
                  }

                  for (let i = 0; i < 220; i++) {
                    const pt = randInCircle(WORLD_CENTER, WORLD_CENTER, ARENA_RADIUS, 260);
                    if (waterZones.some(w => distSq(pt.x, pt.y, w.x, w.y) < (w.r + 65) ** 2)) continue;
                    const nearRuins = dist(pt.x, pt.y, 3400, 3400) < 1700;
                    const r = Math.random();
                    const kind = (nearRuins && r < 0.55) ? 'ruin' : (r < 0.28 ? 'log' : r < 0.56 ? 'rock' : r < 0.68 ? 'ruin' : 'fern');
                    worldProps.push({ x: pt.x, y: pt.y, kind, sz: rand(26, 52), rot: rand(0, 6.28) });
                  }

                  for (let i = 0; i < 90; i++) {
                    const pt = randInCircle(WORLD_CENTER, WORLD_CENTER, ARENA_RADIUS, 340);
                    if (waterZones.some(w => distSq(pt.x, pt.y, w.x, w.y) < (w.r + 95) ** 2)) continue;
                    trees.push({ x: pt.x, y: pt.y, r: rand(88, 138), ph: rand(0, 6.28) });
                  }
                }

                function getRegionAt(x, y) {
                  let best = REGIONS[0], bd = Infinity;
                  for (const r of REGIONS) { const d = dist(x, y, r.x, r.y); if (d < bd) { bd = d; best = r; } }
                  return best;
                }

                function getTerrainAt(x, y) {
                  for (const w of waterZones) if (distSq(x, y, w.x, w.y) < w.r * w.r) return 'water';
                  for (const m of mudZones) if (distSq(x, y, m.x, m.y) < m.r * m.r) return 'mud';
                  return 'ground';
                }

                function isUnderTree(x, y) {
                  for (const tr of trees) if (distSq(x, y, tr.x, tr.y) < (tr.r * 0.78) ** 2) return true;
                  return false;
                }

                function spawnParticles(x, y, color, count = 6, spd = 90) {
                  if (particles.length > 160) return;
                  for (let i = 0; i < count; i++) {
                    const a = rand(0, Math.PI * 2), v = rand(spd * 0.3, spd);
                    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.25, 0.55), maxLife: 0.55, size: rand(2.5, 5.5), color });
                  }
                }

                function pushKillFeed(text) {
                  const feed = document.getElementById('killFeed');
                  if (!feed) return;
                  const div = document.createElement('div');
                  div.className = 'kf-entry';
                  div.textContent = text;
                  feed.prepend(div);
                  while (feed.children.length > 4) feed.lastChild.remove();
                  setTimeout(() => div.remove(), 4200);
                }

                function drawPrey(c, p) {
                  c.save();
                  c.translate(p.x, p.y);
                  c.rotate(p.angle);
                  c.fillStyle = 'rgba(0,0,0,0.36)';
                  c.beginPath(); c.ellipse(2, 5, p.r * 0.9, p.r * 0.65, 0, 0, Math.PI * 2); c.fill();

                  if (p.id === 'frog') {
                    c.fillStyle = '#2d7a1d';
                    for (const s of [-1, 1]) { c.beginPath(); c.ellipse(-7, s * 8, 7, 3.5, s * 0.4, 0, Math.PI * 2); c.fill(); }
                    c.fillStyle = '#5ce63a'; c.beginPath(); c.ellipse(0, 0, 12, 9.5, 0, 0, Math.PI * 2); c.fill();
                    c.fillStyle = '#ffe552'; c.beginPath(); c.arc(7, -4.5, 3, 0, Math.PI * 2); c.arc(7, 4.5, 3, 0, Math.PI * 2); c.fill();
                    c.fillStyle = '#111'; c.beginPath(); c.arc(8, -4.5, 1.4, 0, Math.PI * 2); c.arc(8, 4.5, 1.4, 0, Math.PI * 2); c.fill();
                  } else if (p.id === 'mouse') {
                    c.strokeStyle = '#d99898'; c.lineWidth = 2; c.beginPath(); c.moveTo(-10, 0); c.lineTo(-22, Math.sin(globalTime * 10 + p.x) * 4); c.stroke();
                    c.fillStyle = '#a89684'; c.beginPath(); c.ellipse(0, 0, 11, 7.5, 0, 0, Math.PI * 2); c.fill();
                    c.fillStyle = '#e3a8a8'; c.beginPath(); c.arc(5, -6, 3.2, 0, Math.PI * 2); c.arc(5, 6, 3.2, 0, Math.PI * 2); c.fill();
                    c.fillStyle = '#ff8a98'; c.beginPath(); c.arc(11.5, 0, 2, 0, Math.PI * 2); c.fill();
                  } else if (p.id === 'gecko') {
                    c.strokeStyle = '#6ec736'; c.lineWidth = 4; c.lineCap = 'round';
                    c.beginPath(); c.moveTo(-8, 0); c.lineTo(-21, Math.sin(globalTime * 12 + p.y) * 5); c.stroke();
                    c.fillStyle = '#85db42'; c.beginPath(); c.ellipse(0, 0, 11, 5, 0, 0, Math.PI * 2); c.fill();
                    c.fillStyle = '#111'; c.beginPath(); c.arc(8, -2.5, 1.5, 0, Math.PI * 2); c.arc(8, 2.5, 1.5, 0, Math.PI * 2); c.fill();
                  } else if (p.id === 'crab') {
                    c.fillStyle = '#f0552e';
                    c.beginPath(); c.ellipse(10, -7, 5, 3, 0.3, 0, Math.PI * 2); c.ellipse(10, 7, 5, 3, -0.3, 0, Math.PI * 2); c.fill();
                    c.fillStyle = '#de4523'; c.beginPath(); c.ellipse(0, 0, 9.5, 11.5, 0, 0, Math.PI * 2); c.fill();
                    c.fillStyle = '#111'; c.beginPath(); c.arc(7, -3.5, 1.6, 0, Math.PI * 2); c.arc(7, 3.5, 1.6, 0, Math.PI * 2); c.fill();
                  } else if (p.id === 'beetle') {
                    c.fillStyle = '#f2b824'; c.beginPath(); c.ellipse(0, 0, 10.5, 8, 0, 0, Math.PI * 2); c.fill();
                    c.strokeStyle = '#4a2c04'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(-10, 0); c.lineTo(6, 0); c.stroke();
                  } else {
                    c.fillStyle = '#246622'; c.beginPath(); c.arc(0, 0, 11, 0, Math.PI * 2); c.fill();
                    c.fillStyle = '#eb2f5e';
                    for (const [bx, by] of [[-4,-3],[4,-2],[0,4],[-4,4],[4,4]]) { c.beginPath(); c.arc(bx, by, 3.2, 0, Math.PI * 2); c.fill(); }
                  }
                  c.restore();
                }

                // -------------------- 24 UNIQUE REALISTIC SERPENTS (THICKER NATURAL TAIL) --------------------
                class Snake {
                  constructor({ name, species, x, y, isPlayer = false, mass = 30 }) {
                    this.name = name; this.species = species; this.isPlayer = isPlayer; this.alive = true;
                    this.x = x; this.y = y; this.angle = rand(0, Math.PI * 2); this.targetAngle = this.angle;
                    this.mass = mass; this.kills = 0; this.terrain = 'ground'; this.inBush = false;
                    this.spawnShield = isPlayer ? 3.5 : 1.5;
                    this.stamina = 100; this.boosting = false;
                    this.hoodFlare = species.hood ? 0.55 : 0; this.spitTimer = 0; this.jawOpen = 0;
                    this.venomCd = 0; this.venomMax = species.id === 'krait' ? 3.5 : 4.8;
                    this.camoCd = 0; this.camoMax = 11.0; this.camoTimer = 0; this.slowTimer = 0;
                    this.slitherPhase = rand(0, 6.28); this.tongueTimer = rand(0.6, 2.0); this.tongueExt = 0;
                    this.trackCd = 0; this.rippleCd = 0; this.trailCd = 0;
                    this.aiTimer = rand(0, 0.5); this.aiWander = this.angle; this.aiBoost = 0;
                    this.segments = [];
                    const cnt = this.getSegCount();
                    for (let i = 0; i < cnt; i++) this.segments.push({ x: x - Math.cos(this.angle) * i * 6.5, y: y - Math.sin(this.angle) * i * 6.5 });
                  }

                  getRadius() { return clamp(11.0 + Math.pow(this.mass, 0.43) * 1.38, 11.0, 29); }
                  getSegCount() { return Math.min(68, Math.floor(20 + this.mass * 0.5)); }
                  getLen() { return Math.floor(this.mass * 4.5); }
                  isCamo() { return this.camoTimer > 0 || this.inBush; }

                  // THICKER REALISTIC MUSCULAR TAIL (0.28 at end instead of thin 0.08 needle!)
                  getHalfWidth(i, len, baseR) {
                    const t = i / Math.max(1, len - 1);
                    let pw = t < 0.08 ? lerp(0.82, 0.98, t / 0.08)
                           : t < 0.62 ? (0.98 + Math.sin(((t - 0.08) / 0.54) * Math.PI) * 0.14)
                           : lerp(0.98, 0.28, Math.pow((t - 0.62) / 0.38, 1.05));
                    let hood = 1.0;
                    if (this.species.hood && this.hoodFlare > 0.04 && i >= 1 && i <= 8) {
                      hood = 1 + Math.sin(clamp((i - 0.5) / 7.5, 0, 1) * Math.PI) * 0.9 * this.hoodFlare;
                    }
                    return baseR * this.species.girth * pw * hood;
                  }

                  activateVenom() {
                    if (!this.alive || this.venomCd > 0) return;
                    this.venomCd = this.venomMax; this.spitTimer = 1.6; this.jawOpen = 1.0;
                    const r = this.getRadius();
                    const sx = this.x + Math.cos(this.angle) * (r * 1.5), sy = this.y + Math.sin(this.angle) * (r * 1.5);
                    const pCol = this.species.glow || '#7eff3b';
                    projectiles.push({
                      owner: this, x: sx, y: sy, vx: Math.cos(this.angle) * 680, vy: Math.sin(this.angle) * 680,
                      life: 0.85, r: 11, col: pCol, slowDur: this.species.id === 'cobra' ? 4.2 : 3.2
                    });
                    if (isNearCam(sx, sy, 500)) spawnParticles(sx, sy, pCol, 8, 120);
                    if (this.isPlayer) { Sound.venom(); vibrate(18); }
                  }

                  activateCamo() {
                    if (!this.alive || this.camoCd > 0) return;
                    this.camoCd = this.camoMax;
                    this.camoTimer = this.species.id === 'boa' ? 5.0 : 3.8;
                    if (isNearCam(this.x, this.y, 500)) spawnParticles(this.x, this.y, '#7be3cb', 10, 90);
                    if (this.isPlayer) Sound.camo();
                  }

                  updateAI(dt, near) {
                    this.aiTimer -= dt;
                    if (this.aiBoost > 0) this.aiBoost -= dt;
                    const dZone = dist(this.x, this.y, safeZone.cx, safeZone.cy);
                    if (safeZone.active && dZone > safeZone.r - 220) {
                      this.targetAngle = Math.atan2(safeZone.cy - this.y, safeZone.cx - this.x);
                      this.boosting = dZone > safeZone.r; return;
                    }
                    if (dist(this.x, this.y, WORLD_CENTER, WORLD_CENTER) > ARENA_RADIUS - 320) {
                      this.targetAngle = Math.atan2(WORLD_CENTER - this.y, WORLD_CENTER - this.x);
                      this.boosting = false; return;
                    }

                    const rivals = queryGrid(snakeGrid, this.x, this.y, 260);
                    let avX = 0, avY = 0, danger = false;
                    for (const o of rivals) {
                      if (o === this || !o.alive || o.isCamo()) continue;
                      const step = Math.max(1, Math.floor(o.segments.length / 10));
                      for (let k = 0; k < o.segments.length; k += step) {
                        const sg = o.segments[k];
                        const d2 = distSq(this.x, this.y, sg.x, sg.y);
                        if (d2 < 145 * 145) {
                          const d = Math.sqrt(d2) || 1;
                          avX += (this.x - sg.x) / d; avY += (this.y - sg.y) / d;
                          danger = true;
                        }
                      }
                      if (this.venomCd <= 0 && distSq(this.x, this.y, o.x, o.y) < 300 * 300) {
                        const toA = Math.atan2(o.y - this.y, o.x - this.x);
                        if (Math.abs(angleDiff(toA, this.angle)) < 0.28 && Math.random() < 0.04) this.activateVenom();
                      }
                    }
                    if (danger) {
                      this.targetAngle = Math.atan2(avY, avX);
                      this.boosting = this.stamina > 40;
                      return;
                    }

                    if (this.aiTimer <= 0) {
                      this.aiTimer = near ? rand(0.3, 0.6) : rand(0.7, 1.3);
                      this.aiWander += rand(-1.0, 1.0);
                      this.targetAngle = this.aiWander;
                      let bestX = null, bestY = null, bestD = 380 * 380;
                      for (const m of meatList) {
                        const d2 = distSq(this.x, this.y, m.x, m.y);
                        if (d2 < bestD) { bestD = d2; bestX = m.x; bestY = m.y; }
                      }
                      if (bestX === null) {
                        const pIdxs = queryGrid(preyGrid, this.x, this.y, 340);
                        for (const idx of pIdxs) {
                          const p = preyList[idx]; if (!p) continue;
                          const d2 = distSq(this.x, this.y, p.x, p.y);
                          if (d2 < bestD) { bestD = d2; bestX = p.x; bestY = p.y; }
                        }
                      }
                      if (bestX !== null) {
                        this.targetAngle = Math.atan2(bestY - this.y, bestX - this.x);
                        if (bestD < 160 * 160 && this.stamina > 55 && Math.random() < 0.25) this.aiBoost = 0.45;
                      }
                    }
                    this.boosting = this.aiBoost > 0 && this.stamina > 20;
                  }

                  update(dt) {
                    if (!this.alive) return;
                    if (this.spawnShield > 0) this.spawnShield = Math.max(0, this.spawnShield - dt);
                    if (this.jawOpen > 0) this.jawOpen = Math.max(0, this.jawOpen - dt * 3.2);
                    if (this.venomCd > 0) this.venomCd = Math.max(0, this.venomCd - dt);
                    if (this.camoCd > 0) this.camoCd = Math.max(0, this.camoCd - dt);
                    if (this.camoTimer > 0) this.camoTimer = Math.max(0, this.camoTimer - dt);
                    if (this.slowTimer > 0) this.slowTimer = Math.max(0, this.slowTimer - dt);
                    if (this.spitTimer > 0) this.spitTimer = Math.max(0, this.spitTimer - dt);

                    const near = this.isPlayer || isNearCam(this.x, this.y, 700);
                    if (!this.isPlayer) this.updateAI(dt, near);

                    this.terrain = getTerrainAt(this.x, this.y);
                    this.inBush = isUnderTree(this.x, this.y);
                    const canBoost = this.boosting && this.stamina > 5 && this.mass > 14 && this.slowTimer <= 0;
                    if (canBoost) { this.stamina = Math.max(0, this.stamina - dt * 26); this.mass = Math.max(14, this.mass - dt * 1.1); }
                    else this.stamina = Math.min(100, this.stamina + dt * 19);

                    let spd = 176 + this.species.speed * 0.3;
                    if (canBoost) spd *= 1.6;
                    if (this.terrain === 'water') spd *= (this.species.id === 'anaconda' || this.species.id === 'leviathan' ? 1.35 : 1.18);
                    else if (this.terrain === 'mud') spd *= 0.72;
                    if (this.slowTimer > 0) spd *= 0.55;

                    const turnRate = 4.4 + this.species.turn * 0.015;
                    this.angle += clamp(angleDiff(this.targetAngle, this.angle), -turnRate * dt, turnRate * dt);
                    this.slitherPhase += dt * (canBoost ? 14 : 9.2);
                    const sAng = this.angle + Math.sin(this.slitherPhase) * 0.09;
                    this.x += Math.cos(sAng) * spd * dt;
                    this.y += Math.sin(sAng) * spd * dt;

                    const r = this.getRadius();
                    const dC = dist(this.x, this.y, WORLD_CENTER, WORLD_CENTER);
                    if (dC + r > ARENA_RADIUS) { killSnake(this, null, 'Jungle Cliff'); return; }

                    if (safeZone.active && dist(this.x, this.y, safeZone.cx, safeZone.cy) > safeZone.r) {
                      this.mass -= (4.2 + (safeZone.stage - 1) * 1.8) * dt;
                      if (this.mass < 12) { killSnake(this, null, 'Storm Zone'); return; }
                    }

                    this.segments[0].x = this.x; this.segments[0].y = this.y;
                    const spc = r * 0.48;
                    for (let i = 1; i < this.segments.length; i++) {
                      const p = this.segments[i - 1], c = this.segments[i];
                      if (i === 1) {
                        const idealX = p.x - Math.cos(this.angle) * spc;
                        const idealY = p.y - Math.sin(this.angle) * spc;
                        c.x = lerp(c.x, idealX, clamp(dt * 12, 0, 0.55));
                        c.y = lerp(c.y, idealY, clamp(dt * 12, 0, 0.55));
                      }
                      const dx = c.x - p.x, dy = c.y - p.y, d = Math.hypot(dx, dy) || 0.001;
                      if (d > spc) { const rt = spc / d; c.x = p.x + dx * rt; c.y = p.y + dy * rt; }
                    }
                    const tLen = this.getSegCount();
                    while (this.segments.length < tLen) { const tl = this.segments[this.segments.length - 1]; this.segments.push({ x: tl.x, y: tl.y }); }
                    while (this.segments.length > tLen && this.segments.length > 14) this.segments.pop();

                    if (near) {
                      const wantHood = this.species.hood ? ((canBoost || this.spitTimer > 0) ? 1.0 : 0.48) : 0;
                      this.hoodFlare = lerp(this.hoodFlare, wantHood, dt * 6);
                      this.tongueTimer -= dt;
                      if (this.tongueTimer <= 0) {
                        const p = -this.tongueTimer / 0.4;
                        if (p < 1) this.tongueExt = Math.sin(p * Math.PI);
                        else { this.tongueExt = 0; this.tongueTimer = rand(1.0, 2.4); }
                      } else this.tongueExt = 0;

                      this.rippleCd -= dt;
                      if (this.terrain === 'water' && this.rippleCd <= 0 && ripples.length < 36) {
                        ripples.push({ x: this.x, y: this.y, r: r * 0.7, maxR: r * 3.0, life: 0.7, maxLife: 0.7 });
                        this.rippleCd = 0.18;
                      }
                      this.trackCd -= dt;
                      if (this.terrain === 'mud' && this.trackCd <= 0 && tracks.length < 70) {
                        tracks.push({ x: this.segments[3].x, y: this.segments[3].y, r: r * 0.85, ang: this.angle, life: 3.0, maxLife: 3.0 });
                        this.trackCd = 0.12;
                      }
                      this.trailCd -= dt;
                      if (canBoost && this.trailCd <= 0) {
                        spawnParticles(this.segments[Math.min(5, this.segments.length - 1)].x, this.segments[Math.min(5, this.segments.length - 1)].y, this.species.glow || this.species.accent, 2, 55);
                        this.trailCd = 0.08;
                      }
                    }
                  }

                  draw(c, showLabel = true) {
                    if (!this.alive || this.segments.length < 4) return;
                    const baseR = this.getRadius(), len = this.segments.length;
                    const detail = profile.settings.gfx !== 'low';
                    const ultra = profile.settings.gfx === 'ultra';

                    const pts = new Array(len);
                    for (let i = 0; i < len; i++) {
                      const seg = this.segments[i];
                      const prev = this.segments[Math.max(0, i - 1)], next = this.segments[Math.min(len - 1, i + 1)];
                      const ang = i === 0 ? Math.atan2(seg.y - this.segments[1].y, seg.x - this.segments[1].x) : Math.atan2(prev.y - next.y, prev.x - next.x);
                      const nx = -Math.sin(ang), ny = Math.cos(ang);
                      const mask = i < 3 ? 0 : Math.min(1, (i - 2) / 4) * (1 - (i / len) * 0.2);
                      const wave = Math.sin(this.slitherPhase - i * 0.42) * (baseR * 0.18 * mask);
                      pts[i] = { x: seg.x + nx * wave, y: seg.y + ny * wave, ang, nx, ny, w: this.getHalfWidth(i, len, baseR) };
                    }

                    // Smooth Rounded Muscular Tail Tip (NOT a needle!)
                    const traceBody = (ox = 0, oy = 0, sw = 1) => {
                      c.beginPath();
                      const p0 = pts[0];
                      c.moveTo(p0.x + ox + p0.nx * p0.w * sw, p0.y + oy + p0.ny * p0.w * sw);
                      for (let i = 1; i < len - 1; i++) {
                        const a = pts[i], b = pts[i + 1];
                        const ax = a.x + a.nx * a.w * sw + ox, ay = a.y + a.ny * a.w * sw + oy;
                        const bx = b.x + b.nx * b.w * sw + ox, by = b.y + b.ny * b.w * sw + oy;
                        c.quadraticCurveTo(ax, ay, (ax + bx) * 0.5, (ay + by) * 0.5);
                      }
                      const tl = pts[len - 1];
                      const tx = tl.x - Math.cos(tl.ang) * tl.w * 1.15 + ox;
                      const ty = tl.y - Math.sin(tl.ang) * tl.w * 1.15 + oy;
                      c.quadraticCurveTo(tx + tl.nx * tl.w * 0.5, ty + tl.ny * tl.w * 0.5, tx, ty);
                      c.quadraticCurveTo(tx - tl.nx * tl.w * 0.5, ty - tl.ny * tl.w * 0.5, tl.x - tl.nx * tl.w * sw + ox, tl.y - tl.ny * tl.w * sw + oy);
                      for (let i = len - 2; i >= 1; i--) {
                        const a = pts[i], b = pts[i - 1];
                        const ax = a.x - a.nx * a.w * sw + ox, ay = a.y - a.ny * a.w * sw + oy;
                        const bx = b.x - b.nx * b.w * sw + ox, by = b.y - b.ny * b.w * sw + oy;
                        c.quadraticCurveTo(ax, ay, (ax + bx) * 0.5, (ay + by) * 0.5);
                      }
                      c.closePath();
                    };

                    const alpha = this.camoTimer > 0 ? (this.isPlayer ? 0.35 : 0.14) : (this.inBush ? (this.isPlayer ? 0.65 : 0.22) : 1);
                    c.save();
                    c.globalAlpha = alpha;

                    // GLOWING AURA (Stronger for Mythic/Legendary!)
                    if (this.species.glow && detail) {
                      c.save();
                      traceBody(0, 0, this.species.tier === 'Mythic' ? 1.24 : 1.15);
                      c.shadowColor = this.species.glow;
                      c.shadowBlur = this.species.tier === 'Mythic' ? 28 : 14;
                      c.strokeStyle = this.species.glow;
                      c.lineWidth = this.species.tier === 'Mythic' ? 4.5 : 3.0;
                      c.globalAlpha = alpha * (this.species.tier === 'Mythic' ? 0.62 : 0.42);
                      c.stroke();
                      c.restore();
                    }

                    // 1. Ground Drop Shadow
                    if (detail) {
                      traceBody(5, 8, 1.05);
                      c.fillStyle = 'rgba(0,0,0,0.42)';
                      c.fill();
                    }

                    // 2. Cylindrical 3D Body + 24 UNIQUE SPECIES PATTERNS
                    c.save();
                    traceBody(0, 0, 1.0);
                    c.fillStyle = this.species.dark;
                    c.fill();
                    c.clip();

                    traceBody(0, 0, 0.92);
                    c.fillStyle = this.species.mid;
                    c.fill();

                    traceBody(-1.2, -1.2, 0.78);
                    c.fillStyle = this.species.base;
                    c.fill();

                    const pat = this.species.pat;
                    const step = ultra ? 2 : 3;

                    for (let i = 2; i < len - 1; i++) {
                      const p = pts[i];
                      const doMark = (i % 3 === 0 || i % 4 === 0);
                      const doScale = detail && (i % step === 0) && p.w > 4.5;
                      if (!doMark && !doScale && !(this.species.hood && i === 4)) continue;

                      c.save();
                      c.translate(p.x, p.y);
                      c.rotate(p.ang);

                      if (pat === 'cobra' || pat === 'taipan' || pat === 'phoenix') {
                        if (i === 4 && this.hoodFlare > 0.25) {
                          c.strokeStyle = this.species.accent; c.lineWidth = Math.max(2, p.w * 0.12);
                          c.beginPath(); c.arc(0, -p.w * 0.4, p.w * 0.21, 0, Math.PI * 2); c.stroke();
                          c.beginPath(); c.arc(0, p.w * 0.4, p.w * 0.21, 0, Math.PI * 2); c.stroke();
                        } else if (i > 7 && i % 4 === 0) {
                          c.strokeStyle = this.species.accent; c.lineWidth = Math.max(1.8, p.w * 0.16);
                          if (pat === 'phoenix') {
                            c.fillStyle = this.species.accent;
                            c.beginPath(); c.moveTo(p.w * 0.4, 0); c.lineTo(-p.w * 0.3, -p.w * 0.65); c.lineTo(-p.w * 0.1, 0); c.lineTo(-p.w * 0.3, p.w * 0.65); c.closePath(); c.fill();
                          } else {
                            c.beginPath(); c.moveTo(-p.w * 0.12, -p.w * 0.98); c.quadraticCurveTo(p.w * 0.28, 0, -p.w * 0.12, p.w * 0.98); c.stroke();
                          }
                        }
                      } else if (pat === 'boa' && i % 4 === 0) {
                        c.fillStyle = this.species.accent;
                        c.beginPath(); c.moveTo(p.w * 0.32, 0); c.lineTo(0, -p.w * 0.76); c.lineTo(-p.w * 0.34, 0); c.lineTo(0, p.w * 0.76); c.closePath(); c.fill();
                      } else if (pat === 'viper' && i % 3 === 0) {
                        c.fillStyle = this.species.accent; c.strokeStyle = this.species.belly; c.lineWidth = 1.1;
                        c.beginPath(); c.moveTo(p.w * 0.56, 0); c.lineTo(0, -p.w * 0.58); c.lineTo(-p.w * 0.56, 0); c.lineTo(0, p.w * 0.58); c.closePath(); c.fill(); c.stroke();
                      } else if (pat === 'python' && i % 4 === 0) {
                        c.fillStyle = this.species.accent; c.strokeStyle = this.species.dark; c.lineWidth = 2.0;
                        c.beginPath(); c.moveTo(p.w * 0.65, 0); c.lineTo(0, -p.w * 0.54); c.lineTo(-p.w * 0.65, 0); c.lineTo(0, p.w * 0.54); c.closePath(); c.fill(); c.stroke();
                        c.fillStyle = this.species.belly; c.beginPath(); c.arc(0, -p.w * 0.74, p.w * 0.17, 0, Math.PI * 2); c.arc(0, p.w * 0.74, p.w * 0.17, 0, Math.PI * 2); c.fill();
                      } else if (pat === 'anaconda' && i % 3 === 0) {
                        const sgn = i % 6 === 0 ? -1 : 1;
                        c.fillStyle = this.species.accent;
                        c.beginPath(); c.ellipse(0, sgn * p.w * 0.28, p.w * 0.48, p.w * 0.34, sgn * 0.2, 0, Math.PI * 2); c.fill();
                        c.fillStyle = this.species.belly; c.beginPath(); c.arc(-p.w * 0.1, -sgn * p.w * 0.66, p.w * 0.18, 0, Math.PI * 2); c.fill();
                      } else if (pat === 'corn' && i % 4 === 0) {
                        c.fillStyle = '#9e2608'; c.strokeStyle = '#1f0802'; c.lineWidth = 1.5;
                        c.beginPath(); c.ellipse(0, 0, p.w * 0.42, p.w * 0.62, 0, 0, Math.PI * 2); c.fill(); c.stroke();
                      } else if (pat === 'krait' && i % 4 === 0) {
                        c.strokeStyle = this.species.dark; c.lineWidth = p.w * 0.72;
                        c.beginPath(); c.moveTo(-p.w * 0.15, -p.w * 1.1); c.quadraticCurveTo(p.w * 0.22, 0, -p.w * 0.15, p.w * 1.1); c.stroke();
                        c.strokeStyle = this.species.accent; c.lineWidth = p.w * 0.22;
                        c.beginPath(); c.moveTo(p.w * 0.36, -p.w * 1.1); c.quadraticCurveTo(p.w * 0.72, 0, p.w * 0.36, p.w * 1.1); c.stroke();
                      } else if (pat === 'albino' && i % 4 === 0) {
                        c.strokeStyle = '#e0b338'; c.lineWidth = p.w * 0.28;
                        c.beginPath(); c.arc(0, 0, p.w * 0.56, 0, Math.PI * 2); c.stroke();
                      } else if (pat === 'mamba' && i % 4 === 0) {
                        c.strokeStyle = 'rgba(170,185,205,0.28)'; c.lineWidth = 1.6;
                        c.beginPath(); c.moveTo(-p.w * 0.2, -p.w * 0.85); c.lineTo(p.w * 0.25, 0); c.lineTo(-p.w * 0.2, p.w * 0.85); c.stroke();
                      } else if (pat === 'coral' && i % 3 === 0) {
                        c.strokeStyle = this.species.accent; c.lineWidth = 2.2;
                        c.beginPath(); c.moveTo(-p.w * 0.3, -p.w * 0.95); c.bezierCurveTo(p.w * 0.3, -p.w * 0.3, -p.w * 0.3, p.w * 0.3, p.w * 0.3, p.w * 0.95); c.stroke();
                      } else if ((pat === 'obsidian' || pat === 'frost') && i % 3 === 0) {
                        // Jagged Crystal / Ice Shards along spine!
                        c.fillStyle = this.species.accent;
                        c.beginPath(); c.moveTo(p.w * 0.52, 0); c.lineTo(-p.w * 0.1, -p.w * 0.42); c.lineTo(-p.w * 0.5, 0); c.lineTo(-p.w * 0.1, p.w * 0.42); c.closePath(); c.fill();
                        c.strokeStyle = '#ffffff'; c.lineWidth = 0.8; c.stroke();
                      } else if (pat === 'bush' && i % 3 === 0) {
                        c.fillStyle = this.species.accent;
                        c.beginPath(); c.moveTo(p.w * 0.4, 0); c.lineTo(-p.w * 0.35, -p.w * 0.72); c.lineTo(-p.w * 0.15, 0); c.lineTo(-p.w * 0.35, p.w * 0.72); c.closePath(); c.fill();
                      } else if (pat === 'gaboon' && i % 4 === 0) {
                        // Bold Geometric Leaf-Camo Triangles
                        c.fillStyle = '#1f140d'; c.beginPath(); c.moveTo(0, -p.w * 0.85); c.lineTo(p.w * 0.5, 0); c.lineTo(0, p.w * 0.85); c.lineTo(-p.w * 0.5, 0); c.closePath(); c.fill();
                        c.fillStyle = this.species.accent; c.fillRect(-p.w * 0.16, -p.w * 0.42, p.w * 0.32, p.w * 0.84);
                      } else if (pat === 'titan' && i % 3 === 0) {
                        c.fillStyle = this.species.dark; c.strokeStyle = this.species.accent; c.lineWidth = 1.4;
                        c.beginPath(); c.moveTo(p.w * 0.45, 0); c.lineTo(0, -p.w * 0.74); c.lineTo(-p.w * 0.45, -p.w * 0.45); c.lineTo(-p.w * 0.45, p.w * 0.45); c.lineTo(0, p.w * 0.74); c.closePath(); c.fill(); c.stroke();
                      } else if (pat === 'plasma' && i % 3 === 0) {
                        // Cyber Hex Nodes + glowing side circuits
                        c.strokeStyle = '#00f7ff'; c.lineWidth = 1.6;
                        c.beginPath(); c.arc(0, 0, p.w * 0.42, 0, Math.PI * 2); c.stroke();
                        c.fillStyle = this.species.accent; c.beginPath(); c.arc(0, 0, p.w * 0.22, 0, Math.PI * 2); c.fill();
                      } else if (pat === 'basilisk' && i % 3 === 0) {
                        c.fillStyle = '#75ff9c';
                        c.beginPath(); c.moveTo(p.w * 0.5, 0); c.lineTo(-p.w * 0.3, -p.w * 0.35); c.lineTo(-p.w * 0.3, p.w * 0.35); c.closePath(); c.fill();
                      } else if (pat === 'd_thunder' && i % 3 === 0) {
                        // Jagged Electric Lightning Bolts
                        c.strokeStyle = '#ffea54'; c.lineWidth = 2.2;
                        c.beginPath(); c.moveTo(p.w * 0.5, -p.w * 0.5); c.lineTo(0, 0); c.lineTo(p.w * 0.25, p.w * 0.2); c.lineTo(-p.w * 0.45, p.w * 0.65); c.stroke();
                      } else if (pat === 'd_void' && i % 3 === 0) {
                        // Cosmic Starlight Runes
                        c.fillStyle = '#ffffff';
                        c.beginPath(); c.arc(0, 0, p.w * 0.22, 0, Math.PI * 2); c.fill();
                        c.strokeStyle = '#e08cff'; c.lineWidth = 1.4;
                        c.beginPath(); c.arc(0, 0, p.w * 0.52, 0, Math.PI * 2); c.stroke();
                      } else if (this.species.dragon && i % 3 === 0) {
                        c.fillStyle = this.species.accent;
                        c.beginPath(); c.moveTo(p.w * 0.48, 0); c.lineTo(-p.w * 0.25, -p.w * 0.34); c.lineTo(-p.w * 0.45, 0); c.lineTo(-p.w * 0.25, p.w * 0.34); c.closePath(); c.fill();
                      }

                      if (doScale) {
                        const sr = p.w * 0.36;
                        c.strokeStyle = 'rgba(0,0,0,0.3)'; c.lineWidth = 0.95;
                        c.beginPath(); c.arc(0, 0, sr, -1.25, 1.25); c.stroke();
                        c.beginPath(); c.arc(-sr * 0.5, -p.w * 0.52, sr * 0.85, -1.15, 1.15); c.stroke();
                        c.beginPath(); c.arc(-sr * 0.5, p.w * 0.52, sr * 0.85, -1.15, 1.15); c.stroke();
                      }
                      c.restore();
                    }

                    traceBody(-baseR * 0.14, -baseR * 0.14, pat === 'krait' ? 0.32 : 0.22);
                    c.fillStyle = pat === 'krait' ? 'rgba(255,255,255,0.32)' : 'rgba(255,255,240,0.16)';
                    c.fill();
                    c.restore();

                    if (this.species.rattle) {
                      const tl = pts[len - 1];
                      c.save(); c.translate(tl.x, tl.y); c.rotate(tl.ang + Math.sin(globalTime * 52) * 0.16);
                      for (let b = 0; b < 5; b++) {
                        c.fillStyle = b % 2 === 0 ? '#dec08e' : '#967442';
                        c.beginPath(); c.ellipse(-b * 4.2 - 4, 0, 3.8 - b * 0.35, 3.3 - b * 0.28, 0, 0, Math.PI * 2); c.fill();
                      }
                      c.restore();
                    }

                    // 3. PERFECTLY PROPORTIONED, NECK-ALIGNED REALISTIC HEAD!
                    const neckAng = pts[0].ang;
                    const headAng = neckAng + angleDiff(this.angle, neckAng) * 0.55;
                    const hr = baseR * this.species.girth * 1.04;

                    c.save();
                    c.translate(pts[0].x, pts[0].y);
                    c.rotate(headAng);

                    if (detail) {
                      c.fillStyle = 'rgba(0,0,0,0.34)';
                      c.beginPath(); c.ellipse(4, 6, hr * 1.25, hr * 0.9, 0, 0, Math.PI * 2); c.fill();
                    }

                    if (this.jawOpen > 0.12 || this.boosting) {
                      const openAmt = Math.max(this.jawOpen, this.boosting ? 0.28 : 0);
                      const ext = openAmt * hr * 0.45;
                      c.fillStyle = pat === 'mamba' ? '#12101a' : '#6e1620';
                      c.beginPath(); c.ellipse(hr * 0.95 + ext * 0.4, 0, hr * 0.45, hr * 0.4, 0, 0, Math.PI * 2); c.fill();
                      c.fillStyle = '#fffdf5';
                      for (const s of [-1, 1]) {
                        c.beginPath(); c.moveTo(hr * 1.08, s * hr * 0.26); c.lineTo(hr * 1.44 + ext, s * hr * 0.16); c.lineTo(hr * 1.06, s * hr * 0.1); c.closePath(); c.fill();
                      }
                    }

                    if (this.tongueExt > 0.05 && this.jawOpen < 0.2) {
                      const tl = hr * 1.1 + this.tongueExt * hr * 1.15;
                      c.strokeStyle = this.species.id === 'frost' ? '#70f3ff' : '#e82534'; c.lineWidth = 1.8; c.lineCap = 'round';
                      c.beginPath(); c.moveTo(hr * 0.95, 0); c.lineTo(tl, 0);
                      c.lineTo(tl + 6, -4.5); c.moveTo(tl, 0); c.lineTo(tl + 6, 4.5); c.stroke();
                    }

                    // SPECIES-UNIQUE HEAD CRESTS, HORNS, ANTLERS, FINS & CROWNS
                    if (pat === 'd_jade') {
                      c.strokeStyle = '#ffd84d'; c.lineWidth = 2.4; c.lineCap = 'round';
                      for (const s of [-1, 1]) {
                        c.beginPath(); c.moveTo(-hr * 0.2, s * hr * 0.55); c.lineTo(-hr * 1.25, s * hr * 1.15); c.moveTo(-hr * 0.75, s * hr * 0.85); c.lineTo(-hr * 1.05, s * hr * 1.38); c.stroke();
                        const ww = Math.sin(globalTime * 7) * hr * 0.14;
                        c.lineWidth = 1.6;
                        c.beginPath(); c.moveTo(hr * 0.9, s * hr * 0.34); c.quadraticCurveTo(hr * 0.48, s * hr * 1.15 + ww, -hr * 0.3, s * hr * 1.4 - ww); c.stroke();
                        c.lineWidth = 2.4;
                      }
                    } else if (pat === 'd_sea' || pat === 'plasma') {
                      c.fillStyle = pat === 'plasma' ? 'rgba(255, 71, 222, 0.5)' : 'rgba(69, 240, 255, 0.5)';
                      c.strokeStyle = this.species.accent; c.lineWidth = 1.4;
                      for (const s of [-1, 1]) {
                        c.beginPath(); c.moveTo(hr * 0.1, s * hr * 0.8); c.lineTo(-hr * 0.85, s * hr * 1.45); c.lineTo(-hr * 1.1, s * hr * 0.6); c.closePath(); c.fill(); c.stroke();
                      }
                    } else if (pat === 'basilisk') {
                      // 3-Point Royal Crown Crest
                      c.fillStyle = '#ffe45c';
                      c.beginPath(); c.moveTo(-hr * 0.3, -hr * 0.65); c.lineTo(-hr * 1.05, -hr * 0.95); c.lineTo(-hr * 0.6, -hr * 0.25);
                      c.lineTo(-hr * 1.2, 0); c.lineTo(-hr * 0.6, hr * 0.25); c.lineTo(-hr * 1.05, hr * 0.95); c.lineTo(-hr * 0.3, hr * 0.65); c.closePath(); c.fill();
                    } else if (this.species.dragon) {
                      c.fillStyle = this.species.dark; c.strokeStyle = this.species.accent; c.lineWidth = 1.4;
                      for (const s of [-1, 1]) {
                        c.beginPath(); c.moveTo(-hr * 0.15, s * hr * 0.6); c.quadraticCurveTo(-hr * 0.95, s * hr * 1.28, -hr * 1.55, s * hr * 1.08);
                        c.quadraticCurveTo(-hr * 0.9, s * hr * 0.88, -hr * 0.55, s * hr * 0.42); c.closePath(); c.fill(); c.stroke();
                      }
                    }

                    const hg = c.createRadialGradient(hr * 0.22, -hr * 0.2, 2, 0, 0, hr * 1.45);
                    hg.addColorStop(0, this.species.base); hg.addColorStop(0.68, this.species.mid); hg.addColorStop(1, this.species.dark);
                    c.fillStyle = hg;
                    c.beginPath();
                    if (pat === 'viper' || pat === 'gaboon' || pat === 'obsidian' || pat === 'frost') {
                      c.moveTo(hr * 1.4, 0);
                      c.quadraticCurveTo(hr * 0.8, -hr * 0.78, hr * 0.05, -hr * 1.12);
                      c.quadraticCurveTo(-hr * 0.75, -hr * 1.04, -hr * 0.92, -hr * 0.74);
                      c.quadraticCurveTo(-hr * 1.05, 0, -hr * 0.92, hr * 0.74);
                      c.quadraticCurveTo(-hr * 0.75, hr * 1.04, hr * 0.05, hr * 1.12);
                      c.quadraticCurveTo(hr * 0.8, hr * 0.78, hr * 1.4, 0);
                    } else if (this.species.dragon || pat === 'titan') {
                      c.moveTo(hr * 1.48, -hr * 0.2);
                      c.quadraticCurveTo(hr * 1.62, 0, hr * 1.48, hr * 0.2);
                      c.lineTo(hr * 0.62, hr * 0.74);
                      c.quadraticCurveTo(-hr * 0.2, hr * 1.08, -hr * 0.88, hr * 0.82);
                      c.quadraticCurveTo(-hr * 1.08, 0, -hr * 0.88, -hr * 0.82);
                      c.quadraticCurveTo(-hr * 0.2, -hr * 1.08, hr * 0.62, -hr * 0.74);
                    } else {
                      c.moveTo(hr * 1.42, 0);
                      c.quadraticCurveTo(hr * 0.9, -hr * 0.64, hr * 0.15, -hr * 0.92);
                      c.quadraticCurveTo(-hr * 0.72, -hr * 0.96, -hr * 0.9, -hr * 0.76);
                      c.quadraticCurveTo(-hr * 1.04, 0, -hr * 0.9, hr * 0.76);
                      c.quadraticCurveTo(-hr * 0.72, hr * 0.96, hr * 0.15, hr * 0.92);
                      c.quadraticCurveTo(hr * 0.9, hr * 0.64, hr * 1.42, 0);
                    }
                    c.closePath();
                    c.fill();
                    c.strokeStyle = 'rgba(0,0,0,0.52)'; c.lineWidth = 1.2; c.stroke();

                    // Lip Line & Labial Rim
                    for (const s of [-1, 1]) {
                      c.strokeStyle = 'rgba(15, 8, 5, 0.72)'; c.lineWidth = 1.4;
                      c.beginPath(); c.moveTo(hr * 1.36, s * hr * 0.08); c.quadraticCurveTo(hr * 0.82, s * hr * 0.54, hr * 0.05, s * hr * 0.8); c.stroke();
                      c.strokeStyle = this.species.belly; c.lineWidth = 1.1; c.globalAlpha = alpha * 0.5;
                      c.beginPath(); c.moveTo(hr * 1.3, s * hr * 0.14); c.quadraticCurveTo(hr * 0.78, s * hr * 0.6, hr * 0.08, s * hr * 0.84); c.stroke();
                      c.globalAlpha = alpha;
                    }

                    if (!this.species.dragon && this.species.horns) {
                      c.fillStyle = this.species.accent;
                      for (const s of [-1, 1]) {
                        c.beginPath(); c.moveTo(hr * 0.36, s * hr * 0.54); c.lineTo(hr * 0.02, s * hr * 1.16); c.lineTo(-hr * 0.14, s * hr * 0.54); c.closePath(); c.fill();
                      }
                    }

                    c.fillStyle = 'rgba(255,255,245,0.15)';
                    c.beginPath(); c.ellipse(hr * 0.42, -hr * 0.14, hr * 0.52, hr * 0.2, -0.1, 0, Math.PI * 2); c.fill();
                    c.fillStyle = 'rgba(0,0,0,0.8)';
                    c.beginPath(); c.arc(hr * 1.1, -hr * 0.2, 1.5, 0, Math.PI * 2); c.arc(hr * 1.1, hr * 0.2, 1.5, 0, Math.PI * 2); c.fill();

                    for (const s of [-1, 1]) {
                      c.fillStyle = 'rgba(0,0,0,0.6)';
                      c.beginPath(); c.ellipse(hr * 0.42, s * hr * 0.52, hr * 0.3, hr * 0.21, s * 0.24, 0, Math.PI * 2); c.fill();
                      c.fillStyle = this.species.eye;
                      c.beginPath(); c.ellipse(hr * 0.45, s * hr * 0.5, hr * 0.24, hr * 0.17, s * 0.24, 0, Math.PI * 2); c.fill();
                      c.fillStyle = '#050505';
                      c.beginPath(); c.ellipse(hr * 0.49, s * hr * 0.5, hr * 0.055, hr * 0.15, 0, 0, Math.PI * 2); c.fill();
                      c.fillStyle = 'rgba(255,255,255,0.92)';
                      c.beginPath(); c.arc(hr * 0.39, s * hr * 0.45, hr * 0.06, 0, Math.PI * 2); c.fill();
                    }

                    if (this.spawnShield > 0) {
                      c.strokeStyle = 'rgba(77, 226, 240, 0.85)'; c.lineWidth = 2.5;
                      c.beginPath(); c.arc(0, 0, hr * 1.85, 0, Math.PI * 2); c.stroke();
                    }
                    c.restore();

                    if (showLabel && !this.isPlayer) {
                      c.font = 'bold 10.5px sans-serif'; c.textAlign = 'center';
                      c.fillStyle = 'rgba(0,0,0,0.65)'; c.fillText(this.name, this.x + 1, this.y - hr - 11);
                      c.fillStyle = this.slowTimer > 0 ? '#84ff3b' : '#eef7eb'; c.fillText(this.name, this.x, this.y - hr - 12);
                    }
                    c.restore();
                  }
                }

                // -------------------- GAME LOGIC --------------------
                function killSnake(victim, killer, cause) {
                  if (!victim.alive) return;
                  victim.alive = false;
                  spawnParticles(victim.x, victim.y, victim.species.glow || victim.species.accent, 18, 160);
                  for (let i = 0; i < victim.segments.length; i += 3) {
                    meatList.push({
                      x: victim.segments[i].x + rand(-10, 10), y: victim.segments[i].y + rand(-10, 10),
                      r: rand(9, 13), mass: 5.5, col: victim.species.glow || victim.species.accent, life: 28
                    });
                  }
                  if (killer && killer !== victim) {
                    killer.kills++;
                    if (killer.isPlayer) {
                      matchStats.kills++;
                      Sound.kill(); vibrate(60);
                      floatTexts.push({ x: victim.x, y: victim.y - 20, text: `KILL! +150 🪙 +5 💎`, color: '#ffe45c', life: 1.3, maxLife: 1.3 });
                    }
                    pushKillFeed(`${killer.name} [${cause}] ${victim.name}`);
                  } else {
                    pushKillFeed(`${victim.name} (${cause})`);
                  }
                  const aliveCount = snakes.filter(s => s.alive).length;
                  if (victim.isPlayer) {
                    matchStats.rank = aliveCount + 1;
                    matchStats.reason = killer ? `Your head crashed into ${killer.name}!` : `Eliminated by ${cause}`;
                    endMatch(false);
                  } else if (player && player.alive && aliveCount === 1) {
                    matchStats.rank = 1;
                    matchStats.reason = 'Last Serpent Standing — 50-Snake Champion!';
                    endMatch(true);
                  }
                }

                function spawnPrey(count = 1) {
                  for (let i = 0; i < count; i++) {
                    const t = PREY_TYPES[Math.floor(Math.random() * PREY_TYPES.length)];
                    const pt = randInCircle(safeZone.cx, safeZone.cy, Math.min(safeZone.r, ARENA_RADIUS), 180);
                    preyList.push({ ...t, x: pt.x, y: pt.y, angle: rand(0, Math.PI * 2), timer: rand(0.5, 2.5) });
                  }
                }

                function spawnGoldenDrop() {
                  const pt = randInCircle(safeZone.cx, safeZone.cy, Math.min(safeZone.r * 0.8, ARENA_RADIUS - 400), 200);
                  feastDrops.push({ x: pt.x, y: pt.y, r: 24, life: 45 });
                  Sound.drop();
                  const al = document.getElementById('dropAlert');
                  al.style.display = 'block';
                  setTimeout(() => { al.style.display = 'none'; }, 4500);
                }

                function startMatch() {
                  screenState = 'playing'; tacMapOpen = false;
                  document.getElementById('tacMapOverlay').classList.remove('open');
                  document.getElementById('lobbyScreen').style.display = 'none';
                  document.getElementById('resultsScreen').classList.remove('open');
                  document.getElementById('hud').style.display = 'block';
                  document.getElementById('killFeed').innerHTML = '';

                  generateWorld(profile.selectedBiome);
                  snakes = []; preyList = []; meatList = []; feastDrops = []; projectiles = []; particles = []; floatTexts = [];
                  safeZone.active = profile.selectedMode === 'br';
                  safeZone.cx = WORLD_CENTER; safeZone.cy = WORLD_CENTER;
                  safeZone.r = ARENA_RADIUS; safeZone.targetR = ARENA_RADIUS * 0.72;
                  safeZone.stage = 1; safeZone.timer = 40; safeZone.shrinking = false;
                  dayCycle = 0; weatherRain = false; weatherTimer = 36; dropTimer = 22;

                  matchStats.kills = 0; matchStats.prey = 0; matchStats.maxLen = 135; matchStats.rank = TOTAL_SNAKES; matchStats.reason = '';

                  const pSpec = SPECIES.find(s => s.id === profile.selectedSnake) || SPECIES[0];
                  const pSpawn = randInCircle(WORLD_CENTER, WORLD_CENTER, ARENA_RADIUS * 0.55, 300);
                  player = new Snake({ name: profile.name, species: pSpec, x: pSpawn.x, y: pSpawn.y, isPlayer: true, mass: 30 });
                  snakes.push(player);

                  for (let i = 1; i < TOTAL_SNAKES; i++) {
                    const sp = SPECIES[Math.floor(Math.random() * SPECIES.length)];
                    let pt = randInCircle(WORLD_CENTER, WORLD_CENTER, ARENA_RADIUS, 340);
                    if (dist(pt.x, pt.y, player.x, player.y) < 600) pt = randInCircle(WORLD_CENTER, WORLD_CENTER, ARENA_RADIUS, 340);
                    const nm = AI_PREFIX[i % AI_PREFIX.length] + AI_SUFFIX[Math.floor(i / 3) % AI_SUFFIX.length];
                    snakes.push(new Snake({ name: nm, species: sp, x: pt.x, y: pt.y, mass: rand(24, 38) }));
                  }

                  spawnPrey(340);
                  camera.x = player.x; camera.y = player.y; camera.lookX = 0; camera.lookY = 0;
                  camera.zoom = profile.settings.zoom;
                  applySettingsToDOM();
                  const hint = document.getElementById('controlsHint');
                  if (hint) { hint.style.opacity = '1'; setTimeout(() => { hint.style.opacity = '0'; }, 5500); }
                }

                function endMatch(isWin) {
                  screenState = 'results';
                  document.getElementById('hud').style.display = 'none';
                  document.getElementById('tacMapOverlay').classList.remove('open');
                  const gold = (isWin ? 800 : Math.max(80, (TOTAL_SNAKES - matchStats.rank) * 12)) + matchStats.kills * 150;
                  const dias = (isWin ? 35 : (matchStats.rank <= 5 ? 10 : 2)) + matchStats.kills * 5;
                  const xp = (isWin ? 200 : 50) + matchStats.kills * 30 + matchStats.prey * 2;

                  profile.coins += gold; profile.diamonds += dias; profile.xp += xp;
                  profile.stats.matches++;
                  if (isWin) profile.stats.wins++;
                  profile.stats.kills += matchStats.kills;
                  profile.stats.prey += matchStats.prey;
                  if (matchStats.maxLen > profile.stats.bestLength) profile.stats.bestLength = matchStats.maxLen;
                  while (profile.xp >= getXpNeed(profile.level)) { profile.xp -= getXpNeed(profile.level); profile.level++; }
                  saveProfile();

                  document.getElementById('resTitle').textContent = isWin ? '#1 APEX PREDATOR!' : `RANK #${matchStats.rank} / ${TOTAL_SNAKES}`;
                  document.getElementById('resSub').textContent = matchStats.reason;
                  document.getElementById('resRank').textContent = `#${matchStats.rank}`;
                  document.getElementById('resKills').textContent = matchStats.kills;
                  document.getElementById('resLen').textContent = matchStats.maxLen;
                  document.getElementById('resPrey').textContent = matchStats.prey;
                  document.getElementById('resGold').textContent = `+${gold} 🪙 Coins`;
                  document.getElementById('resDia').textContent = `+${dias} 💎 Diamonds`;
                  document.getElementById('resXp').textContent = `+${xp} XP`;
                  document.getElementById('resultsScreen').classList.add('open');
                  isWin ? Sound.win() : Sound.over();
                }

                function enterLobby() {
                  screenState = 'lobby';
                  document.getElementById('hud').style.display = 'none';
                  document.getElementById('resultsScreen').classList.remove('open');
                  document.getElementById('lobbyScreen').style.display = 'block';
                  generateWorld(profile.selectedBiome);
                  const sp = SPECIES.find(s => s.id === profile.selectedSnake) || SPECIES[0];
                  lobbySnake = new Snake({ name: profile.name, species: sp, x: appW * 0.5, y: appH * 0.5, isPlayer: true, mass: 38 });
                  lobbySnake.spawnShield = 0;
                  lobbySnake.hoodFlare = sp.hood ? 0.9 : 0;
                  refreshLobbyUI();
                }

                function updateGame(dt) {
                  dayCycle = (dayCycle + dt) % 120;
                  weatherTimer -= dt;
                  if (weatherTimer <= 0) { weatherRain = !weatherRain; weatherTimer = rand(28, 48); }
                  dropTimer -= dt;
                  if (dropTimer <= 0 && feastDrops.length < 2) { spawnGoldenDrop(); dropTimer = 38; }

                  if (player && player.alive) {
                    let kx = (ctrl.keys.right ? 1 : 0) - (ctrl.keys.left ? 1 : 0);
                    let ky = (ctrl.keys.down ? 1 : 0) - (ctrl.keys.up ? 1 : 0);
                    if (kx !== 0 || ky !== 0) player.targetAngle = Math.atan2(ky, kx);
                    else if (ctrl.joyActive && ctrl.joyMag > 8) player.targetAngle = ctrl.joyAngle;
                    player.boosting = ctrl.boostHeld || ctrl.keys.boost;
                    matchStats.maxLen = Math.max(matchStats.maxLen, player.getLen());
                  }

                  if (safeZone.active) {
                    safeZone.timer -= dt;
                    if (!safeZone.shrinking && safeZone.timer <= 0) {
                      safeZone.shrinking = true; safeZone.timer = 26;
                      safeZone.targetR = Math.max(550, safeZone.r * 0.65);
                    } else if (safeZone.shrinking) {
                      safeZone.r = Math.max(safeZone.targetR, safeZone.r - (ARENA_RADIUS * 0.013) * dt);
                      if (safeZone.timer <= 0 || safeZone.r <= safeZone.targetR) {
                        safeZone.shrinking = false; safeZone.stage = Math.min(6, safeZone.stage + 1); safeZone.timer = 32;
                      }
                    }
                  }

                  rebuildGrids();
                  for (const s of snakes) s.update(dt);

                  for (const s of snakes) {
                    if (!s.alive || s.spawnShield > 0) continue;
                    const hr = s.getRadius() * 0.85;
                    const near = queryGrid(snakeGrid, s.x, s.y, hr + 85);
                    for (const o of near) {
                      if (o === s || !o.alive || o.spawnShield > 0) continue;
                      const oR = o.getRadius() * 0.85;
                      let crashed = false;
                      for (let k = 1; k < o.segments.length; k++) {
                        if (distSq(s.x, s.y, o.segments[k].x, o.segments[k].y) < (hr + oR) ** 2) { crashed = true; break; }
                      }
                      if (crashed) { killSnake(s, o, 'Cut-Off'); break; }
                      if (distSq(s.x, s.y, o.x, o.y) < (hr + oR) ** 2 && s.mass < o.mass) {
                        killSnake(s, o, 'Head Clash'); break;
                      }
                    }
                  }

                  for (let i = feastDrops.length - 1; i >= 0; i--) {
                    const f = feastDrops[i]; f.life -= dt;
                    if (f.life <= 0) { feastDrops.splice(i, 1); continue; }
                    const nearS = queryGrid(snakeGrid, f.x, f.y, 65);
                    for (const s of nearS) {
                      if (!s.alive) continue;
                      if (distSq(s.x, s.y, f.x, f.y) < (s.getRadius() + f.r) ** 2) {
                        s.mass += 28;
                        spawnParticles(f.x, f.y, '#ffe45c', 18, 150);
                        if (s.isPlayer) { Sound.win(); vibrate(40); profile.diamonds += 10; saveProfile(); floatTexts.push({ x: f.x, y: f.y - 20, text: '+28 MASS • +10 💎', color: '#9cf4ff', life: 1.3, maxLife: 1.3 }); }
                        pushKillFeed(`${s.name} claimed Golden Feast!`);
                        feastDrops.splice(i, 1); break;
                      }
                    }
                  }

                  for (let i = preyList.length - 1; i >= 0; i--) {
                    const p = preyList[i];
                    if (p.speed > 0) {
                      p.timer -= dt;
                      if (p.timer <= 0) { p.angle += rand(-1.3, 1.3); p.timer = rand(0.8, 2.2); }
                      p.x += Math.cos(p.angle) * p.speed * dt; p.y += Math.sin(p.angle) * p.speed * dt;
                      if (dist(p.x, p.y, WORLD_CENTER, WORLD_CENTER) > ARENA_RADIUS - 180) p.angle = Math.atan2(WORLD_CENTER - p.y, WORLD_CENTER - p.x);
                    }
                    const nearS = queryGrid(snakeGrid, p.x, p.y, 50);
                    for (const s of nearS) {
                      if (!s.alive) continue;
                      if (distSq(s.x, s.y, p.x, p.y) < (s.getRadius() * 1.2 + p.r) ** 2) {
                        const mult = s.species.id === 'python' ? 1.22 : 1.0;
                        s.mass += p.mass * mult; s.jawOpen = 0.6;
                        if (s.isPlayer) { matchStats.prey++; Sound.eat(); }
                        preyList.splice(i, 1); break;
                      }
                    }
                  }
                  if (preyList.length < 300) spawnPrey(8);

                  for (let i = meatList.length - 1; i >= 0; i--) {
                    const m = meatList[i]; m.life -= dt;
                    if (m.life <= 0) { meatList.splice(i, 1); continue; }
                    const nearS = queryGrid(snakeGrid, m.x, m.y, 50);
                    for (const s of nearS) {
                      if (!s.alive) continue;
                      if (distSq(s.x, s.y, m.x, m.y) < (s.getRadius() * 1.25 + m.r) ** 2) {
                        s.mass += m.mass; s.jawOpen = 0.45;
                        if (s.isPlayer) Sound.eat();
                        meatList.splice(i, 1); break;
                      }
                    }
                  }

                  for (let i = projectiles.length - 1; i >= 0; i--) {
                    const pr = projectiles[i]; pr.x += pr.vx * dt; pr.y += pr.vy * dt; pr.life -= dt;
                    if (pr.life <= 0) { projectiles.splice(i, 1); continue; }
                    const nearS = queryGrid(snakeGrid, pr.x, pr.y, 52);
                    for (const s of nearS) {
                      if (!s.alive || s === pr.owner || s.spawnShield > 0) continue;
                      if (distSq(pr.x, pr.y, s.x, s.y) < (s.getRadius() * 1.2 + pr.r) ** 2) {
                        s.slowTimer = pr.slowDur;
                        spawnParticles(s.x, s.y, pr.col, 10, 110);
                        if (pr.owner.isPlayer || s.isPlayer) floatTexts.push({ x: s.x, y: s.y - 24, text: 'SLOWED!', color: pr.col, life: 0.9, maxLife: 0.9 });
                        projectiles.splice(i, 1); break;
                      }
                    }
                  }

                  for (let i = tracks.length - 1; i >= 0; i--) { tracks[i].life -= dt; if (tracks[i].life <= 0) tracks.splice(i, 1); }
                  for (let i = ripples.length - 1; i >= 0; i--) {
                    const rp = ripples[i]; rp.life -= dt; rp.r = lerp(rp.r, rp.maxR, dt * 3.5);
                    if (rp.life <= 0) ripples.splice(i, 1);
                  }
                  for (let i = particles.length - 1; i >= 0; i--) {
                    const pt = particles[i]; pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.life -= dt;
                    if (pt.life <= 0) particles.splice(i, 1);
                  }
                  for (let i = floatTexts.length - 1; i >= 0; i--) {
                    const ft = floatTexts[i]; ft.y -= 28 * dt; ft.life -= dt;
                    if (ft.life <= 0) floatTexts.splice(i, 1);
                  }

                  if (camera.shake > 0) camera.shake = Math.max(0, camera.shake - dt * 24);
                  if (player && player.alive) {
                    camera.x = lerp(camera.x, player.x, clamp(dt * 8, 0, 1));
                    camera.y = lerp(camera.y, player.y, clamp(dt * 8, 0, 1));
                    camera.zoom = lerp(camera.zoom, profile.settings.zoom, clamp(dt * 5, 0, 1));
                    if (!ctrl.lookActive && profile.settings.autoCenter) {
                      camera.lookX = lerp(camera.lookX, 0, clamp(dt * 7, 0, 1));
                      camera.lookY = lerp(camera.lookY, 0, clamp(dt * 7, 0, 1));
                    }
                    document.getElementById('btnRecenter').style.display = Math.hypot(camera.lookX, camera.lookY) > 35 ? 'flex' : 'none';
                  }

                  hudTick -= dt;
                  if (hudTick <= 0 && player) {
                    hudTick = 0.1;
                    const alive = snakes.filter(s => s.alive).length;
                    document.getElementById('hudAlive').textContent = `${alive}/${TOTAL_SNAKES}`;
                    document.getElementById('hudKills').textContent = matchStats.kills;
                    document.getElementById('hudLen').textContent = player.getLen();
                    document.getElementById('hudZoneStage').textContent = safeZone.stage;
                    const zt = Math.max(0, Math.ceil(safeZone.timer));
                    document.getElementById('hudZoneTimer').textContent = `${Math.floor(zt / 60)}:${String(zt % 60).padStart(2, '0')}`;
                    document.getElementById('shieldBadge').style.display = player.spawnShield > 0 ? 'block' : 'none';

                    const stRing = document.getElementById('staminaRing');
                    if (stRing) stRing.style.strokeDashoffset = String(201 * (1 - player.stamina / 100));

                    const inStorm = safeZone.active && dist(player.x, player.y, safeZone.cx, safeZone.cy) > safeZone.r;
                    document.getElementById('stormVignette').style.opacity = inStorm ? '1' : '0';

                    document.getElementById('btnVenom').classList.toggle('on-cd', player.venomCd > 0);
                    document.getElementById('cdTxtVenom').textContent = player.venomCd > 0 ? Math.ceil(player.venomCd) : '';
                    document.getElementById('btnCamo').classList.toggle('on-cd', player.camoCd > 0);
                    document.getElementById('cdTxtCamo').textContent = player.camoCd > 0 ? Math.ceil(player.camoCd) : '';

                    document.getElementById('regionPill').textContent = getRegionAt(player.x, player.y).name;
                    const timeIcon = dayCycle < 48 ? '☀️ Sunlit' : dayCycle < 78 ? '🌅 Dusk' : '🌙 Night';
                    document.getElementById('envPill').textContent = `${timeIcon} • ${weatherRain ? '🌧️ Rain' : 'Clear'}`;
                    if (profile.settings.showFps) document.getElementById('fpsPill').textContent = `${fpsVal} FPS`;

                    const tTag = document.getElementById('terrainTag');
                    if (player.inBush) { tTag.style.display = 'block'; tTag.style.background = 'rgba(34,115,44,0.88)'; tTag.textContent = '🌿 STEALTH COVER'; }
                    else if (player.terrain === 'water') { tTag.style.display = 'block'; tTag.style.background = 'rgba(26,136,148,0.85)'; tTag.textContent = '🌊 RIVER BOOST'; }
                    else if (player.terrain === 'mud') { tTag.style.display = 'block'; tTag.style.background = 'rgba(84,54,28,0.88)'; tTag.textContent = '🟤 MUD SLOW'; }
                    else tTag.style.display = 'none';

                    drawRadar(miniCtx, miniCanvas.width, miniCanvas.height, false);
                    if (tacMapOpen) drawRadar(tacCtx, tacCanvas.width, tacCanvas.height, true);
                  }
                }

                function drawRadar(rc, w, h, showLabels) {
                  const sc = (w * 0.45) / ARENA_RADIUS, cx = w / 2, cy = h / 2;
                  rc.clearRect(0, 0, w, h);
                  rc.fillStyle = '#0c180d'; rc.fillRect(0, 0, w, h);

                  for (const r of REGIONS) {
                    const rx = cx + (r.x - WORLD_CENTER) * sc, ry = cy + (r.y - WORLD_CENTER) * sc;
                    rc.fillStyle = r.col; rc.beginPath(); rc.arc(rx, ry, r.r * sc, 0, Math.PI * 2); rc.fill();
                  }
                  rc.fillStyle = 'rgba(38,165,180,0.45)';
                  for (const wv of waterZones) {
                    rc.beginPath(); rc.arc(cx + (wv.x - WORLD_CENTER) * sc, cy + (wv.y - WORLD_CENTER) * sc, Math.max(2, wv.r * sc), 0, Math.PI * 2); rc.fill();
                  }
                  rc.strokeStyle = 'rgba(255,75,58,0.5)'; rc.lineWidth = showLabels ? 2.5 : 1.5;
                  rc.beginPath(); rc.arc(cx, cy, ARENA_RADIUS * sc, 0, Math.PI * 2); rc.stroke();
                  if (safeZone.active) {
                    rc.strokeStyle = '#4de2f0'; rc.lineWidth = showLabels ? 3 : 2;
                    rc.beginPath(); rc.arc(cx + (safeZone.cx - WORLD_CENTER) * sc, cy + (safeZone.cy - WORLD_CENTER) * sc, safeZone.r * sc, 0, Math.PI * 2); rc.stroke();
                  }
                  if (showLabels) {
                    rc.font = 'bold 10px sans-serif'; rc.textAlign = 'center'; rc.fillStyle = 'rgba(255,235,160,0.88)';
                    for (const r of REGIONS) rc.fillText(r.name.toUpperCase(), cx + (r.x - WORLD_CENTER) * sc, cy + (r.y - WORLD_CENTER) * sc);
                  }
                  rc.fillStyle = '#ffe44d';
                  for (const f of feastDrops) {
                    rc.beginPath(); rc.arc(cx + (f.x - WORLD_CENTER) * sc, cy + (f.y - WORLD_CENTER) * sc, showLabels ? 5 : 3.5, 0, Math.PI * 2); rc.fill();
                  }
                  rc.fillStyle = 'rgba(255,90,78,0.85)';
                  for (const s of snakes) {
                    if (!s.alive || s.isPlayer || s.isCamo()) continue;
                    const sx = cx + (s.x - WORLD_CENTER) * sc, sy = cy + (s.y - WORLD_CENTER) * sc;
                    rc.beginPath(); rc.arc(sx, sy, showLabels ? 3 : 1.7, 0, Math.PI * 2); rc.fill();
                  }
                  if (player && player.alive) {
                    const px = cx + (player.x - WORLD_CENTER) * sc, py = cy + (player.y - WORLD_CENTER) * sc;
                    rc.fillStyle = '#7ce846';
                    rc.beginPath(); rc.arc(px, py, showLabels ? 6 : 4, 0, Math.PI * 2); rc.fill();
                    rc.strokeStyle = '#fff'; rc.lineWidth = 1.5; rc.stroke();
                  }
                }

                function renderGame(dt) {
                  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                  ctx.fillStyle = '#060b07'; ctx.fillRect(0, 0, appW, appH);

                  if (screenState !== 'playing') {
                    if (groundPattern) { ctx.fillStyle = groundPattern; ctx.fillRect(0, 0, appW, appH); }
                    else { ctx.fillStyle = '#1b2b15'; ctx.fillRect(0, 0, appW, appH); }
                    const g = ctx.createRadialGradient(appW * 0.5, appH * 0.48, 20, appW * 0.5, appH * 0.48, Math.max(appW, appH) * 0.56);
                    g.addColorStop(0, 'rgba(180, 235, 110, 0.14)'); g.addColorStop(1, 'rgba(4,9,5,0.68)');
                    ctx.fillStyle = g; ctx.fillRect(0, 0, appW, appH);

                    if (lobbySnake) {
                      lobbySnake.slitherPhase += dt * 7.5;
                      const rx = Math.min(appW * 0.25, 190), ry = Math.min(appH * 0.22, 95);
                      const t = globalTime * 0.82;
                      const nx = appW * 0.5 + Math.cos(t) * rx;
                      const ny = appH * 0.48 + Math.sin(t) * ry;
                      lobbySnake.angle = Math.atan2(ny - lobbySnake.y, nx - lobbySnake.x);
                      lobbySnake.x = nx; lobbySnake.y = ny;
                      lobbySnake.segments[0].x = nx; lobbySnake.segments[0].y = ny;
                      const spc = lobbySnake.getRadius() * 0.52;
                      for (let i = 1; i < lobbySnake.segments.length; i++) {
                        const p = lobbySnake.segments[i - 1], c = lobbySnake.segments[i], dx = c.x - p.x, dy = c.y - p.y, d = Math.hypot(dx, dy) || 1;
                        if (d > spc) { c.x = p.x + (dx / d) * spc; c.y = p.y + (dy / d) * spc; }
                      }
                      lobbySnake.draw(ctx, false);
                    }
                    for (const ff of fireflies) {
                      ff.x = (ff.x + ff.vx * dt + appW) % appW; ff.y = (ff.y + ff.vy * dt + appH) % appH;
                      const al = 0.2 + 0.5 * (0.5 + 0.5 * Math.sin(globalTime * 3.5 + ff.ph));
                      ctx.fillStyle = `rgba(190, 255, 120, ${al})`;
                      ctx.beginPath(); ctx.arc(ff.x, ff.y, 2, 0, Math.PI * 2); ctx.fill();
                    }
                    return;
                  }

                  const biome = BIOMES.find(b => b.id === profile.selectedBiome) || BIOMES[0];
                  const shX = camera.shake > 0 ? rand(-camera.shake, camera.shake) : 0;
                  const shY = camera.shake > 0 ? rand(-camera.shake, camera.shake) : 0;

                  ctx.save();
                  ctx.translate(appW / 2 + shX, appH / 2 + shY);
                  ctx.scale(camera.zoom, camera.zoom);
                  ctx.translate(-(camera.x + camera.lookX), -(camera.y + camera.lookY));

                  if (groundPattern) { ctx.fillStyle = groundPattern; ctx.fillRect(0, 0, WORLD_SIZE, WORLD_SIZE); }

                  for (const r of REGIONS) {
                    if (!isNearCam(r.x, r.y, r.r)) continue;
                    ctx.fillStyle = r.col; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.fill();
                  }

                  for (const m of mudZones) {
                    if (!isNearCam(m.x, m.y, m.r + 80)) continue;
                    ctx.fillStyle = biome.mud; ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
                  }

                  for (const w of waterZones) {
                    if (!isNearCam(w.x, w.y, w.r + 100)) continue;
                    ctx.fillStyle = biome.shore; ctx.beginPath(); ctx.arc(w.x, w.y, w.r + 16, 0, Math.PI * 2); ctx.fill();
                  }
                  for (const w of waterZones) {
                    if (!isNearCam(w.x, w.y, w.r + 100)) continue;
                    ctx.fillStyle = biome.water; ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = biome.waterDeep; ctx.beginPath(); ctx.arc(w.x, w.y, w.r * 0.65, 0, Math.PI * 2); ctx.fill();
                  }
                  for (const lp of lilyPads) {
                    if (!isNearCam(lp.x, lp.y, 50)) continue;
                    ctx.save(); ctx.translate(lp.x, lp.y); ctx.rotate(lp.rot);
                    ctx.fillStyle = '#2d7a2d';
                    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, lp.r, 0.25, Math.PI * 2 - 0.25); ctx.closePath(); ctx.fill();
                    if (lp.lotus) {
                      ctx.fillStyle = '#ff85b3';
                      for (let p = 0; p < 5; p++) { ctx.rotate((Math.PI * 2) / 5); ctx.beginPath(); ctx.ellipse(4, 0, 5, 2.5, 0, 0, Math.PI * 2); ctx.fill(); }
                      ctx.fillStyle = '#ffe552'; ctx.beginPath(); ctx.arc(0, 0, 2.2, 0, Math.PI * 2); ctx.fill();
                    }
                    ctx.restore();
                  }

                  for (const tr of tracks) {
                    if (!isNearCam(tr.x, tr.y, 40)) continue;
                    ctx.save(); ctx.translate(tr.x, tr.y); ctx.rotate(tr.ang);
                    ctx.globalAlpha = clamp(tr.life / tr.maxLife, 0, 1) * 0.42;
                    ctx.fillStyle = '#170d05'; ctx.beginPath(); ctx.ellipse(0, 0, tr.r * 0.5, tr.r * 0.9, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                  }
                  for (const rp of ripples) {
                    if (!isNearCam(rp.x, rp.y, rp.maxR)) continue;
                    ctx.strokeStyle = `rgba(195, 245, 255, ${(rp.life / rp.maxLife) * 0.42})`; ctx.lineWidth = 1.8;
                    ctx.beginPath(); ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2); ctx.stroke();
                  }

                  for (const pr of worldProps) {
                    if (!isNearCam(pr.x, pr.y, pr.sz + 50)) continue;
                    ctx.save(); ctx.translate(pr.x, pr.y); ctx.rotate(pr.rot);
                    if (pr.kind === 'log') {
                      ctx.fillStyle = 'rgba(0,0,0,0.38)'; ctx.fillRect(-pr.sz + 4, -pr.sz * 0.24 + 5, pr.sz * 2, pr.sz * 0.48);
                      ctx.fillStyle = '#4a3019'; ctx.fillRect(-pr.sz, -pr.sz * 0.24, pr.sz * 2, pr.sz * 0.48);
                      ctx.fillStyle = 'rgba(76,138,44,0.72)'; ctx.beginPath(); ctx.ellipse(-pr.sz * 0.2, -3, pr.sz * 0.36, pr.sz * 0.19, 0.2, 0, Math.PI * 2); ctx.fill();
                    } else if (pr.kind === 'rock') {
                      ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(4, 6, pr.sz * 0.78, pr.sz * 0.62, 0, 0, Math.PI * 2); ctx.fill();
                      ctx.fillStyle = '#5c6358';
                      ctx.beginPath();
                      ctx.moveTo(pr.sz * 0.75, 0); ctx.lineTo(pr.sz * 0.42, -pr.sz * 0.56); ctx.lineTo(-pr.sz * 0.38, -pr.sz * 0.52);
                      ctx.lineTo(-pr.sz * 0.76, -pr.sz * 0.08); ctx.lineTo(-pr.sz * 0.46, pr.sz * 0.54); ctx.lineTo(pr.sz * 0.36, pr.sz * 0.5);
                      ctx.closePath(); ctx.fill();
                      ctx.strokeStyle = 'rgba(22,26,20,0.6)'; ctx.lineWidth = 1.2;
                      ctx.beginPath(); ctx.moveTo(-pr.sz * 0.3, -pr.sz * 0.15); ctx.lineTo(pr.sz * 0.1, pr.sz * 0.05); ctx.lineTo(pr.sz * 0.35, -pr.sz * 0.2); ctx.stroke();
                      ctx.fillStyle = 'rgba(68,122,42,0.62)'; ctx.beginPath(); ctx.arc(-pr.sz * 0.24, -pr.sz * 0.2, pr.sz * 0.28, 0, Math.PI * 2); ctx.fill();
                    } else if (pr.kind === 'ruin') {
                      ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(-pr.sz * 0.8 + 5, -pr.sz * 0.55 + 6, pr.sz * 1.6, pr.sz * 1.1);
                      ctx.fillStyle = '#6c7065'; ctx.fillRect(-pr.sz * 0.8, -pr.sz * 0.55, pr.sz * 1.6, pr.sz * 1.1);
                      ctx.strokeStyle = 'rgba(28,32,26,0.72)'; ctx.lineWidth = 2; ctx.strokeRect(-pr.sz * 0.68, -pr.sz * 0.44, pr.sz * 1.36, pr.sz * 0.88);
                      ctx.fillStyle = 'rgba(64,116,40,0.68)'; ctx.beginPath(); ctx.arc(-pr.sz * 0.45, -pr.sz * 0.3, pr.sz * 0.28, 0, Math.PI * 2); ctx.fill();
                    } else {
                      for (let f = 0; f < 6; f++) {
                        ctx.rotate(Math.PI / 3); ctx.fillStyle = f % 2 === 0 ? '#2b6e24' : '#3d8c30';
                        ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(pr.sz * 0.45, -pr.sz * 0.22, pr.sz * 0.85, 0); ctx.quadraticCurveTo(pr.sz * 0.45, pr.sz * 0.22, 0, 0); ctx.fill();
                      }
                    }
                    ctx.restore();
                  }

                  ctx.strokeStyle = 'rgba(255,75,58,0.6)'; ctx.lineWidth = 18;
                  ctx.beginPath(); ctx.arc(WORLD_CENTER, WORLD_CENTER, ARENA_RADIUS, 0, Math.PI * 2); ctx.stroke();
                  if (safeZone.active) {
                    ctx.strokeStyle = 'rgba(77,226,240,0.88)'; ctx.lineWidth = 10;
                    ctx.beginPath(); ctx.arc(safeZone.cx, safeZone.cy, safeZone.r, 0, Math.PI * 2); ctx.stroke();
                  }

                  for (const f of feastDrops) {
                    if (!isNearCam(f.x, f.y, 120)) continue;
                    const pulse = 1 + Math.sin(globalTime * 6) * 0.16;
                    ctx.fillStyle = 'rgba(255,224,82,0.28)'; ctx.beginPath(); ctx.arc(f.x, f.y, 38 * pulse, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#ffe052'; ctx.beginPath(); ctx.arc(f.x, f.y, 14, 0, Math.PI * 2); ctx.fill();
                  }

                  for (const p of preyList) { if (isNearCam(p.x, p.y, 50)) drawPrey(ctx, p); }
                  for (const m of meatList) {
                    if (!isNearCam(m.x, m.y, 40)) continue;
                    ctx.fillStyle = m.col || '#ff9d3b'; ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.arc(m.x - 2.5, m.y - 2.5, m.r * 0.32, 0, Math.PI * 2); ctx.fill();
                  }

                  for (const s of snakes) {
                    if (!s.alive || (!s.isPlayer && !isNearCam(s.x, s.y, 260))) continue;
                    s.draw(ctx, true);
                  }

                  if (player && player.alive && safeZone.active && dist(player.x, player.y, safeZone.cx, safeZone.cy) > safeZone.r - 120) {
                    const za = Math.atan2(safeZone.cy - player.y, safeZone.cx - player.x);
                    ctx.save(); ctx.translate(player.x + Math.cos(za) * 58, player.y + Math.sin(za) * 58); ctx.rotate(za);
                    ctx.fillStyle = '#4de2f0'; ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-6, -8); ctx.lineTo(-3, 0); ctx.lineTo(-6, 8); ctx.closePath(); ctx.fill();
                    ctx.restore();
                  }

                  for (const pr of projectiles) {
                    ctx.fillStyle = pr.col || '#84ff3b'; ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.r, 0, Math.PI * 2); ctx.fill();
                  }

                  for (const tr of trees) {
                    if (!isNearCam(tr.x, tr.y, tr.r + 40)) continue;
                    const pUnder = player && player.alive && distSq(player.x, player.y, tr.x, tr.y) < (tr.r * 0.95) ** 2;
                    ctx.save();
                    ctx.translate(tr.x + Math.sin(globalTime * 1.3 + tr.ph) * 3, tr.y);
                    ctx.globalAlpha = pUnder ? 0.34 : 0.76;
                    ctx.fillStyle = 'rgba(0,0,0,0.32)'; ctx.beginPath(); ctx.arc(12, 16, tr.r * 0.9, 0, Math.PI * 2); ctx.fill();
                    for (let l = 0; l < 5; l++) {
                      const a = (l / 5) * Math.PI * 2 + tr.ph;
                      ctx.fillStyle = l % 2 === 0 ? '#1b521a' : '#266b22';
                      ctx.beginPath(); ctx.arc(Math.cos(a) * tr.r * 0.36, Math.sin(a) * tr.r * 0.36, tr.r * 0.56, 0, Math.PI * 2); ctx.fill();
                    }
                    ctx.fillStyle = '#36852c'; ctx.beginPath(); ctx.arc(-tr.r * 0.1, -tr.r * 0.1, tr.r * 0.42, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                  }

                  for (const pt of particles) {
                    ctx.globalAlpha = clamp(pt.life / pt.maxLife, 0, 1);
                    ctx.fillStyle = pt.color; ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2); ctx.fill();
                  }
                  ctx.globalAlpha = 1;
                  ctx.font = '900 13px sans-serif'; ctx.textAlign = 'center';
                  for (const ft of floatTexts) {
                    ctx.globalAlpha = clamp(ft.life / ft.maxLife, 0, 1);
                    ctx.fillStyle = ft.color; ctx.fillText(ft.text, ft.x, ft.y);
                  }
                  ctx.restore();

                  if (dayCycle >= 48) {
                    const dusk = dayCycle < 78 ? Math.sin(((dayCycle - 48) / 30) * Math.PI) : 0;
                    const night = dayCycle >= 78 ? Math.sin(((dayCycle - 78) / 42) * Math.PI) : 0;
                    if (dusk > 0.02) { ctx.fillStyle = `rgba(180, 90, 25, ${dusk * 0.15})`; ctx.fillRect(0, 0, appW, appH); }
                    if (night > 0.02) { ctx.fillStyle = `rgba(6, 14, 30, ${night * 0.32})`; ctx.fillRect(0, 0, appW, appH); }
                  }
                  if (profile.settings.gfx !== 'low' && weatherRain) {
                    ctx.strokeStyle = 'rgba(180, 225, 255, 0.25)'; ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    for (const rd of rainDrops) {
                      rd.x -= rd.v * 0.2 * dt; rd.y += rd.v * dt;
                      if (rd.y > appH) { rd.y = -20; rd.x = rand(0, appW + 100); }
                      ctx.moveTo(rd.x, rd.y); ctx.lineTo(rd.x - 4, rd.y + rd.l);
                    }
                    ctx.stroke();
                  }
                }

                function mainLoop(ts) {
                  const dt = Math.min(0.05, (ts - (lastFrame || ts)) / 1000);
                  lastFrame = ts; globalTime += dt;
                  fpsCount++; fpsTimer += dt;
                  if (fpsTimer >= 0.5) { fpsVal = Math.round(fpsCount / fpsTimer); fpsCount = 0; fpsTimer = 0; }
                  if (screenState === 'playing') updateGame(dt);
                  renderGame(dt);
                  requestAnimationFrame(mainLoop);
                }

                // -------------------- UI, SHOP & 24-SNAKE PAGE WIRING --------------------
                function refreshLobbyUI() {
                  document.getElementById('lbAvatar').textContent = profile.avatar;
                  document.getElementById('lbLvl').textContent = `LV.${profile.level}`;
                  document.getElementById('lbName').textContent = profile.name;
                  document.getElementById('lbRank').textContent = getRank(profile.level);
                  document.getElementById('lbTitle').textContent = profile.title;
                  document.getElementById('lbCoins').textContent = profile.coins.toLocaleString();
                  document.getElementById('lbDiamonds').textContent = profile.diamonds.toLocaleString();
                  document.getElementById('mCoins').textContent = profile.coins.toLocaleString();
                  document.getElementById('mDias').textContent = profile.diamonds.toLocaleString();
                  const sp = SPECIES.find(s => s.id === profile.selectedSnake) || SPECIES[0];
                  const bi = BIOMES.find(b => b.id === profile.selectedBiome) || BIOMES[0];
                  document.getElementById('scSnake').textContent = sp.name;
                  document.getElementById('scBiome').textContent = bi.name;
