                };

                let profile = (() => {
                  try {
                    const raw = localStorage.getItem('serpent_wild_50_v2');
                    if (!raw) return JSON.parse(JSON.stringify(DEFAULT_PROFILE));
                    const d = JSON.parse(raw);
                    return { ...JSON.parse(JSON.stringify(DEFAULT_PROFILE)), ...d, settings: { ...DEFAULT_PROFILE.settings, ...(d.settings || {}) }, stats: { ...DEFAULT_PROFILE.stats, ...(d.stats || {}) } };
