          cat << 'GAMEHTML' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
            <title>SERPENT WILD: APEX — v23 Worms Zone Pro</title>
            <style>
              :root {
                --bg-grass: #1a7322;
                --panel-border: rgba(118, 206, 255, 0.48);
                --gold: #ffd23f;
                --green: #69f03a;
                --cyan: #4de2f0;
                --text-main: #ffffff;
                --text-muted: #b8d8f8;
              }
              * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
              html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg-grass); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
              #gameCanvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; touch-action: none; }
              button, input { touch-action: manipulation; font-family: inherit; }

              .wz-panel {
                background: linear-gradient(165deg, rgba(24, 58, 114, 0.96), rgba(10, 26, 58, 0.98));
                border: 2px solid var(--panel-border);
                box-shadow: 0 8px 24px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.22);
              }
              .btn-battle {
                border: 3px solid #d4ff8a; border-radius: 18px; padding: 12px 28px;
                background: linear-gradient(180deg, #8cff3b 0%, #3ec918 55%, #1d8a09 100%);
                color: #ffffff; font-size: 18px; font-weight: 900; letter-spacing: 1px;
                text-shadow: 0 2px 3px rgba(0,0,0,0.55);
                box-shadow: 0 6px 0 #145c06, 0 10px 22px rgba(0,0,0,0.5);
                cursor: pointer;
              }
              .btn-battle:active { transform: translateY(3px); box-shadow: 0 3px 0 #145c06; }
              .btn-gold {
                border: 2px solid #fff3a1; border-radius: 13px; padding: 8px 15px;
                background: linear-gradient(180deg, #ffe259 0%, #f5a623 65%, #c77208 100%);
                color: #241300; font-size: 12px; font-weight: 900; text-transform: uppercase;
                box-shadow: 0 4px 0 #8a4b00; cursor: pointer;
              }
              .btn-gold:active { transform: translateY(2px); }
              .btn-blue {
                border: 2px solid #9cf0ff; border-radius: 13px; padding: 8px 14px;
                background: linear-gradient(180deg, #42c6ff 0%, #1678d4 65%, #0c4894 100%);
                color: #ffffff; font-size: 11.5px; font-weight: 900; text-transform: uppercase;
                box-shadow: 0 4px 0 #082e63; cursor: pointer;
              }
              .btn-ad {
                border: 2px solid #ffe875; border-radius: 14px; padding: 7px 12px;
                background: linear-gradient(180deg, #ff7a18 0%, #e03e12 70%, #a32005 100%);
                color: #fff; font-size: 11px; font-weight: 900; text-transform: uppercase;
                box-shadow: 0 4px 0 #6e1202; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
              }
              .btn-ghost {
                border: 1.5px solid rgba(255,255,255,0.28); border-radius: 12px; padding: 8px 14px;
                background: rgba(255,255,255,0.1); color: #eef7ff; font-size: 11.5px; font-weight: 800; cursor: pointer;
              }

              @keyframes champShine {
                0% { background-position: 0% 50%; transform: scale(1); }
                50% { background-position: 100% 50%; transform: scale(1.05); }
                100% { background-position: 0% 50%; transform: scale(1); }
              }
              .world-champ-title {
                display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 9px; font-weight: 900;
                letter-spacing: 0.7px; text-transform: uppercase; color: #1b0e00;
                background: linear-gradient(90deg, #ffe259, #ff6b81, #59f4ff, #8cff3b, #ffe259);
                background-size: 300% 300%; animation: champShine 2.4s linear infinite;
                box-shadow: 0 0 12px rgba(255, 218, 71, 0.85);
              }

              #splashScreen {
                position: fixed; inset: 0; z-index: 140; display: flex; flex-direction: column;
                align-items: center; justify-content: space-between; padding: 18px 24px 26px;
                background: radial-gradient(circle at 50% 42%, #2da32d 0%, #13541b 65%, #07260b 100%);
                transition: opacity 0.35s ease;
              }
              #splashScreen.fade-out { opacity: 0; pointer-events: none; }
              .splash-title {
                font-size: clamp(28px, 5.5vw, 52px); font-weight: 900; letter-spacing: 2px;
                background: linear-gradient(180deg, #fffbe0 0%, #ffd23f 55%, #e67e00 100%);
                -webkit-background-clip: text; -webkit-text-fill-color: transparent;
                filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
              }
              #loaderWrap { display: none; width: 100%; max-width: 400px; flex-direction: column; gap: 6px; }
              .loader-bar { width: 100%; height: 11px; border-radius: 999px; background: rgba(0,0,0,0.35); border: 2px solid #ffd23f; overflow: hidden; }
              #loaderFill { width: 0%; height: 100%; background: linear-gradient(90deg, #7cff3b, #ffd23f); transition: width 0.1s linear; }

              #lobbyScreen { position: fixed; inset: 0; z-index: 30; display: none; pointer-events: none; }
              #lobbyTopBar {
                position: absolute; top: 10px; left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right));
                display: flex; justify-content: space-between; align-items: center; gap: 8px;
              }
              .top-left-grp, .top-right-grp { pointer-events: auto; display: flex; align-items: center; gap: 7px; }
              .pill-box { display: flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 13px; font-size: 12px; font-weight: 900; cursor: pointer; }
              .net-pill { padding: 5px 10px; border-radius: 999px; font-size: 10px; font-weight: 900; cursor: pointer; border: 2px solid #7cff3b; background: rgba(15, 74, 24, 0.92); color: #a8ff78; }
              .net-pill.offline { border-color: #ff9f43; background: rgba(74, 38, 12, 0.92); color: #ffd280; }
              .icon-sq { width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 17px; cursor: pointer; color: #fff; }

              #lobbyLeftRail { position: absolute; left: max(12px, env(safe-area-inset-left)); top: 52%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
              #lobbyRightRail { position: absolute; right: max(12px, env(safe-area-inset-right)); top: 52%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px; pointer-events: auto; align-items: flex-end; }
              .wz-tile-btn { display: flex; align-items: center; gap: 8px; padding: 8px 13px; border-radius: 14px; font-size: 11px; font-weight: 900; text-transform: uppercase; color: #fff; cursor: pointer; min-width: 126px; }
              .wz-tile-btn:active { transform: scale(0.95); }
              .wz-tile-btn.gift { background: linear-gradient(135deg, #d9387a, #7d1546); border: 2px solid #ff9ec4; }
              .wz-tile-btn.chest { background: linear-gradient(135deg, #c97b12, #6b3804); border: 2px solid #ffe07d; }
              .wz-tile-btn.cal { background: linear-gradient(135deg, #1b8c6e, #0c4738); border: 2px solid #6effd2; }
              .wz-tile-btn.world { background: linear-gradient(135deg, #6b38d9, #311278); border: 2px solid #c8a6ff; }
              .wz-tile-btn.workshop { background: linear-gradient(135deg, #1b78d4, #0c3d7a); border: 2px solid #80dcff; }
              .wz-tile-btn.shop { background: linear-gradient(135deg, #e07b10, #8a3d04); border: 2px solid #ffd25c; }

              #lobbyBottomBar { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; pointer-events: auto; }
              .mode-chip { padding: 9px 14px; border-radius: 14px; font-size: 11.5px; font-weight: 900; cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; }

              .modal-backdrop { position: fixed; inset: 0; z-index: 90; display: none; align-items: center; justify-content: center; padding: 8px; background: rgba(4, 14, 24, 0.84); backdrop-filter: blur(7px); }
              .modal-backdrop.open { display: flex; }
              .modal-box { width: 100%; max-width: 920px; height: 92vh; border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; }
              .modal-head { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 9px 15px; background: rgba(7, 18, 40, 0.96); border-bottom: 2px solid rgba(118,206,255,0.28); }
              .modal-title { font-size: 14px; font-weight: 900; letter-spacing: 1px; color: var(--gold); text-transform: uppercase; }
              .close-btn { width: 32px; height: 32px; border-radius: 10px; border: 2px solid #ff7b8a; background: linear-gradient(180deg, #ff5e6c, #c41d31); color: #fff; font-size: 15px; font-weight: 900; cursor: pointer; }
              .modal-body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 12px; }

              .ws-layout { display: flex; gap: 10px; height: 100%; min-height: 0; }
              .ws-left-tabs { display: flex; flex-direction: column; gap: 7px; width: 64px; flex-shrink: 0; }
              .ws-ico-tab { height: 54px; border-radius: 14px; border: 2px solid rgba(120,200,255,0.3); background: rgba(8, 22, 46, 0.9); color: #a8d2ff; font-size: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; }
              .ws-ico-tab span { font-size: 8px; font-weight: 900; text-transform: uppercase; }
              .ws-ico-tab.active { background: linear-gradient(180deg, #32a8ff, #1258b5); border-color: #fff; color: #fff; }
              .ws-center-preview {
                width: 225px; flex-shrink: 0; border-radius: 16px; padding: 10px;
                background: radial-gradient(circle at 50% 44%, #ff6b81 0%, #6b1d57 52%, #1d1245 100%);
                border: 2px solid rgba(255, 210, 63, 0.65);
                display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 6px;
              }
              #wsPreviewCanvas { width: 100%; flex: 1; min-height: 130px; border-radius: 12px; display: block; }
              .ws-right-content { flex: 1; min-width: 0; overflow-y: auto; padding-right: 2px; }
              .ws-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(106px, 1fr)); gap: 8px; }
              .snake-card { padding: 7px 5px; border-radius: 14px; border: 2px solid rgba(255,255,255,0.28); display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; text-align: center; }
              .snake-card.t-Free      { background: linear-gradient(160deg, #28a645, #125924); border-color: #7cff4d; }
              .snake-card.t-Rare      { background: linear-gradient(160deg, #2478d9, #0f3b7a); border-color: #69c9ff; }
              .snake-card.t-Epic      { background: linear-gradient(160deg, #8b32d4, #3d126b); border-color: #da8cff; }
              .snake-card.t-Legendary { background: linear-gradient(160deg, #de7e16, #6e3604); border-color: #ffd859; }
              .snake-card.t-Mythical  { background: linear-gradient(160deg, #e02868, #5c105e); border-color: #ff85c0; }
              .snake-card.selected    { outline: 3px solid #ffe259; transform: scale(1.03); }
              .snake-thumb { width: 68px; height: 68px; border-radius: 10px; background: rgba(0,0,0,0.18); display: block; }
              .sc-name { font-size: 9.5px; font-weight: 900; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
              .sc-price { font-size: 9px; font-weight: 900; padding: 2px 5px; border-radius: 7px; background: rgba(0,0,0,0.48); width: 100%; }

              .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 9px; }
              .item-card { padding: 10px; border-radius: 14px; background: rgba(255,255,255,0.08); border: 2px solid rgba(130,205,255,0.28); display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
              .item-card.selected { border-color: var(--gold); background: rgba(255, 210, 63, 0.16); }
              .sec-lbl { font-size: 10.5px; font-weight: 900; color: var(--gold); text-transform: uppercase; letter-spacing: 0.9px; margin: 8px 0 6px; }

              .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 8px; }
              .cal-hdr { text-align: center; font-size: 10px; font-weight: 900; color: #8cd4ff; padding-bottom: 4px; }
              .cal-day { border-radius: 11px; padding: 7px 4px; text-align: center; font-size: 11px; font-weight: 900; background: rgba(255,255,255,0.07); border: 1.5px solid rgba(255,255,255,0.14); display: flex; flex-direction: column; align-items: center; gap: 2px; }
              .cal-day.played { background: rgba(62, 201, 24, 0.25); border-color: #69f03a; color: #d6ffbf; }
              .cal-day.missed { background: rgba(255, 71, 87, 0.16); border-color: rgba(255, 71, 87, 0.45); color: #ffb8bf; }
              .cal-day.today  { outline: 2.5px solid #ffd23f; }

              .wl-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 12px; border-radius: 13px; margin-bottom: 6px; background: rgba(255,255,255,0.07); border: 1.5px solid rgba(130,205,255,0.2); }
              .wl-row.top1 { background: linear-gradient(135deg, rgba(255, 196, 0, 0.28), rgba(140, 48, 255, 0.28)); border: 2px solid #ffd23f; box-shadow: 0 0 18px rgba(255, 210, 63, 0.35); }
              .wl-row.me { border-color: #69f03a; background: rgba(105, 240, 58, 0.18); }

              .setting-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; border-radius: 12px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14); margin-bottom: 7px; gap: 10px; }
              .chip { padding: 5px 11px; border-radius: 9px; border: 1.5px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: #e6f4ff; font-size: 11px; font-weight: 800; cursor: pointer; }
              .chip.selected { border-color: var(--gold); background: rgba(255,210,63,0.25); color: #fff; }
              .text-input { width: 100%; padding: 7px 11px; border-radius: 10px; border: 2px solid #6ec6ff; background: rgba(5,16,36,0.9); color: #fff; font-size: 13px; font-weight: 900; outline: none; }

              #hud { position: fixed; inset: 0; z-index: 20; display: none; pointer-events: none; }
              #hudTopLeft { position: absolute; top: 8px; left: max(10px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 5px; }
              .score-pill { padding: 6px 13px; border-radius: 14px; display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 900; }
              #hudScoreBig { font-size: 20px; font-weight: 900; color: #ffe259; font-variant-numeric: tabular-nums; }
              #hudKillsPill { font-size: 11.5px; color: #ff8594; }
              #activeBuffRow { display: flex; gap: 5px; flex-wrap: wrap; }
              .buff-tag { padding: 3px 8px; border-radius: 999px; font-size: 9.5px; font-weight: 900; background: rgba(16, 42, 84, 0.9); border: 1.5px solid #59e8ff; color: #aef6ff; }

              #defeatBanner { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: none; padding: 7px 18px; border-radius: 999px; background: linear-gradient(135deg, #ff512f, #f09819); color: #fff; font-size: 13px; font-weight: 900; border: 2px solid #fff3a1; }
              #modeTimerPill { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: none; padding: 4px 13px; border-radius: 999px; font-size: 11px; font-weight: 900; color: #ffe259; }

              #hudTopRight { position: absolute; top: 8px; right: max(10px, env(safe-area-inset-right)); display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
              .hud-tools { display: flex; gap: 5px; pointer-events: auto; }
              #arenaLeaderBox { width: 176px; padding: 6px 9px; border-radius: 12px; background: rgba(8, 22, 16, 0.72); border: 1.5px solid rgba(145, 235, 118, 0.45); font-size: 9.5px; font-weight: 800; display: flex; flex-direction: column; gap: 2px; }
              .alb-row { display: flex; justify-content: space-between; gap: 6px; color: #e2f5dc; }
              .alb-row.me { color: #ffe259; font-weight: 900; background: rgba(255,210,63,0.18); padding: 1px 4px; border-radius: 5px; }
              #minimapBox { width: 82px; height: 82px; border-radius: 50%; padding: 3px; pointer-events: auto; background: rgba(8, 24, 14, 0.82); border: 2px solid rgba(145, 235, 118, 0.65); }
              #minimapCanvas { width: 100%; height: 100%; border-radius: 50%; display: block; }

              #quickPotions { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 7px; pointer-events: auto; }
              .qp-btn { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #7ee6ff; background: rgba(12, 32, 68, 0.9); color: #fff; font-size: 17px; cursor: pointer; position: relative; display: flex; align-items: center; justify-content: center; }
              .qp-cnt { position: absolute; bottom: -3px; right: -3px; background: var(--gold); color: #1f1100; font-size: 9px; font-weight: 900; padding: 1px 5px; border-radius: 8px; }

              #floatingJoy { position: absolute; width: 108px; height: 108px; margin-left: -54px; margin-top: -54px; border-radius: 50%; background: rgba(255,255,255,0.16); border: 2px solid rgba(255,255,255,0.55); opacity: 0; pointer-events: none; transition: opacity 0.12s; }
              #floatingJoy.visible { opacity: 1; }
              #floatingJoy.fixed-mode { left: 82px !important; top: calc(100% - 82px) !important; opacity: 0.85 !important; }
              #floatingJoyKnob { position: absolute; top: 50%; left: 50%; width: 42px; height: 42px; border-radius: 50%; transform: translate(-50%,-50%); background: radial-gradient(circle at 35% 30%, #ffffff, #8cff3b 70%, #248a0c); border: 2px solid #fff; }

              #btnBoost { pointer-events: auto; position: absolute; bottom: 18px; right: max(18px, env(safe-area-inset-right)); width: 78px; height: 78px; border-radius: 50%; border: 3px solid #fff3a1; background: radial-gradient(circle at 30% 25%, #ffe259, #ff7a18 70%, #b52b04); color: #fff; font-size: 24px; font-weight: 900; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 8px 20px rgba(0,0,0,0.55); }
              #btnBoost.active { transform: scale(0.9); }

              .popup-card { width: 92%; max-width: 420px; padding: 20px; border-radius: 20px; text-align: center; }
              .ad-bar { width: 100%; height: 10px; border-radius: 999px; background: rgba(255,255,255,0.15); overflow: hidden; margin: 12px 0; }
              #adProgress { width: 0%; height: 100%; background: linear-gradient(90deg, #ff7a18, #ffe259); }
            </style>
          </head>
          <body>
            <canvas id="gameCanvas"></canvas>

            <div id="splashScreen">
              <div style="font-size:11px;font-weight:900;letter-spacing:4px;color:#c8ff9e;">APEX WILD STUDIOS</div>
              <div style="text-align:center;margin:auto 0;">
                <div style="font-size:52px;margin-bottom:4px;">🐍</div>
                <div class="splash-title">SERPENT WILD</div>
                <div style="font-size:11.5px;font-weight:900;letter-spacing:2.5px;color:#a8ff78;margin-top:4px;">v23 • 45+ COSTUMED SNAKES • WORMS ZONE PRO</div>
              </div>
              <div id="tapEnterWrap" style="width:100%;max-width:300px;text-align:center;">
                <button class="btn-battle" id="btnTapEnter" type="button" style="width:100%;">PLAY NOW!</button>
              </div>
              <div id="loaderWrap">
                <div style="display:flex;justify-content:space-between;font-size:11px;font-weight:900;color:#e8ffdb;">
                  <span>Loading 45+ Costumed Snakes &amp; Arena...</span><span id="loaderPct">0%</span>
                </div>
                <div class="loader-bar"><div id="loaderFill"></div></div>
              </div>
            </div>

            <div id="lobbyScreen">
              <div id="lobbyTopBar">
                <div class="top-left-grp">
                  <div class="pill-box wz-panel" id="btnProfileOpen">
                    <span id="lbAvatar" style="font-size:18px;">🐍</span>
                    <div>
                      <div style="font-size:12px;color:#fff;" id="lbName">ApexHunter</div>
                      <div style="font-size:9px;color:#ffe259;" id="lbChampWrap">LV.1 • Best: 0</div>
                    </div>
                  </div>
                  <button class="net-pill" id="btnNetToggle" type="button">🟢 ONLINE</button>
                </div>
                <div class="top-right-grp">
                  <div class="pill-box wz-panel" id="btnTopCoins"><span>🪙</span><span id="lbCoins">2,500</span><span style="color:#69f03a;font-size:14px;">+</span></div>
                  <div class="pill-box wz-panel" id="btnTopGems"><span>💎</span><span id="lbDias">50</span></div>
                  <button class="icon-sq wz-panel" id="btnLobbyAudio" type="button">🔊</button>
                  <button class="icon-sq wz-panel" id="btnLobbySettings" type="button">⚙️</button>
                </div>
              </div>

              <div id="lobbyLeftRail">
                <button class="wz-tile-btn gift" id="btnOpenGift" type="button"><span>🎁</span><span>Open Gift</span></button>
                <button class="wz-tile-btn chest" id="btnReadyChest" type="button"><span>🧰</span><span>Ready Chest</span></button>
                <button class="wz-tile-btn cal" id="btnOpenCal" type="button"><span>📅</span><span>Calendar</span></button>
                <button class="wz-tile-btn world" id="btnOpenWorld" type="button"><span>🌍</span><span>World Top</span></button>
              </div>

              <div id="lobbyRightRail">
                <button class="wz-tile-btn workshop" id="btnOpenWorkshop" type="button"><span>🎨</span><span>Workshop</span></button>
                <button class="wz-tile-btn shop" id="btnOpenShop" type="button"><span>🛒</span><span>Shop</span></button>
                <button class="btn-ad" id="btnAdGold" type="button"><span>🎬</span><span>+300 🪙 AD</span></button>
                <button class="btn-ad" id="btnAd10k" type="button" style="background:linear-gradient(180deg,#9b38ff,#5810a8);border-color:#e2b8ff;box-shadow:0 4px 0 #310663;"><span>🎬</span><span>10K START AD</span></button>
              </div>

              <div id="lobbyBottomBar">
                <button class="mode-chip wz-panel" id="btnModeCycle" type="button"><span>♾️</span><span id="modeLabel">Infinity</span><span>▾</span></button>
                <button class="btn-battle" id="btnStartMatch" type="button">To battle!</button>
              </div>
            </div>

            <div class="modal-backdrop" id="workshopModal">
              <div class="modal-box wz-panel">
