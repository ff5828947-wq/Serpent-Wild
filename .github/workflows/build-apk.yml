                function drawSnakeCardThumb(thumbCanvas, sp) {
                  const tc = thumbCanvas.getContext('2d');
                  const w = thumbCanvas.width, h = thumbCanvas.height;
                  tc.clearRect(0, 0, w, h);
                  tc.save();
                  tc.translate(w * 0.46, h * 0.5);
                  if (sp.glow) { tc.shadowColor = sp.glow; tc.shadowBlur = 14; }
                  tc.fillStyle = sp.mid;
                  tc.beginPath(); tc.ellipse(-18, 0, 17, 12, 0, 0, Math.PI * 2); tc.fill();
                  drawSpeciesHead(tc, sp, 16, 0.5, 0, 0);
                  tc.restore();
                }

                class Snake {
                  constructor({ name, species, x, y, isPlayer = false, mass = 16 }) {
                    this.name = name; this.species = species; this.isPlayer = isPlayer; this.alive = true;
                    this.x = x; this.y = y; this.angle = rand(0, Math.PI * 2); this.targetAngle = this.angle;
                    this.mass = mass; this.kills = 0; this.terrain = 'ground'; this.inBush = false;
                    this.spawnShield = isPlayer ? 3.5 : 1.5;
                    this.stamina = 100; this.boosting = false; this.turnDelta = 0;
                    this.hoodFlare = species.hood ? 0.55 : 0; this.jawOpen = 0;
                    this.slitherPhase = rand(0, 6.28); this.tongueTimer = rand(0.6, 2.0); this.tongueExt = 0;
                    this.trackCd = 0; this.rippleCd = 0; this.trailCd = 0;
                    this.aiTimer = rand(0, 0.5); this.aiWander = this.angle; this.aiBoost = 0;
                    this.segments = [];
                    const cnt = this.getSegCount();
                    for (let i = 0; i < cnt; i++) this.segments.push({ x: x - Math.cos(this.angle) * i * 5.2, y: y - Math.sin(this.angle) * i * 5.2 });
                  }

                  getRadius() { return clamp(9.5 + Math.pow(this.mass, 0.46) * 1.48, 9.5, 36); }
                  getSegCount() { return Math.min(92, Math.floor(14 + this.mass * 0.42)); }
                  getLen() { return Math.floor(this.mass * 4.5); }

                  getHalfWidth(i, len, baseR) {
                    const t = i / Math.max(1, len - 1);
                    let pw = t < 0.08 ? lerp(0.92, 1.0, t / 0.08)
                           : t < 0.78 ? (1.0 + Math.sin(((t - 0.08) / 0.7) * Math.PI) * 0.1)
                           : lerp(1.0, 0.68, (t - 0.78) / 0.22);
                    let hood = 1.0;
                    if (this.species.hood && this.hoodFlare > 0.04 && i >= 1 && i <= 7) {
                      hood = 1 + Math.sin(clamp((i - 0.5) / 6.5, 0, 1) * Math.PI) * 0.85 * this.hoodFlare;
                    }
                    return baseR * this.species.girth * pw * hood;
                  }

                  updateAI(dt, near) {
                    this.aiTimer -= dt;
                    if (this.aiBoost > 0) this.aiBoost -= dt;
                    const dZone = dist(this.x, this.y, safeZone.cx, safeZone.cy);
                    if (safeZone.active && dZone > safeZone.r - 240) {
                      this.targetAngle = Math.atan2(safeZone.cy - this.y, safeZone.cx - this.x);
                      this.boosting = dZone > safeZone.r; return;
                    }
                    if (dist(this.x, this.y, WORLD_CENTER, WORLD_CENTER) > ARENA_RADIUS - 360) {
                      this.targetAngle = Math.atan2(WORLD_CENTER - this.y, WORLD_CENTER - this.x);
                      this.boosting = false; return;
                    }
                    const rivals = queryGrid(snakeGrid, this.x, this.y, 260);
                    let avX = 0, avY = 0, danger = false;
                    for (const o of rivals) {
                      if (o === this || !o.alive) continue;
                      const step = Math.max(1, Math.floor(o.segments.length / 10));
                      for (let k = 0; k < o.segments.length; k += step) {
                        const sg = o.segments[k];
                        const d2 = distSq(this.x, this.y, sg.x, sg.y);
                        if (d2 < 140 * 140) { const d = Math.sqrt(d2) || 1; avX += (this.x - sg.x) / d; avY += (this.y - sg.y) / d; danger = true; }
                      }
                    }
                    if (danger) { this.targetAngle = Math.atan2(avY, avX); this.boosting = this.stamina > 40; return; }
                    if (this.aiTimer <= 0) {
                      this.aiTimer = near ? rand(0.3, 0.6) : rand(0.7, 1.3);
                      this.aiWander += rand(-1.0, 1.0);
                      this.targetAngle = this.aiWander;
                      let bestX = null, bestY = null, bestD = 380 * 380;
                      for (const m of meatList) { const d2 = distSq(this.x, this.y, m.x, m.y); if (d2 < bestD) { bestD = d2; bestX = m.x; bestY = m.y; } }
                      if (bestX === null) {
                        const pIdxs = queryGrid(preyGrid, this.x, this.y, 340);
                        for (const idx of pIdxs) { const p = preyList[idx]; if (!p) continue; const d2 = distSq(this.x, this.y, p.x, p.y); if (d2 < bestD) { bestD = d2; bestX = p.x; bestY = p.y; } }
                      }
                      if (bestX !== null) { this.targetAngle = Math.atan2(bestY - this.y, bestX - this.x); if (bestD < 160 * 160 && this.stamina > 55 && Math.random() < 0.25) this.aiBoost = 0.45; }
                    }
                    this.boosting = this.aiBoost > 0 && this.stamina > 20;
                  }

                  update(dt) {
                    if (!this.alive) return;
                    if (this.spawnShield > 0) this.spawnShield = Math.max(0, this.spawnShield - dt);
                    if (this.jawOpen > 0) this.jawOpen = Math.max(0, this.jawOpen - dt * 3.2);

                    const near = this.isPlayer || isNearCam(this.x, this.y, 800);
                    if (!this.isPlayer) this.updateAI(dt, near);

                    this.terrain = getTerrainAt(this.x, this.y);
                    this.inBush = isUnderTree(this.x, this.y);

                    const stBonus = this.isPlayer ? profile.upgrades.stamina : 0;
                    const turboOn = this.isPlayer && activePotion.id === 'turbo' && activePotion.timer > 0;
                    const canBoost = (this.boosting || turboOn) && this.stamina > 5 && this.mass > 11;
                    if (this.boosting && !turboOn && canBoost) { this.stamina = Math.max(0, this.stamina - dt * (26 - stBonus * 2.2)); this.mass = Math.max(11, this.mass - dt * 0.9); }
                    else this.stamina = Math.min(100, this.stamina + dt * (19 + stBonus * 2.5));

                    const spdBonus = this.isPlayer ? profile.upgrades.speed * 7 : 0;
                    let spd = 178 + this.species.speed * 0.3 + spdBonus;
                    if (canBoost) spd *= turboOn ? 1.72 : 1.6;
                    if (this.terrain === 'water') spd *= (this.species.id === 'shark' || this.species.id === 'croco' || this.species.id === 'waterdrag' ? 1.35 : 1.18);
                    else if (this.terrain === 'mud') spd *= 0.72;

                    const agBonus = this.isPlayer ? profile.upgrades.agility * 0.25 : 0;
                    const turnRate = 4.6 + this.species.turn * 0.015 + agBonus;
                    const diff = angleDiff(this.targetAngle, this.angle);
                    this.turnDelta = lerp(this.turnDelta, clamp(diff * 2.5, -1, 1), dt * 10);
                    this.angle += clamp(diff, -turnRate * dt, turnRate * dt);
                    this.slitherPhase += dt * (canBoost ? 14 : 9.2);
                    const sAng = this.angle + Math.sin(this.slitherPhase) * 0.08;
                    this.x += Math.cos(sAng) * spd * dt;
                    this.y += Math.sin(sAng) * spd * dt;

                    const r = this.getRadius();
                    if (dist(this.x, this.y, WORLD_CENTER, WORLD_CENTER) + r > ARENA_RADIUS) { killSnake(this, null, 'Jungle Cliff'); return; }
                    if (safeZone.active && dist(this.x, this.y, safeZone.cx, safeZone.cy) > safeZone.r) {
                      this.mass -= (2.5 + (safeZone.stage - 1) * 1.2) * dt;
                      if (this.mass < 9) { killSnake(this, null, 'Storm Zone'); return; }
                    }

                    this.segments[0].x = this.x; this.segments[0].y = this.y;
                    const spc = r * 0.46;
                    for (let i = 1; i < this.segments.length; i++) {
                      const p = this.segments[i - 1], c = this.segments[i];
                      if (i === 1) {
                        c.x = lerp(c.x, p.x - Math.cos(this.angle) * spc, clamp(dt * 12, 0, 0.55));
                        c.y = lerp(c.y, p.y - Math.sin(this.angle) * spc, clamp(dt * 12, 0, 0.55));
                      }
                      const dx = c.x - p.x, dy = c.y - p.y, d = Math.hypot(dx, dy) || 0.001;
                      if (d > spc) { const rt = spc / d; c.x = p.x + dx * rt; c.y = p.y + dy * rt; }
                    }
                    const tLen = this.getSegCount();
                    while (this.segments.length < tLen) { const tl = this.segments[this.segments.length - 1]; this.segments.push({ x: tl.x, y: tl.y }); }
                    while (this.segments.length > tLen && this.segments.length > 12) this.segments.pop();

                    if (near) {
                      const wantHood = this.species.hood ? (canBoost ? 1.0 : 0.48) : 0;
                      this.hoodFlare = lerp(this.hoodFlare, wantHood, dt * 6);
                      this.tongueTimer -= dt;
                      if (this.tongueTimer <= 0) {
                        const p = -this.tongueTimer / 0.4;
                        if (p < 1) this.tongueExt = Math.sin(p * Math.PI);
                        else { this.tongueExt = 0; this.tongueTimer = rand(1.0, 2.4); }
                      } else this.tongueExt = 0;

                      this.rippleCd -= dt;
                      if (this.terrain === 'water' && this.rippleCd <= 0 && ripples.length < 36) { ripples.push({ x: this.x, y: this.y, r: r * 0.7, maxR: r * 3.0, life: 0.7, maxLife: 0.7 }); this.rippleCd = 0.18; }
                      this.trackCd -= dt;
                      if (this.terrain === 'mud' && this.trackCd <= 0 && tracks.length < 70) { tracks.push({ x: this.segments[3].x, y: this.segments[3].y, r: r * 0.85, ang: this.angle, life: 3.0, maxLife: 3.0 }); this.trackCd = 0.12; }
                      this.trailCd -= dt;
                      if (canBoost && this.trailCd <= 0) { spawnParticles(this.segments[Math.min(5, this.segments.length - 1)].x, this.segments[Math.min(5, this.segments.length - 1)].y, this.species.glow || this.species.accent, 2, 55); this.trailCd = 0.08; }
                    }
                  }

                  draw(c, showLabel = true) {
                    if (!this.alive || this.segments.length < 4) return;
                    const baseR = this.getRadius(), len = this.segments.length;
                    const detail = profile.settings.gfx !== 'low';
                    const ultra = profile.settings.gfx === 'ultra';

                    const pts = new Array(len);
                    for (let i = 0; i < len; i++) {
                      const seg = this.segments[i];
                      const prev = this.segments[Math.max(0, i - 1)], next = this.segments[Math.min(len - 1, i + 1)];
                      const ang = i === 0 ? Math.atan2(seg.y - this.segments[1].y, seg.x - this.segments[1].x) : Math.atan2(prev.y - next.y, prev.x - next.x);
                      const nx = -Math.sin(ang), ny = Math.cos(ang);
                      const mask = i < 3 ? 0 : Math.min(1, (i - 2) / 4) * (1 - (i / len) * 0.2);
                      const wave = Math.sin(this.slitherPhase - i * 0.42) * (baseR * 0.16 * mask);
                      pts[i] = { x: seg.x + nx * wave, y: seg.y + ny * wave, ang, nx, ny, w: this.getHalfWidth(i, len, baseR) };
                    }

                    const traceBody = (ox = 0, oy = 0, sw = 1) => {
                      c.beginPath();
                      const p0 = pts[0];
                      c.moveTo(p0.x + ox + p0.nx * p0.w * sw, p0.y + oy + p0.ny * p0.w * sw);
                      for (let i = 1; i < len - 1; i++) {
                        const a = pts[i], b = pts[i + 1];
                        const ax = a.x + a.nx * a.w * sw + ox, ay = a.y + a.ny * a.w * sw + oy;
                        const bx = b.x + b.nx * b.w * sw + ox, by = b.y + b.ny * b.w * sw + oy;
                        c.quadraticCurveTo(ax, ay, (ax + bx) * 0.5, (ay + by) * 0.5);
                      }
                      const tl = pts[len - 1];
                      c.arc(tl.x + ox, tl.y + oy, tl.w * sw, tl.ang + Math.PI / 2, tl.ang + Math.PI * 1.5, false);
                      for (let i = len - 2; i >= 1; i--) {
                        const a = pts[i], b = pts[i - 1];
                        const ax = a.x - a.nx * a.w * sw + ox, ay = a.y - a.ny * a.w * sw + oy;
                        const bx = b.x - b.nx * b.w * sw + ox, by = b.y - b.ny * b.w * sw + oy;
                        c.quadraticCurveTo(ax, ay, (ax + bx) * 0.5, (ay + by) * 0.5);
                      }
                      c.closePath();
                    };

                    // 100% SOLID, DEEP OPAQUE BODY (NO TRANSPARENCY!)
                    c.save();
                    c.globalAlpha = 1.0;

                    const auraCol = this.species.glow || (this.boosting ? '#ffe45c' : null);
                    if (auraCol && detail) {
                      c.save();
                      traceBody(0, 0, this.boosting ? 1.24 : 1.15);
                      c.shadowColor = auraCol; c.shadowBlur = this.boosting ? 22 : 16;
                      c.strokeStyle = auraCol; c.lineWidth = this.boosting ? 4.0 : 3.0;
                      c.globalAlpha = this.boosting ? 0.65 : 0.45;
                      c.stroke(); c.restore();
                    }

                    if (detail) { traceBody(5, 8, 1.05); c.fillStyle = 'rgba(0,0,0,0.48)'; c.fill(); }

                    c.save();
                    traceBody(0, 0, 1.0); c.fillStyle = this.species.dark; c.fill(); c.clip();
                    traceBody(0, 0, 0.92); c.fillStyle = this.species.mid; c.fill();
                    traceBody(-1.2, -1.2, 0.8); c.fillStyle = this.species.base; c.fill();

                    const pat = this.species.pat;
                    const step = ultra ? 2 : 3;
                    for (let i = 2; i < len - 1; i++) {
                      const p = pts[i];
                      const doMark = (i % 3 === 0 || i % 4 === 0);
                      const doScale = detail && (i % step === 0) && p.w > 4.2;
                      if (!doMark && !doScale && !(this.species.hood && i === 4)) continue;

                      c.save(); c.translate(p.x, p.y); c.rotate(p.ang);
                      if (this.species.id === 'tiger' && i % 3 === 0) {
                        c.strokeStyle = '#121010'; c.lineWidth = Math.max(2.4, p.w * 0.25);
                        c.beginPath(); c.moveTo(-p.w * 0.1, -p.w * 0.98); c.quadraticCurveTo(p.w * 0.25, 0, -p.w * 0.1, p.w * 0.98); c.stroke();
                      } else if (this.species.id === 'panda' && i % 5 === 0) {
                        c.fillStyle = '#14171a'; c.fillRect(-p.w * 0.45, -p.w * 1.1, p.w * 0.9, p.w * 2.2);
                      } else if (pat === 'skeleton' && i % 3 === 0) {
                        c.strokeStyle = '#f2f7ff'; c.lineWidth = Math.max(1.8, p.w * 0.16);
                        c.beginPath(); c.moveTo(-p.w * 0.1, -p.w * 0.85); c.quadraticCurveTo(p.w * 0.25, 0, -p.w * 0.1, p.w * 0.85); c.stroke();
                        c.fillStyle = '#ffffff'; c.beginPath(); c.arc(0, 0, p.w * 0.22, 0, Math.PI * 2); c.fill();
                      } else if (pat === 'racer' && i % 2 === 0) {
                        c.fillStyle = '#ffffff'; c.fillRect(-p.w * 0.5, -p.w * 0.22, p.w, p.w * 0.44);
                      } else if (pat === 'croco' && i % 3 === 0) {
                        c.fillStyle = '#113816'; c.fillRect(-p.w * 0.35, -p.w * 0.72, p.w * 0.7, p.w * 1.44);
                        c.fillStyle = this.species.accent; c.beginPath(); c.arc(0, 0, p.w * 0.24, 0, Math.PI * 2); c.fill();
                      } else if (pat === 'plasma' && i % 3 === 0) {
                        c.strokeStyle = '#00f7ff'; c.lineWidth = 1.6; c.beginPath(); c.arc(0, 0, p.w * 0.42, 0, Math.PI * 2); c.stroke();
                        c.fillStyle = this.species.accent; c.beginPath(); c.arc(0, 0, p.w * 0.22, 0, Math.PI * 2); c.fill();
                      } else if (pat === 'd_thunder' && i % 3 === 0) {
                        c.strokeStyle = '#ffea54'; c.lineWidth = 2.2; c.beginPath(); c.moveTo(p.w * 0.5, -p.w * 0.5); c.lineTo(0, 0); c.lineTo(p.w * 0.25, p.w * 0.2); c.lineTo(-p.w * 0.45, p.w * 0.65); c.stroke();
                      } else if (i % 4 === 0) {
                        c.fillStyle = this.species.accent; c.globalAlpha = 0.75;
                        c.beginPath(); c.moveTo(p.w * 0.45, 0); c.lineTo(0, -p.w * 0.52); c.lineTo(-p.w * 0.45, 0); c.lineTo(0, p.w * 0.52); c.closePath(); c.fill();
                        c.globalAlpha = 1.0;
                      }

                      if (doScale && pat !== 'skeleton' && pat !== 'racer' && this.species.id !== 'panda') {
                        const sr = p.w * 0.36;
                        c.strokeStyle = 'rgba(0,0,0,0.28)'; c.lineWidth = 0.9;
                        c.beginPath(); c.arc(0, 0, sr, -1.25, 1.25); c.stroke();
                      }
                      c.restore();
                    }

                    traceBody(-baseR * 0.16, -baseR * 0.16, 0.28);
                    c.fillStyle = 'rgba(255,255,255,0.22)';
                    c.fill();
                    c.restore();

                    traceBody(0, 0, 1.0);
                    c.strokeStyle = 'rgba(0,0,0,0.6)'; c.lineWidth = 1.6; c.stroke();

                    if (this.species.rattle) {
                      const tl = pts[len - 1];
                      c.save(); c.translate(tl.x, tl.y); c.rotate(tl.ang + Math.sin(globalTime * 52) * 0.16);
                      for (let b = 0; b < 5; b++) {
                        c.fillStyle = b % 2 === 0 ? '#dec08e' : '#967442';
                        c.beginPath(); c.ellipse(-b * 4.2 - 4, 0, 3.8 - b * 0.35, 3.3 - b * 0.28, 0, 0, Math.PI * 2); c.fill();
                      }
                      c.restore();
                    }

                    const neckAng = pts[0].ang;
                    const headAng = neckAng + angleDiff(this.angle, neckAng) * 0.55;
                    const hr = baseR * this.species.girth * 1.04;
                    c.save();
                    c.translate(pts[0].x, pts[0].y);
                    c.rotate(headAng);
                    if (detail) { c.fillStyle = 'rgba(0,0,0,0.38)'; c.beginPath(); c.ellipse(4, 6, hr * 1.25, hr * 0.9, 0, 0, Math.PI * 2); c.fill(); }
                    drawSpeciesHead(c, this.species, hr, this.tongueExt, Math.max(this.jawOpen, this.boosting ? 0.28 : 0), this.turnDelta);
                    if (this.spawnShield > 0) {
                      c.strokeStyle = 'rgba(77, 226, 240, 0.85)'; c.lineWidth = 2.5;
                      c.beginPath(); c.arc(0, 0, hr * 1.85, 0, Math.PI * 2); c.stroke();
                    }
                    if (this.isPlayer && showLabel) {
                      c.fillStyle = 'rgba(255, 148, 36, 0.88)';
                      c.beginPath(); c.moveTo(hr * 2.55, 0); c.lineTo(hr * 2.0, -hr * 0.42); c.lineTo(hr * 2.15, 0); c.lineTo(hr * 2.0, hr * 0.42); c.closePath(); c.fill();
                    }
                    c.restore();

                    if (showLabel && !this.isPlayer) {
                      c.font = 'bold 10.5px sans-serif'; c.textAlign = 'center';
                      c.fillStyle = 'rgba(0,0,0,0.75)'; c.fillText(this.name, this.x + 1, this.y - hr - 11);
                      c.fillStyle = '#eef7eb'; c.fillText(this.name, this.x, this.y - hr - 12);
                    }
                    c.restore();
                  }
                }

                function showStreakBanner(txt) {
                  const el = document.getElementById('streakBanner');
                  if (!el) return;
                  el.textContent = txt; el.style.display = 'block';
                  setTimeout(() => { el.style.display = 'none'; }, 2400);
                }

                function killSnake(victim, killer, cause) {
                  if (!victim.alive) return;
                  victim.alive = false;
                  spawnParticles(victim.x, victim.y, '#e82534', 18, 160);
                  // DROP REALISTIC RED BONE-IN MEAT CHUNKS!
                  for (let i = 0; i < victim.segments.length; i += 3) {
                    meatList.push({ x: victim.segments[i].x + rand(-12, 12), y: victim.segments[i].y + rand(-12, 12), r: rand(12, 16), mass: 12.0, rot: rand(0, 6.28), life: 32 });
                  }
                  if (killer && killer !== victim) {
                    killer.kills++;
                    if (killer.isPlayer) {
                      matchStats.kills++; Sound.kill(); vibrate(60);
                      killStreak = streakTimer > 0 ? killStreak + 1 : 1;
                      streakTimer = 8.0;
                      if (killStreak === 2) showStreakBanner('🔥 DOUBLE KILL!');
                      else if (killStreak === 3) showStreakBanner('⚡ TRIPLE KILL!');
                      else if (killStreak >= 4) showStreakBanner('👑 RAMPAGE!');
                      floatTexts.push({ x: victim.x, y: victim.y - 20, text: `KILL! +25 🪙 +1 💎`, color: '#ffe45c', life: 1.3, maxLife: 1.3 });
                    }
                    pushKillFeed(`${killer.name} [${cause}] ${victim.name}`);
                  } else {
                    pushKillFeed(`${victim.name} (${cause})`);
                  }
                  if (!victim.isPlayer && profile.selectedMode === 'infinity') {
                    const sp = SPECIES[Math.floor(Math.random() * SPECIES.length)];
                    const pt = randInCircle(WORLD_CENTER, WORLD_CENTER, ARENA_RADIUS, 340);
                    snakes.push(new Snake({ name: victim.name, species: sp, x: pt.x, y: pt.y, mass: rand(14, 24) }));
                    return;
                  }
                  const aliveCount = snakes.filter(s => s.alive).length;
                  if (victim.isPlayer) {
                    matchStats.rank = aliveCount + 1;
                    matchStats.reason = killer ? `Your head crashed into ${killer.name}!` : `Eliminated by ${cause}`;
                    endMatch(false);
                  } else if (player && player.alive && aliveCount === 1) {
                    matchStats.rank = 1;
                    matchStats.reason = 'Last Beast Standing — 50-Player Champion!';
                    endMatch(true);
                  }
                }

                function spawnPrey(count = 1) {
                  for (let i = 0; i < count; i++) {
                    const t = PREY_TYPES[Math.floor(Math.random() * PREY_TYPES.length)];
                    const pt = randInCircle(safeZone.cx, safeZone.cy, Math.min(safeZone.r, ARENA_RADIUS), 200);
                    preyList.push({ ...t, x: pt.x, y: pt.y, angle: rand(0, Math.PI * 2), timer: rand(0.5, 2.5) });
                  }
                }

                function spawnPotions(count = 1) {
                  for (let i = 0; i < count; i++) {
                    const t = POTION_TYPES[Math.floor(Math.random() * POTION_TYPES.length)];
                    const pt = randInCircle(safeZone.cx, safeZone.cy, Math.min(safeZone.r, ARENA_RADIUS), 280);
                    potions.push({ ...t, x: pt.x, y: pt.y, r: 18, life: 45 });
                  }
                }

                function spawnGoldenDrop() {
                  const pt = randInCircle(safeZone.cx, safeZone.cy, Math.min(safeZone.r * 0.8, ARENA_RADIUS - 400), 220);
                  feastDrops.push({ x: pt.x, y: pt.y, r: 24, life: 50 });
                  Sound.drop();
                  const al = document.getElementById('dropAlert');
                  al.style.display = 'block';
                  setTimeout(() => { al.style.display = 'none'; }, 4500);
                }

                function refreshQuickPotions() {
                  ['magnet', 'turbo', 'zoom', 'double'].forEach(id => {
                    const el = document.getElementById(`qpc_${id}`);
                    if (el) el.textContent = profile.potionInv[id] || 0;
                  });
                }

                function startMatch() {
                  screenState = 'playing'; tacMapOpen = false;
                  activePotion = { id: null, label: '', timer: 0 };
                  mission = { goal: 40, done: false };
                  killStreak = 0; streakTimer = 0;
                  document.getElementById('tacMapOverlay').classList.remove('open');
                  document.getElementById('lobbyScreen').style.display = 'none';
                  document.getElementById('resultsScreen').classList.remove('open');
                  document.getElementById('hud').style.display = 'block';
                  document.getElementById('killFeed').innerHTML = '';

                  generateWorld(profile.selectedBiome);
                  snakes = []; preyList = []; meatList = []; potions = []; feastDrops = []; particles = []; floatTexts = [];
                  safeZone.active = profile.selectedMode === 'br';
                  safeZone.cx = WORLD_CENTER; safeZone.cy = WORLD_CENTER;
                  safeZone.r = ARENA_RADIUS; safeZone.targetR = ARENA_RADIUS * 0.78;
                  safeZone.stage = 1; safeZone.timer = 85; safeZone.shrinking = false;
                  dayCycle = 0; weatherRain = false; weatherTimer = 36; dropTimer = profile.selectedMode === 'treasure' ? 6 : 20;

                  matchStats.kills = 0; matchStats.prey = 0; matchStats.xp = 0; matchStats.maxLen = 72; matchStats.rank = TOTAL_SNAKES; matchStats.reason = '';

                  const pSpec = SPECIES.find(s => s.id === profile.selectedSnake) || SPECIES[0];
                  const pSpawn = randInCircle(WORLD_CENTER, WORLD_CENTER, ARENA_RADIUS * 0.55, 350);
                  player = new Snake({ name: profile.name, species: pSpec, x: pSpawn.x, y: pSpawn.y, isPlayer: true, mass: 16 });
                  snakes.push(player);

                  for (let i = 1; i < TOTAL_SNAKES; i++) {
                    const sp = SPECIES[Math.floor(Math.random() * SPECIES.length)];
                    let pt = randInCircle(WORLD_CENTER, WORLD_CENTER, ARENA_RADIUS, 360);
                    if (dist(pt.x, pt.y, player.x, player.y) < 650) pt = randInCircle(WORLD_CENTER, WORLD_CENTER, ARENA_RADIUS, 360);
                    const nm = AI_PREFIX[i % AI_PREFIX.length] + AI_SUFFIX[Math.floor(i / 3) % AI_SUFFIX.length];
                    snakes.push(new Snake({ name: nm, species: sp, x: pt.x, y: pt.y, mass: rand(14, 26) }));
                  }

                  spawnPrey(480);
                  spawnPotions(34);
                  if (profile.selectedMode === 'treasure') { spawnGoldenDrop(); spawnGoldenDrop(); }
                  camera.x = player.x; camera.y = player.y; camera.lookX = 0; camera.lookY = 0;
                  camera.zoom = profile.settings.zoom;
                  applySettingsToDOM();
                  refreshQuickPotions();
                }

                function endMatch(isWin) {
                  screenState = 'results';
                  document.getElementById('hud').style.display = 'none';
                  document.getElementById('tacMapOverlay').classList.remove('open');
                  const gold = (isWin ? 120 : Math.max(15, Math.floor((TOTAL_SNAKES - matchStats.rank) * 2))) + matchStats.kills * 25 + (mission.done ? 60 : 0);
                  const dias = (isWin ? 5 : (matchStats.rank <= 5 ? 2 : 0)) + matchStats.kills * 1;
                  const totalXp = matchStats.xp;

                  profile.coins += gold; profile.diamonds += dias; profile.xp += totalXp;
                  profile.stats.matches++;
                  if (isWin) profile.stats.wins++;
                  profile.stats.kills += matchStats.kills;
                  profile.stats.prey += matchStats.prey;
                  if (matchStats.maxLen > profile.stats.bestLength) profile.stats.bestLength = matchStats.maxLen;
                  while (profile.xp >= getXpNeed(profile.level)) { profile.xp -= getXpNeed(profile.level); profile.level++; }
                  saveProfile();

                  document.getElementById('resTitle').textContent = isWin ? '#1 APEX PREDATOR!' : `RANK #${matchStats.rank} / ${TOTAL_SNAKES}`;
                  document.getElementById('resSub').textContent = matchStats.reason;
                  document.getElementById('resRank').textContent = `#${matchStats.rank}`;
                  document.getElementById('resKills').textContent = matchStats.kills;
                  document.getElementById('resLen').textContent = matchStats.maxLen;
                  document.getElementById('resPrey').textContent = matchStats.prey;
                  document.getElementById('resGold').textContent = `+${gold} 🪙 Coins`;
                  document.getElementById('resDia').textContent = `+${dias} 💎 Diamonds`;
                  document.getElementById('resXp').textContent = `+${totalXp.toLocaleString()} XP`;
                  document.getElementById('resultsScreen').classList.add('open');
                  isWin ? Sound.win() : Sound.over();
                }

                function enterLobby() {
                  screenState = 'lobby';
                  document.getElementById('hud').style.display = 'none';
                  document.getElementById('resultsScreen').classList.remove('open');
                  document.getElementById('lobbyScreen').style.display = 'block';
                  generateWorld(profile.selectedBiome);
                  const sp = SPECIES.find(s => s.id === profile.selectedSnake) || SPECIES[0];
                  lobbySnake = new Snake({ name: profile.name, species: sp, x: appW * 0.5, y: appH * 0.5, isPlayer: true, mass: 16 });
                  lobbySnake.spawnShield = 0; lobbySnake.hoodFlare = sp.hood ? 0.9 : 0;
                  refreshLobbyUI();
                }

                function updateGame(dt) {
                  dayCycle = (dayCycle + dt) % 120;
                  weatherTimer -= dt;
                  if (weatherTimer <= 0) { weatherRain = !weatherRain; weatherTimer = rand(28, 48); }
                  dropTimer -= dt;
                  const maxDrops = profile.selectedMode === 'treasure' ? 5 : 2;
                  if (dropTimer <= 0 && feastDrops.length < maxDrops) { spawnGoldenDrop(); dropTimer = profile.selectedMode === 'treasure' ? 14 : 36; }
                  if (streakTimer > 0) streakTimer = Math.max(0, streakTimer - dt);
                  if (activePotion.timer > 0) {
                    activePotion.timer = Math.max(0, activePotion.timer - dt);
                    if (activePotion.timer <= 0) activePotion.id = null;
                  }

                  if (player && player.alive) {
                    let kx = (ctrl.keys.right ? 1 : 0) - (ctrl.keys.left ? 1 : 0);
                    let ky = (ctrl.keys.down ? 1 : 0) - (ctrl.keys.up ? 1 : 0);
                    if (kx !== 0 || ky !== 0) player.targetAngle = Math.atan2(ky, kx);
                    else if (ctrl.joyActive && ctrl.joyMag > 8) player.targetAngle = ctrl.joyAngle;
                    player.boosting = ctrl.boostHeld || ctrl.keys.boost;
                    matchStats.maxLen = Math.max(matchStats.maxLen, player.getLen());
                  }

                  if (safeZone.active) {
                    safeZone.timer -= dt;
                    if (!safeZone.shrinking && safeZone.timer <= 0) {
                      safeZone.shrinking = true; safeZone.timer = 65;
                      safeZone.targetR = Math.max(700, safeZone.r * 0.72);
                    } else if (safeZone.shrinking) {
                      safeZone.r = Math.max(safeZone.targetR, safeZone.r - (ARENA_RADIUS * 0.0042) * dt);
                      if (safeZone.timer <= 0 || safeZone.r <= safeZone.targetR) {
                        safeZone.shrinking = false; safeZone.stage = Math.min(6, safeZone.stage + 1); safeZone.timer = 75;
                      }
                    }
                  }

                  rebuildGrids();
                  for (const s of snakes) s.update(dt);

                  for (const s of snakes) {
                    if (!s.alive || s.spawnShield > 0) continue;
                    const hr = s.getRadius() * 0.85;
                    const near = queryGrid(snakeGrid, s.x, s.y, hr + 85);
                    for (const o of near) {
                      if (o === s || !o.alive || o.spawnShield > 0) continue;
                      const oR = o.getRadius() * 0.85;
                      let crashed = false;
                      for (let k = 1; k < o.segments.length; k++) {
                        if (distSq(s.x, s.y, o.segments[k].x, o.segments[k].y) < (hr + oR) ** 2) { crashed = true; break; }
                      }
                      if (crashed) { killSnake(s, o, 'Cut-Off'); break; }
                      if (distSq(s.x, s.y, o.x, o.y) < (hr + oR) ** 2 && s.mass < o.mass) { killSnake(s, o, 'Head Clash'); break; }
                    }
                  }

                  // POTION PICKUP = +250 XP!
                  for (let i = potions.length - 1; i >= 0; i--) {
                    const po = potions[i]; po.life -= dt;
                    if (po.life <= 0) { potions.splice(i, 1); continue; }
                    if (player && player.alive && distSq(player.x, player.y, po.x, po.y) < (player.getRadius() + po.r + 12) ** 2) {
                      activePotion = { id: po.id, label: po.label, timer: po.dur };
                      matchStats.xp += 250;
                      Sound.potion(); vibrate(30);
                      spawnParticles(po.x, po.y, po.col, 14, 130);
                      floatTexts.push({ x: po.x, y: po.y - 20, text: `${po.label} +250 XP!`, color: po.col, life: 1.2, maxLife: 1.2 });
                      potions.splice(i, 1);
                    }
                  }
                  if (potions.length < 24) spawnPotions(2);

                  for (let i = feastDrops.length - 1; i >= 0; i--) {
                    const f = feastDrops[i]; f.life -= dt;
                    if (f.life <= 0) { feastDrops.splice(i, 1); continue; }
                    const nearS = queryGrid(snakeGrid, f.x, f.y, 65);
                    for (const s of nearS) {
                      if (!s.alive) continue;
                      if (distSq(s.x, s.y, f.x, f.y) < (s.getRadius() + f.r) ** 2) {
                        s.mass += 40; spawnParticles(f.x, f.y, '#ffe45c', 18, 150);
                        if (s.isPlayer) { Sound.win(); vibrate(40); profile.coins += 50; profile.diamonds += 2; matchStats.xp += 250; saveProfile(); floatTexts.push({ x: f.x, y: f.y - 20, text: 'TREASURE! +50 🪙 +250 XP', color: '#9cf4ff', life: 1.4, maxLife: 1.4 }); }
                        pushKillFeed(`${s.name} found Golden Treasure!`);
                        feastDrops.splice(i, 1); break;
                      }
                    }
                  }

                  const magBoost = (activePotion.id === 'magnet' && activePotion.timer > 0) ? 185 : 0;
                  const magR = player && player.alive ? (45 + profile.upgrades.magnet * 28 + magBoost) : 0;
                  const dblMult = (activePotion.id === 'double' && activePotion.timer > 0) ? 2.0 : 1.0;

                  // EATING 1 ANIMAL = +100 XP!
                  for (let i = preyList.length - 1; i >= 0; i--) {
                    const p = preyList[i];
                    if (p.speed > 0 && profile.selectedFood === 'prey') {
                      p.timer -= dt;
                      if (p.timer <= 0) { p.angle += rand(-1.3, 1.3); p.timer = rand(0.8, 2.2); }
                      p.x += Math.cos(p.angle) * p.speed * dt; p.y += Math.sin(p.angle) * p.speed * dt;
                      if (dist(p.x, p.y, WORLD_CENTER, WORLD_CENTER) > ARENA_RADIUS - 200) p.angle = Math.atan2(WORLD_CENTER - p.y, WORLD_CENTER - p.x);
                    }
                    if (magR > 50 && player && player.alive && distSq(player.x, player.y, p.x, p.y) < magR * magR) {
                      p.x = lerp(p.x, player.x, dt * 6.5); p.y = lerp(p.y, player.y, dt * 6.5);
                    }
                    const nearS = queryGrid(snakeGrid, p.x, p.y, 55);
                    for (const s of nearS) {
                      if (!s.alive) continue;
                      if (distSq(s.x, s.y, p.x, p.y) < (s.getRadius() * 1.25 + p.r) ** 2) {
                        s.mass += p.mass * (s.isPlayer ? dblMult : 1.0); s.jawOpen = 0.6;
                        if (s.isPlayer) {
                          matchStats.prey++; matchStats.xp += 100; Sound.eat();
                          floatTexts.push({ x: p.x, y: p.y - 14, text: '+100 XP', color: '#a8ff78', life: 0.75, maxLife: 0.75 });
                          if (!mission.done && matchStats.prey >= mission.goal) {
                            mission.done = true; Sound.win();
                            floatTexts.push({ x: player.x, y: player.y - 30, text: 'MISSION DONE! +60 🪙', color: '#8cff6e', life: 1.5, maxLife: 1.5 });
                          }
                        }
                        preyList.splice(i, 1); break;
                      }
                    }
                  }
                  if (preyList.length < 440) spawnPrey(10);

                  // EATING KILLED SNAKE MEAT = +500 XP!
                  for (let i = meatList.length - 1; i >= 0; i--) {
                    const m = meatList[i]; m.life -= dt;
                    if (m.life <= 0) { meatList.splice(i, 1); continue; }
                    if (magR > 50 && player && player.alive && distSq(player.x, player.y, m.x, m.y) < magR * magR) {
                      m.x = lerp(m.x, player.x, dt * 7.5); m.y = lerp(m.y, player.y, dt * 7.5);
                    }
                    const nearS = queryGrid(snakeGrid, m.x, m.y, 55);
                    for (const s of nearS) {
                      if (!s.alive) continue;
                      if (distSq(s.x, s.y, m.x, m.y) < (s.getRadius() * 1.25 + m.r) ** 2) {
                        s.mass += m.mass * (s.isPlayer ? dblMult : 1.0); s.jawOpen = 0.55;
                        if (s.isPlayer) {
                          matchStats.xp += 500; Sound.eat();
                          floatTexts.push({ x: m.x, y: m.y - 16, text: '+500 XP', color: '#ffe45c', life: 0.9, maxLife: 0.9 });
                        }
                        meatList.splice(i, 1); break;
                      }
                    }
                  }

                  for (let i = tracks.length - 1; i >= 0; i--) { tracks[i].life -= dt; if (tracks[i].life <= 0) tracks.splice(i, 1); }
                  for (let i = ripples.length - 1; i >= 0; i--) { const rp = ripples[i]; rp.life -= dt; rp.r = lerp(rp.r, rp.maxR, dt * 3.5); if (rp.life <= 0) ripples.splice(i, 1); }
                  for (let i = particles.length - 1; i >= 0; i--) { const pt = particles[i]; pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.life -= dt; if (pt.life <= 0) particles.splice(i, 1); }
                  for (let i = floatTexts.length - 1; i >= 0; i--) { const ft = floatTexts[i]; ft.y -= 28 * dt; ft.life -= dt; if (ft.life <= 0) floatTexts.splice(i, 1); }

                  if (camera.shake > 0) camera.shake = Math.max(0, camera.shake - dt * 24);
                  if (player && player.alive) {
                    camera.x = lerp(camera.x, player.x, clamp(dt * 8, 0, 1));
                    camera.y = lerp(camera.y, player.y, clamp(dt * 8, 0, 1));
                    const targetZoom = (activePotion.id === 'zoom' && activePotion.timer > 0) ? Math.max(0.58, profile.settings.zoom - 0.2) : profile.settings.zoom;
                    camera.zoom = lerp(camera.zoom, targetZoom, clamp(dt * 5, 0, 1));
                    if (!ctrl.lookActive && profile.settings.autoCenter) { camera.lookX = lerp(camera.lookX, 0, clamp(dt * 7, 0, 1)); camera.lookY = lerp(camera.lookY, 0, clamp(dt * 7, 0, 1)); }
                    document.getElementById('btnRecenter').style.display = Math.hypot(camera.lookX, camera.lookY) > 35 ? 'flex' : 'none';
                  }

                  hudTick -= dt;
                  if (hudTick <= 0 && player) {
                    hudTick = 0.12;
                    const aliveArr = snakes.filter(s => s.alive);
                    document.getElementById('hudAlive').textContent = `${aliveArr.length}/${TOTAL_SNAKES}`;
                    document.getElementById('hudKills').textContent = matchStats.kills;
                    document.getElementById('hudXp').textContent = matchStats.xp;
                    document.getElementById('hudLen').textContent = player.getLen();
                    document.getElementById('missionProg').textContent = mission.done ? 'DONE ✅' : `${matchStats.prey}/${mission.goal}`;

                    if (safeZone.active) {
                      document.getElementById('hudZoneStage').textContent = safeZone.stage;
                      const zt = Math.max(0, Math.ceil(safeZone.timer));
                      document.getElementById('hudZoneTimer').textContent = `${Math.floor(zt / 60)}:${String(zt % 60).padStart(2, '0')}`;
                    } else {
                      document.getElementById('hudZoneStage').textContent = '∞';
                      document.getElementById('hudZoneTimer').textContent = profile.selectedMode === 'treasure' ? 'TREASURE' : 'ENDLESS';
                    }
                    document.getElementById('shieldBadge').style.display = player.spawnShield > 0 ? 'block' : 'none';

                    const pb = document.getElementById('potionBadge');
                    if (activePotion.id && activePotion.timer > 0) { pb.style.display = 'block'; pb.textContent = `${activePotion.label} ${Math.ceil(activePotion.timer)}s`; }
                    else pb.style.display = 'none';

                    aliveArr.sort((a, b) => b.mass - a.mass);
                    const lb = document.getElementById('leaderBox');
                    lb.innerHTML = aliveArr.slice(0, 5).map((s, idx) =>
                      `<div class="lb-row${s.isPlayer ? ' me' : ''}"><span>${idx + 1}. ${s.name.slice(0, 10)}</span><span>${s.getLen()}</span></div>`
                    ).join('');

                    const stRing = document.getElementById('staminaRing');
                    if (stRing) stRing.style.strokeDashoffset = String(220 * (1 - player.stamina / 100));
                    document.getElementById('stormVignette').style.opacity = (safeZone.active && dist(player.x, player.y, safeZone.cx, safeZone.cy) > safeZone.r) ? '1' : '0';

                    document.getElementById('regionPill').textContent = getRegionAt(player.x, player.y).name;
                    if (profile.settings.showFps) document.getElementById('fpsPill').textContent = `${fpsVal} FPS`;

                    const tTag = document.getElementById('terrainTag');
                    if (player.inBush) { tTag.style.display = 'block'; tTag.style.background = 'rgba(34,115,44,0.88)'; tTag.textContent = '🌿 STEALTH COVER'; }
                    else if (player.terrain === 'water') { tTag.style.display = 'block'; tTag.style.background = 'rgba(26,136,148,0.85)'; tTag.textContent = '🌊 RIVER BOOST'; }
                    else if (player.terrain === 'mud') { tTag.style.display = 'block'; tTag.style.background = 'rgba(84,54,28,0.88)'; tTag.textContent = '🟤 MUD SLOW'; }
                    else tTag.style.display = 'none';

                    drawRadar(miniCtx, miniCanvas.width, miniCanvas.height, false);
                    if (tacMapOpen) drawRadar(tacCtx, tacCanvas.width, tacCanvas.height, true);
                  }
                }

                function drawRadar(rc, w, h, showLabels) {
                  const sc = (w * 0.45) / ARENA_RADIUS, cx = w / 2, cy = h / 2;
                  rc.clearRect(0, 0, w, h);
                  rc.fillStyle = '#0c180d'; rc.fillRect(0, 0, w, h);
                  for (const r of REGIONS) { const rx = cx + (r.x - WORLD_CENTER) * sc, ry = cy + (r.y - WORLD_CENTER) * sc; rc.fillStyle = r.col; rc.beginPath(); rc.arc(rx, ry, r.r * sc, 0, Math.PI * 2); rc.fill(); }
                  rc.fillStyle = 'rgba(38,165,180,0.45)';
                  for (const wv of waterZones) { rc.beginPath(); rc.arc(cx + (wv.x - WORLD_CENTER) * sc, cy + (wv.y - WORLD_CENTER) * sc, Math.max(2, wv.r * sc), 0, Math.PI * 2); rc.fill(); }
                  rc.strokeStyle = 'rgba(255,75,58,0.5)'; rc.lineWidth = showLabels ? 2.5 : 1.5; rc.beginPath(); rc.arc(cx, cy, ARENA_RADIUS * sc, 0, Math.PI * 2); rc.stroke();
                  if (safeZone.active) { rc.strokeStyle = '#4de2f0'; rc.lineWidth = showLabels ? 3 : 2; rc.beginPath(); rc.arc(cx + (safeZone.cx - WORLD_CENTER) * sc, cy + (safeZone.cy - WORLD_CENTER) * sc, safeZone.r * sc, 0, Math.PI * 2); rc.stroke(); }
                  if (showLabels) { rc.font = 'bold 10px sans-serif'; rc.textAlign = 'center'; rc.fillStyle = 'rgba(255,235,160,0.88)'; for (const r of REGIONS) rc.fillText(r.name.toUpperCase(), cx + (r.x - WORLD_CENTER) * sc, cy + (r.y - WORLD_CENTER) * sc); }
                  rc.fillStyle = '#ffe44d';
                  for (const f of feastDrops) { rc.beginPath(); rc.arc(cx + (f.x - WORLD_CENTER) * sc, cy + (f.y - WORLD_CENTER) * sc, showLabels ? 5 : 3.5, 0, Math.PI * 2); rc.fill(); }
                  rc.fillStyle = 'rgba(255,90,78,0.85)';
                  for (const s of snakes) { if (!s.alive || s.isPlayer) continue; rc.beginPath(); rc.arc(cx + (s.x - WORLD_CENTER) * sc, cy + (s.y - WORLD_CENTER) * sc, showLabels ? 3 : 1.7, 0, Math.PI * 2); rc.fill(); }
                  if (player && player.alive) { const px = cx + (player.x - WORLD_CENTER) * sc, py = cy + (player.y - WORLD_CENTER) * sc; rc.fillStyle = '#7ce846'; rc.beginPath(); rc.arc(px, py, showLabels ? 6 : 4, 0, Math.PI * 2); rc.fill(); rc.strokeStyle = '#fff'; rc.lineWidth = 1.5; rc.stroke(); }
                }

                function renderGame(dt) {
                  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                  ctx.fillStyle = '#060b07'; ctx.fillRect(0, 0, appW, appH);

                  if (document.getElementById('profileModal').classList.contains('open') && document.getElementById('tabSnakes').classList.contains('active') && previewSnake) {
                    const pw = wsCanvas.width, ph = wsCanvas.height;
                    wsCtx.clearRect(0, 0, pw, ph);
                    previewSnake.slitherPhase += dt * 7;
                    const t = globalTime * 1.1;
                    const nx = pw * 0.5 + Math.cos(t) * 54, ny = ph * 0.5 + Math.sin(t) * 58;
                    previewSnake.angle = Math.atan2(ny - previewSnake.y, nx - previewSnake.x);
                    previewSnake.x = nx; previewSnake.y = ny; previewSnake.segments[0].x = nx; previewSnake.segments[0].y = ny;
                    for (let i = 1; i < previewSnake.segments.length; i++) {
                      const p = previewSnake.segments[i - 1], c = previewSnake.segments[i], dx = c.x - p.x, dy = c.y - p.y, d = Math.hypot(dx, dy) || 1;
                      if (d > 6) { c.x = p.x + (dx / d) * 6; c.y = p.y + (dy / d) * 6; }
                    }
                    previewSnake.draw(wsCtx, false);
                  }

                  if (screenState !== 'playing') {
                    if (groundPattern) { ctx.fillStyle = groundPattern; ctx.fillRect(0, 0, appW, appH); }
                    else { ctx.fillStyle = '#1b2b15'; ctx.fillRect(0, 0, appW, appH); }
                    const g = ctx.createRadialGradient(appW * 0.5, appH * 0.48, 20, appW * 0.5, appH * 0.48, Math.max(appW, appH) * 0.56);
                    g.addColorStop(0, 'rgba(180, 235, 110, 0.14)'); g.addColorStop(1, 'rgba(4,9,5,0.68)');
                    ctx.fillStyle = g; ctx.fillRect(0, 0, appW, appH);

                    if (lobbySnake) {
                      lobbySnake.slitherPhase += dt * 7.5;
                      const rx = Math.min(appW * 0.22, 165), ry = Math.min(appH * 0.2, 85);
                      const t = globalTime * 0.85;
                      const nx = appW * 0.5 + Math.cos(t) * rx, ny = appH * 0.48 + Math.sin(t) * ry;
                      lobbySnake.angle = Math.atan2(ny - lobbySnake.y, nx - lobbySnake.x);
                      lobbySnake.x = nx; lobbySnake.y = ny; lobbySnake.segments[0].x = nx; lobbySnake.segments[0].y = ny;
                      const spc = lobbySnake.getRadius() * 0.48;
                      for (let i = 1; i < lobbySnake.segments.length; i++) {
                        const p = lobbySnake.segments[i - 1], c = lobbySnake.segments[i], dx = c.x - p.x, dy = c.y - p.y, d = Math.hypot(dx, dy) || 1;
                        if (d > spc) { c.x = p.x + (dx / d) * spc; c.y = p.y + (dy / d) * spc; }
                      }
                      lobbySnake.draw(ctx, false);
                    }
                    for (const ff of fireflies) {
                      ff.x = (ff.x + ff.vx * dt + appW) % appW; ff.y = (ff.y + ff.vy * dt + appH) % appH;
                      ctx.fillStyle = `rgba(190, 255, 120, ${0.2 + 0.5 * (0.5 + 0.5 * Math.sin(globalTime * 3.5 + ff.ph))})`;
                      ctx.beginPath(); ctx.arc(ff.x, ff.y, 2, 0, Math.PI * 2); ctx.fill();
                    }
                    return;
                  }

                  const biome = BIOMES.find(b => b.id === profile.selectedBiome) || BIOMES[0];
                  const shX = camera.shake > 0 ? rand(-camera.shake, camera.shake) : 0;
                  const shY = camera.shake > 0 ? rand(-camera.shake, camera.shake) : 0;

                  ctx.save();
                  ctx.translate(appW / 2 + shX, appH / 2 + shY);
                  ctx.scale(camera.zoom, camera.zoom);
                  ctx.translate(-(camera.x + camera.lookX), -(camera.y + camera.lookY));

                  if (groundPattern) { ctx.fillStyle = groundPattern; ctx.fillRect(0, 0, WORLD_SIZE, WORLD_SIZE); }
                  for (const r of REGIONS) { if (!isNearCam(r.x, r.y, r.r)) continue; ctx.fillStyle = r.col; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.fill(); }
                  for (const m of mudZones) { if (!isNearCam(m.x, m.y, m.r + 80)) continue; ctx.fillStyle = biome.mud; ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill(); }
                  for (const w of waterZones) { if (!isNearCam(w.x, w.y, w.r + 100)) continue; ctx.fillStyle = biome.shore; ctx.beginPath(); ctx.arc(w.x, w.y, w.r + 16, 0, Math.PI * 2); ctx.fill(); }
                  for (const w of waterZones) {
                    if (!isNearCam(w.x, w.y, w.r + 100)) continue;
                    ctx.fillStyle = biome.water; ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = biome.waterDeep; ctx.beginPath(); ctx.arc(w.x, w.y, w.r * 0.65, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = 'rgba(255,255,255,0.12)';
                    ctx.beginPath(); ctx.ellipse(w.x + Math.sin(globalTime * 2 + w.x) * 14, w.y - w.r * 0.2, w.r * 0.25, 4, 0.2, 0, Math.PI * 2); ctx.fill();
                  }
                  for (const lp of lilyPads) {
                    if (!isNearCam(lp.x, lp.y, 50)) continue;
                    ctx.save(); ctx.translate(lp.x, lp.y); ctx.rotate(lp.rot);
                    ctx.fillStyle = '#2d7a2d'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, lp.r, 0.25, Math.PI * 2 - 0.25); ctx.closePath(); ctx.fill();
                    if (lp.lotus) { ctx.fillStyle = '#ff85b3'; for (let p = 0; p < 5; p++) { ctx.rotate((Math.PI * 2) / 5); ctx.beginPath(); ctx.ellipse(4, 0, 5, 2.5, 0, 0, Math.PI * 2); ctx.fill(); } ctx.fillStyle = '#ffe552'; ctx.beginPath(); ctx.arc(0, 0, 2.2, 0, Math.PI * 2); ctx.fill(); }
                    ctx.restore();
                  }
                  for (const tr of tracks) {
                    if (!isNearCam(tr.x, tr.y, 40)) continue;
                    ctx.save(); ctx.translate(tr.x, tr.y); ctx.rotate(tr.ang); ctx.globalAlpha = clamp(tr.life / tr.maxLife, 0, 1) * 0.42;
                    ctx.fillStyle = '#170d05'; ctx.beginPath(); ctx.ellipse(0, 0, tr.r * 0.5, tr.r * 0.9, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
                  }
                  for (const rp of ripples) {
                    if (!isNearCam(rp.x, rp.y, rp.maxR)) continue;
                    ctx.strokeStyle = `rgba(195, 245, 255, ${(rp.life / rp.maxLife) * 0.42})`; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2); ctx.stroke();
                  }
                  for (const pr of worldProps) {
                    if (!isNearCam(pr.x, pr.y, pr.sz + 50)) continue;
                    ctx.save(); ctx.translate(pr.x, pr.y); ctx.rotate(pr.rot);
                    if (pr.kind === 'log') {
                      ctx.fillStyle = 'rgba(0,0,0,0.38)'; ctx.fillRect(-pr.sz + 4, -pr.sz * 0.24 + 5, pr.sz * 2, pr.sz * 0.48);
                      ctx.fillStyle = '#4a3019'; ctx.fillRect(-pr.sz, -pr.sz * 0.24, pr.sz * 2, pr.sz * 0.48);
                      ctx.fillStyle = 'rgba(76,138,44,0.72)'; ctx.beginPath(); ctx.ellipse(-pr.sz * 0.2, -3, pr.sz * 0.36, pr.sz * 0.19, 0.2, 0, Math.PI * 2); ctx.fill();
                    } else if (pr.kind === 'rock') {
                      ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.ellipse(4, 6, pr.sz * 0.78, pr.sz * 0.62, 0, 0, Math.PI * 2); ctx.fill();
                      ctx.fillStyle = '#5c6358'; ctx.beginPath(); ctx.moveTo(pr.sz * 0.75, 0); ctx.lineTo(pr.sz * 0.42, -pr.sz * 0.56); ctx.lineTo(-pr.sz * 0.38, -pr.sz * 0.52); ctx.lineTo(-pr.sz * 0.76, -pr.sz * 0.08); ctx.lineTo(-pr.sz * 0.46, pr.sz * 0.54); ctx.lineTo(pr.sz * 0.36, pr.sz * 0.5); ctx.closePath(); ctx.fill();
                      ctx.strokeStyle = 'rgba(22,26,20,0.6)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(-pr.sz * 0.3, -pr.sz * 0.15); ctx.lineTo(pr.sz * 0.1, pr.sz * 0.05); ctx.lineTo(pr.sz * 0.35, -pr.sz * 0.2); ctx.stroke();
                      ctx.fillStyle = 'rgba(68,122,42,0.62)'; ctx.beginPath(); ctx.arc(-pr.sz * 0.24, -pr.sz * 0.2, pr.sz * 0.28, 0, Math.PI * 2); ctx.fill();
                    } else if (pr.kind === 'ruin') {
                      ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(-pr.sz * 0.8 + 5, -pr.sz * 0.55 + 6, pr.sz * 1.6, pr.sz * 1.1);
                      ctx.fillStyle = '#6c7065'; ctx.fillRect(-pr.sz * 0.8, -pr.sz * 0.55, pr.sz * 1.6, pr.sz * 1.1);
                      ctx.strokeStyle = 'rgba(28,32,26,0.72)'; ctx.lineWidth = 2; ctx.strokeRect(-pr.sz * 0.68, -pr.sz * 0.44, pr.sz * 1.36, pr.sz * 0.88);
                      ctx.fillStyle = 'rgba(64,116,40,0.68)'; ctx.beginPath(); ctx.arc(-pr.sz * 0.45, -pr.sz * 0.3, pr.sz * 0.28, 0, Math.PI * 2); ctx.fill();
                    } else {
                      for (let f = 0; f < 6; f++) { ctx.rotate(Math.PI / 3); ctx.fillStyle = f % 2 === 0 ? '#2b6e24' : '#3d8c30'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(pr.sz * 0.45, -pr.sz * 0.22, pr.sz * 0.85, 0); ctx.quadraticCurveTo(pr.sz * 0.45, pr.sz * 0.22, 0, 0); ctx.fill(); }
                    }
                    ctx.restore();
                  }

                  ctx.strokeStyle = 'rgba(255,75,58,0.6)'; ctx.lineWidth = 18; ctx.beginPath(); ctx.arc(WORLD_CENTER, WORLD_CENTER, ARENA_RADIUS, 0, Math.PI * 2); ctx.stroke();
                  if (safeZone.active) { ctx.strokeStyle = 'rgba(77,226,240,0.88)'; ctx.lineWidth = 10; ctx.beginPath(); ctx.arc(safeZone.cx, safeZone.cy, safeZone.r, 0, Math.PI * 2); ctx.stroke(); }

                  for (const po of potions) {
                    if (!isNearCam(po.x, po.y, 70)) continue;
                    const pu = 1 + Math.sin(globalTime * 5 + po.x) * 0.15;
                    ctx.save(); ctx.translate(po.x, po.y);
                    ctx.fillStyle = po.col; ctx.globalAlpha = 0.25; ctx.beginPath(); ctx.arc(0, 0, 26 * pu, 0, Math.PI * 2); ctx.fill();
                    ctx.globalAlpha = 1; ctx.fillStyle = '#0e1726'; ctx.strokeStyle = po.col; ctx.lineWidth = 2.5;
                    ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                    ctx.font = '14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(po.icon, 0, 1); ctx.restore();
                  }

                  for (const f of feastDrops) {
                    if (!isNearCam(f.x, f.y, 120)) continue;
                    const pulse = 1 + Math.sin(globalTime * 6) * 0.16;
                    ctx.fillStyle = 'rgba(255,224,82,0.32)'; ctx.beginPath(); ctx.arc(f.x, f.y, 40 * pulse, 0, Math.PI * 2); ctx.fill();
                    ctx.font = '26px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText('💰', f.x, f.y);
                  }
                  for (const p of preyList) { if (isNearCam(p.x, p.y, 60)) drawPrey(ctx, p); }
                  for (const m of meatList) { if (isNearCam(m.x, m.y, 50)) drawMeatChunk(ctx, m); }

                  // FIXED: FULL-BODY VISIBILITY CHECK SO ENEMIES NEVER DISAPPEAR!
                  for (const s of snakes) { if (s.alive && isSnakeVisible(s)) s.draw(ctx, true); }

                  if (player && player.alive && safeZone.active && dist(player.x, player.y, safeZone.cx, safeZone.cy) > safeZone.r - 120) {
                    const za = Math.atan2(safeZone.cy - player.y, safeZone.cx - player.x);
                    ctx.save(); ctx.translate(player.x + Math.cos(za) * 58, player.y + Math.sin(za) * 58); ctx.rotate(za);
                    ctx.fillStyle = '#4de2f0'; ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-6, -8); ctx.lineTo(-3, 0); ctx.lineTo(-6, 8); ctx.closePath(); ctx.fill(); ctx.restore();
                  }
                  for (const tr of trees) {
                    if (!isNearCam(tr.x, tr.y, tr.r + 40)) continue;
                    const pUnder = player && player.alive && distSq(player.x, player.y, tr.x, tr.y) < (tr.r * 0.95) ** 2;
                    ctx.save(); ctx.translate(tr.x + Math.sin(globalTime * 1.3 + tr.ph) * 3, tr.y); ctx.globalAlpha = pUnder ? 0.34 : 0.76;
                    ctx.fillStyle = 'rgba(0,0,0,0.32)'; ctx.beginPath(); ctx.arc(12, 16, tr.r * 0.9, 0, Math.PI * 2); ctx.fill();
                    for (let l = 0; l < 5; l++) { const a = (l / 5) * Math.PI * 2 + tr.ph; ctx.fillStyle = l % 2 === 0 ? '#1b521a' : '#266b22'; ctx.beginPath(); ctx.arc(Math.cos(a) * tr.r * 0.36, Math.sin(a) * tr.r * 0.36, tr.r * 0.56, 0, Math.PI * 2); ctx.fill(); }
                    ctx.fillStyle = '#36852c'; ctx.beginPath(); ctx.arc(-tr.r * 0.1, -tr.r * 0.1, tr.r * 0.42, 0, Math.PI * 2); ctx.fill(); ctx.restore();
                  }
                  for (const pt of particles) { ctx.globalAlpha = clamp(pt.life / pt.maxLife, 0, 1); ctx.fillStyle = pt.color; ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2); ctx.fill(); }
                  ctx.globalAlpha = 1; ctx.font = '900 14px sans-serif'; ctx.textAlign = 'center';
                  for (const ft of floatTexts) { ctx.globalAlpha = clamp(ft.life / ft.maxLife, 0, 1); ctx.fillStyle = ft.color; ctx.fillText(ft.text, ft.x, ft.y); }
                  ctx.restore();

                  if (dayCycle < 48 && profile.settings.gfx === 'ultra') {
                    const sg = ctx.createLinearGradient(0, 0, appW * 0.6, appH * 0.7);
                    sg.addColorStop(0, 'rgba(255,245,180,0.08)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = sg; ctx.fillRect(0, 0, appW, appH);
                  } else if (dayCycle >= 48) {
                    const dusk = dayCycle < 78 ? Math.sin(((dayCycle - 48) / 30) * Math.PI) : 0;
                    const night = dayCycle >= 78 ? Math.sin(((dayCycle - 78) / 42) * Math.PI) : 0;
                    if (dusk > 0.02) { ctx.fillStyle = `rgba(180, 90, 25, ${dusk * 0.15})`; ctx.fillRect(0, 0, appW, appH); }
                    if (night > 0.02) { ctx.fillStyle = `rgba(6, 14, 30, ${night * 0.32})`; ctx.fillRect(0, 0, appW, appH); }
                  }
                  if (profile.settings.gfx !== 'low' && weatherRain) {
                    ctx.strokeStyle = 'rgba(180, 225, 255, 0.25)'; ctx.lineWidth = 1.2; ctx.beginPath();
                    for (const rd of rainDrops) { rd.x -= rd.v * 0.2 * dt; rd.y += rd.v * dt; if (rd.y > appH) { rd.y = -20; rd.x = rand(0, appW + 100); } ctx.moveTo(rd.x, rd.y); ctx.lineTo(rd.x - 4, rd.y + rd.l); }
                    ctx.stroke();
                  }
                }

                function mainLoop(ts) {
                  const dt = Math.min(0.05, (ts - (lastFrame || ts)) / 1000);
                  lastFrame = ts; globalTime += dt;
                  fpsCount++; fpsTimer += dt;
                  if (fpsTimer >= 0.5) { fpsVal = Math.round(fpsCount / fpsTimer); fpsCount = 0; fpsTimer = 0; }
                  if (screenState === 'playing') updateGame(dt);
                  renderGame(dt);
                  requestAnimationFrame(mainLoop);
                }

                // -------------------- WORKSHOP, POTIONS, DECOR, TROPHIES & SHOP WIRING --------------------
                function refreshLobbyUI() {
                  document.getElementById('lbAvatar').textContent = profile.avatar;
                  document.getElementById('lbLvl').textContent = `LV.${profile.level}`;
                  document.getElementById('lbName').textContent = profile.name;
                  document.getElementById('lbRank').textContent = getRank(profile.level);
                  document.getElementById('lbTitle').textContent = profile.title;
                  document.getElementById('lbCoins').textContent = profile.coins.toLocaleString();
                  document.getElementById('lbDiamonds').textContent = profile.diamonds.toLocaleString();
                  document.getElementById('mCoins').textContent = profile.coins.toLocaleString();
                  document.getElementById('mDias').textContent = profile.diamonds.toLocaleString();
                  const sp = SPECIES.find(s => s.id === profile.selectedSnake) || SPECIES[0];
                  const bi = BIOMES.find(b => b.id === profile.selectedBiome) || BIOMES[0];
                  const mo = MODES.find(m => m.id === profile.selectedMode) || MODES[0];
                  document.getElementById('scSnake').textContent = sp.name;
                  document.getElementById('scBiome').textContent = bi.name;
                  document.getElementById('modeLabel').textContent = mo.label;
                  const muteIcon = profile.settings.muted ? '🔇' : '🔊';
                  document.getElementById('btnLobbyAudio').textContent = muteIcon;
                  document.getElementById('hudAudioBtn').textContent = muteIcon;
                }

                function selectWorkshopPreview(spId) {
                  previewSnakeId = spId;
                  const sp = SPECIES.find(s => s.id === spId) || SPECIES[0];
                  previewSnake = new Snake({ name: sp.name, species: sp, x: 105, y: 115, isPlayer: true, mass: 16 });
                  previewSnake.spawnShield = 0; previewSnake.hoodFlare = sp.hood ? 0.9 : 0;

                  const owned = profile.ownedSnakes.includes(sp.id) || sp.curr === 'free';
                  const eq = profile.selectedSnake === sp.id;
                  document.getElementById('wsName').textContent = sp.name;
                  document.getElementById('wsTier').textContent = `${sp.tier} • ${sp.curr === 'free' ? 'FREE' : sp.price.toLocaleString() + (sp.curr === 'dia' ? ' 💎' : ' 🪙')}`;
                  document.getElementById('wsTrait').textContent = sp.trait;

                  const btn = document.getElementById('wsActionBtn');
                  btn.className = (!owned && sp.curr === 'dia') ? 'btn-dia' : 'btn-gold';
                  btn.textContent = eq ? 'EQUIPPED ✅' : (owned ? 'EQUIP BEAST' : `BUY ${sp.price.toLocaleString()} ${sp.curr === 'dia' ? '💎' : '🪙'}`);
                  btn.onclick = () => {
                    if (owned) profile.selectedSnake = sp.id;
                    else if (sp.curr === 'coin' && profile.coins >= sp.price) { profile.coins -= sp.price; profile.ownedSnakes.push(sp.id); profile.selectedSnake = sp.id; Sound.buy(); }
                    else if (sp.curr === 'dia' && profile.diamonds >= sp.price) { profile.diamonds -= sp.price; profile.ownedSnakes.push(sp.id); profile.selectedSnake = sp.id; Sound.buy(); }
                    else { Sound.over(); return; }
                    saveProfile(); Sound.click(); renderProfileModal(); enterLobby();
                  };
                }

