                    c.fillStyle = fg; c.strokeStyle = '#0e3307'; c.lineWidth = 1.4; c.beginPath(); c.ellipse(0, 0, 18.5, 14.5, 0, 0, Math.PI * 2); c.fill(); c.stroke();
