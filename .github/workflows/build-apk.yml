                window.startGoogleSignOut = async () => {
                  await syncProfileToCloud();
                  if (window.GoogleAuthBridge && window.GoogleAuthBridge.signOut) {
                    window.GoogleAuthBridge.signOut();
                  } else {
                    window.onGoogleSignOut();
                  }
                };

                window.onGoogleSignInSuccess = async (user) => {
                  if (!user || !user.id) return;
                  _cloudReady = false;
                  const cleanUid = String(user.id).replace(/[^a-zA-Z0-9_-]/g, '');
                  const newPlayerId = 'g_' + cleanUid;
                  try {
                    const r = await fetch(`${FIREBASE_DB_URL}/players/${newPlayerId}.json`);
                    const cd = r.ok ? await r.json() : null;
                    const localBest = Math.max(0, ...Object.values(profile.bestScores || {}).map(Number));
                    const isFresh = (profile.stats?.games || 0) === 0 && localBest === 0;
                    if (cd && typeof cd === 'object') {
                      if (isFresh) {
                        profile = {
                          ...JSON.parse(JSON.stringify(DEFAULT_PROFILE)), ...cd,
                          potions: { ...DEFAULT_PROFILE.potions, ...(cd.potions || {}) },
                          bestScores: { ...DEFAULT_PROFILE.bestScores, ...(cd.bestScores || {}) },
                          stats: { ...DEFAULT_PROFILE.stats, ...(cd.stats || {}) },
                          settings: { ...DEFAULT_PROFILE.settings, ...(cd.settings || {}) }
                        };
                      } else {
                        profile = {
                          ...profile, ...cd,
                          coins: Math.max(profile.coins || 0, cd.coins || 0),
                          diamonds: Math.max(profile.diamonds || 0, cd.diamonds || 0),
                          level: Math.max(profile.level || 1, cd.level || 1),
                          ownedSkins: mergeUnique(profile.ownedSkins, cd.ownedSkins),
                          ownedEyes: mergeUnique(profile.ownedEyes, cd.ownedEyes),
                          ownedLips: mergeUnique(profile.ownedLips, cd.ownedLips),
