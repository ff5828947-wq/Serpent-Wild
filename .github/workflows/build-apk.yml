                // REWARDED AD PLAYER
                function watchRewardAd(desc, onReward) {
                  const modal = document.getElementById('adModal');
                  const bar = document.getElementById('adProgress');
                  const txt = document.getElementById('adTimerTxt');
                  document.getElementById('adDesc').textContent = desc;
                  bar.style.width = '0%';
                  modal.classList.add('open');
                  let elapsed = 0;
                  const dur = 3.0;
                  const iv = setInterval(() => {
                    elapsed += 0.1;
                    bar.style.width = `${Math.min(100, (elapsed / dur) * 100)}%`;
                    txt.textContent = `${Math.max(0, Math.ceil(dur - elapsed))}s remaining`;
                    if (elapsed >= dur) {
                      clearInterval(iv);
                      modal.classList.remove('open');
                      Sound.play('buy');
                      onReward();
                    }
                  }, 100);
                }

                // DOUBLE REWARD POPUP (GIFT & CHEST LIKE VIDEO 1)
                let pendingReward = null;
                function openRewardPopup(icon, title, coins, dias, potionId = null) {
                  pendingReward = { coins, dias, potionId };
                  document.getElementById('rwIcon').textContent = icon;
                  document.getElementById('rwTitle').textContent = title;
                  let txt = `+${coins} 🪙`;
                  if (dias > 0) txt += `  &  +${dias} 💎`;
                  if (potionId) txt += `  &  +1 Potion`;
                  document.getElementById('rwAmount').textContent = txt;
                  document.getElementById('rewardModal').classList.add('open');
                }
                function applyPendingReward(mult = 1) {
                  if (!pendingReward) return;
                  profile.coins += pendingReward.coins * mult;
                  profile.diamonds += pendingReward.dias * mult;
                  if (pendingReward.potionId) profile.potions[pendingReward.potionId] = (profile.potions[pendingReward.potionId] || 0) + mult;
                  pendingReward = null;
                  saveProfile(); refreshLobbyUI(); syncQuickPotions();
                  document.getElementById('rewardModal').classList.remove('open');
                  Sound.play('buy');
                }
                document.getElementById('btnRwOk').addEventListener('click', () => applyPendingReward(1));
                document.getElementById('btnRwDouble').addEventListener('click', () => {
                  document.getElementById('rewardModal').classList.remove('open');
                  watchRewardAd('Double your Reward (2x)!', () => applyPendingReward(2));
                });

                // LUCKY SPIN WHEEL (EXTRA BONUS)
                const SPIN_SLICES = [
                  { lbl: '500 🪙',  col: '#ff4757', coins: 500,  dias: 0 },
                  { lbl: '15 💎',   col: '#4de2f0', coins: 0,    dias: 15 },
                  { lbl: '1000 🪙', col: '#ffe259', coins: 1000, dias: 0 },
                  { lbl: 'x5 🧪',   col: '#9b38ff', coins: 0,    dias: 0, potion: 'x5' },
                  { lbl: '300 🪙',  col: '#69f03a', coins: 300,  dias: 0 },
                  { lbl: '35 💎',   col: '#ff9f43', coins: 0,    dias: 35 }
                ];
                let spinAngle = 0, spinning = false;
                function drawSpinWheel() {
                  const sc = document.getElementById('spinCanvas');
                  const c = sc.getContext('2d');
                  const cx = 105, cy = 105, r = 92;
                  c.clearRect(0, 0, 210, 210);
                  const step = (Math.PI * 2) / SPIN_SLICES.length;
                  SPIN_SLICES.forEach((sl, i) => {
                    const a0 = spinAngle + i * step, a1 = a0 + step;
                    c.fillStyle = sl.col; c.beginPath(); c.moveTo(cx, cy); c.arc(cx, cy, r, a0, a1); c.closePath(); c.fill();
                    c.strokeStyle = '#fff'; c.lineWidth = 2; c.stroke();
                    c.save(); c.translate(cx, cy); c.rotate(a0 + step / 2);
                    c.fillStyle = '#111'; c.font = '900 11px sans-serif'; c.textAlign = 'right';
                    c.fillText(sl.lbl, r - 12, 4); c.restore();
                  });
                  c.fillStyle = '#ffe259'; c.strokeStyle = '#241300'; c.lineWidth = 2;
                  c.beginPath(); c.moveTo(cx + r + 8, cy); c.lineTo(cx + r - 10, cy - 10); c.lineTo(cx + r - 10, cy + 10); c.closePath(); c.fill(); c.stroke();
                }
                function doSpin() {
                  if (spinning) return;
                  spinning = true;
                  document.getElementById('spinResult').textContent = 'Spinning...';
                  const target = spinAngle + Math.PI * 8 + rand(0, Math.PI * 2);
                  const start = spinAngle, t0 = performance.now(), dur = 2400;
                  function stepAnim(now) {
                    const u = Math.min(1, (now - t0) / dur);
                    spinAngle = start + (target - start) * (1 - Math.pow(1 - u, 3));
                    drawSpinWheel();
                    if (u < 1) requestAnimationFrame(stepAnim);
                    else {
                      spinning = false;
                      const norm = ((Math.PI * 2) - (spinAngle % (Math.PI * 2))) % (Math.PI * 2);
                      const idx = Math.floor(norm / ((Math.PI * 2) / SPIN_SLICES.length)) % SPIN_SLICES.length;
                      const win = SPIN_SLICES[idx];
                      profile.coins += win.coins || 0;
                      profile.diamonds += win.dias || 0;
                      if (win.potion) profile.potions[win.potion] = (profile.potions[win.potion] || 0) + 1;
                      saveProfile(); refreshLobbyUI(); syncQuickPotions(); Sound.play('buy');
                      document.getElementById('spinResult').textContent = `🎉 YOU WON ${win.lbl}!`;
                    }
                  }
                  requestAnimationFrame(stepAnim);
                }

