                  const iv = setInterval(() => {
                    cnt = Math.min(TOTAL_SNAKES, cnt + Math.floor(rand(8, 15)));
                    mt.textContent = `${cnt} / ${TOTAL_SNAKES} SNAKES READY`;
                    if (cnt >= TOTAL_SNAKES) { clearInterval(iv); setTimeout(() => { mm.classList.remove('open'); startMatch(); }, 220); }
                  }, 115);
                });

