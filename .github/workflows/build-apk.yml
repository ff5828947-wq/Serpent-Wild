                            <button class="${profile.googleUid ? 'btn-ghost' : 'btn-blue'}" id="btnProfGoogle" type="button" style="width:100%;margin-top:5px;padding:6px;font-size:9.5px;">${profile.googleUid ? 'Sign Out / Switch Gmail' : 'G Sign in with Google'}</button>
                          </div>
                          <button class="btn-ghost" id="btnResetData" type="button" style="font-size:9.5px;color:#ff8594;border-color:#ff4757;margin-top:6px;">🗑️ Reset Data</button>
                        </div>
                        <div class="dossier-stats">
                          <div class="stat-card"><div class="sv">${bestAll.toLocaleString()}</div><div class="sl">🏆 Best Score</div></div>
                          <div class="stat-card"><div class="sv">${fmtSec(profile.stats.bestTimeSec || 0)}</div><div class="sl">⏱️ Best Survival Time</div></div>
                          <div class="stat-card"><div class="sv">${profile.stats.kills || 0}</div><div class="sl">💀 Worms Defeated</div></div>
