                };
                const EMOJI_RGB_COLS = ['#ff4fd8', '#ffe259', '#69ff59', '#4de8ff', '#9b6bff', '#ff5e5e'];

                function getEmojiDef(key) {
                  const mk = EMOJI_FALLBACK_MAP[key] || key;
                  return EXPRESSIONS.find(e => e.id === mk || e.text === mk) || EXPRESSIONS[0];
                }

                function drawEmHeart(c, x, y, s, col) {
                  c.save(); c.translate(x, y); c.fillStyle = col;
                  c.beginPath(); c.moveTo(0, s * 0.72);
                  c.bezierCurveTo(-s * 1.15, s * 0.05, -s * 0.95, -s * 0.92, 0, -s * 0.25);
                  c.bezierCurveTo(s * 0.95, -s * 0.92, s * 1.15, s * 0.05, 0, s * 0.72);
                  c.closePath(); c.fill();
                  c.fillStyle = 'rgba(255,255,255,0.68)';
                  c.beginPath(); c.ellipse(-s * 0.34, -s * 0.28, s * 0.2, s * 0.12, -0.5, 0, Math.PI * 2); c.fill();
                  c.restore();
                }

                function drawEmStar(c, x, y, ro, ri, rot, col) {
                  c.save(); c.translate(x, y); c.rotate(rot); c.fillStyle = col;
                  c.beginPath();
                  for (let k = 0; k < 10; k++) {
                    const a = (k * Math.PI) / 5 - Math.PI / 2, rad = k % 2 === 0 ? ro : ri;
                    k === 0 ? c.moveTo(Math.cos(a) * rad, Math.sin(a) * rad) : c.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
                  }
                  c.closePath(); c.fill(); c.restore();
                }

                function drawEmSphere(c, r, c1, c2, c3, glossy, glowCol, t) {
                  const g = c.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.08, 0, 0, r * 1.05);
                  g.addColorStop(0, c1); g.addColorStop(0.58, c2); g.addColorStop(1, c3);
                  c.fillStyle = g;
                  c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
                  c.strokeStyle = glowCol ? glowCol : 'rgba(26,14,34,0.62)';
                  c.lineWidth = Math.max(1.6, r * (glossy ? 0.095 : 0.075));
                  c.stroke();
                  c.fillStyle = glossy ? 'rgba(255,255,255,0.58)' : 'rgba(255,255,255,0.38)';
                  c.beginPath(); c.ellipse(-r * 0.28, -r * 0.42, r * 0.38, r * 0.2, -0.45, 0, Math.PI * 2); c.fill();
                  if (glossy) {
                    c.fillStyle = 'rgba(255,255,255,0.78)';
                    c.beginPath(); c.ellipse(-r * 0.42, -r * 0.5, r * 0.14, r * 0.08, -0.45, 0, Math.PI * 2); c.fill();
                    c.save(); c.beginPath(); c.arc(0, 0, r * 0.94, 0, Math.PI * 2); c.clip();
                    const sw = (((t * 0.9) % 2.4) - 1.2) * r * 2.4;
                    c.fillStyle = 'rgba(255,255,255,0.22)';
                    c.beginPath(); c.moveTo(sw - r * 0.35, -r); c.lineTo(sw + r * 0.15, -r); c.lineTo(sw - r * 0.35, r); c.lineTo(sw - r * 0.85, r); c.closePath(); c.fill();
                    c.restore();
                  }
                  c.fillStyle = 'rgba(255,255,255,0.18)';
                  c.beginPath(); c.ellipse(0, r * 0.62, r * 0.55, r * 0.18, 0, 0, Math.PI * 2); c.fill();
                }

                function drawCustomEmoji(c, em, cx, cy, r, t) {
                  if (!em) em = EXPRESSIONS[0];
                  const id = em.id, isGlow = em.tier === 'glow', isDia = em.tier === 'diamond';
                  c.save();
                  c.translate(cx, cy);

                  if (isGlow || isDia) {
                    const pulse = 0.88 + 0.14 * Math.sin(t * (isDia ? 7.5 : 4.2));
                    const gCol = id === 'em_live_king' ? EMOJI_RGB_COLS[Math.floor(t * 4) % EMOJI_RGB_COLS.length] : em.glow;
                    const gr = r * (isDia ? 1.65 : 1.38) * pulse;
                    c.globalAlpha = isDia ? 0.72 : 0.45;
                    c.drawImage(getGlowSprite(gCol), -gr, -gr, gr * 2, gr * 2);
                    if (isDia) {
                      const gr2 = r * 1.18 * pulse;
                      c.globalAlpha = 0.38;
                      c.drawImage(getGlowSprite('#ffffff'), -gr2, -gr2, gr2 * 2, gr2 * 2);
                    }
                    c.globalAlpha = 1;
                  }

                  if (id === 'em_live_rofl') { c.translate(0, -Math.abs(Math.sin(t * 11)) * r * 0.14); c.rotate(Math.sin(t * 5.5) * 0.14); }
                  else if (id === 'em_live_kiss') { c.rotate(Math.sin(t * 3.8) * 0.09); }
                  else if (id === 'em_live_blaze') { c.translate(Math.sin(t * 28) * r * 0.04, Math.cos(t * 24) * r * 0.03); }
                  else if (id === 'em_live_yummy') { const sq = 1 + 0.05 * Math.sin(t * 8); c.scale(sq, 2 - sq); }
                  else if (id === 'em_live_king') { c.translate(0, Math.sin(t * 4.5) * r * 0.08); }

                  const lw = Math.max(1.5, r * 0.085);
                  c.lineCap = 'round'; c.lineJoin = 'round';

                  if (id === 'em_pink_cheeky') {
                    drawEmSphere(c, r, '#ff9cd0', '#f03e8b', '#990c4c', false, '', t);
                    c.fillStyle = 'rgba(255,20,90,0.32)';
                    c.beginPath(); c.ellipse(-r * 0.56, r * 0.18, r * 0.18, r * 0.11, 0, 0, Math.PI * 2); c.ellipse(r * 0.56, r * 0.18, r * 0.18, r * 0.11, 0, 0, Math.PI * 2); c.fill();
                    for (const s of [-1, 1]) {
                      c.fillStyle = '#fff'; c.strokeStyle = '#380a22'; c.lineWidth = lw * 0.85;
                      c.beginPath(); c.arc(s * r * 0.33, -r * 0.18, r * 0.25, 0, Math.PI * 2); c.fill(); c.stroke();
                      c.fillStyle = '#181024'; c.beginPath(); c.arc(s * r * 0.35, -r * 0.18, r * 0.13, 0, Math.PI * 2); c.fill();
                      c.fillStyle = '#fff'; c.beginPath(); c.arc(s * r * 0.3, -r * 0.24, r * 0.06, 0, Math.PI * 2); c.fill();
                    }
                    c.fillStyle = '#4a061c'; c.strokeStyle = '#24030e'; c.lineWidth = lw * 0.8;
                    c.beginPath(); c.arc(0, r * 0.16, r * 0.44, 0.05, Math.PI - 0.05); c.closePath(); c.fill(); c.stroke();
                    c.fillStyle = '#fff'; c.fillRect(-r * 0.36, r * 0.17, r * 0.72, r * 0.14);
                    c.fillStyle = '#ff385c'; c.strokeStyle = '#7a0924'; c.lineWidth = lw * 0.7;
                    c.beginPath(); c.ellipse(r * 0.16, r * 0.52, r * 0.2, r * 0.24, -0.25, 0, Math.PI * 2); c.fill(); c.stroke();
                  } else if (id === 'em_angry_sweat') {
                    drawEmSphere(c, r, '#ffae42', '#e83e14', '#851004', false, '', t);
                    for (const s of [-1, 1]) {
                      c.fillStyle = '#fff'; c.strokeStyle = '#360802'; c.lineWidth = lw * 0.8;
                      c.beginPath(); c.arc(s * r * 0.32, -r * 0.08, r * 0.2, 0, Math.PI * 2); c.fill(); c.stroke();
                      c.fillStyle = '#140808'; c.beginPath(); c.arc(s * r * 0.3, -r * 0.06, r * 0.1, 0, Math.PI * 2); c.fill();
                      c.strokeStyle = '#360802'; c.lineWidth = lw * 1.4;
                      c.beginPath(); c.moveTo(s * r * 0.56, -r * 0.34); c.lineTo(s * r * 0.12, -r * 0.18); c.stroke();
                    }
                    c.strokeStyle = '#360802'; c.lineWidth = lw * 1.25;
                    c.beginPath(); c.arc(0, r * 0.52, r * 0.32, Math.PI * 1.15, Math.PI * 1.85); c.stroke();
                    c.fillStyle = '#59d4ff'; c.strokeStyle = '#0e5894'; c.lineWidth = lw * 0.75;
                    c.beginPath(); c.moveTo(-r * 0.68, -r * 0.08);
                    c.bezierCurveTo(-r * 0.92, r * 0.32, -r * 0.78, r * 0.58, -r * 0.62, r * 0.56);
                    c.bezierCurveTo(-r * 0.44, r * 0.54, -r * 0.46, r * 0.26, -r * 0.68, -r * 0.08); c.fill(); c.stroke();
                    c.fillStyle = '#fff'; c.beginPath(); c.arc(-r * 0.68, r * 0.34, r * 0.06, 0, Math.PI * 2); c.fill();
                  } else if (id === 'em_sunny_grin') {
                    drawEmSphere(c, r, '#fff58a', '#ffb800', '#b56500', false, '', t);
                    c.fillStyle = 'rgba(255,75,110,0.42)';
                    c.beginPath(); c.ellipse(-r * 0.54, r * 0.12, r * 0.18, r * 0.1, 0, 0, Math.PI * 2); c.ellipse(r * 0.54, r * 0.12, r * 0.18, r * 0.1, 0, 0, Math.PI * 2); c.fill();
                    c.strokeStyle = '#4a2200'; c.lineWidth = lw * 1.25;
                    for (const s of [-1, 1]) { c.beginPath(); c.arc(s * r * 0.34, -r * 0.1, r * 0.19, Math.PI * 1.12, Math.PI * 1.88); c.stroke(); }
                    c.fillStyle = '#fff'; c.strokeStyle = '#4a2200'; c.lineWidth = lw;
                    c.beginPath(); c.arc(0, r * 0.14, r * 0.48, 0.04, Math.PI - 0.04); c.closePath(); c.fill(); c.stroke();
                    c.beginPath(); c.moveTo(-r * 0.44, r * 0.34); c.lineTo(r * 0.44, r * 0.34); c.stroke();
                  } else if (id === 'em_cool_shades') {
                    drawEmSphere(c, r, '#9eff8a', '#18b85c', '#075c28', false, '', t);
