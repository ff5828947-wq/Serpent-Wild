                    c.beginPath(); c.arc(0, 0, sr * 1.08, 0, Math.PI * 2); c.fill(); c.stroke();
                    c.fillStyle = '#4de2f0'; c.beginPath(); c.arc(0, 0, sr * 0.72, 0, Math.PI * 2); c.fill();
                    c.globalAlpha = 0.94;
                    c.fillStyle = '#ffffff'; c.beginPath(); c.arc(0, 0, sr * (0.34 + 0.08 * Math.sin(t * 10 + idx)), 0, Math.PI * 2); c.fill();
                    c.globalAlpha = 1;
                  } else if (bt === 'blazeMane') {
                    const fl = 0.8 + 0.34 * Math.sin(t * 15 - idx * 1.2);
                    c.fillStyle = '#ffae00'; c.globalAlpha = 0.82;
                    for (const s of [-1, 1]) {
                      c.beginPath(); c.moveTo(sr * 0.4, s * sr * 0.72); c.quadraticCurveTo(-sr * 0.3, s * sr * (1.65 * fl), -sr * 1.0, s * sr * (1.1 * fl)); c.lineTo(-sr * 0.35, s * sr * 0.65); c.closePath(); c.fill();
                    }
                    c.globalAlpha = 1;
                    c.fillStyle = idx % 2 === 0 ? '#e63900' : '#ff6b00'; c.strokeStyle = '#ffe875'; c.lineWidth = 1.9;
                    c.beginPath(); c.arc(0, 0, sr * 1.04, 0, Math.PI * 2); c.fill(); c.stroke();
                    c.fillStyle = '#fff59e'; c.beginPath(); c.arc(sr * 0.1, 0, sr * 0.44 * fl, 0, Math.PI * 2); c.fill();
                  } else if (bt === 'hellSpikes') {
                    const df = 0.82 + 0.28 * Math.sin(t * 14 - idx * 1.1);
                    if (idx % 2 === 0) {
                      c.fillStyle = '#ff1e38'; c.strokeStyle = '#ffd0d6'; c.lineWidth = 1.4;
                      for (const s of [-1, 1]) {
                        c.beginPath(); c.moveTo(sr * 0.35, s * sr * 0.75); c.lineTo(-sr * 0.35, s * sr * 1.68 * df); c.lineTo(-sr * 0.6, s * sr * 0.7); c.closePath(); c.fill(); c.stroke();
                      }
                    }
                    c.fillStyle = '#38030a'; c.strokeStyle = '#ff2442'; c.lineWidth = 2.1;
                    c.beginPath(); c.arc(0, 0, sr * 1.05, 0, Math.PI * 2); c.fill(); c.stroke();
                    c.fillStyle = '#b80b1f'; c.beginPath(); c.moveTo(sr * 0.74, 0); c.lineTo(0, -sr * 0.58); c.lineTo(-sr * 0.74, 0); c.lineTo(0, sr * 0.58); c.closePath(); c.fill();
                    c.fillStyle = '#ff8594'; c.beginPath(); c.arc(0, 0, sr * 0.28 * df, 0, Math.PI * 2); c.fill();
                  } else if (bt === 'spectralEmerald') {
                    const inf = 0.82 + 0.32 * Math.sin(t * 13 - idx * 1.0);
                    c.fillStyle = '#52ff42'; c.globalAlpha = 0.68;
                    for (const s of [-1, 1]) {
                      c.beginPath(); c.moveTo(sr * 0.35, s * sr * 0.75); c.quadraticCurveTo(-sr * 0.2, s * sr * (1.76 * inf), -sr * 0.95, s * sr * 1.0); c.closePath(); c.fill();
                    }
                    c.globalAlpha = 1;
                    c.fillStyle = '#09381d'; c.strokeStyle = '#69ff59'; c.lineWidth = 2.3;
                    c.beginPath();
                    for (let k = 0; k < 6; k++) {
                      const a = (Math.PI / 3) * k;
                      k === 0 ? c.moveTo(Math.cos(a) * sr * 1.1, Math.sin(a) * sr * 1.1) : c.lineTo(Math.cos(a) * sr * 1.1, Math.sin(a) * sr * 1.1);
                    }
                    c.closePath(); c.fill(); c.stroke();
                    c.fillStyle = '#d4ffbf'; c.beginPath(); c.arc(0, 0, sr * 0.4 * inf, 0, Math.PI * 2); c.fill();
                  } else if (bt === 'aquaFins') {
                    const sw = Math.sin(t * 9 - idx * 0.5) * sr * 0.28;
                    if (idx % 2 === 0) {
                      c.fillStyle = 'rgba(120, 245, 255, 0.88)'; c.strokeStyle = '#ffffff'; c.lineWidth = 1.4;
                      for (const s of [-1, 1]) {
                        c.beginPath(); c.moveTo(sr * 0.45, s * sr * 0.78); c.quadraticCurveTo(sw, s * sr * 1.9, -sr * 0.88, s * sr * 1.12); c.closePath(); c.fill(); c.stroke();
                      }
                    }
                    c.fillStyle = idx % 2 === 0 ? '#0b6cd4' : '#18a8ff'; c.strokeStyle = '#9cf8ff'; c.lineWidth = 2.2;
                    c.beginPath(); c.arc(0, 0, sr * 1.06, 0, Math.PI * 2); c.fill(); c.stroke();
                    c.strokeStyle = 'rgba(255,255,255,0.85)'; c.lineWidth = 1.7;
                    c.beginPath(); c.arc(0, 0, sr * 0.64, -1.1, 1.1); c.stroke();
                    c.fillStyle = '#ffffff'; c.beginPath(); c.arc(sr * 0.14, 0, sr * (0.3 + 0.08 * Math.sin(t * 8 + idx)), 0, Math.PI * 2); c.fill();
                  } else {
                    c.fillStyle = skin.base; c.beginPath(); c.arc(0, 0, sr, 0, Math.PI * 2); c.fill();
                  }

                  c.drawImage(getShadeSprite(maxQ), -sr, -sr, sr * 2, sr * 2);

                  if (aura.rim > 0) {
