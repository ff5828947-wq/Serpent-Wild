                const SPECIES = [
                  { id: 'cobra',    name: 'King Cobra',          head: 'cobra',    hood: true,  rattle: false, horns: false, base: '#4a5e26', dark: '#1a260b', stripe: '#ebd068', belly: '#c4ba78', eye: '#f5be2c', speed: 84, turn: 85, bonusHp: 0,  girth: 1.0,  trait: 'Flare Hood • +25% Venom Poison DoT', price: 0 },
