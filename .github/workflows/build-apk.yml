                const getRank = lv => { let n = RANK_TIERS[0].name; for (const r of RANK_TIERS) if (lv >= r.lv) n = r.name; return n; };
                const getXpNeed = lv => 180 + (lv - 1) * 90;

                const rand = (a, b) => a + Math.random() * (b - a);
                const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
                const lerp = (a, b, t) => a + (b - a) * t;
                const distSq = (x1, y1, x2, y2) => (x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1);
                const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
                const angleDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));
                const randInCircle = (cx, cy, r, m = 160) => { const a = rand(0, Math.PI * 2), d = Math.sqrt(Math.random()) * Math.max(40, r - m); return { x: cx + Math.cos(a) * d, y: cy + Math.sin(a) * d }; };

                const Sound = {
                  ctx: null,
                  init() {
                    try {
                      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
                      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
                    } catch (e) {}
                  },
                  tone(f1, f2, dur, type = 'sine', g = 0.1) {
                    const v = profile.settings.muted ? 0 : profile.settings.sfxVol;
                    if (v <= 0 || !this.ctx) return;
                    try {
                      const t = this.ctx.currentTime, o = this.ctx.createOscillator(), gn = this.ctx.createGain();
                      o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + dur);
                      gn.gain.setValueAtTime(g * v, t); gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
                      o.connect(gn); gn.connect(this.ctx.destination); o.start(t); o.stop(t + dur);
                    } catch (e) {}
                  },
                  click()  { this.tone(560, 820, 0.05, 'triangle', 0.08); },
                  eat()    { this.tone(320, 560, 0.09, 'triangle', 0.1); },
                  bite(cr) { this.tone(cr ? 190 : 250, 75, 0.13, 'sawtooth', cr ? 0.14 : 0.1); },
                  venom()  { this.tone(620, 210, 0.14, 'sawtooth', 0.09); },
                  camo()   { this.tone(380, 760, 0.18, 'sine', 0.09); },
                  kill()   { this.tone(440, 880, 0.16, 'triangle', 0.14); },
                  win()    { [523,659,784,1046].forEach((f,i) => setTimeout(() => this.tone(f, f * 1.03, 0.22, 'triangle', 0.14), i * 110)); },
                  over()   { this.tone(260, 85, 0.42, 'sawtooth', 0.13); }
                };

