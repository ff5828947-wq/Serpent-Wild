                    const buf = this.ctx.createBuffer(1, len, sr), ch = buf.getChannelData(0);
                    let ph = 0;
                    for (let i = 0; i < len; i++) {
                      const t = i / len, env = Math.sin(Math.PI * t);
                      ph += (2 * Math.PI * (f1 + (f2 - f1) * t)) / sr;
                      ch[i] = Math.sin(ph) * env * vol;
