                  c.restore();
                }

                function drawSkinThumb(thumbCvs, skin) {
                  const tc = thumbCvs.getContext('2d');
                  const w = thumbCvs.width, h = thumbCvs.height;
                  tc.clearRect(0, 0, w, h);
                  tc.save(); tc.translate(w * 0.58, h * 0.52);
                  drawWormTail(tc, skin, -34, Math.sin(4.5) * 4, 6.2, 0);
                  for (let i = 4; i >= 1; i--) {
                    drawBodySegment(tc, skin, -i * 8, Math.sin(i * 0.9) * 4, 10.5 - i * 0.8, i, 0);
                  }
                  drawWormHead(tc, skin, profile.eye, profile.lip, 11.5, 0, 0, 0);
                  tc.restore();
                }

                class Worm {
                  constructor({ name, skin, eye, lip, x, y, isPlayer = false, score = 100, isChamp = false, scale = 1.0 }) {
                    this.name = name; this.skin = skin; this.eye = eye || 'cute'; this.lip = lip || 'smile';
                    this.isPlayer = isPlayer; this.isChamp = isChamp; this.scale = scale; this.alive = true;
                    this.x = x; this.y = y; this.angle = rand(0, Math.PI * 2); this.targetAngle = this.angle;
                    this.score = score; this.visualScore = score;
                    this.kills = 0; this.boosting = false;
                    this.spawnShield = isPlayer ? 4.0 : 1.5;
                    this.mouthOpen = 0; this.blinkTimer = rand(1.5, 4.5); this.blinkAmt = 0;
                    this.lookAng = 0; this.bubbleText = ''; this.bubbleTimer = 0;
                    this.aiTimer = rand(0, 0.5); this.aiWander = this.angle; this.aiBoost = 0;
                    this.segments = [];
                    const cnt = this.getSegCount();
                    for (let i = 0; i < cnt; i++) this.segments.push({ x: x - Math.cos(this.angle) * i * 4.5, y: y - Math.sin(this.angle) * i * 4.5 });
                  }

                  getRadius() {
                    const s = Math.max(0, this.visualScore != null ? this.visualScore : this.score);
                    let r;
                    if (s <= 100000) {
                      r = 12 + 38 * (s / 100000);
                    } else if (s <= 200000) {
                      r = 50 + 12.5 * ((s - 100000) / 100000);
                    } else {
                      r = 62.5;
                    }
                    return clamp(r, 9, 62.5) * this.scale;
                  }

                  getSegCount() {
                    const s = Math.max(0, this.visualScore != null ? this.visualScore : this.score);
                    const rBase = this.getRadius() / (this.scale || 1);
                    let targetLenPx;
                    if (s <= 20000) {
                      targetLenPx = 150 + 850 * (s / 20000);
                    } else if (s <= 100000) {
                      targetLenPx = 1000 + 3000 * ((s - 20000) / 80000);
                    } else {
                      targetLenPx = 4000;
                    }
                    const spc = rBase * 0.45;
                    return clamp(Math.round((targetLenPx - 2 * rBase) / spc) + 1, 14, 650);
                  }

                  say(txt) { this.bubbleText = txt; this.bubbleTimer = 2.6; }

                  updateAI(dt) {
                    this.aiTimer -= dt;
                    this.aiReact = (this.aiReact || 0) - dt;
                    if (this.aiBoost > 0) this.aiBoost -= dt;
                    if (dist(this.x, this.y, WORLD_CENTER, WORLD_CENTER) > ARENA_RADIUS - 380) {
                      this.targetAngle = Math.atan2(WORLD_CENTER - this.y, WORLD_CENTER - this.x);
                      this.boosting = false; return;
                    }

                    if (this.aiReact <= 0) {
                      this.aiReact = rand(0.24, 0.36);
                      const rSelf = this.getRadius();
                      const fx = Math.cos(this.angle), fy = Math.sin(this.angle);
                      const probeX = this.x + fx * (rSelf + 34), probeY = this.y + fy * (rSelf + 34);
                      let avX = 0, avY = 0, danger = false;

                      for (const o of worms) {
                        if (o === this || !o.alive) continue;
                        const rO = o.getRadius();
                        const maxReach = o.segments.length * rO * 0.5 + 200;
                        if (distSq(this.x, this.y, o.x, o.y) > maxReach * maxReach) continue;

                        const safeR = rSelf + rO + 46;
                        const safeR2 = safeR * safeR;
                        const step = o.segments.length > 50 ? 4 : 3;
                        for (let k = 0; k < o.segments.length; k += step) {
                          const sg = o.segments[k];
                          const dx = this.x - sg.x, dy = this.y - sg.y;
                          const d2 = dx * dx + dy * dy;
                          const pd2 = distSq(probeX, probeY, sg.x, sg.y);
                          if (d2 < safeR2 || pd2 < safeR2 * 0.55) {
                            const d = Math.sqrt(d2) || 1;
                            const ahead = -(dx * fx + dy * fy) / d;
                            if (ahead > 0.05) {
                              const weight = ((safeR - Math.min(d, safeR * 0.9)) / (d * d)) * (ahead > 0.3 ? 1.6 : 0.9);
                              avX += (dx / d) * weight;
                              avY += (dy / d) * weight;
                              danger = true;
                            }
                          }
                        }
                      }

                      if (danger && Math.random() < 0.82) {
                        this.targetAngle = Math.atan2(avY, avX);
                        this.aiBoost = 0;
                        this.boosting = false;
                        this.aiTimer = 0.35;
                        return;
                      }
                    }

                    if (this.aiTimer <= 0) {
                      this.aiTimer = rand(0.45, 0.95);
                      let prey = null, preyD = 280 * 280;
                      if (this.score > 300) {
                        for (const o of worms) {
                          if (o === this || !o.alive || o.spawnShield > 0) continue;
                          const d2 = distSq(this.x, this.y, o.x, o.y);
                          if (d2 < preyD && d2 > 110 * 110) { preyD = d2; prey = o; }
                        }
                      }

                      if (prey && Math.random() < 0.25) {
                        const lead = 60 + prey.getRadius();
                        const tx = prey.x + Math.cos(prey.angle) * lead;
                        const ty = prey.y + Math.sin(prey.angle) * lead;
                        this.targetAngle = Math.atan2(ty - this.y, tx - this.x);
                        this.aiBoost = rand(0.3, 0.65);
                      } else {
                        this.aiWander += rand(-1.2, 1.2);
                        this.targetAngle = this.aiWander;
                        let bestF = null, bestD = 280 * 280;
                        for (let i = 0; i < foods.length; i += 2) {
                          const f = foods[i], d2 = distSq(this.x, this.y, f.x, f.y);
                          const lim = f.big ? 350 * 350 : bestD;
                          if (d2 < lim) {
                            bestD = f.big ? d2 * 0.65 : d2;
                            bestF = f;
                          }
                        }
                        if (bestF) {
                          this.targetAngle = Math.atan2(bestF.y - this.y, bestF.x - this.x);
                          if (bestF.big && this.score > 250 && Math.random() < 0.25) this.aiBoost = 0.45;
                        }
                      }
                    }
                    this.boosting = this.aiBoost > 0 && this.score > 160;
                  }

                  update(dt) {
                    if (!this.alive) return;
                    if (this.spawnShield > 0) this.spawnShield = Math.max(0, this.spawnShield - dt);
                    if (this.mouthOpen > 0) this.mouthOpen = Math.max(0, this.mouthOpen - dt * 3.8);
                    if (this.bubbleTimer > 0) this.bubbleTimer = Math.max(0, this.bubbleTimer - dt);

                    this.blinkTimer -= dt;
                    if (this.blinkTimer <= 0) {
                      this.blinkAmt = 1;
                      if (this.blinkTimer < -0.14) { this.blinkAmt = 0; this.blinkTimer = rand(2.2, 5.2); }
                    }

                    if (!this.isPlayer) this.updateAI(dt);

                    const speedBuff = this.isPlayer && (buffs.speed || 0) > 0;
                    const canBoost = (this.boosting || speedBuff) && (this.score > 120 || speedBuff);
                    if (this.boosting && !speedBuff && canBoost) {
                      this.score = Math.max(100, this.score - dt * 15);
                      if (Math.random() < 0.14 && foods.length < 750) {
                        const tail = this.segments[this.segments.length - 1];
                        foods.push({ x: tail.x, y: tail.y, val: 6, r: 8, icon: '✨', col: this.skin.base, orb: true, big: false });
                      }
                    }

                    const baseSpd = 215;
                    const spd = canBoost ? baseSpd * (speedBuff ? 1.82 : 1.65) : baseSpd;
                    const diff = angleDiff(this.targetAngle, this.angle);
                    this.angle += clamp(diff, -5.8 * dt, 5.8 * dt);
                    this.x += Math.cos(this.angle) * spd * dt;
                    this.y += Math.sin(this.angle) * spd * dt;

                    this.visualScore = lerp(this.visualScore, this.score, clamp(dt * 2.0, 0, 1));
                    const r = this.getRadius();
                    if (dist(this.x, this.y, WORLD_CENTER, WORLD_CENTER) + r > ARENA_RADIUS) {
                      killWorm(this, null, 'Arena Wall'); return;
                    }

                    this.segments[0].x = this.x; this.segments[0].y = this.y;
                    const spc = r * 0.45;
                    for (let i = 1; i < this.segments.length; i++) {
                      const p = this.segments[i - 1], c = this.segments[i];
                      const dx = c.x - p.x, dy = c.y - p.y, d = Math.hypot(dx, dy) || 0.001;
                      if (d > spc) { const rt = spc / d; c.x = p.x + dx * rt; c.y = p.y + dy * rt; }
                    }
                    const tLen = this.getSegCount();
                    if (this.segments.length < tLen) { const tl = this.segments[this.segments.length - 1]; this.segments.push({ x: tl.x, y: tl.y }); }
                    else if (this.segments.length > tLen && this.segments.length > 14) this.segments.pop();
                  }

                  draw(c, showUi = true, viewX = 0, viewY = 0) {
                    if (!this.alive || this.segments.length < 4) return;
                    const r = this.getRadius(), len = this.segments.length;
                    const cull = viewX > 0 && viewY > 0;
                    const cx = camera.x, cy = camera.y;
                    const padX = viewX + r * 2, padY = viewY + r * 2;
                    const segStep = (len > 50 && r > 15) ? 2 : 1;

                    c.save();
                    c.fillStyle = 'rgba(0,0,0,0.20)';
                    c.beginPath();
                    for (let i = len - 1; i >= 0; i -= 2) {
                      const seg = this.segments[i];
                      if (cull && (Math.abs(seg.x - cx) > padX || Math.abs(seg.y - cy) > padY)) continue;
                      const taper = i > len - 6 ? lerp(1, 0.55, (i - (len - 6)) / 6) : 1;
                      const sr = r * taper;
                      c.moveTo(seg.x + 3 + sr, seg.y + 5);
                      c.arc(seg.x + 3, seg.y + 5, sr, 0, Math.PI * 2);
                    }
                    c.fill();

                    if (this.boosting) {
                      const aura = 0.22 + 0.08 * Math.sin(globalTime * 16);
                      c.fillStyle = '#ffffff'; c.globalAlpha = aura;
                      const ar = r * 1.34;
                      c.beginPath();
                      for (let i = len - 1; i >= 0; i -= 2) {
                        const seg = this.segments[i];
                        if (cull && (Math.abs(seg.x - cx) > padX || Math.abs(seg.y - cy) > padY)) continue;
                        c.moveTo(seg.x + ar, seg.y);
                        c.arc(seg.x, seg.y, ar, 0, Math.PI * 2);
                      }
                      c.fill();
                      c.globalAlpha = 1;
                    }
                    const tailSeg = this.segments[len - 1], tailPrev = this.segments[len - 2];
                    if (tailSeg && tailPrev && (!cull || (Math.abs(tailSeg.x - cx) <= padX && Math.abs(tailSeg.y - cy) <= padY))) {
                      const tailAng = Math.atan2(tailPrev.y - tailSeg.y, tailPrev.x - tailSeg.x);
                      drawWormTail(c, this.skin, tailSeg.x, tailSeg.y, r * 0.62, tailAng);
                    }

                    for (let i = len - 1; i >= 1; i -= segStep) {
                      const seg = this.segments[i];
                      if (cull && (Math.abs(seg.x - cx) > padX || Math.abs(seg.y - cy) > padY)) continue;
                      const prev = this.segments[i - 1];
                      const ang = Math.atan2(prev.y - seg.y, prev.x - seg.x);
                      const taper = i > len - 6 ? lerp(1, 0.55, (i - (len - 6)) / 6) : 1;
                      drawBodySegment(c, this.skin, seg.x, seg.y, r * taper, i, ang);
                    }

                    const headVisible = !cull || (Math.abs(this.x - cx) <= padX && Math.abs(this.y - cy) <= padY);
                    if (headVisible) {
                      c.save();
                      c.translate(this.x, this.y);
                      c.rotate(this.angle);
                      drawWormHead(c, this.skin, this.eye, this.lip, r * 1.08, this.blinkAmt, this.mouthOpen, this.lookAng);
                      if (this.spawnShield > 0) {
                        c.strokeStyle = 'rgba(89, 244, 255, 0.85)'; c.lineWidth = 2.6;
                        c.beginPath(); c.arc(0, 0, r * 1.65, 0, Math.PI * 2); c.stroke();
                      }
                      c.restore();

                      if (this.bubbleTimer > 0 && this.bubbleText) {
                        drawEmojiBubble(c, this.x, this.y, r, this.bubbleText, this === lobbyWorm, this === wsPreviewWorm);
                      }

                      if (showUi && profile.settings.showNames) {
                        c.font = '900 10.5px sans-serif'; c.textAlign = 'center';
                        const lbl = this.isChamp ? `👑 ${this.name}` : this.name;
                        c.fillStyle = 'rgba(0,0,0,0.65)'; c.fillText(lbl, this.x + 1, this.y - r - 10);
                        c.fillStyle = this.isChamp ? '#ffe259' : '#ffffff'; c.fillText(lbl, this.x, this.y - r - 11);
                      }
                    }
                    c.restore();
                  }
                }

                function spawnFood(count = 1, nearPlayer = false) {
                  const fv = FOOD_VARIETIES.find(f => f.id === profile.food) || FOOD_VARIETIES[0];
                  const vals = [3, 6, 12, 22, 36, 54];
                  const cols = ['#ff4757','#ffe259','#69f03a','#4de2f0','#ff6be6','#ff9f43'];
                  for (let i = 0; i < count; i++) {
                    let pt = (nearPlayer && player && player.alive)
                      ? { x: clamp(player.x + rand(-1800, 1800), WORLD_CENTER - ARENA_RADIUS + 200, WORLD_CENTER + ARENA_RADIUS - 200),
                          y: clamp(player.y + rand(-1800, 1800), WORLD_CENTER - ARENA_RADIUS + 200, WORLD_CENTER + ARENA_RADIUS - 200) }
                      : randInArena(240);
                    const v = vals[Math.floor(Math.random() * vals.length)];
                    const icon = fv.items[Math.floor(Math.random() * fv.items.length)];
                    foods.push({ x: pt.x, y: pt.y, val: v, r: v >= 36 ? 19 : (v >= 12 ? 16 : 13), icon, col: cols[i % cols.length], orb: icon === 'orb', big: false });
                  }
                }

                function spawnMapPotion(count = 1) {
                  for (let i = 0; i < count; i++) {
                    const po = POTIONS[Math.floor(Math.random() * POTIONS.length)];
                    const pt = randInArena(360);
                    potions.push({ ...po, x: pt.x, y: pt.y, r: 18, life: 55 });
                  }
                }

                function spawnChest(count = 1) {
                  for (let i = 0; i < count; i++) {
                    const pt = randInArena(450);
                    chests.push({ x: pt.x, y: pt.y, r: 22, life: 65 });
                  }
                }

                function showDefeatBanner(txt) {
                  const el = document.getElementById('defeatBanner');
                  el.textContent = txt; el.style.display = 'block';
                  clearTimeout(el.__t);
                  el.__t = setTimeout(() => { el.style.display = 'none'; }, 2400);
                }

                function killWorm(victim, killer, reason) {
                  if (!victim.alive) return;
                  victim.alive = false;
                  const deadItems = ['🥩', '🥦', '🍗', '🥕', '🍖', '🍅', '🥓', '🌽', '🥩', '🌶️', '🍗', '🥒', '🍖', '🍆'];
                  const dropPts = [];
                  const stepPx = 42;
                  if (victim.segments.length > 0) {
                    dropPts.push({ x: victim.segments[0].x, y: victim.segments[0].y });
                    let carry = 0;
                    for (let i = 1; i < victim.segments.length && dropPts.length < 95; i++) {
                      const p0 = victim.segments[i - 1], p1 = victim.segments[i];
                      const dx = p1.x - p0.x, dy = p1.y - p0.y;
                      const segD = Math.hypot(dx, dy);
                      if (segD < 0.001) continue;
                      let d = stepPx - carry;
                      while (d <= segD && dropPts.length < 95) {
                        const u = d / segD;
                        dropPts.push({ x: p0.x + dx * u, y: p0.y + dy * u });
                        d += stepPx;
                      }
                      carry = segD - (d - stepPx);
                    }
                  }
                  const chunkVal = Math.max(14, Math.min(180, Math.round((victim.score * 0.65) / Math.max(1, dropPts.length))));
                  const glowCols = ['#ffe259', '#ff7a18', '#69f03a', '#ff4757', '#4de2f0'];
                  for (let i = 0; i < dropPts.length; i++) {
                    const pt = dropPts[i];
                    foods.push({
                      x: pt.x, y: pt.y, val: chunkVal, r: 26, icon: deadItems[i % deadItems.length],
                      col: glowCols[i % glowCols.length], orb: false, big: true, killDrop: true, phase: i * 0.55
                    });
                  }

                  const sadEmojis = ['😭', '🫠', '😵', '💀'];
                  emojiPopups.push({ x: victim.x, y: victim.y - victim.getRadius() - 10, emoji: sadEmojis[Math.floor(Math.random() * sadEmojis.length)], life: 1.8, maxLife: 1.8 });
                  if (killer && killer !== victim && killer.alive) {
                    const winEmojis = ['😈', '💪', '😎', '🔥'];
                    killer.say(winEmojis[Math.floor(Math.random() * winEmojis.length)]);
                  }

                  for (let i = 0; i < 16; i++) {
                    const a = rand(0, 6.28), sp = rand(40, 170);
                    particles.push({ x: victim.x, y: victim.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.55, maxLife: 0.55, r: rand(3, 6), col: victim.skin.base });
                  }

                  if (killer && killer !== victim) {
                    killer.kills++;
                    if (killer.isPlayer) {
                      matchKills++;
                      const killBonus = Math.max(231, Math.min(3022, Math.round(victim.score * 0.35)));
                      killer.score += killBonus;
                      matchCoins += 15;
                      Sound.play('kill'); vibrate(55);
                      showDefeatBanner(`+1 You defeated ${victim.name}! (+${killBonus})`);
                      floatTexts.push({ x: victim.x, y: victim.y - 24, text: `+${killBonus}`, color: '#ffe259', life: 1.3, maxLife: 1.3, big: true });
                    }
                  }

                  if (victim.isPlayer) {
                    if (!reviveUsed) openReviveModal();
                    else finishMatch(reason || 'Defeated in Arena');
                  } else {
                    setTimeout(() => {
                      if (screenState !== 'playing') return;
                      const pt = randInArena(450);
                      const sk = SKINS[Math.floor(Math.random() * SKINS.length)];
                      const ey = EXTRA_EYES[Math.floor(Math.random() * EXTRA_EYES.length)].id;
                      const lp = EXTRA_LIPS[Math.floor(Math.random() * EXTRA_LIPS.length)].id;
                      worms.push(new Worm({ name: victim.name, skin: sk, eye: ey, lip: lp, x: pt.x, y: pt.y, score: Math.floor(rand(120, 4200)) }));
                    }, 900);
                  }
                }

                function openReviveModal() {
                  screenState = 'revive';
                  document.getElementById('revScoreTxt').textContent = Math.floor(player.score).toLocaleString();
                  let left = 5;
                  document.getElementById('revCountTxt').textContent = left;
                  document.getElementById('reviveModal').classList.add('open');
                  clearInterval(reviveIv);
                  reviveIv = setInterval(() => {
                    left--;
                    document.getElementById('revCountTxt').textContent = left;
                    if (left <= 0) {
                      clearInterval(reviveIv);
                      document.getElementById('reviveModal').classList.remove('open');
                      finishMatch('Defeated in Arena');
                    }
                  }, 1000);
                }

                function revivePlayer() {
                  clearInterval(reviveIv);
                  reviveUsed = true;
                  document.getElementById('reviveModal').classList.remove('open');
                  const pt = randInArena(700);
                  player.x = pt.x; player.y = pt.y; player.alive = true; player.spawnShield = 4.0;
                  player.segments.forEach((s, i) => { s.x = pt.x - i * 4.5; s.y = pt.y; });
                  screenState = 'playing';
                  player.say('I am back! ⚡');
                }

                function startMatch(bonusScore = 0) {
                  recordPlayToday();
                  screenState = 'playing';
                  reviveUsed = false;
                  matchStartMs = Date.now();
                  matchKills = 0; matchCoins = 0; matchTimer = 300; buffs = {};
                  profile.stats.games = (profile.stats.games || 0) + 1;
                  document.getElementById('lobbyScreen').style.display = 'none';
                  document.getElementById('resultsModal').classList.remove('open');
                  document.getElementById('hud').style.display = 'block';
                  document.getElementById('modeTimerPill').style.display = profile.mode === 'time' ? 'block' : 'none';

                  buildFloorPattern(profile.floor);
                  worms = []; foods = []; potions = []; chests = []; particles = []; floatTexts = [];
                  emojiPopups = [];

                  const pSkin = SKINS.find(s => s.id === profile.skin) || SKINS[0];
                  const startScore = 100 + (bonusScore || pendingStartBonus);
                  pendingStartBonus = 0;
                  player = new Worm({
                    name: profile.name, skin: pSkin, eye: profile.eye, lip: profile.lip,
                    x: WORLD_CENTER, y: WORLD_CENTER, isPlayer: true, score: startScore, isChamp: isWorldChampion()
                  });
                  const exprObj = EXPRESSIONS.find(e => e.id === profile.expr) || EXPRESSIONS[0];
                  player.say(exprObj.text);
                  worms.push(player);

                  const shuffledSkins = [...SKINS].sort(() => Math.random() - 0.5);
                  for (let i = 1; i < TOTAL_WORMS; i++) {
                    const pt = randInArena(450);
                    const sk = shuffledSkins[(i - 1) % shuffledSkins.length];
                    const ey = EXTRA_EYES[Math.floor(Math.random() * EXTRA_EYES.length)].id;
                    const lp = EXTRA_LIPS[Math.floor(Math.random() * EXTRA_LIPS.length)].id;
                    const sc = i === 1 ? Math.floor(rand(95000, 180000)) : (i < 5 ? Math.floor(rand(18000, 58000)) : Math.floor(rand(120, 4200)));
                    worms.push(new Worm({ name: AI_NAMES[i % AI_NAMES.length] + (i > 25 ? i : ''), skin: sk, eye: ey, lip: lp, x: pt.x, y: pt.y, score: sc }));
                  }

                  spawnFood(450, true);
                  spawnFood(750, false);
                  spawnMapPotion(18);
                  spawnChest(profile.mode === 'treasure' ? 12 : 4);
                  camera.x = player.x; camera.y = player.y; camera.zoom = 1.0;
                  syncQuickPotions();
                  saveProfile();
                }

                function finishMatch(subText) {
                  screenState = 'results';
                  document.getElementById('hud').style.display = 'none';
                  const finalScore = Math.floor(player ? player.score : 0);
                  const earnedGold = Math.max(25, Math.floor(finalScore / 85) + matchCoins);
                  const elapsedSec = Math.max(1, Math.floor((Date.now() - matchStartMs) / 1000));
                  const wasChamp = isWorldChampion();

                  profile.coins += earnedGold;
                  profile.xp = (profile.xp || 0) + Math.floor(finalScore / 12);
                  while (profile.xp >= profile.level * 1000) { profile.xp -= profile.level * 1000; profile.level++; }
                  profile.stats.kills = (profile.stats.kills || 0) + matchKills;
                  profile.stats.totalTimeSec = (profile.stats.totalTimeSec || 0) + elapsedSec;
                  if (elapsedSec > (profile.stats.bestTimeSec || 0)) profile.stats.bestTimeSec = elapsedSec;
                  if (finalScore > (profile.bestScores[profile.mode] || 0)) profile.bestScores[profile.mode] = finalScore;
                  saveProfile();
                  document.getElementById('resTitle').textContent = profile.mode === 'time' && matchTimer <= 0 ? 'TIME UP!' : 'GAME OVER!';
                  document.getElementById('resSub').textContent = subText;
                  document.getElementById('resScore').textContent = finalScore.toLocaleString();
                  document.getElementById('resKills').textContent = matchKills;
                  document.getElementById('resGold').textContent = `+${earnedGold} 🪙`;
                  const resNotice = document.getElementById('resChampNotice');
                  resNotice.style.display = 'none';
                  document.getElementById('resultsModal').classList.add('open');
                  syncRealPlayerScore(profile.mode, finalScore).then(() => {
                    const r = getMyWorldRank(profile.mode);
                    if (r >= 1 && r <= 10) {
                      resNotice.innerHTML = `🎉 WORLD TOP #${r}! ${getRankBadgeHtml(r)} ACTIVE!`;
                      resNotice.style.display = 'block';
                    } else {
                      resNotice.style.display = 'none';
                    }
                  });

                  Sound.play('over');
                }

                function updateGame(dt) {
                  if (profile.mode === 'time') {
                    matchTimer -= dt;
                    if (matchTimer <= 0) { finishMatch('5-Minute Time Battle Completed!'); return; }
                  }

                  Object.keys(buffs).forEach(k => { if (buffs[k] > 0) buffs[k] = Math.max(0, buffs[k] - dt); });

                  if (player && player.alive) {
                    let kx = (ctrl.keys.right ? 1 : 0) - (ctrl.keys.left ? 1 : 0);
                    let ky = (ctrl.keys.down ? 1 : 0) - (ctrl.keys.up ? 1 : 0);
                    if (kx !== 0 || ky !== 0) player.targetAngle = Math.atan2(ky, kx);
                    else if (ctrl.joyActive && ctrl.joyMag > 8) player.targetAngle = ctrl.joyAngle;
                    player.boosting = ctrl.boostHeld || ctrl.keys.boost;
                  }

                  for (const w of worms) w.update(dt);

                  for (const w of worms) {
                    if (!w.alive || w.spawnShield > 0) continue;
                    const rW = w.getRadius();
                    const noseX = w.x + Math.cos(w.angle) * (rW * 0.72);
                    const noseY = w.y + Math.sin(w.angle) * (rW * 0.72);
                    const hitW = rW * 0.56;
                    for (const o of worms) {
                      if (o === w || !o.alive || o.spawnShield > 0) continue;
                      const rO = o.getRadius();
                      const maxReach = o.segments.length * rO * 0.5 + 320;
                      if (distSq(noseX, noseY, o.x, o.y) > maxReach * maxReach) continue;
                      const hitO = rO * 0.90;
                      const hitSq = (hitW + hitO) * (hitW + hitO);
                      let hit = false;
                      const hitStep = rO > 16 ? 2 : 1;
                      for (let k = 1; k < o.segments.length; k += hitStep) {
                        if (distSq(noseX, noseY, o.segments[k].x, o.segments[k].y) < hitSq) { hit = true; break; }
                      }
                      if (hit) { killWorm(w, o, `Crashed into ${o.name}`); break; }
                    }
                  }

                  const magR = (buffs.magnet || 0) > 0 ? 260 : 85;
                  const mult = (buffs.x5 || 0) > 0 ? 5 : 1;
                  let nearFoodAng = 0, nearFoodD = 220 * 220;

                  for (let i = foods.length - 1; i >= 0; i--) {
                    const f = foods[i];
                    if (player && player.alive) {
                      const d2 = distSq(player.x, player.y, f.x, f.y);
                      if (d2 < nearFoodD) { nearFoodD = d2; nearFoodAng = Math.atan2(f.y - player.y, f.x - player.x) - player.angle; }
                      if (d2 < magR * magR) { f.x = lerp(f.x, player.x, dt * 8.5); f.y = lerp(f.y, player.y, dt * 8.5); }
                    }
                    for (const w of worms) {
                      if (!w.alive || Math.abs(w.x - f.x) > 105 || Math.abs(w.y - f.y) > 105) continue;
                      const er = w.getRadius() * 1.28 + f.r;
                      if (distSq(w.x, w.y, f.x, f.y) < er * er) {
                        const gain = Math.round(f.val * 1.3 * (w.isPlayer ? mult : 1));
                        w.score += gain;
                        w.mouthOpen = 0.85;
                        if (w.isPlayer) {
                          Sound.eat();
                          if (gain >= 12 || Math.random() < 0.35) {
                            floatTexts.push({ x: f.x, y: f.y - 12, text: `+${gain}`, color: gain >= 50 ? '#ffe259' : '#a8ff78', life: 0.72, maxLife: 0.72, big: gain >= 50 });
                          }
                        }
                        foods[i] = foods[foods.length - 1]; foods.pop(); break;
                      }
                    }
                  }
                  if (player && player.alive) player.lookAng = lerp(player.lookAng, nearFoodAng, dt * 10);
                  if (foods.length < 1150) { spawnFood(8, true); spawnFood(12, false); }

                  for (let i = potions.length - 1; i >= 0; i--) {
                    const p = potions[i]; p.life -= dt;
                    if (p.life <= 0) { potions.splice(i, 1); continue; }
                    if (player && player.alive && distSq(player.x, player.y, p.x, p.y) < (player.getRadius() + p.r + 12) ** 2) {
                      buffs[p.id] = p.dur;
                      Sound.play('potion'); vibrate(30);
                      floatTexts.push({ x: p.x, y: p.y - 18, text: `${p.icon} ${p.name}!`, color: p.col, life: 1.2, maxLife: 1.2, big: true });
                      potions.splice(i, 1);
                    }
                  }
                  if (potions.length < 14) spawnMapPotion(2);

                  for (let i = chests.length - 1; i >= 0; i--) {
                    const ch = chests[i]; ch.life -= dt;
                    if (ch.life <= 0) { chests.splice(i, 1); continue; }
                    if (player && player.alive && distSq(player.x, player.y, ch.x, ch.y) < (player.getRadius() + ch.r + 14) ** 2) {
                      const bonus = 1500 * mult;
                      player.score += bonus; matchCoins += 60;
                      Sound.play('buy'); vibrate(45);
                      floatTexts.push({ x: ch.x, y: ch.y - 20, text: `💰 +${bonus} & +60 🪙`, color: '#ffe259', life: 1.4, maxLife: 1.4, big: true });
                      chests.splice(i, 1);
                    }
                  }
                  if (chests.length < (profile.mode === 'treasure' ? 10 : 3)) spawnChest(1);

                  for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; if (p.life <= 0) particles.splice(i, 1); }
                  for (let i = floatTexts.length - 1; i >= 0; i--) { const ft = floatTexts[i]; ft.y -= 34 * dt; ft.life -= dt; if (ft.life <= 0) floatTexts.splice(i, 1); }
                  for (let i = emojiPopups.length - 1; i >= 0; i--) { const ep = emojiPopups[i]; ep.y -= 18 * dt; ep.life -= dt; if (ep.life <= 0) emojiPopups.splice(i, 1); }

                  if (player && player.alive) {
                    camera.x = lerp(camera.x, player.x, clamp(dt * 8, 0, 1));
                    camera.y = lerp(camera.y, player.y, clamp(dt * 8, 0, 1));
                                     const sizeZoom = 0.96;
                 const targetZoom = (buffs.zoom || 0) > 0 ? 0.78 : sizeZoom;

                    camera.zoom = lerp(camera.zoom, targetZoom, clamp(dt * 3.5, 0, 1));
                  }

                  hudTick -= dt;
                  if (hudTick <= 0 && player) {
                    hudTick = 0.45;
                    document.getElementById('hudScoreBig').textContent = Math.floor(player.score).toLocaleString();
                    document.getElementById('hudKillsPill').textContent = `💀 ${matchKills}`;
                    document.getElementById('hudCoinsRun').textContent = `🪙 ${matchCoins}`;

                    if (profile.mode === 'time') {
                      const t = Math.max(0, Math.ceil(matchTimer));
                      document.getElementById('modeTimerPill').textContent = `⏱️ ${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
                    }

                    const bRow = document.getElementById('activeBuffRow');
                    bRow.innerHTML = POTIONS.filter(p => (buffs[p.id] || 0) > 0)
                      .map(p => `<span class="buff-tag">${p.icon} ${Math.ceil(buffs[p.id])}s</span>`).join('');

                    const sorted = worms.filter(w => w.alive).sort((a, b) => b.score - a.score);
                    const myIdx = sorted.findIndex(w => w.isPlayer);
                    let lbHtml = `<div class="alb-hdr">Top players (in arena: ${sorted.length})</div>`;
                    lbHtml += sorted.slice(0, 9).map((w, i) =>
                      `<div class="alb-row${w.isPlayer ? ' me' : ''}"><span>${i === 0 ? '👑' : (i + 1) + '.'} ${w.name.slice(0, 11)}</span><span>${Math.floor(w.score).toLocaleString()}</span></div>`
                    ).join('');
                    if (myIdx >= 9 && player.alive) {
                      lbHtml += `<div class="alb-sep"></div><div class="alb-row me"><span>${myIdx + 1}. ${player.name.slice(0, 11)}</span><span>${Math.floor(player.score).toLocaleString()}</span></div>`;
                    }
                    document.getElementById('arenaLeaderBox').innerHTML = lbHtml;

                    drawMinimap();
                  }
                }

                function drawMinimap() {
                  const w = miniCanvas.width, h = miniCanvas.height, cx = w / 2, cy = h / 2;
                  const sc = (w * 0.45) / ARENA_RADIUS;
                  miniCtx.clearRect(0, 0, w, h);
                  miniCtx.fillStyle = '#09240f'; miniCtx.fillRect(0, 0, w, h);

                  miniCtx.strokeStyle = 'rgba(130,240,105,0.16)'; miniCtx.lineWidth = 1;
                  miniCtx.beginPath(); miniCtx.moveTo(cx, 6); miniCtx.lineTo(cx, h - 6); miniCtx.moveTo(6, cy); miniCtx.lineTo(w - 6, cy); miniCtx.stroke();

                  miniCtx.strokeStyle = 'rgba(255,80,80,0.75)'; miniCtx.lineWidth = 2.4;
                  miniCtx.beginPath(); miniCtx.arc(cx, cy, ARENA_RADIUS * sc, 0, Math.PI * 2); miniCtx.stroke();

                  const radarOn = (buffs.radar || 0) > 0;
                  miniCtx.fillStyle = '#ffe259';
                  for (const ch of chests) {
                    miniCtx.beginPath(); miniCtx.arc(cx + (ch.x - WORLD_CENTER) * sc, cy + (ch.y - WORLD_CENTER) * sc, radarOn ? 4.2 : 2.8, 0, Math.PI * 2); miniCtx.fill();
                  }
                  for (const wm of worms) {
                    if (!wm.alive || wm.isPlayer) continue;
                    const isBoss = wm.score > 5000;
                    miniCtx.fillStyle = isBoss ? '#ff3b30' : 'rgba(255,140,140,0.78)';
                    miniCtx.beginPath(); miniCtx.arc(cx + (wm.x - WORLD_CENTER) * sc, cy + (wm.y - WORLD_CENTER) * sc, isBoss ? (radarOn ? 4.2 : 3.2) : 2.0, 0, Math.PI * 2); miniCtx.fill();
                  }
                  if (player && player.alive) {
                    const px = cx + (player.x - WORLD_CENTER) * sc, py = cy + (player.y - WORLD_CENTER) * sc;
                    miniCtx.fillStyle = '#69f03a';
                    miniCtx.beginPath(); miniCtx.arc(px, py, 4.4, 0, Math.PI * 2); miniCtx.fill();
                    miniCtx.strokeStyle = '#ffffff'; miniCtx.lineWidth = 1.6; miniCtx.stroke();
                  }
                }

                function isWormVisible(w, vx, vy) {
                  if (w.isPlayer) return true;
                  const segs = w.segments;
                  const step = Math.max(1, Math.floor(segs.length / 18));
                  for (let i = 0; i < segs.length; i += step) {
                    if (Math.abs(segs[i].x - camera.x) < vx && Math.abs(segs[i].y - camera.y) < vy) return true;
                  }
                  const tl = segs[segs.length - 1];
                  return Math.abs(tl.x - camera.x) < vx && Math.abs(tl.y - camera.y) < vy;
                }

                const foodSpriteCache = {};
                function getFoodSprite(icon, r, big) {
                  const k = icon + '_' + r + '_' + (big ? 1 : 0);
                  if (foodSpriteCache[k]) return foodSpriteCache[k];
                  const sz = Math.ceil(r * 2.4 + (big ? 24 : 12)), mid = sz / 2;
                  const c = document.createElement('canvas'); c.width = sz; c.height = sz;
                  const g = c.getContext('2d');
                  if (big) { const gr = g.createRadialGradient(mid, mid, r * 0.2, mid, mid, r * 1.35); gr.addColorStop(0, 'rgba(255,226,89,0.58)'); gr.addColorStop(1, 'rgba(255,226,89,0)'); g.fillStyle = gr; g.beginPath(); g.arc(mid, mid, r * 1.35, 0, Math.PI * 2); g.fill(); }
                  g.shadowColor = 'rgba(0,0,0,0.45)'; g.shadowBlur = 4; g.shadowOffsetY = 2;
                  g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = Math.round(r * 1.65) + 'px sans-serif';
                  g.fillText(icon, mid, mid);
                  return (foodSpriteCache[k] = c);
                }

                function renderGame(dt) {
                  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                  if (document.getElementById('workshopModal').classList.contains('open') && wsPreviewWorm) {
                    wsCtx.clearRect(0, 0, wsCanvas.width, wsCanvas.height);
                    const t = globalTime * 1.4;
                    const nx = wsCanvas.width * 0.5 + Math.cos(t) * 48, ny = wsCanvas.height * 0.52 + Math.sin(t) * 48;
                    wsPreviewWorm.angle = Math.atan2(ny - wsPreviewWorm.y, nx - wsPreviewWorm.x);
                    wsPreviewWorm.x = nx; wsPreviewWorm.y = ny; wsPreviewWorm.segments[0].x = nx; wsPreviewWorm.segments[0].y = ny;
                    for (let i = 1; i < wsPreviewWorm.segments.length; i++) {
                      const p = wsPreviewWorm.segments[i - 1], c = wsPreviewWorm.segments[i], dx = c.x - p.x, dy = c.y - p.y, d = Math.hypot(dx, dy) || 1;
                      if (d > 5) { c.x = p.x + (dx / d) * 5; c.y = p.y + (dy / d) * 5; }
                    }
                    wsPreviewWorm.draw(wsCtx, false);
                  }

                  if (screenState !== 'playing') {
                    if (floorPattern) { ctx.fillStyle = floorPattern; ctx.fillRect(0, 0, appW, appH); }
                    else { ctx.fillStyle = '#145e1c'; ctx.fillRect(0, 0, appW, appH); }
                    if (lobbyWorm) {
                      const t = globalTime * 1.35;
                      const rx = appW * 0.42, ry = appH * 0.38;
                      const nx = appW * 0.5 + Math.sin(t * 0.85) * rx;
                      const ny = appH * 0.5 + Math.sin(t * 1.35) * ry * 0.78 + Math.cos(t * 0.55) * (ry * 0.22);
                      lobbyWorm.angle = Math.atan2(ny - lobbyWorm.y, nx - lobbyWorm.x);
                      lobbyWorm.x = nx; lobbyWorm.y = ny; lobbyWorm.segments[0].x = nx; lobbyWorm.segments[0].y = ny;
                      lobbyWorm.blinkTimer -= dt;
                      if (lobbyWorm.blinkTimer <= 0) {
                        lobbyWorm.blinkAmt = 1;
                        if (lobbyWorm.blinkTimer < -0.14) { lobbyWorm.blinkAmt = 0; lobbyWorm.blinkTimer = rand(2.2, 4.5); }
                      }
                      if (Math.random() < 0.005 && lobbyWorm.bubbleTimer <= 0) {
                        const ex = EXPRESSIONS.find(e => e.id === profile.expr) || EXPRESSIONS[0];
                        lobbyWorm.say(ex.text);
                      }
                      if (lobbyWorm.bubbleTimer > 0) lobbyWorm.bubbleTimer -= dt;
                      for (let i = 1; i < lobbyWorm.segments.length; i++) {
                        const p = lobbyWorm.segments[i - 1], c = lobbyWorm.segments[i], dx = c.x - p.x, dy = c.y - p.y, d = Math.hypot(dx, dy) || 1;
                        if (d > 6.2) { c.x = p.x + (dx / d) * 6.2; c.y = p.y + (dy / d) * 6.2; }
                      }
                      lobbyWorm.draw(ctx, false);
                    }
                    if (isMaxGfx()) {
                      const lv = ctx.createRadialGradient(appW * 0.5, appH * 0.5, appW * 0.25, appW * 0.5, appH * 0.5, appW * 0.78);
                      lv.addColorStop(0, 'rgba(0,0,0,0)');
                      lv.addColorStop(1, 'rgba(0,12,6,0.42)');
                      ctx.fillStyle = lv; ctx.fillRect(0, 0, appW, appH);
                    }
                    return;
                  }

                  ctx.save();
                  ctx.translate(appW / 2, appH / 2);
                  ctx.scale(camera.zoom, camera.zoom);
                  ctx.translate(-camera.x, -camera.y);

                  const vx = (appW / camera.zoom) * 0.56 + 110, vy = (appH / camera.zoom) * 0.56 + 110;
                  const near = (x, y) => Math.abs(x - camera.x) < vx && Math.abs(y - camera.y) < vy;

                  ctx.fillStyle = floorPattern || '#145e1c';
                  ctx.fillRect(camera.x - vx, camera.y - vy, vx * 2, vy * 2);

                  ctx.strokeStyle = 'rgba(255, 71, 87, 0.28)'; ctx.lineWidth = 46;
                  ctx.beginPath(); ctx.arc(WORLD_CENTER, WORLD_CENTER, ARENA_RADIUS, 0, Math.PI * 2); ctx.stroke();
                  ctx.strokeStyle = '#ff4757'; ctx.lineWidth = 18;
                  ctx.beginPath(); ctx.arc(WORLD_CENTER, WORLD_CENTER, ARENA_RADIUS, 0, Math.PI * 2); ctx.stroke();
                  ctx.strokeStyle = '#ffd2d7'; ctx.lineWidth = 4;
                  ctx.beginPath(); ctx.arc(WORLD_CENTER, WORLD_CENTER, ARENA_RADIUS, 0, Math.PI * 2); ctx.stroke();

                  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                  for (const f of foods) {
                    if (!near(f.x, f.y)) continue;
                    if (f.orb) {
                      const pulse = f.killDrop ? (1 + 0.16 * Math.sin(globalTime * 7 + (f.phase || 0))) : 1;
                      const fr = f.r * pulse;
                      if (f.big || f.killDrop) {
                        ctx.fillStyle = f.col || '#ffe259';
                        ctx.globalAlpha = f.killDrop ? 0.34 : 0.24;
                        ctx.beginPath(); ctx.arc(f.x, f.y, fr * 1.75, 0, Math.PI * 2); ctx.fill();
                        ctx.globalAlpha = 1;
                      }
                      ctx.fillStyle = f.col; ctx.beginPath(); ctx.arc(f.x, f.y, fr, 0, Math.PI * 2); ctx.fill();
                      ctx.fillStyle = 'rgba(255,255,255,0.68)'; ctx.beginPath(); ctx.arc(f.x - fr * 0.26, f.y - fr * 0.28, fr * 0.36, 0, Math.PI * 2); ctx.fill();
                    } else if (f.killDrop) {
                      const wave = Math.sin(globalTime * 6.5 - (f.phase || 0));
                      const pulse = 1 + 0.12 * wave;
                      const gRad = f.r * 1.85 * pulse;
                      ctx.globalAlpha = 0.48 + 0.24 * wave;
                      ctx.drawImage(getGlowSprite(f.col || '#ffe259'), f.x - gRad, f.y - gRad, gRad * 2, gRad * 2);
                      ctx.globalAlpha = 1;
                      const sp = getFoodSprite(f.icon, f.r, true);
                      const dw = sp.width * pulse, dh = sp.height * pulse;
                      ctx.drawImage(sp, f.x - dw / 2, f.y - dh / 2, dw, dh);
                    } else {
                      const sp = getFoodSprite(f.icon, f.r, f.big);
                      ctx.drawImage(sp, f.x - sp.width / 2, f.y - sp.height / 2);
                    }
                  }

                  for (const p of potions) {
                    if (!near(p.x, p.y)) continue;
                    ctx.fillStyle = p.col; ctx.globalAlpha = 0.26;
                    ctx.beginPath(); ctx.arc(p.x, p.y, 24 + Math.sin(globalTime * 6) * 3, 0, Math.PI * 2); ctx.fill();
                    ctx.globalAlpha = 1; ctx.fillStyle = '#0e2448'; ctx.strokeStyle = p.col; ctx.lineWidth = 2.4;
                    ctx.beginPath(); ctx.arc(p.x, p.y, 16, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                    ctx.font = '15px sans-serif'; ctx.fillText(p.icon, p.x, p.y + 1);
                  }
                  for (const ch of chests) {
                    if (!near(ch.x, ch.y)) continue;
                    ctx.fillStyle = 'rgba(255,210,63,0.32)';
                    ctx.beginPath(); ctx.arc(ch.x, ch.y, 32 + Math.sin(globalTime * 5) * 4, 0, Math.PI * 2); ctx.fill();
                    ctx.font = '26px sans-serif'; ctx.fillText('🧰', ch.x, ch.y);
                  }

                  for (const pt of particles) {
                    ctx.globalAlpha = clamp(pt.life / pt.maxLife, 0, 1);
                    ctx.fillStyle = pt.col; ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2); ctx.fill();
                  }
                  ctx.globalAlpha = 1;

                  for (const w of worms) {
                    if (!w.alive) continue;
                    if (isWormVisible(w, vx, vy)) w.draw(ctx, true, vx, vy);
                  }

                  for (const ft of floatTexts) {
                    ctx.globalAlpha = clamp(ft.life / ft.maxLife, 0, 1);
                    ctx.font = ft.big ? '900 17px sans-serif' : '900 12.5px sans-serif';
                    ctx.fillStyle = '#000'; ctx.fillText(ft.text, ft.x + 1, ft.y + 1);
                    ctx.fillStyle = ft.color; ctx.fillText(ft.text, ft.x, ft.y);
                  }
                  ctx.globalAlpha = 1;

                  for (const ep of emojiPopups) {
                    if (!near(ep.x, ep.y)) continue;
                    ctx.save();
                    ctx.globalAlpha = clamp(ep.life / ep.maxLife, 0, 1);
                    drawCustomEmoji(ctx, getEmojiDef(ep.emoji), ep.x, ep.y, 26, globalTime);
                    ctx.restore();
                  }

                  ctx.restore();
                }

                function mainLoop(ts) {
                  const dt = Math.min(0.05, (ts - (lastFrame || ts)) / 1000);
                  lastFrame = ts; globalTime += dt;
                  if (screenState === 'playing') updateGame(dt);
                  renderGame(dt);
                  requestAnimationFrame(mainLoop);
                }
                function applyLanguage() {
                  const lg = LANGUAGES.find(l => l.id === profile.lang) || LANGUAGES[0];
                  document.querySelectorAll('[data-i18n]').forEach(el => {
                    const k = el.getAttribute('data-i18n');
                    if (lg[k]) el.textContent = lg[k];
                  });
                }

                function syncQuickPotions() {
                  ['magnet', 'x5', 'speed', 'zoom', 'radar'].forEach(id => {
                    const el = document.getElementById(`qpc_${id}`);
                    if (el) el.textContent = profile.potions[id] || 0;
                  });
                }

                function refreshLobbyUI() {
                  applyLanguage();
                  if (typeof updateGoogleUi === 'function') updateGoogleUi();
                  document.getElementById('lbLvl').textContent = profile.level;
                  document.getElementById('lbName').textContent = profile.name;
                  document.getElementById('lbEnergy').textContent = `${profile.energy}/20`;
                  document.getElementById('lbCoins').textContent = profile.coins.toLocaleString();
                  document.getElementById('lbDias').textContent = profile.diamonds.toLocaleString();
                  document.getElementById('wsCoins').textContent = profile.coins.toLocaleString();
                  document.getElementById('wsDias').textContent = profile.diamonds.toLocaleString();
                  document.getElementById('shCoins').textContent = profile.coins.toLocaleString();
                  document.getElementById('shDias').textContent = profile.diamonds.toLocaleString();

                  const xpNeed = profile.level * 1000;
                  document.getElementById('lbXpBar').style.width = `${Math.min(100, ((profile.xp || 0) / xpNeed) * 100)}%`;

                  const bestAll = Math.max(profile.bestScores.infinity || 0, profile.bestScores.time || 0, profile.bestScores.treasure || 0);
                  const myRank = getMyWorldRank(profile.mode);
                  const badgeHtml = getRankBadgeHtml(myRank);
                  document.getElementById('lbChampWrap').innerHTML = `Best: ${bestAll.toLocaleString()}${badgeHtml ? ' ' + badgeHtml : ''}`;
                  applyProfileRankGlow(document.getElementById('btnProfileOpen'), myRank);

                  const netBtn = document.getElementById('btnNetToggle');
                  const hasNet = window.AndroidAudio ? window.AndroidAudio.isOnline() : navigator.onLine;
                  const onlineNow = profile.onlineMode && hasNet;
                  netBtn.textContent = onlineNow ? '🟢 ONLINE' : '🟠 OFFLINE';
                  netBtn.classList.toggle('offline', !onlineNow);

                  const mo = MODES.find(m => m.id === profile.mode) || MODES[0];
                  document.getElementById('btnModeCycle').innerHTML = `<span>${mo.icon}</span><span id="modeLabel">${mo.label}</span><span>▾</span>`;

                  const muteIcon = profile.settings.muted ? '🔇' : '🔊';
                  const lbAudio = document.getElementById('btnLobbyAudio');
                  if (lbAudio) lbAudio.textContent = muteIcon;
                  document.getElementById('hudAudioBtn').textContent = muteIcon;
                  document.getElementById('floatingJoy').classList.toggle('fixed-mode', profile.settings.joy === 'fixed');
                  const jSz = profile.settings.joySize === 'large' ? 124 : (profile.settings.joySize === 'small' ? 86 : 104);
                  const joy = document.getElementById('floatingJoy');
                  joy.style.width = `${jSz}px`; joy.style.height = `${jSz}px`;
                  joy.style.marginLeft = `${-jSz / 2}px`; joy.style.marginTop = `${-jSz / 2}px`;
                }

                function spawnLobbyWorm() {
                  const sk = SKINS.find(s => s.id === profile.skin) || SKINS[0];
                  lobbyWorm = new Worm({
                    name: profile.name, skin: sk, eye: profile.eye, lip: profile.lip,
                    x: appW * 0.5, y: appH * 0.48, isPlayer: true, score: 65, isChamp: isWorldChampion(), scale: 0.85
                  });
                  lobbyWorm.spawnShield = 0;
                  const ex = EXPRESSIONS.find(e => e.id === profile.expr) || EXPRESSIONS[0];
                  lobbyWorm.say(ex.text);
                }

                function enterLobby() {
                  screenState = 'lobby';
                  document.getElementById('hud').style.display = 'none';
                  document.getElementById('resultsModal').classList.remove('open');
                  document.getElementById('reviveModal').classList.remove('open');
                  document.getElementById('lobbyScreen').style.display = 'block';
                  buildFloorPattern(profile.floor);
                  spawnLobbyWorm();
                  refreshLobbyUI();
                  Sound.init();
                }

                function runIntroAnimation() {
                  const sc = document.getElementById('introScreen');
                  const cvs = document.getElementById('introCanvas');
                  const fill = document.getElementById('introFill');
                  const sub = document.getElementById('introSub');
                  cvs.width = appW; cvs.height = appH;
                  const ic = cvs.getContext('2d');
                  const pts = Array.from({ length: 34 }, () => ({
                    x: rand(0, appW), y: rand(0, appH), r: rand(2, 5), vy: rand(28, 70),
                    col: ['#ffe259', '#69f03a', '#4de2f0', '#ff6b81'][Math.floor(Math.random() * 4)]
                  }));
                  let pct = 0, alive = true;
                  const msgs = ['Awakening 36 Unique Glow Snakes...', 'Starting Funky Arcade BGM...', 'Ready to Battle!'];
                  function tickIntro() {
                    if (!alive) return;
                    ic.clearRect(0, 0, cvs.width, cvs.height);
                    for (const p of pts) {
                      p.y -= p.vy * 0.016;
                      if (p.y < -10) { p.y = cvs.height + 10; p.x = rand(0, cvs.width); }
                      ic.fillStyle = p.col; ic.globalAlpha = 0.65;
                      ic.beginPath(); ic.arc(p.x, p.y, p.r, 0, Math.PI * 2); ic.fill();
                    }
                    ic.globalAlpha = 1;
                    requestAnimationFrame(tickIntro);
                  }
                  tickIntro();
                  Sound.init();
                  const iv = setInterval(() => {
                    pct = Math.min(100, pct + rand(14, 22));
                    fill.style.width = `${pct}%`;
                    sub.textContent = pct < 40 ? msgs[0] : (pct < 80 ? msgs[1] : msgs[2]);
                    if (pct >= 100) {
                      clearInterval(iv);
                      setTimeout(() => {
                        alive = false;
                        sc.classList.add('hide');
                        setTimeout(() => { sc.style.display = 'none'; enterLobby(); }, 420);
                      }, 220);
                    }
                  }, 140);
                  sc.addEventListener('click', () => { Sound.init(); }, { once: true });
                }

                window.addEventListener('pointerdown', () => Sound.init(), { once: true });

                // GOOGLE PLAY BILLING PURCHASE CALLBACK
                window.onPlayPurchaseSuccess = (sku) => {
                  const pack = SHOP_PACKS.find(p => p.sku === sku);
                  if (!pack) return;
                  profile.coins += pack.coins;
                  profile.diamonds += pack.dias;
                  if (pack.potions > 0) {
                    ['magnet','x5','speed','zoom','radar'].forEach(k => {
                      profile.potions[k] = (profile.potions[k] || 0) + pack.potions;
                    });
                  }
                  saveProfile(); Sound.play('buy'); renderShop(); syncQuickPotions(); refreshLobbyUI();
                };
                let pendingAdReward = null;
