name: Build Serpent-Wild Upgraded APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Accept Android SDK Licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Generate Serpent-Wild Upgraded Android Project
        run: |
          mkdir -p app/src/main/java/com/apexwild/serpent app/src/main/assets app/src/main/res/values

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SerpentWild"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.9.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.apexwild.serpent"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.apexwild.serpent.royale"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 2
                  versionName = "2.0.0"
              }
              signingConfigs {
                  create("release") {
                      storeFile = file("serpent-release.jks")
                      storePassword = System.getenv("SERPENT_STORE_PASS").orEmpty().ifBlank { "Serpent@2026" }
                      keyAlias = System.getenv("SERPENT_KEY_ALIAS").orEmpty().ifBlank { "serpentkey" }
                      keyPassword = System.getenv("SERPENT_KEY_PASS").orEmpty().ifBlank { "Serpent@2026" }
                  }
              }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.SerpentWild" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">#060b07</item>
                  <item name="android:colorBackground">#060b07</item>
                  <item name="android:statusBarColor">#060b07</item>
                  <item name="android:navigationBarColor">#060b07</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="Serpent Wild: Apex"
                  android:theme="@style/Theme.SerpentWild"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:hardwareAccelerated="true"
                      android:screenOrientation="sensor"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          LOGO_FILE=$(find . -maxdepth 1 \( -iname "logo.png" -o -iname "logo.jpg" -o -iname "logo.jpeg" -o -iname "logo.webp" \) | head -n 1)
          if [ -n "$LOGO_FILE" ]; then
            mkdir -p app/src/main/res/mipmap-xxxhdpi
            if command -v convert >/dev/null 2>&1; then
              convert "$LOGO_FILE" -resize 512x512^ -gravity center -extent 512x512 PNG32:app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            else
              cp "$LOGO_FILE" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            fi
            sed -i 's/android:label="Serpent Wild: Apex"/android:label="Serpent Wild: Apex" android:icon="@mipmap\/ic_launcher" android:roundIcon="@mipmap\/ic_launcher"/' app/src/main/AndroidManifest.xml
          fi

          cat << 'EOF' > app/src/main/java/com/apexwild/serpent/MainActivity.kt
          package com.apexwild.serpent

          import android.annotation.SuppressLint
          import android.graphics.Color
          import android.os.Bundle
          import android.view.View
          import android.view.WindowManager
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView
              private var lastBackPressMs = 0L

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  hideSystemBars()

                  webView = WebView(this).apply {
                      setBackgroundColor(Color.parseColor("#060b07"))
                      overScrollMode = View.OVER_SCROLL_NEVER
                      isHorizontalScrollBarEnabled = false
                      isVerticalScrollBarEnabled = false
                      settings.apply {
                          javaScriptEnabled = true
                          domStorageEnabled = true
                          databaseEnabled = true
                          allowFileAccess = true
                          allowContentAccess = true
                          mediaPlaybackRequiresUserGesture = false
                          cacheMode = WebSettings.LOAD_DEFAULT
                          useWideViewPort = true
                          loadWithOverviewMode = true
                          mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                      }
                      webViewClient = WebViewClient()
                      webChromeClient = WebChromeClient()
                  }

                  setContentView(webView)
                  webView.loadUrl("file:///android_asset/index.html")
              }

              private fun hideSystemBars() {
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  val controller = WindowInsetsControllerCompat(window, window.decorView)
                  controller.hide(WindowInsetsCompat.Type.systemBars())
                  controller.systemBarsBehavior =
                      WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) hideSystemBars()
              }

              override fun onPause() {
                  super.onPause()
                  webView.onPause()
                  webView.pauseTimers()
              }

              override fun onResume() {
                  super.onResume()
                  hideSystemBars()
                  webView.resumeTimers()
                  webView.onResume()
              }

              override fun onDestroy() {
                  webView.destroy()
                  super.onDestroy()
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  val now = System.currentTimeMillis()
                  if (now - lastBackPressMs < 2000L) {
                      super.onBackPressed()
                  } else {
                      lastBackPressMs = now
                      Toast.makeText(this, "Press back again to exit Serpent Wild", Toast.LENGTH_SHORT).show()
                  }
              }
          }
          EOF

          cat << 'GAMEHTML' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
            <title>SERPENT WILD: APEX — 50-Snake Ultra Royale</title>
            <style>
              :root {
                --bg-dark: #060b07;
                --panel-bg: rgba(10, 18, 12, 0.88);
                --panel-border: rgba(164, 224, 124, 0.3);
                --gold: #f6c445;
                --green: #7ce846;
                --cyan: #4de2f0;
                --danger: #ff4b3a;
                --text-main: #f2f8f0;
                --text-muted: #98b395;
              }
              * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
              html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg-dark); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
              #gameCanvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; touch-action: none; }
              button, input { touch-action: manipulation; font-family: inherit; }
              .glass { background: var(--panel-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--panel-border); box-shadow: 0 8px 24px rgba(0,0,0,0.55); }
              .btn-gold {
                border: none; border-radius: 15px; padding: 14px 26px;
                background: linear-gradient(135deg, #ffe370 0%, #f5b324 52%, #c9770c 100%);
                color: #1c1202; font-size: 15px; font-weight: 900; letter-spacing: 1.4px; text-transform: uppercase;
                cursor: pointer; box-shadow: 0 8px 24px rgba(245,179,36,0.48), inset 0 2px 3px rgba(255,255,255,0.6);
              }
              .btn-gold:active { transform: scale(0.95); }
              .btn-ghost {
                border: 1px solid rgba(255,255,255,0.22); border-radius: 14px; padding: 12px 18px;
                background: rgba(255,255,255,0.08); color: #dcead7; font-size: 13px; font-weight: 800; text-transform: uppercase; cursor: pointer;
              }
              #splashScreen {
                position: fixed; inset: 0; z-index: 120; display: flex; flex-direction: column;
                align-items: center; justify-content: space-between;
                padding: max(22px, env(safe-area-inset-top)) 20px max(105px, calc(env(safe-area-inset-bottom) + 90px));
                background: radial-gradient(circle at 50% 38%, rgba(28, 60, 26, 0.9), rgba(6, 11, 7, 0.99) 78%);
                cursor: pointer; transition: opacity 0.4s ease;
              }
              #splashScreen.fade-out { opacity: 0; pointer-events: none; }
              .studio-brand { font-size: 11.5px; font-weight: 900; letter-spacing: 5px; color: #b7d9a7; text-transform: uppercase; }
              .splash-hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; margin: auto 0; }
              .splash-crest {
                width: 82px; height: 82px; border-radius: 22px;
                background: linear-gradient(145deg, rgba(124,232,70,0.22), rgba(246,196,69,0.14));
                border: 2px solid rgba(246,196,69,0.62); display: flex; align-items: center; justify-content: center;
                box-shadow: 0 0 42px rgba(124,232,70,0.3); animation: pulse 2.2s ease-in-out infinite;
              }
              @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
              .splash-title {
                font-size: clamp(28px, 6.5vw, 50px); font-weight: 900; letter-spacing: 3px; line-height: 1.08;
                background: linear-gradient(180deg, #fffbe0 0%, #f6c445 52%, #a66912 100%);
                -webkit-background-clip: text; -webkit-text-fill-color: transparent;
              }
              .splash-subtitle { font-size: 11.5px; font-weight: 900; letter-spacing: 3.5px; color: var(--green); text-transform: uppercase; }
              #tapEnterWrap { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; max-width: 340px; }
              #btnTapEnter { width: 100%; padding: 16px 24px; font-size: 15.5px; letter-spacing: 1.8px; animation: pulse 1.9s ease-in-out infinite; }
              #loaderWrap { display: none; width: 100%; max-width: 420px; flex-direction: column; gap: 8px; }
              .loader-row { display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; color: #d6ead0; }
              .loader-bar { width: 100%; height: 10px; border-radius: 999px; background: rgba(255,255,255,0.1); border: 1px solid rgba(246,196,69,0.45); overflow: hidden; padding: 1px; }
              #loaderFill { width: 0%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #5ed128, #a7f554, #f6c445); transition: width 0.12s linear; }
              #loaderTip { font-size: 11px; color: var(--text-muted); text-align: center; }

              #lobbyScreen { position: fixed; inset: 0; z-index: 30; display: none; pointer-events: none; }
              #lobbyTopBar { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
              #profileBadge { pointer-events: auto; display: flex; align-items: center; gap: 9px; padding: 6px 12px 6px 6px; border-radius: 14px; cursor: pointer; }
              .avatar-box { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(145deg,#2d4f27,#132211); border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; font-size: 20px; position: relative; }
              .lvl-tag { position: absolute; bottom: -5px; right: -5px; background: linear-gradient(135deg,#ffe26e,#c98314); color: #171002; font-size: 8.5px; font-weight: 900; padding: 1px 4px; border-radius: 5px; }
              .top-right-tools { pointer-events: auto; display: flex; align-items: center; gap: 6px; }
              .curr-pill { display: flex; align-items: center; gap: 4px; padding: 6px 9px; border-radius: 11px; font-size: 11.5px; font-weight: 900; }
              .tool-btn { pointer-events: auto; width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #edf7e8; font-size: 15px; cursor: pointer; }
              #lobbyRail { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 7px; pointer-events: auto; }
              .rail-item { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 12px; color: #ebf5e7; font-size: 11px; font-weight: 800; text-transform: uppercase; cursor: pointer; }
              #showcasePill { position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); padding: 7px 14px; border-radius: 999px; display: flex; align-items: center; gap: 8px; pointer-events: auto; cursor: pointer; white-space: nowrap; max-width: 92vw; overflow: hidden; }
              #startCluster { position: absolute; bottom: max(16px, env(safe-area-inset-bottom)); right: 14px; display: flex; flex-direction: column; align-items: flex-end; gap: 7px; pointer-events: auto; }
              .mode-pill { display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 11px; font-size: 11px; font-weight: 800; cursor: pointer; }
              .mode-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
              #btnStartMatch { width: 186px; height: 52px; }
              @media (max-width: 680px) {
                #showcasePill { bottom: 132px; font-size: 10.5px; }
                #startCluster { left: 14px; right: 14px; align-items: center; bottom: 22px; }
                #btnStartMatch { width: 100%; max-width: 300px; }
                #lobbyRail { top: 44%; }
                .rail-item span:last-child { display: none; }
                .rail-item { padding: 10px 11px; font-size: 16px; }
              }

              #matchmakingOverlay, .modal-backdrop, #tacMapOverlay { position: fixed; inset: 0; z-index: 80; display: none; align-items: center; justify-content: center; padding: 12px; background: rgba(5,10,6,0.84); backdrop-filter: blur(8px); }
              #matchmakingOverlay.open, .modal-backdrop.open, #tacMapOverlay.open { display: flex; }
              .mm-card { padding: 24px 28px; border-radius: 20px; text-align: center; max-width: 340px; width: 90%; }
              .mm-spin { width: 46px; height: 46px; margin: 0 auto 12px; border-radius: 50%; border: 4px solid rgba(246,196,69,0.22); border-top-color: var(--gold); animation: spin 0.72s linear infinite; }
              @keyframes spin { to { transform: rotate(360deg); } }
              .modal-box { width: 100%; max-width: 780px; max-height: 88vh; border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; background: linear-gradient(165deg, rgba(16,27,17,0.98), rgba(9,15,10,0.99)); border: 1px solid rgba(168,222,128,0.34); }
              .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: rgba(0,0,0,0.3); border-bottom: 1px solid rgba(255,255,255,0.08); }
              .modal-title { font-size: 14.5px; font-weight: 900; letter-spacing: 1.3px; text-transform: uppercase; color: var(--gold); }
              .close-btn { width: 34px; height: 34px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: #fff; font-size: 16px; cursor: pointer; }
              .modal-tabs { display: flex; gap: 6px; padding: 8px 14px; background: rgba(0,0,0,0.22); overflow-x: auto; }
              .tab-btn { padding: 7px 12px; border-radius: 10px; border: 1px solid transparent; background: rgba(255,255,255,0.06); color: var(--text-muted); font-size: 11px; font-weight: 800; text-transform: uppercase; white-space: nowrap; cursor: pointer; }
              .tab-btn.active { background: rgba(246,196,69,0.22); border-color: var(--gold); color: #fff; }
              .modal-body { padding: 14px 16px; overflow-y: auto; flex: 1; }
              .tab-pane { display: none; }
              .tab-pane.active { display: block; }
              .section-lbl { font-size: 10.5px; font-weight: 800; letter-spacing: 1.1px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 7px; }
              .text-input { width: 100%; padding: 8px 11px; border-radius: 10px; border: 1px solid rgba(168,222,128,0.36); background: rgba(6,12,7,0.85); color: #fff; font-size: 14px; font-weight: 800; outline: none; }
              .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
              .chip { padding: 6px 11px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.06); color: #dcead7; font-size: 12px; font-weight: 700; cursor: pointer; }
              .chip.selected { border-color: var(--gold); background: rgba(246,196,69,0.24); color: #fff; }
              .armory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
              .card-item { padding: 11px; border-radius: 14px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.12); display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
              .card-item.selected { border-color: var(--gold); background: rgba(246,196,69,0.12); }
              .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(95px, 1fr)); gap: 8px; margin-bottom: 12px; }
              .stat-box { padding: 9px; border-radius: 12px; background: rgba(0,0,0,0.34); border: 1px solid rgba(255,255,255,0.08); text-align: center; }
              .stat-val { font-size: 17px; font-weight: 900; color: var(--green); }
              .stat-lbl { font-size: 9px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-top: 2px; }
              .setting-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); margin-bottom: 8px; gap: 10px; }
              .xp-track { width: 100%; height: 8px; border-radius: 999px; background: rgba(255,255,255,0.1); overflow: hidden; margin-top: 4px; }
              .xp-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #62de3a, #f6c445); }

              #hud { position: fixed; inset: 0; z-index: 20; display: none; pointer-events: none; }
              #stormVignette { position: absolute; inset: 0; box-shadow: inset 0 0 90px rgba(255,48,36,0.72); opacity: 0; transition: opacity 0.25s; }
              #hudTopLeft { position: absolute; top: max(8px, env(safe-area-inset-top)); left: 8px; display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
              #minimapBox {
                pointer-events: auto; cursor: pointer; position: relative;
                width: 92px; height: 92px; border-radius: 14px; padding: 3px;
                background: rgba(8, 15, 10, 0.88); border: 2px solid rgba(164, 224, 124, 0.55);
                box-shadow: 0 6px 20px rgba(0,0,0,0.65);
              }
              #minimapCanvas { width: 100%; height: 100%; border-radius: 10px; display: block; }
              .map-scale-tag {
                position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%);
                background: #102414; border: 1px solid var(--gold); color: var(--gold);
                font-size: 8px; font-weight: 900; padding: 1px 6px; border-radius: 6px; white-space: nowrap;
              }
              #regionPill { margin-top: 4px; padding: 3px 8px; border-radius: 8px; font-size: 9px; font-weight: 900; letter-spacing: 0.6px; text-transform: uppercase; color: #ffe382; }
              #terrainTag { display: none; padding: 3px 8px; border-radius: 8px; font-size: 9px; font-weight: 900; text-transform: uppercase; }

              #hudTopCenter {
                position: absolute; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
                display: flex; flex-direction: column; align-items: center; gap: 5px; width: min(215px, 48vw);
              }
              .br-stats-bar { display: flex; align-items: center; justify-content: space-between; gap: 6px; width: 100%; padding: 5px 9px; border-radius: 11px; }
              .br-stat { display: flex; flex-direction: column; align-items: center; font-size: 8px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; line-height: 1.1; }
              .br-stat strong { font-size: 12.5px; font-weight: 900; color: #fff; font-variant-numeric: tabular-nums; }
              #playerHpWrap { width: 100%; padding: 5px 8px; border-radius: 10px; display: flex; flex-direction: column; gap: 3px; }
              .hp-top-row { display: flex; justify-content: space-between; font-size: 9.5px; font-weight: 900; }
              .hp-bar-track { width: 100%; height: 8px; border-radius: 999px; background: rgba(0,0,0,0.6); overflow: hidden; }
              #hpMainFill { width: 100%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #3bd646, #95f54c); transition: width 0.12s linear; }
              .zone-pill { display: flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 9.5px; font-weight: 800; color: #b8f2ff; }

              #hudTopRight { position: absolute; top: max(8px, env(safe-area-inset-top)); right: 8px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
              .tr-tools { display: flex; gap: 5px; pointer-events: auto; }
