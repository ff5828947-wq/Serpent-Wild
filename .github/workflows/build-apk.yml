                    c.fillStyle = '#de4523'; c.strokeStyle = '#5c1405'; c.lineWidth = 1.2; c.beginPath(); c.ellipse(0, 0, 13, 15, 0, 0, Math.PI * 2); c.fill(); c.stroke();
                    c.fillStyle = '#111'; c.beginPath(); c.arc(9, -5, 2.2, 0, Math.PI * 2); c.arc(9, 5, 2.2, 0, Math.PI * 2); c.fill();
