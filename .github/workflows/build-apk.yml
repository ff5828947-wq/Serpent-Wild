                      const a = rRot + (k * Math.PI) / 2;
                      k === 0 ? c.moveTo(Math.cos(a) * sr * 0.66, Math.sin(a) * sr * 0.66) : c.lineTo(Math.cos(a) * sr * 0.66, Math.sin(a) * sr * 0.66);
                    }
                    c.closePath(); c.stroke();
                    c.fillStyle = '#ffe259'; c.beginPath(); c.arc(0, 0, sr * (0.24 + 0.08 * Math.sin(t * 8 + idx)), 0, Math.PI * 2); c.fill();
                  } else if (bt === 'emeraldScales') {
                    c.fillStyle = idx % 2 === 0 ? '#0c6b22' : '#189634'; c.strokeStyle = '#ffe259'; c.lineWidth = 1.7;
                    c.beginPath();
                    c.moveTo(sr * 1.18, 0); c.lineTo(sr * 0.2, -sr * 1.04); c.lineTo(-sr * 0.98, -sr * 0.56);
                    c.lineTo(-sr * 1.1, 0); c.lineTo(-sr * 0.98, sr * 0.56); c.lineTo(sr * 0.2, sr * 1.04);
                    c.closePath(); c.fill(); c.stroke();
                    c.fillStyle = '#69ff59';
                    c.beginPath(); c.moveTo(sr * 0.68, 0); c.lineTo(0, -sr * 0.42); c.lineTo(-sr * 0.62, 0); c.lineTo(0, sr * 0.42); c.closePath(); c.fill();
                    c.fillStyle = '#fff599'; c.beginPath(); c.arc(sr * 0.1, 0, sr * 0.18, 0, Math.PI * 2); c.fill();
                  } else if (bt === 'dinoSpikes') {
