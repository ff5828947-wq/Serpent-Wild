                    c.fillStyle = orn; c.beginPath(); c.arc(0, 0, sr * 0.34, 0, Math.PI * 2); c.fill();
                    c.fillStyle = '#ffffff'; c.beginPath(); c.arc(-sr * 0.1, -sr * 0.1, sr * 0.12, 0, Math.PI * 2); c.fill();
                  } else if (bt === 'arcaneRunes') {
                    c.fillStyle = idx % 2 === 0 ? '#1b206e' : '#2d369e'; c.strokeStyle = '#ffd23f'; c.lineWidth = 1.8;
                    c.beginPath(); c.arc(0, 0, sr * 1.02, 0, Math.PI * 2); c.fill(); c.stroke();
                    const rRot = t * 2.4 + idx * 0.35;
                    c.strokeStyle = '#8ef6ff'; c.lineWidth = 1.5;
