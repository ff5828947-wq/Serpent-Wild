                function isMaxGfx() {
                  return profile.settings.gfx !== 'medium' && profile.settings.gfx !== 'low';
                }

                let shadeMaxCvs = null, shadeMedCvs = null;
                const glowCache = {};

                function getGlowSprite(col) {
                  if (glowCache[col]) return glowCache[col];
                  const s = 64, r = s / 2;
                  const oc = document.createElement('canvas');
                  oc.width = s; oc.height = s;
                  const g = oc.getContext('2d');
                  const gg = g.createRadialGradient(r, r, r * 0.2, r, r, r);
                  gg.addColorStop(0, col);
                  gg.addColorStop(1, 'rgba(0,0,0,0)');
                  g.fillStyle = gg;
                  g.beginPath(); g.arc(r, r, r, 0, Math.PI * 2); g.fill();
                  glowCache[col] = oc;
                  return oc;
                }

                function getShadeSprite(maxQ) {
                  if (maxQ && shadeMaxCvs) return shadeMaxCvs;
                  if (!maxQ && shadeMedCvs) return shadeMedCvs;
                  const s = 64, r = s / 2;
                  const oc = document.createElement('canvas');
                  oc.width = s; oc.height = s;
                  const g = oc.getContext('2d');
                  const sh = g.createRadialGradient(r - r * 0.24, r - r * 0.34, r * 0.05, r, r, r);
                  sh.addColorStop(0, maxQ ? 'rgba(255,255,255,0.62)' : 'rgba(255,255,255,0.48)');
                  sh.addColorStop(0.32, maxQ ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.14)');
                  sh.addColorStop(0.62, 'rgba(255,255,255,0)');
                  sh.addColorStop(0.84, 'rgba(0,0,0,0.07)');
                  sh.addColorStop(1, maxQ ? 'rgba(0,0,0,0.20)' : 'rgba(0,0,0,0.15)');
                  g.fillStyle = sh;
                  g.beginPath(); g.arc(r, r, r, 0, Math.PI * 2); g.fill();
                  g.fillStyle = 'rgba(255,255,255,0.55)';
                  g.beginPath(); g.ellipse(r - r * 0.28, r - r * 0.36, r * 0.24, r * 0.13, -0.5, 0, Math.PI * 2); g.fill();
                  if (maxQ) shadeMaxCvs = oc; else shadeMedCvs = oc;
                  return oc;
                }

                function resizeCanvas() {
                  appW = window.innerWidth; appH = window.innerHeight;
                  dpr = 1;
                  canvas.width = Math.max(1, Math.floor(appW * dpr));
                  canvas.height = Math.max(1, Math.floor(appH * dpr));
                  const vgEl = document.getElementById('maxGfxVignette');
                  if (vgEl) vgEl.style.display = 'none';
                }

                function buildFloorPattern(floorId) {
                  const fl = ARENA_FLOORS.find(f => f.id === floorId) || ARENA_FLOORS[0];
                  const maxQ = isMaxGfx();
                  const t = document.createElement('canvas');
                  t.width = 160; t.height = 160;
                  const c = t.getContext('2d');

                  const bgGrad = c.createLinearGradient(0, 0, 160, 160);
                  bgGrad.addColorStop(0, fl.bg);
                  bgGrad.addColorStop(0.5, fl.hex);
                  bgGrad.addColorStop(1, fl.bg);
                  c.fillStyle = bgGrad;
                  c.fillRect(0, 0, 160, 160);

                  if (maxQ) {
                    for (let i = 0; i < 48; i++) {
                      const gx = (i * 37) % 160, gy = (i * 61) % 160;
                      c.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.035)' : 'rgba(0,0,0,0.08)';
                      c.beginPath(); c.arc(gx, gy, 2 + (i % 4), 0, Math.PI * 2); c.fill();
                    }
                  }

                  const r = 40;
                  for (let y = 0; y <= 160; y += 69) {
                    for (let x = 0; x <= 160; x += 80) {
                      const ox = (Math.floor(y / 69) % 2) * 40;
                      const cx = x + ox, cy = y;
                      c.beginPath();
                      for (let i = 0; i < 6; i++) {
                        const a = (Math.PI / 3) * i;
                        const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
                        i === 0 ? c.moveTo(px, py) : c.lineTo(px, py);
                      }
                      c.closePath();
                      if (maxQ) {
                        const hg = c.createRadialGradient(cx - 8, cy - 8, 4, cx, cy, r);
                        hg.addColorStop(0, 'rgba(255,255,255,0.06)');
                        hg.addColorStop(1, 'rgba(0,0,0,0.12)');
                        c.fillStyle = hg; c.fill();
                      }
                      c.strokeStyle = fl.line; c.lineWidth = maxQ ? 2.2 : 1.6; c.stroke();
                    }
                  }

                  if (fl.id === 'clover') {
                    for (let i = 0; i < (maxQ ? 18 : 10); i++) {
                      const cx = rand(14, 146), cy = rand(14, 146), sz = rand(4, 7.5);
                      if (maxQ) {
                        c.fillStyle = 'rgba(0,0,0,0.22)';
                        c.beginPath(); c.arc(cx + 2, cy + 3, sz * 1.1, 0, Math.PI * 2); c.fill();
                      }
                      c.fillStyle = i % 2 === 0 ? 'rgba(112, 232, 74, 0.28)' : 'rgba(16, 86, 22, 0.38)';
                      for (let k = 0; k < 4; k++) {
                        const a = (Math.PI / 2) * k + 0.4;
                        c.beginPath(); c.arc(cx + Math.cos(a) * sz * 0.7, cy + Math.sin(a) * sz * 0.7, sz * 0.65, 0, Math.PI * 2); c.fill();
                      }
                    }
                  }
                  floorPattern = ctx.createPattern(t, 'repeat');
                }
                function getSkinAura(skin) {
                  if (!skin || skin.curr === 'free' || skin.price <= 0) {
                    return { level: 0, power: 0, radMul: 0, alpha: 0, rim: 0, orbs: 0, ring: false, col: '' };
                  }
                  let p = 0.16;
                  if (skin.curr === 'coin') {
                    const norm = clamp((Math.log10(Math.max(1000, skin.price)) - 3.4) / 1.7, 0, 1);
                    p = 0.16 + norm * 0.56;
                  } else {
                    const norm = clamp((Math.log10(Math.max(100, skin.price)) - 2.3) / 1.8, 0, 1);
                    p = 0.78 + norm * 0.22;
                  }
                  const level = skin.curr === 'dia'
                    ? (skin.price >= 8000 ? 6 : 5)
                    : (skin.price >= 50000 ? 4 : (skin.price >= 27000 ? 3 : (skin.price >= 15000 ? 2 : 1)));
                  return {
                    level,
                    power: p,
                    radMul: 1.24 + p * 1.28,
                    alpha: 0.14 + p * 0.56,
                    rim: level >= 2 ? (0.22 + p * 0.62) : 0,
                    orbs: level >= 6 ? 2 : (level >= 4 ? 1 : 0),
                    ring: level >= 5,
                    col: skin.glow || skin.accent || skin.base
                  };
                }

                function drawWormTail(c, skin, x, y, sr, ang) {
                  const id = skin.id, t = globalTime;
                  c.save();
                  c.translate(x, y);
                  c.rotate(ang);

                  if (id === 'corgi') {
                    const wag = Math.sin(t * 11) * sr * 0.28;
                    c.fillStyle = '#f29c38'; c.strokeStyle = skin.dark; c.lineWidth = 1.3;
                    c.beginPath(); c.ellipse(-sr * 0.9, wag, sr * 0.85, sr * 0.62, 0, 0, Math.PI * 2); c.fill(); c.stroke();
                    c.fillStyle = '#fff7eb'; c.beginPath(); c.arc(-sr * 1.45, wag, sr * 0.42, 0, Math.PI * 2); c.fill();
                  } else if (id === 'rhino') {
                    c.strokeStyle = '#545e69'; c.lineWidth = Math.max(2.2, sr * 0.42); c.lineCap = 'round';
                    c.beginPath(); c.moveTo(0, 0); c.lineTo(-sr * 1.6, 0); c.stroke();
                    c.fillStyle = '#222830';
                    c.beginPath(); c.moveTo(-sr * 1.4, -sr * 0.36); c.lineTo(-sr * 2.35, 0); c.lineTo(-sr * 1.4, sr * 0.36); c.closePath(); c.fill();
                  } else if (id === 'panda') {
                    c.fillStyle = '#1a1e24'; c.beginPath(); c.arc(-sr * 0.85, 0, sr * 0.72, 0, Math.PI * 2); c.fill();
                    c.fillStyle = '#4be35d'; c.beginPath(); c.ellipse(-sr * 1.45, -sr * 0.35, sr * 0.48, sr * 0.2, -0.4, 0, Math.PI * 2); c.fill();
                  } else if (id === 'watermelon') {
                    const sw = Math.sin(t * 7) * sr * 0.25;
                    c.strokeStyle = '#248a2d'; c.lineWidth = Math.max(2, sr * 0.28); c.lineCap = 'round';
                    c.beginPath(); c.moveTo(0, 0); c.bezierCurveTo(-sr * 0.9, -sr + sw, -sr * 1.7, sr + sw, -sr * 2.3, sw); c.stroke();
                    c.fillStyle = '#4be35d'; c.beginPath(); c.ellipse(-sr * 1.2, -sr * 0.55 + sw, sr * 0.46, sr * 0.22, -0.5, 0, Math.PI * 2); c.fill();
                  } else if (id === 'dilopho') {
                    c.fillStyle = '#ff38d4'; c.strokeStyle = '#8cff3b'; c.lineWidth = 1.4;
                    c.beginPath(); c.moveTo(0, -sr * 0.6); c.lineTo(-sr * 2.3, -sr * 0.85); c.lineTo(-sr * 1.65, 0); c.lineTo(-sr * 2.3, sr * 0.85); c.lineTo(0, sr * 0.6); c.closePath(); c.fill(); c.stroke();
                  } else if (id === 'honey') {
