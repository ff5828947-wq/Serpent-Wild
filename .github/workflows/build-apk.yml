                function resizeCanvas() {
                  appW = window.innerWidth; appH = window.innerHeight;
                  dpr = Math.min(window.devicePixelRatio || 1, 2);
                  canvas.width = Math.max(1, Math.floor(appW * dpr));
                  canvas.height = Math.max(1, Math.floor(appH * dpr));
                }

                const snakeGrid = new Map(), preyGrid = new Map();
                const cellKey = (cx, cy) => ((cx & 0xFFFF) << 16) | (cy & 0xFFFF);

                function rebuildGrids() {
                  snakeGrid.clear();
                  for (const s of snakes) {
                    if (!s.alive) continue;
                    const step = Math.max(1, Math.floor(s.segments.length / 8));
                    const seen = new Set();
                    for (let i = 0; i < s.segments.length; i += step) {
                      const k = cellKey(Math.floor(s.segments[i].x / CELL_SIZE), Math.floor(s.segments[i].y / CELL_SIZE));
                      if (seen.has(k)) continue;
                      seen.add(k);
                      let arr = snakeGrid.get(k); if (!arr) { arr = []; snakeGrid.set(k, arr); }
                      arr.push(s);
                    }
                  }
                  preyGrid.clear();
                  for (let i = 0; i < preyList.length; i++) {
                    const p = preyList[i];
                    const k = cellKey(Math.floor(p.x / CELL_SIZE), Math.floor(p.y / CELL_SIZE));
                    let arr = preyGrid.get(k); if (!arr) { arr = []; preyGrid.set(k, arr); }
                    arr.push(i);
                  }
                }

                function queryGrid(grid, x, y, r) {
                  const x0 = Math.floor((x - r) / CELL_SIZE), x1 = Math.floor((x + r) / CELL_SIZE);
                  const y0 = Math.floor((y - r) / CELL_SIZE), y1 = Math.floor((y + r) / CELL_SIZE);
                  const out = [];
                  for (let cx = x0; cx <= x1; cx++) for (let cy = y0; cy <= y1; cy++) {
                    const arr = grid.get(cellKey(cx, cy));
                    if (arr) for (let i = 0; i < arr.length; i++) out.push(arr[i]);
                  }
                  return out;
                }

                function isNearCam(x, y, pad = 750) {
                  const cx = camera.x + camera.lookX, cy = camera.y + camera.lookY;
                  return Math.abs(x - cx) < (appW / camera.zoom) * 0.6 + pad && Math.abs(y - cy) < (appH / camera.zoom) * 0.6 + pad;
                }

                function generateWorld(biomeId) {
                  const biome = BIOMES.find(b => b.id === biomeId) || BIOMES[0];
                  const tile = document.createElement('canvas');
                  tile.width = 512; tile.height = 512;
                  const t = tile.getContext('2d');
                  t.fillStyle = biome.floor; t.fillRect(0, 0, 512, 512);
                  for (let i = 0; i < 85; i++) {
                    const x = rand(0, 512), y = rand(0, 512), r = rand(26, 86);
                    const col = Math.random() < 0.55 ? biome.moss : biome.soil;
                    const g = t.createRadialGradient(x, y, 2, x, y, r);
                    g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
                    t.fillStyle = g; t.beginPath(); t.arc(x, y, r, 0, Math.PI * 2); t.fill();
                  }
                  t.fillStyle = 'rgba(0,0,0,0.14)';
                  for (let i = 0; i < 360; i++) t.fillRect(rand(0, 512), rand(0, 512), 2, 2);
                  for (let i = 0; i < 34; i++) {
                    t.save(); t.translate(rand(0, 512), rand(0, 512)); t.rotate(rand(0, 6.28));
                    t.fillStyle = Math.random() < 0.5 ? 'rgba(128,96,42,0.34)' : 'rgba(64,112,40,0.32)';
                    t.beginPath(); t.ellipse(0, 0, rand(5, 10), rand(2, 4), 0, 0, Math.PI * 2); t.fill();
                    t.restore();
                  }
                  groundPattern = ctx.createPattern(tile, 'repeat');

                  waterZones = []; mudZones = []; worldProps = [];
                  const addRiver = (sx, sy, ang, steps, baseR) => {
                    let rx = sx, ry = sy, a = ang;
                    for (let s = 0; s < steps; s++) {
                      const rad = baseR + rand(-25, 35);
                      if (dist(rx, ry, WORLD_CENTER, WORLD_CENTER) < ARENA_RADIUS - 320) waterZones.push({ x: rx, y: ry, r: rad });
                      a += rand(-0.36, 0.36); rx += Math.cos(a) * rad * 1.12; ry += Math.sin(a) * rad * 1.12;
                    }
                  };
                  addRiver(1800, 4400, 0.42, 20, 175);
                  addRiver(6200, 8600, -1.25, 14, 155);
                  addRiver(8800, 8800, -2.3, 14, 150);

                  for (let i = 0; i < 36; i++) {
                    const pt = i < 12 ? randInCircle(8600, 3500, 1500, 140) : randInCircle(WORLD_CENTER, WORLD_CENTER, ARENA_RADIUS, 400);
                    const rad = rand(125, 220);
                    if (!waterZones.some(w => distSq(pt.x, pt.y, w.x, w.y) < (w.r + rad) ** 2)) mudZones.push({ x: pt.x, y: pt.y, r: rad });
                  }

                  for (let i = 0; i < 180; i++) {
                    const pt = randInCircle(WORLD_CENTER, WORLD_CENTER, ARENA_RADIUS, 260);
                    if (waterZones.some(w => distSq(pt.x, pt.y, w.x, w.y) < (w.r + 60) ** 2)) continue;
                    const r = Math.random();
                    worldProps.push({ x: pt.x, y: pt.y, kind: r < 0.33 ? 'log' : r < 0.65 ? 'rock' : 'fern', sz: rand(22, 46), rot: rand(0, 6.28) });
                  }
                }

                function getRegionAt(x, y) {
                  let best = REGIONS[0], bd = Infinity;
                  for (const r of REGIONS) { const d = dist(x, y, r.x, r.y); if (d < bd) { bd = d; best = r; } }
                  return best;
                }

                function getTerrainAt(x, y) {
                  for (const w of waterZones) if (distSq(x, y, w.x, w.y) < w.r * w.r) return 'water';
                  for (const m of mudZones) if (distSq(x, y, m.x, m.y) < m.r * m.r) return 'mud';
                  return 'ground';
                }

                function spawnParticles(x, y, color, count = 6, spd = 90) {
                  if (particles.length > 180) return;
                  for (let i = 0; i < count; i++) {
                    const a = rand(0, Math.PI * 2), v = rand(spd * 0.3, spd);
                    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.25, 0.55), maxLife: 0.55, size: rand(2.5, 5.5), color });
                  }
                }

                function pushKillFeed(text) {
                  const feed = document.getElementById('killFeed');
                  if (!feed) return;
                  const div = document.createElement('div');
                  div.className = 'kf-entry';
                  div.textContent = text;
                  feed.prepend(div);
                  while (feed.children.length > 4) feed.lastChild.remove();
                  setTimeout(() => div.remove(), 4200);
                }

                function drawPrey(c, p) {
                  c.save();
                  c.translate(p.x, p.y);
                  c.rotate(p.angle);
                  c.fillStyle = 'rgba(0,0,0,0.34)';
                  c.beginPath(); c.ellipse(2, 4, p.r * 0.9, p.r * 0.65, 0, 0, Math.PI * 2); c.fill();

                  if (p.id === 'frog') {
                    c.fillStyle = '#2d7a1d';
                    for (const s of [-1, 1]) { c.beginPath(); c.ellipse(-7, s * 8, 7, 3.5, s * 0.4, 0, Math.PI * 2); c.fill(); }
                    c.fillStyle = '#5ee63d'; c.beginPath(); c.ellipse(0, 0, 12, 9.5, 0, 0, Math.PI * 2); c.fill();
                    c.fillStyle = '#ffe552'; c.beginPath(); c.arc(7, -4.5, 3, 0, Math.PI * 2); c.arc(7, 4.5, 3, 0, Math.PI * 2); c.fill();
                    c.fillStyle = '#111'; c.beginPath(); c.arc(8, -4.5, 1.4, 0, Math.PI * 2); c.arc(8, 4.5, 1.4, 0, Math.PI * 2); c.fill();
                  } else if (p.id === 'mouse') {
                    c.strokeStyle = '#d99898'; c.lineWidth = 2; c.beginPath(); c.moveTo(-10, 0); c.lineTo(-22, Math.sin(globalTime * 10 + p.x) * 4); c.stroke();
                    c.fillStyle = '#a89684'; c.beginPath(); c.ellipse(0, 0, 11, 7.5, 0, 0, Math.PI * 2); c.fill();
                    c.fillStyle = '#e3a8a8'; c.beginPath(); c.arc(5, -6, 3.2, 0, Math.PI * 2); c.arc(5, 6, 3.2, 0, Math.PI * 2); c.fill();
                    c.fillStyle = '#ff8a98'; c.beginPath(); c.arc(11.5, 0, 2, 0, Math.PI * 2); c.fill();
                  } else if (p.id === 'gecko') {
                    c.strokeStyle = '#6ec736'; c.lineWidth = 4; c.lineCap = 'round';
                    c.beginPath(); c.moveTo(-8, 0); c.lineTo(-21, Math.sin(globalTime * 12 + p.y) * 5); c.stroke();
                    c.fillStyle = '#85db42'; c.beginPath(); c.ellipse(0, 0, 11, 5, 0, 0, Math.PI * 2); c.fill();
                    c.fillStyle = '#111'; c.beginPath(); c.arc(8, -2.5, 1.5, 0, Math.PI * 2); c.arc(8, 2.5, 1.5, 0, Math.PI * 2); c.fill();
                  } else if (p.id === 'crab') {
                    c.fillStyle = '#f0552e';
                    c.beginPath(); c.ellipse(10, -7, 5, 3, 0.3, 0, Math.PI * 2); c.ellipse(10, 7, 5, 3, -0.3, 0, Math.PI * 2); c.fill();
                    c.fillStyle = '#de4523'; c.beginPath(); c.ellipse(0, 0, 9.5, 11.5, 0, 0, Math.PI * 2); c.fill();
                    c.fillStyle = '#111'; c.beginPath(); c.arc(7, -3.5, 1.6, 0, Math.PI * 2); c.arc(7, 3.5, 1.6, 0, Math.PI * 2); c.fill();
                  } else if (p.id === 'beetle') {
                    const g = c.createRadialGradient(2, -2, 1, 0, 0, 11);
                    g.addColorStop(0, '#fff7a8'); g.addColorStop(0.55, '#f2b824'); g.addColorStop(1, '#7d4b06');
                    c.fillStyle = g; c.beginPath(); c.ellipse(0, 0, 10.5, 8, 0, 0, Math.PI * 2); c.fill();
                    c.strokeStyle = '#4a2c04'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(-10, 0); c.lineTo(6, 0); c.stroke();
                  } else {
                    c.fillStyle = '#246622'; c.beginPath(); c.arc(0, 0, 11, 0, Math.PI * 2); c.fill();
                    c.fillStyle = '#eb2f5e';
                    for (const [bx, by] of [[-4,-3],[4,-2],[0,4],[-4,4],[4,4]]) { c.beginPath(); c.arc(bx, by, 3.2, 0, Math.PI * 2); c.fill(); }
                  }
                  c.restore();
                }

                class Snake {
                  constructor({ name, species, x, y, isPlayer = false, mass = 28 }) {
                    this.name = name; this.species = species; this.isPlayer = isPlayer; this.alive = true;
                    this.x = x; this.y = y; this.angle = rand(0, Math.PI * 2); this.targetAngle = this.angle;
                    this.mass = mass; this.kills = 0; this.terrain = 'ground';
                    this.maxHp = this.calcMaxHp(); this.hp = this.maxHp;
                    this.spawnShield = isPlayer ? 3.2 : 1.5;
                    this.hitFlash = 0; this.biteCd = 0; this.poisonTimer = 0; this.poisonDps = 6; this.poisonOwner = null;
                    this.combatTimer = 0; this.stamina = 100; this.boosting = false;
                    this.vxKnock = 0; this.vyKnock = 0;
                    this.hoodFlare = 0; this.spitTimer = 0;
                    this.venomCd = 0; this.venomMax = species.id === 'krait' ? 3.6 : 4.8;
                    this.camoCd = 0; this.camoMax = 11.0; this.camoTimer = 0; this.slowTimer = 0;
                    this.slitherPhase = rand(0, 6.28); this.tongueTimer = rand(0.6, 2.0); this.tongueExt = 0;
                    this.aiTimer = rand(0, 0.5); this.aiWander = this.angle; this.aiBoost = 0;
                    this.segments = [];
                    const cnt = this.getSegCount();
                    for (let i = 0; i < cnt; i++) this.segments.push({ x: x - Math.cos(this.angle) * i * 6.5, y: y - Math.sin(this.angle) * i * 6.5 });
                  }

                  calcMaxHp() { return Math.min(360, Math.round(130 + this.species.bonusHp + Math.max(0, this.mass - 24) * 1.15)); }
                  getRadius() { return clamp(11.5 + Math.pow(this.mass, 0.44) * 1.4, 11.5, 30); }
                  getSegCount() { return Math.min(68, Math.floor(18 + this.mass * 0.52)); }
                  getLen() { return Math.floor(this.mass * 4.5); }
                  isCamo() { return this.camoTimer > 0; }

                  getHalfWidth(i, len, baseR) {
                    const t = i / Math.max(1, len - 1);
                    let pw = t < 0.08 ? lerp(0.75, 1.0, t / 0.08)
                           : t < 0.58 ? (1.0 + Math.sin(((t - 0.08) / 0.5) * Math.PI) * 0.14)
                           : lerp(1.0, this.species.rattle ? 0.24 : 0.1, Math.pow((t - 0.58) / 0.42, 1.2));
                    let hood = 1.0;
                    if (this.hoodFlare > 0.04 && i >= 1 && i <= 7) {
                      hood = 1 + Math.sin(clamp((i - 0.5) / 6.8, 0, 1) * Math.PI) * 0.95 * this.hoodFlare;
                    }
                    return baseR * this.species.girth * pw * hood;
                  }

                  heal(amt, show = false) {
                    if (!this.alive || amt <= 0) return;
                    const prev = this.hp; this.hp = Math.min(this.maxHp, this.hp + amt);
                    const got = Math.round(this.hp - prev);
                    if (show && got > 0 && (this.isPlayer || isNearCam(this.x, this.y, 400))) {
                      floatTexts.push({ x: this.x, y: this.y - 24, text: `+${got} HP`, color: '#7dff66', life: 0.85, maxLife: 0.85 });
                    }
                  }

                  takeDamage(amt, attacker, tag = 'Bite', crit = false) {
                    if (!this.alive || amt <= 0 || this.spawnShield > 0) return;
                    this.hp = Math.max(0, this.hp - amt);
                    this.hitFlash = 0.18; this.combatTimer = 5.0;
                    if (attacker) attacker.combatTimer = 5.0;
                    if (this.isPlayer && crit) camera.shake = 7;
                    if (this.isPlayer || (attacker && attacker.isPlayer) || isNearCam(this.x, this.y, 450)) {
                      floatTexts.push({
                        x: this.x + rand(-12, 12), y: this.y - 22,
                        text: crit ? `-${Math.round(amt)} CRIT!` : `-${Math.round(amt)}`,
                        color: tag === 'Venom' ? '#8cff42' : crit ? '#ffe052' : '#ff5a47', life: 0.9, maxLife: 0.9
                      });
                    }
                    if (this.hp <= 0) killSnake(this, attacker, tag);
                  }

                  activateVenom() {
                    if (!this.alive || this.venomCd > 0) return;
                    this.venomCd = this.venomMax; this.spitTimer = 1.4;
                    const r = this.getRadius();
                    const sx = this.x + Math.cos(this.angle) * (r + 14), sy = this.y + Math.sin(this.angle) * (r + 14);
                    projectiles.push({
                      owner: this, x: sx, y: sy, vx: Math.cos(this.angle) * 630, vy: Math.sin(this.angle) * 630,
                      life: 0.85, r: 10, dmg: 24, dps: this.species.id === 'cobra' ? 8 : 6
                    });
                    if (isNearCam(sx, sy, 500)) spawnParticles(sx, sy, '#7eff3b', 7, 110);
                    if (this.isPlayer) Sound.venom();
                  }

                  activateCamo() {
                    if (!this.alive || this.camoCd > 0) return;
                    this.camoCd = this.camoMax;
                    this.camoTimer = this.species.id === 'boa' ? 4.8 : 3.6;
                    if (isNearCam(this.x, this.y, 500)) spawnParticles(this.x, this.y, '#7be3cb', 10, 90);
                    if (this.isPlayer) Sound.camo();
                  }

                  updateAI(dt, near) {
                    this.aiTimer -= dt;
                    if (this.aiBoost > 0) this.aiBoost -= dt;
                    const dZone = dist(this.x, this.y, safeZone.cx, safeZone.cy);
                    if (safeZone.active && dZone > safeZone.r - 220) {
                      this.targetAngle = Math.atan2(safeZone.cy - this.y, safeZone.cx - this.x);
                      this.boosting = dZone > safeZone.r; return;
                    }
                    if (dist(this.x, this.y, WORLD_CENTER, WORLD_CENTER) > ARENA_RADIUS - 300) {
                      this.targetAngle = Math.atan2(WORLD_CENTER - this.y, WORLD_CENTER - this.x);
                      this.boosting = false; return;
                    }
                    if (this.aiTimer <= 0) {
                      this.aiTimer = near ? rand(0.3, 0.6) : rand(0.7, 1.3);
                      this.aiWander += rand(-1.0, 1.0);
                      this.targetAngle = this.aiWander;
                      const rivals = queryGrid(snakeGrid, this.x, this.y, 380);
                      let target = null, bestD = 360 * 360;
                      for (const o of rivals) {
                        if (o === this || !o.alive || o.isCamo() || o.spawnShield > 0) continue;
                        const d2 = distSq(this.x, this.y, o.x, o.y);
                        if (d2 < bestD) { bestD = d2; target = o; }
                      }
                      if (target) {
                        if (this.hp < this.maxHp * 0.35) {
                          this.targetAngle = Math.atan2(this.y - target.y, this.x - target.x);
                          if (this.camoCd <= 0) this.activateCamo();
                          this.aiBoost = 0.5;
                        } else {
                          this.targetAngle = Math.atan2(target.y - this.y, target.x - this.x);
                          if (this.venomCd <= 0 && bestD < 260 * 260 && Math.abs(angleDiff(this.targetAngle, this.angle)) < 0.35) this.activateVenom();
                          if (bestD < 180 * 180 && this.stamina > 35) this.aiBoost = 0.4;
                        }
                      } else {
                        const pIdxs = queryGrid(preyGrid, this.x, this.y, 320);
                        let bestP = null, pD = 320 * 320;
                        for (const idx of pIdxs) {
                          const p = preyList[idx]; if (!p) continue;
                          const d2 = distSq(this.x, this.y, p.x, p.y);
                          if (d2 < pD) { pD = d2; bestP = p; }
                        }
                        if (bestP) this.targetAngle = Math.atan2(bestP.y - this.y, bestP.x - this.x);
                      }
                    }
                    this.boosting = this.aiBoost > 0 && this.stamina > 20;
                  }

                  update(dt) {
                    if (!this.alive) return;
                    const nm = this.calcMaxHp();
                    if (nm > this.maxHp) { this.hp += (nm - this.maxHp); this.maxHp = nm; }
                    if (this.spawnShield > 0) this.spawnShield = Math.max(0, this.spawnShield - dt);
                    if (this.hitFlash > 0) this.hitFlash = Math.max(0, this.hitFlash - dt);
                    if (this.biteCd > 0) this.biteCd = Math.max(0, this.biteCd - dt);
                    if (this.venomCd > 0) this.venomCd = Math.max(0, this.venomCd - dt);
                    if (this.camoCd > 0) this.camoCd = Math.max(0, this.camoCd - dt);
                    if (this.camoTimer > 0) this.camoTimer = Math.max(0, this.camoTimer - dt);
                    if (this.slowTimer > 0) this.slowTimer = Math.max(0, this.slowTimer - dt);
                    if (this.spitTimer > 0) this.spitTimer = Math.max(0, this.spitTimer - dt);

                    if (this.poisonTimer > 0) {
                      this.poisonTimer = Math.max(0, this.poisonTimer - dt);
                      this.combatTimer = 5.0;
                      this.hp -= this.poisonDps * dt;
                      if (this.hp <= 0) { killSnake(this, this.poisonOwner, 'Venom'); return; }
                    }
                    if (this.combatTimer > 0) this.combatTimer = Math.max(0, this.combatTimer - dt);
                    else if (this.hp < this.maxHp) this.hp = Math.min(this.maxHp, this.hp + 2.5 * dt);

                    const near = this.isPlayer || isNearCam(this.x, this.y, 700);
                    if (!this.isPlayer) this.updateAI(dt, near);

                    this.terrain = getTerrainAt(this.x, this.y);
                    const canBoost = this.boosting && this.stamina > 5 && this.mass > 14 && this.slowTimer <= 0;
                    if (canBoost) { this.stamina = Math.max(0, this.stamina - dt * 26); this.mass = Math.max(14, this.mass - dt * 1.2); }
                    else this.stamina = Math.min(100, this.stamina + dt * 19);

                    if (Math.abs(this.vxKnock) > 1 || Math.abs(this.vyKnock) > 1) {
                      this.x += this.vxKnock * dt; this.y += this.vyKnock * dt;
                      this.vxKnock *= Math.pow(0.04, dt); this.vyKnock *= Math.pow(0.04, dt);
                    }

                    let spd = 178 + this.species.speed * 0.28;
                    if (canBoost) spd *= 1.58;
                    if (this.terrain === 'water') spd *= (this.species.id === 'anaconda' ? 1.32 : 1.18);
                    else if (this.terrain === 'mud') spd *= 0.7;
                    if (this.slowTimer > 0) spd *= 0.65;

                    const turnRate = 4.6 + this.species.turn * 0.016;
                    this.angle += clamp(angleDiff(this.targetAngle, this.angle), -turnRate * dt, turnRate * dt);
                    this.slitherPhase += dt * (canBoost ? 14 : 9.2);
                    const sAng = this.angle + Math.sin(this.slitherPhase) * 0.1;
                    this.x += Math.cos(sAng) * spd * dt;
                    this.y += Math.sin(sAng) * spd * dt;

                    const r = this.getRadius();
                    const dC = dist(this.x, this.y, WORLD_CENTER, WORLD_CENTER);
                    if (dC + r > ARENA_RADIUS) {
                      const a = Math.atan2(WORLD_CENTER - this.y, WORLD_CENTER - this.x);
                      this.x = WORLD_CENTER - Math.cos(a) * (ARENA_RADIUS - r);
                      this.y = WORLD_CENTER - Math.sin(a) * (ARENA_RADIUS - r);
                      this.takeDamage(14 * dt, null, 'Cliff');
                      if (!this.alive) return;
                    }

                    if (safeZone.active && dist(this.x, this.y, safeZone.cx, safeZone.cy) > safeZone.r) {
                      this.hp -= (4.5 + (safeZone.stage - 1) * 2.8) * dt;
                      this.combatTimer = 5.0;
                      if (this.hp <= 0) { killSnake(this, null, 'Storm'); return; }
                    }

                    this.segments[0].x = this.x; this.segments[0].y = this.y;
                    const spc = r * 0.52;
                    for (let i = 1; i < this.segments.length; i++) {
                      const p = this.segments[i - 1], c = this.segments[i];
                      const dx = c.x - p.x, dy = c.y - p.y, d = Math.hypot(dx, dy) || 0.001;
                      if (d > spc) { const rt = spc / d; c.x = p.x + dx * rt; c.y = p.y + dy * rt; }
                    }
                    const tLen = this.getSegCount();
                    while (this.segments.length < tLen) { const tl = this.segments[this.segments.length - 1]; this.segments.push({ x: tl.x, y: tl.y }); }
                    while (this.segments.length > tLen && this.segments.length > 14) this.segments.pop();

                    if (near) {
                      const wantHood = this.species.hood && (canBoost || this.spitTimer > 0) ? 1 : 0;
                      this.hoodFlare = lerp(this.hoodFlare, wantHood, dt * 7);
                      this.tongueTimer -= dt;
                      if (this.tongueTimer <= 0) {
                        const p = -this.tongueTimer / 0.4;
                        if (p < 1) this.tongueExt = Math.sin(p * Math.PI);
                        else { this.tongueExt = 0; this.tongueTimer = rand(1.0, 2.4); }
                      } else this.tongueExt = 0;
                    }
                  }

                  draw(c, showLabel = true) {
                    if (!this.alive || this.segments.length < 4) return;
                    const baseR = this.getRadius(), len = this.segments.length;
                    const pts = new Array(len);
                    for (let i = 0; i < len; i++) {
                      const seg = this.segments[i];
                      const prev = this.segments[Math.max(0, i - 1)], next = this.segments[Math.min(len - 1, i + 1)];
                      const ang = i === 0 ? this.angle : Math.atan2(prev.y - next.y, prev.x - next.x);
                      const nx = -Math.sin(ang), ny = Math.cos(ang);
                      const mask = i < 2 ? 0 : Math.min(1, (i - 1) / 4) * (1 - (i / len) * 0.3);
                      const wave = Math.sin(this.slitherPhase - i * 0.42) * (baseR * 0.22 * mask);
                      pts[i] = { x: seg.x + nx * wave, y: seg.y + ny * wave, ang, nx, ny, w: this.getHalfWidth(i, len, baseR) };
                    }

                    const traceBody = (ox = 0, oy = 0, sw = 1) => {
                      c.beginPath();
                      const p0 = pts[0];
                      c.moveTo(p0.x + ox + p0.nx * p0.w * sw, p0.y + oy + p0.ny * p0.w * sw);
                      for (let i = 1; i < len - 1; i++) {
                        const a = pts[i], b = pts[i + 1];
                        const ax = a.x + a.nx * a.w * sw + ox, ay = a.y + a.ny * a.w * sw + oy;
                        const bx = b.x + b.nx * b.w * sw + ox, by = b.y + b.ny * b.w * sw + oy;
                        c.quadraticCurveTo(ax, ay, (ax + bx) * 0.5, (ay + by) * 0.5);
                      }
                      const tl = pts[len - 1];
                      c.lineTo(tl.x - Math.cos(tl.ang) * tl.w * 2.1 + ox, tl.y - Math.sin(tl.ang) * tl.w * 2.1 + oy);
                      for (let i = len - 2; i >= 1; i--) {
                        const a = pts[i], b = pts[i - 1];
                        const ax = a.x - a.nx * a.w * sw + ox, ay = a.y - a.ny * a.w * sw + oy;
                        const bx = b.x - b.nx * b.w * sw + ox, by = b.y - b.ny * b.w * sw + oy;
                        c.quadraticCurveTo(ax, ay, (ax + bx) * 0.5, (ay + by) * 0.5);
                      }
                      c.closePath();
                    };

                    c.save();
                    c.globalAlpha = this.isCamo() ? (this.isPlayer ? 0.38 : 0.16) : 1;

                    traceBody(5, 8, 1.04);
                    c.fillStyle = 'rgba(0,0,0,0.36)';
                    c.fill();

                    c.save();
                    traceBody(0, 0, 1.0);
                    c.fillStyle = this.species.dark;
                    c.fill();
                    c.clip();

                    traceBody(-1, -1, 0.84);
                    c.fillStyle = this.species.base;
                    c.fill();

                    for (let i = 2; i < len - 1; i++) {
                      const p = pts[i];
                      c.save();
                      c.translate(p.x, p.y);
                      c.rotate(p.ang);
                      if (this.species.id === 'anaconda') {
                        if (i % 3 === 0) {
                          c.fillStyle = this.species.stripe;
                          c.beginPath(); c.ellipse(0, (i % 6 === 0 ? -1 : 1) * p.w * 0.28, p.w * 0.52, p.w * 0.34, 0.2, 0, Math.PI * 2); c.fill();
                        }
                      } else if (this.species.id === 'boa') {
                        if (i % 4 === 0) {
                          c.fillStyle = this.species.stripe;
                          c.beginPath(); c.moveTo(p.w * 0.35, 0); c.lineTo(0, -p.w * 0.72); c.lineTo(-p.w * 0.35, 0); c.lineTo(0, p.w * 0.72); c.closePath(); c.fill();
                        }
                      } else if (this.species.id === 'viper') {
                        if (i % 3 === 0) {
                          c.fillStyle = this.species.stripe;
                          c.beginPath(); c.moveTo(p.w * 0.45, 0); c.lineTo(0, -p.w * 0.65); c.lineTo(-p.w * 0.45, 0); c.lineTo(0, p.w * 0.65); c.closePath(); c.fill();
                        }
                      } else if (this.species.id === 'krait') {
                        if (i % 4 === 0) { c.fillStyle = this.species.dark; c.fillRect(-p.w * 0.45, -p.w * 1.1, p.w * 0.9, p.w * 2.2); }
                        else if (i % 4 === 1) { c.fillStyle = this.species.stripe; c.fillRect(-p.w * 0.16, -p.w * 1.1, p.w * 0.32, p.w * 2.2); }
                      } else {
                        if (i % 3 === 0) {
                          c.strokeStyle = this.species.stripe; c.lineWidth = Math.max(2, p.w * 0.22);
                          c.beginPath(); c.moveTo(-p.w * 0.3, -p.w * 0.78); c.lineTo(p.w * 0.28, 0); c.lineTo(-p.w * 0.3, p.w * 0.78); c.stroke();
                        }
                      }
                      if (i % 2 === 0) {
                        c.strokeStyle = 'rgba(0,0,0,0.22)'; c.lineWidth = 1;
                        c.beginPath(); c.arc(-p.w * 0.15, 0, p.w * 0.72, -1.1, 1.1); c.stroke();
                      }
                      c.restore();
                    }

                    traceBody(-baseR * 0.14, -baseR * 0.14, 0.32);
                    c.fillStyle = 'rgba(255,255,245,0.2)';
                    c.fill();

                    if (this.hitFlash > 0) {
                      traceBody(0, 0, 1.0);
                      c.fillStyle = 'rgba(255, 70, 50, 0.42)';
                      c.fill();
                    }
                    c.restore();

                    if (this.species.rattle) {
                      const tl = pts[len - 1];
                      c.save();
                      c.translate(tl.x, tl.y); c.rotate(tl.ang + Math.sin(globalTime * 45) * 0.12);
                      for (let b = 0; b < 4; b++) {
                        c.fillStyle = b % 2 === 0 ? '#d4b483' : '#8c6e42';
                        c.beginPath(); c.ellipse(-b * 4.5 - 4, 0, 3.8 - b * 0.4, 3.2 - b * 0.3, 0, 0, Math.PI * 2); c.fill();
                      }
                      c.restore();
                    }

                    const hr = baseR * this.species.girth;
                    c.save();
                    c.translate(pts[0].x, pts[0].y);
                    c.rotate(this.angle);

                    if (this.tongueExt > 0.05) {
                      const tl = hr * 1.1 + this.tongueExt * hr * 1.15;
                      c.strokeStyle = '#ff3842'; c.lineWidth = 1.8; c.lineCap = 'round';
                      c.beginPath(); c.moveTo(hr * 0.9, 0); c.lineTo(tl, 0);
                      c.lineTo(tl + 5.5, -4); c.moveTo(tl, 0); c.lineTo(tl + 5.5, 4); c.stroke();
                    }

                    const hg = c.createRadialGradient(hr * 0.25, -hr * 0.2, 2, 0, 0, hr * 1.45);
                    hg.addColorStop(0, this.species.base); hg.addColorStop(1, this.species.dark);
                    c.fillStyle = hg;
                    c.beginPath();
                    if (this.species.head === 'viper') {
                      c.moveTo(hr * 1.45, 0);
                      c.quadraticCurveTo(hr * 0.5, -hr * 1.15, -hr * 0.85, -hr * 0.95);
                      c.quadraticCurveTo(-hr * 1.1, 0, -hr * 0.85, hr * 0.95);
                      c.quadraticCurveTo(hr * 0.5, hr * 1.15, hr * 1.45, 0);
                    } else {
                      c.moveTo(hr * 1.48, 0);
                      c.quadraticCurveTo(hr * 0.85, -hr * 0.95, -hr * 0.7, -hr * 0.84);
                      c.quadraticCurveTo(-hr * 1.05, 0, -hr * 0.7, hr * 0.84);
                      c.quadraticCurveTo(hr * 0.85, hr * 0.95, hr * 1.48, 0);
                    }
                    c.closePath();
                    c.fill();
                    c.strokeStyle = 'rgba(0,0,0,0.45)'; c.lineWidth = 1.2; c.stroke();

                    if (this.species.horns) {
                      c.fillStyle = '#e8cfa0';
                      for (const s of [-1, 1]) {
                        c.beginPath(); c.moveTo(hr * 0.35, s * hr * 0.55); c.lineTo(hr * 0.05, s * hr * 1.05); c.lineTo(-hr * 0.08, s * hr * 0.55); c.closePath(); c.fill();
                      }
                    }

                    c.fillStyle = 'rgba(0,0,0,0.65)';
                    c.beginPath(); c.arc(hr * 1.08, -hr * 0.22, 1.3, 0, Math.PI * 2); c.arc(hr * 1.08, hr * 0.22, 1.3, 0, Math.PI * 2); c.fill();
                    for (const s of [-1, 1]) {
                      c.fillStyle = this.species.eye;
                      c.beginPath(); c.ellipse(hr * 0.42, s * hr * 0.48, hr * 0.24, hr * 0.19, s * 0.2, 0, Math.PI * 2); c.fill();
                      c.fillStyle = '#070707';
                      c.beginPath(); c.ellipse(hr * 0.48, s * hr * 0.48, hr * 0.06, hr * 0.16, 0, 0, Math.PI * 2); c.fill();
                      c.fillStyle = 'rgba(255,255,255,0.85)';
                      c.beginPath(); c.arc(hr * 0.38, s * hr * 0.44, hr * 0.06, 0, Math.PI * 2); c.fill();
                    }

                    if (this.spawnShield > 0) {
                      c.strokeStyle = 'rgba(77, 226, 240, 0.85)'; c.lineWidth = 2.5;
                      c.beginPath(); c.arc(0, 0, hr * 1.9, 0, Math.PI * 2); c.stroke();
                    }
                    c.restore();

                    if (showLabel && !this.isPlayer) {
                      const bw = 44, bh = 5, bx = this.x - bw / 2, by = this.y - hr - 16;
                      c.fillStyle = 'rgba(0,0,0,0.68)'; c.fillRect(bx, by, bw, bh);
                      c.fillStyle = this.poisonTimer > 0 ? '#84ff3b' : '#ff5247';
                      c.fillRect(bx, by, bw * clamp(this.hp / this.maxHp, 0, 1), bh);
                      c.font = 'bold 10px sans-serif'; c.textAlign = 'center'; c.fillStyle = '#e8f5e4';
                      c.fillText(this.name, this.x, by - 4);
                    }
                    c.restore();
                  }
                }

                function killSnake(victim, killer, cause) {
                  if (!victim.alive) return;
                  victim.alive = false;
                  spawnParticles(victim.x, victim.y, victim.species.stripe, 14, 140);
                  for (let i = 0; i < victim.segments.length; i += 4) {
                    meatList.push({ x: victim.segments[i].x + rand(-8, 8), y: victim.segments[i].y + rand(-8, 8), r: 9, mass: 4.8, heal: 14, life: 24 });
                  }
                  if (killer && killer !== victim) {
                    killer.kills++; killer.heal(28, true);
                    if (killer.isPlayer) { matchStats.kills++; Sound.kill(); }
                    pushKillFeed(`${killer.name} [${cause}] ${victim.name}`);
                  } else {
                    pushKillFeed(`${victim.name} (${cause})`);
                  }
                  const aliveCount = snakes.filter(s => s.alive).length;
                  if (victim.isPlayer) {
                    matchStats.rank = aliveCount + 1;
                    matchStats.reason = killer ? `Eliminated by ${killer.name} (${cause})` : `Eliminated by ${cause}`;
                    endMatch(false);
                  } else if (player && player.alive && aliveCount === 1) {
                    matchStats.rank = 1;
                    matchStats.reason = 'Last Serpent Standing — 50-Snake Champion!';
                    endMatch(true);
                  }
                }

                function spawnPrey(count = 1) {
                  for (let i = 0; i < count; i++) {
                    const t = PREY_TYPES[Math.floor(Math.random() * PREY_TYPES.length)];
                    const pt = randInCircle(safeZone.cx, safeZone.cy, Math.min(safeZone.r, ARENA_RADIUS), 180);
                    preyList.push({ ...t, x: pt.x, y: pt.y, angle: rand(0, Math.PI * 2), timer: rand(0.5, 2.5) });
                  }
                }

                function startMatch() {
                  screenState = 'playing';
                  tacMapOpen = false;
                  document.getElementById('tacMapOverlay').classList.remove('open');
                  document.getElementById('lobbyScreen').style.display = 'none';
                  document.getElementById('resultsScreen').classList.remove('open');
                  document.getElementById('hud').style.display = 'block';
                  document.getElementById('killFeed').innerHTML = '';

                  generateWorld(profile.selectedBiome);
                  snakes = []; preyList = []; meatList = []; projectiles = []; particles = []; floatTexts = [];
                  safeZone.active = profile.selectedMode === 'br';
                  safeZone.cx = WORLD_CENTER; safeZone.cy = WORLD_CENTER;
                  safeZone.r = ARENA_RADIUS; safeZone.targetR = ARENA_RADIUS * 0.72;
                  safeZone.stage = 1; safeZone.timer = 40; safeZone.shrinking = false;

                  matchStats.kills = 0; matchStats.prey = 0; matchStats.maxLen = 126; matchStats.rank = TOTAL_SNAKES; matchStats.reason = '';

                  const pSpec = SPECIES.find(s => s.id === profile.selectedSnake) || SPECIES[0];
                  const pSpawn = randInCircle(WORLD_CENTER, WORLD_CENTER, ARENA_RADIUS * 0.55, 300);
                  player = new Snake({ name: profile.name, species: pSpec, x: pSpawn.x, y: pSpawn.y, isPlayer: true, mass: 28 });
                  snakes.push(player);

                  for (let i = 1; i < TOTAL_SNAKES; i++) {
                    const sp = SPECIES[Math.floor(Math.random() * SPECIES.length)];
                    let pt = randInCircle(WORLD_CENTER, WORLD_CENTER, ARENA_RADIUS, 320);
                    if (dist(pt.x, pt.y, player.x, player.y) < 520) pt = randInCircle(WORLD_CENTER, WORLD_CENTER, ARENA_RADIUS, 320);
                    const nm = AI_PREFIX[i % AI_PREFIX.length] + AI_SUFFIX[Math.floor(i / 3) % AI_SUFFIX.length];
                    snakes.push(new Snake({ name: nm, species: sp, x: pt.x, y: pt.y, mass: rand(22, 34) }));
                  }

                  spawnPrey(340);
                  camera.x = player.x; camera.y = player.y; camera.lookX = 0; camera.lookY = 0;
                  const hint = document.getElementById('controlsHint');
                  if (hint) { hint.style.opacity = '1'; setTimeout(() => { hint.style.opacity = '0'; }, 5500); }
                }

                function endMatch(isWin) {
                  screenState = 'results';
                  document.getElementById('hud').style.display = 'none';
                  document.getElementById('tacMapOverlay').classList.remove('open');
                  const gold = (isWin ? 250 : Math.max(30, (TOTAL_SNAKES - matchStats.rank) * 4)) + matchStats.kills * 35;
                  const xp = (isWin ? 180 : 50) + matchStats.kills * 25 + matchStats.prey * 2;
                  profile.coins += gold; profile.xp += xp;
                  profile.stats.matches++;
                  if (isWin) profile.stats.wins++;
                  profile.stats.kills += matchStats.kills;
                  profile.stats.prey += matchStats.prey;
                  if (matchStats.maxLen > profile.stats.bestLength) profile.stats.bestLength = matchStats.maxLen;
                  while (profile.xp >= getXpNeed(profile.level)) { profile.xp -= getXpNeed(profile.level); profile.level++; }
                  saveProfile();

                  document.getElementById('resTitle').textContent = isWin ? '#1 APEX PREDATOR!' : `RANK #${matchStats.rank} / ${TOTAL_SNAKES}`;
                  document.getElementById('resSub').textContent = matchStats.reason;
                  document.getElementById('resRank').textContent = `#${matchStats.rank}`;
                  document.getElementById('resKills').textContent = matchStats.kills;
                  document.getElementById('resLen').textContent = matchStats.maxLen;
                  document.getElementById('resPrey').textContent = matchStats.prey;
                  document.getElementById('resGold').textContent = `+${gold} 🪙 Gold`;
                  document.getElementById('resXp').textContent = `+${xp} XP`;
                  document.getElementById('resultsScreen').classList.add('open');
                  isWin ? Sound.win() : Sound.over();
                }

                function enterLobby() {
                  screenState = 'lobby';
                  document.getElementById('hud').style.display = 'none';
                  document.getElementById('resultsScreen').classList.remove('open');
                  document.getElementById('lobbyScreen').style.display = 'block';
                  generateWorld(profile.selectedBiome);
                  const sp = SPECIES.find(s => s.id === profile.selectedSnake) || SPECIES[0];
                  lobbySnake = new Snake({ name: profile.name, species: sp, x: appW * 0.5, y: appH * 0.5, isPlayer: true, mass: 36 });
                  lobbySnake.spawnShield = 0;
                  refreshLobbyUI();
                }

                function updateGame(dt) {
                  if (player && player.alive) {
                    let kx = (ctrl.keys.right ? 1 : 0) - (ctrl.keys.left ? 1 : 0);
                    let ky = (ctrl.keys.down ? 1 : 0) - (ctrl.keys.up ? 1 : 0);
                    if (kx !== 0 || ky !== 0) player.targetAngle = Math.atan2(ky, kx);
                    else if (ctrl.joyActive && ctrl.joyMag > 8) player.targetAngle = ctrl.joyAngle;
                    player.boosting = ctrl.boostHeld || ctrl.keys.boost;
                    matchStats.maxLen = Math.max(matchStats.maxLen, player.getLen());
                  }

                  if (safeZone.active) {
                    safeZone.timer -= dt;
                    if (!safeZone.shrinking && safeZone.timer <= 0) {
                      safeZone.shrinking = true; safeZone.timer = 26;
                      safeZone.targetR = Math.max(550, safeZone.r * 0.65);
                    } else if (safeZone.shrinking) {
                      safeZone.r = Math.max(safeZone.targetR, safeZone.r - (ARENA_RADIUS * 0.013) * dt);
                      if (safeZone.timer <= 0 || safeZone.r <= safeZone.targetR) {
                        safeZone.shrinking = false; safeZone.stage = Math.min(6, safeZone.stage + 1); safeZone.timer = 32;
                      }
                    }
                  }

                  rebuildGrids();
                  for (const s of snakes) s.update(dt);

                  for (const s of snakes) {
                    if (!s.alive || s.biteCd > 0 || s.spawnShield > 0) continue;
                    const r = s.getRadius();
                    const near = queryGrid(snakeGrid, s.x, s.y, r + 62);
                    for (const o of near) {
                      if (o === s || !o.alive || o.spawnShield > 0) continue;
                      const oR = o.getRadius();
                      let hit = false;
                      for (let k = 0; k < o.segments.length; k += 2) {
                        if (distSq(s.x, s.y, o.segments[k].x, o.segments[k].y) < (r + oR * 0.82) ** 2) { hit = true; break; }
                      }
                      if (hit) {
                        s.biteCd = 0.65;
                        const isCrit = s.boosting && s.stamina > 8;
                        const dmg = isCrit ? (s.species.id === 'viper' ? 36 : 30) : 18;
                        o.takeDamage(dmg, s, isCrit ? 'CRIT Bite' : 'Bite', isCrit);
                        const ka = Math.atan2(s.y - o.y, s.x - o.x);
                        s.vxKnock += Math.cos(ka) * 190; s.vyKnock += Math.sin(ka) * 190;
                        o.vxKnock -= Math.cos(ka) * 140; o.vyKnock -= Math.sin(ka) * 140;
                        if (s.isPlayer || o.isPlayer) Sound.bite(isCrit);
                        break;
                      }
                    }
                  }

                  for (let i = preyList.length - 1; i >= 0; i--) {
                    const p = preyList[i];
                    if (p.speed > 0) {
                      p.timer -= dt;
                      if (p.timer <= 0) { p.angle += rand(-1.3, 1.3); p.timer = rand(0.8, 2.2); }
                      p.x += Math.cos(p.angle) * p.speed * dt; p.y += Math.sin(p.angle) * p.speed * dt;
                      if (dist(p.x, p.y, WORLD_CENTER, WORLD_CENTER) > ARENA_RADIUS - 180) p.angle = Math.atan2(WORLD_CENTER - p.y, WORLD_CENTER - p.x);
                    }
                    const nearS = queryGrid(snakeGrid, p.x, p.y, 46);
                    for (const s of nearS) {
                      if (!s.alive) continue;
                      if (distSq(s.x, s.y, p.x, p.y) < (s.getRadius() + p.r) ** 2) {
                        const mult = s.species.id === 'python' ? 1.2 : 1.0;
                        s.mass += p.mass * mult; s.heal(p.heal * mult, true);
                        if (s.isPlayer) { matchStats.prey++; Sound.eat(); }
                        preyList.splice(i, 1); break;
                      }
                    }
                  }
                  if (preyList.length < 300) spawnPrey(8);

                  for (let i = meatList.length - 1; i >= 0; i--) {
                    const m = meatList[i]; m.life -= dt;
                    if (m.life <= 0) { meatList.splice(i, 1); continue; }
                    const nearS = queryGrid(snakeGrid, m.x, m.y, 44);
                    for (const s of nearS) {
                      if (!s.alive) continue;
                      if (distSq(s.x, s.y, m.x, m.y) < (s.getRadius() + m.r) ** 2) {
                        s.mass += m.mass; s.heal(m.heal, true);
                        if (s.isPlayer) Sound.eat();
                        meatList.splice(i, 1); break;
                      }
                    }
                  }

                  for (let i = projectiles.length - 1; i >= 0; i--) {
                    const pr = projectiles[i]; pr.x += pr.vx * dt; pr.y += pr.vy * dt; pr.life -= dt;
                    if (pr.life <= 0) { projectiles.splice(i, 1); continue; }
                    const nearS = queryGrid(snakeGrid, pr.x, pr.y, 46);
                    for (const s of nearS) {
                      if (!s.alive || s === pr.owner || s.spawnShield > 0) continue;
                      if (distSq(pr.x, pr.y, s.x, s.y) < (s.getRadius() + pr.r) ** 2) {
                        s.takeDamage(pr.dmg, pr.owner, 'Venom', false);
                        s.poisonTimer = 4.0; s.poisonDps = pr.dps; s.poisonOwner = pr.owner; s.slowTimer = 2.6;
                        projectiles.splice(i, 1); break;
                      }
                    }
                  }

                  for (let i = particles.length - 1; i >= 0; i--) {
                    const pt = particles[i]; pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.life -= dt;
                    if (pt.life <= 0) particles.splice(i, 1);
                  }
                  for (let i = floatTexts.length - 1; i >= 0; i--) {
                    const ft = floatTexts[i]; ft.y -= 28 * dt; ft.life -= dt;
                    if (ft.life <= 0) floatTexts.splice(i, 1);
                  }

                  if (camera.shake > 0) camera.shake = Math.max(0, camera.shake - dt * 24);
                  if (player && player.alive) {
                    camera.x = lerp(camera.x, player.x, clamp(dt * 8, 0, 1));
                    camera.y = lerp(camera.y, player.y, clamp(dt * 8, 0, 1));
                    if (!ctrl.lookActive && profile.settings.autoCenter) {
                      camera.lookX = lerp(camera.lookX, 0, clamp(dt * 7, 0, 1));
                      camera.lookY = lerp(camera.lookY, 0, clamp(dt * 7, 0, 1));
                    }
                    document.getElementById('btnRecenter').style.display = Math.hypot(camera.lookX, camera.lookY) > 35 ? 'flex' : 'none';
                  }

                  hudTick -= dt;
                  if (hudTick <= 0 && player) {
                    hudTick = 0.1;
                    const alive = snakes.filter(s => s.alive).length;
                    document.getElementById('hudAlive').textContent = `${alive}/${TOTAL_SNAKES}`;
                    document.getElementById('hudKills').textContent = matchStats.kills;
                    document.getElementById('hudLen').textContent = player.getLen();
                    document.getElementById('hudZoneStage').textContent = safeZone.stage;
                    const zt = Math.max(0, Math.ceil(safeZone.timer));
                    document.getElementById('hudZoneTimer').textContent = `${Math.floor(zt / 60)}:${String(zt % 60).padStart(2, '0')}`;

                    const hpPct = clamp((player.hp / player.maxHp) * 100, 0, 100);
                    document.getElementById('hpMainFill').style.width = `${hpPct}%`;
                    document.getElementById('hpMainFill').style.background = hpPct < 30 ? '#ff4b3a' : (player.poisonTimer > 0 ? '#84ff3b' : 'linear-gradient(90deg,#3bd646,#95f54c)');
                    document.getElementById('hpNumTxt').textContent = `${Math.ceil(player.hp)} / ${player.maxHp}`;
                    document.getElementById('hpStatusTxt').textContent = player.spawnShield > 0 ? '🛡️ SHIELD' : (player.poisonTimer > 0 ? '☠ POISON' : '♥ HEALTH');

                    const stRing = document.getElementById('staminaRing');
                    if (stRing) stRing.style.strokeDashoffset = String(201 * (1 - player.stamina / 100));

                    const inStorm = safeZone.active && dist(player.x, player.y, safeZone.cx, safeZone.cy) > safeZone.r;
                    document.getElementById('stormVignette').style.opacity = inStorm ? '1' : '0';

                    document.getElementById('btnVenom').classList.toggle('on-cd', player.venomCd > 0);
                    document.getElementById('cdTxtVenom').textContent = player.venomCd > 0 ? Math.ceil(player.venomCd) : '';
                    document.getElementById('btnCamo').classList.toggle('on-cd', player.camoCd > 0);
                    document.getElementById('cdTxtCamo').textContent = player.camoCd > 0 ? Math.ceil(player.camoCd) : '';

                    const reg = getRegionAt(player.x, player.y);
                    document.getElementById('regionPill').textContent = reg.name;

                    const tTag = document.getElementById('terrainTag');
                    if (player.terrain === 'water') { tTag.style.display = 'block'; tTag.style.background = 'rgba(26,136,148,0.85)'; tTag.textContent = '🌊 RIVER BOOST'; }
                    else if (player.terrain === 'mud') { tTag.style.display = 'block'; tTag.style.background = 'rgba(84,54,28,0.88)'; tTag.textContent = '🟤 MUD SLOW'; }
                    else tTag.style.display = 'none';

                    drawRadar(miniCtx, miniCanvas.width, miniCanvas.height, false);
                    if (tacMapOpen) drawRadar(tacCtx, tacCanvas.width, tacCanvas.height, true);
                  }
                }

                function drawRadar(rc, w, h, showLabels) {
                  const sc = (w * 0.45) / ARENA_RADIUS, cx = w / 2, cy = h / 2;
                  rc.clearRect(0, 0, w, h);
                  rc.fillStyle = '#0c180d'; rc.fillRect(0, 0, w, h);

                  for (const r of REGIONS) {
                    const rx = cx + (r.x - WORLD_CENTER) * sc, ry = cy + (r.y - WORLD_CENTER) * sc;
                    rc.fillStyle = r.col; rc.beginPath(); rc.arc(rx, ry, r.r * sc, 0, Math.PI * 2); rc.fill();
                  }
                  rc.fillStyle = 'rgba(38,165,180,0.45)';
                  for (const wv of waterZones) {
                    rc.beginPath(); rc.arc(cx + (wv.x - WORLD_CENTER) * sc, cy + (wv.y - WORLD_CENTER) * sc, Math.max(2, wv.r * sc), 0, Math.PI * 2); rc.fill();
                  }
                  rc.strokeStyle = 'rgba(255,75,58,0.5)'; rc.lineWidth = showLabels ? 2.5 : 1.5;
                  rc.beginPath(); rc.arc(cx, cy, ARENA_RADIUS * sc, 0, Math.PI * 2); rc.stroke();
                  if (safeZone.active) {
                    rc.strokeStyle = '#4de2f0'; rc.lineWidth = showLabels ? 3 : 2;
                    rc.beginPath(); rc.arc(cx + (safeZone.cx - WORLD_CENTER) * sc, cy + (safeZone.cy - WORLD_CENTER) * sc, safeZone.r * sc, 0, Math.PI * 2); rc.stroke();
                  }
                  if (showLabels) {
                    rc.font = 'bold 11px sans-serif'; rc.textAlign = 'center'; rc.fillStyle = 'rgba(255,235,160,0.88)';
                    for (const r of REGIONS) rc.fillText(r.name.toUpperCase(), cx + (r.x - WORLD_CENTER) * sc, cy + (r.y - WORLD_CENTER) * sc);
                  }
                  rc.fillStyle = 'rgba(255,90,78,0.85)';
                  for (const s of snakes) {
                    if (!s.alive || s.isPlayer || s.isCamo()) continue;
                    const sx = cx + (s.x - WORLD_CENTER) * sc, sy = cy + (s.y - WORLD_CENTER) * sc;
                    rc.beginPath(); rc.arc(sx, sy, showLabels ? 3 : 1.7, 0, Math.PI * 2); rc.fill();
                  }
                  if (player && player.alive) {
                    const px = cx + (player.x - WORLD_CENTER) * sc, py = cy + (player.y - WORLD_CENTER) * sc;
                    rc.fillStyle = '#7ce846';
                    rc.beginPath(); rc.arc(px, py, showLabels ? 6 : 4, 0, Math.PI * 2); rc.fill();
                    rc.strokeStyle = '#fff'; rc.lineWidth = 1.5; rc.stroke();
                  }
                }

                function renderGame() {
                  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                  ctx.fillStyle = '#060b07'; ctx.fillRect(0, 0, appW, appH);

                  if (screenState !== 'playing') {
                    const biome = BIOMES.find(b => b.id === profile.selectedBiome) || BIOMES[0];
                    ctx.fillStyle = biome.floor; ctx.fillRect(0, 0, appW, appH);
                    if (lobbySnake) {
                      lobbySnake.slitherPhase += 0.14;
                      lobbySnake.x = appW * 0.5 + Math.cos(globalTime * 0.65) * Math.min(appW * 0.17, 115);
                      lobbySnake.y = appH * 0.46 + Math.sin(globalTime * 1.1) * Math.min(appH * 0.11, 65);
                      lobbySnake.angle = Math.atan2(Math.cos(globalTime * 1.1) * 65, -Math.sin(globalTime * 0.65) * 115);
                      lobbySnake.segments[0].x = lobbySnake.x; lobbySnake.segments[0].y = lobbySnake.y;
                      for (let i = 1; i < lobbySnake.segments.length; i++) {
                        const p = lobbySnake.segments[i - 1], c = lobbySnake.segments[i], dx = c.x - p.x, dy = c.y - p.y, d = Math.hypot(dx, dy) || 1;
                        if (d > 8.5) { c.x = p.x + (dx / d) * 8.5; c.y = p.y + (dy / d) * 8.5; }
                      }
                      lobbySnake.draw(ctx, false);
                    }
                    return;
                  }

                  const biome = BIOMES.find(b => b.id === profile.selectedBiome) || BIOMES[0];
                  const shX = camera.shake > 0 ? rand(-camera.shake, camera.shake) : 0;
                  const shY = camera.shake > 0 ? rand(-camera.shake, camera.shake) : 0;

                  ctx.save();
                  ctx.translate(appW / 2 + shX, appH / 2 + shY);
                  ctx.scale(camera.zoom, camera.zoom);
                  ctx.translate(-(camera.x + camera.lookX), -(camera.y + camera.lookY));

                  if (groundPattern) { ctx.fillStyle = groundPattern; ctx.fillRect(0, 0, WORLD_SIZE, WORLD_SIZE); }

                  for (const r of REGIONS) {
                    if (!isNearCam(r.x, r.y, r.r)) continue;
                    ctx.fillStyle = r.col; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.fill();
                  }
                  for (const m of mudZones) {
                    if (!isNearCam(m.x, m.y, m.r + 80)) continue;
                    ctx.fillStyle = biome.mud; ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
                  }
                  for (const w of waterZones) {
                    if (!isNearCam(w.x, w.y, w.r + 80)) continue;
                    ctx.fillStyle = biome.water; ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2); ctx.fill();
                  }
                  for (const pr of worldProps) {
                    if (!isNearCam(pr.x, pr.y, pr.sz + 40)) continue;
                    ctx.save(); ctx.translate(pr.x, pr.y); ctx.rotate(pr.rot);
                    if (pr.kind === 'log') {
                      ctx.fillStyle = '#4a311c'; ctx.fillRect(-pr.sz, -pr.sz * 0.25, pr.sz * 2, pr.sz * 0.5);
                      ctx.fillStyle = 'rgba(72,132,42,0.7)'; ctx.beginPath(); ctx.ellipse(-pr.sz * 0.2, 0, pr.sz * 0.4, pr.sz * 0.22, 0, 0, Math.PI * 2); ctx.fill();
                    } else if (pr.kind === 'rock') {
                      ctx.fillStyle = '#5a6055'; ctx.beginPath(); ctx.ellipse(0, 0, pr.sz * 0.75, pr.sz * 0.58, 0, 0, Math.PI * 2); ctx.fill();
                    } else {
                      ctx.fillStyle = 'rgba(46,112,38,0.65)';
                      for (let f = 0; f < 6; f++) { ctx.rotate(Math.PI / 3); ctx.beginPath(); ctx.ellipse(pr.sz * 0.45, 0, pr.sz * 0.45, pr.sz * 0.16, 0, 0, Math.PI * 2); ctx.fill(); }
                    }
                    ctx.restore();
                  }

                  ctx.strokeStyle = 'rgba(255,75,58,0.6)'; ctx.lineWidth = 18;
                  ctx.beginPath(); ctx.arc(WORLD_CENTER, WORLD_CENTER, ARENA_RADIUS, 0, Math.PI * 2); ctx.stroke();
                  if (safeZone.active) {
                    ctx.strokeStyle = 'rgba(77,226,240,0.88)'; ctx.lineWidth = 10;
                    ctx.beginPath(); ctx.arc(safeZone.cx, safeZone.cy, safeZone.r, 0, Math.PI * 2); ctx.stroke();
                  }

                  for (const p of preyList) { if (isNearCam(p.x, p.y, 50)) drawPrey(ctx, p); }
                  for (const m of meatList) {
                    if (!isNearCam(m.x, m.y, 40)) continue;
                    ctx.fillStyle = '#ff9d3b'; ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
                  }

                  for (const s of snakes) {
                    if (!s.alive || (!s.isPlayer && !isNearCam(s.x, s.y, 260))) continue;
                    s.draw(ctx, true);
                  }

                  for (const pr of projectiles) {
                    ctx.fillStyle = '#84ff3b'; ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.r, 0, Math.PI * 2); ctx.fill();
                  }
                  for (const pt of particles) {
                    ctx.globalAlpha = clamp(pt.life / pt.maxLife, 0, 1);
                    ctx.fillStyle = pt.color; ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2); ctx.fill();
                  }
                  ctx.globalAlpha = 1;
                  ctx.font = '900 13px sans-serif'; ctx.textAlign = 'center';
                  for (const ft of floatTexts) {
                    ctx.globalAlpha = clamp(ft.life / ft.maxLife, 0, 1);
                    ctx.fillStyle = ft.color; ctx.fillText(ft.text, ft.x, ft.y);
                  }
                  ctx.restore();
                }

                function mainLoop(ts) {
                  const dt = Math.min(0.05, (ts - (lastFrame || ts)) / 1000);
                  lastFrame = ts; globalTime += dt;
                  if (screenState === 'playing') updateGame(dt);
                  renderGame();
                  requestAnimationFrame(mainLoop);
                }

                function refreshLobbyUI() {
                  document.getElementById('lbAvatar').textContent = profile.avatar;
                  document.getElementById('lbLvl').textContent = `LV.${profile.level}`;
                  document.getElementById('lbName').textContent = profile.name;
                  document.getElementById('lbRank').textContent = getRank(profile.level);
                  document.getElementById('lbTitle').textContent = profile.title;
                  document.getElementById('lbCoins').textContent = profile.coins;
                  const sp = SPECIES.find(s => s.id === profile.selectedSnake) || SPECIES[0];
                  const bi = BIOMES.find(b => b.id === profile.selectedBiome) || BIOMES[0];
                  document.getElementById('scSnake').textContent = sp.name;
                  document.getElementById('scBiome').textContent = bi.name;
                  document.getElementById('modeLabel').textContent = profile.selectedMode === 'br' ? '50-Snake Safe Zone BR' : '50-Snake Endless Wild';
                  const muteIcon = profile.settings.muted ? '🔇' : '🔊';
                  document.getElementById('btnLobbyAudio').textContent = muteIcon;
                  document.getElementById('hudAudioBtn').textContent = muteIcon;
                }

                function renderProfileModal() {
                  document.getElementById('prAv').textContent = profile.avatar;
                  document.getElementById('prLv').textContent = `LV.${profile.level}`;
                  document.getElementById('prNameIn').value = profile.name;
                  document.getElementById('prRankTxt').textContent = getRank(profile.level);
                  const need = getXpNeed(profile.level);
                  document.getElementById('prXpTxt').textContent = `${profile.xp} / ${need} XP`;
                  document.getElementById('prXpBar').style.width = `${Math.min(100, (profile.xp / need) * 100)}%`;

                  const avWrap = document.getElementById('avatarChips'); avWrap.innerHTML = '';
                  AVATARS.forEach(a => {
                    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip' + (profile.avatar === a ? ' selected' : '');
                    b.textContent = a; b.onclick = () => { profile.avatar = a; saveProfile(); renderProfileModal(); refreshLobbyUI(); Sound.click(); };
                    avWrap.appendChild(b);
                  });

                  document.getElementById('careerGrid').innerHTML = `
                    <div class="stat-box"><div class="stat-val">${profile.stats.matches}</div><div class="stat-lbl">Matches</div></div>
                    <div class="stat-box"><div class="stat-val" style="color:var(--gold);">${profile.stats.wins}</div><div class="stat-lbl">Wins</div></div>
                    <div class="stat-box"><div class="stat-val">${profile.stats.kills}</div><div class="stat-lbl">Kills</div></div>
                    <div class="stat-box"><div class="stat-val">${profile.stats.bestLength}</div><div class="stat-lbl">Max Len</div></div>`;

                  const sg = document.getElementById('snakesGrid'); sg.innerHTML = '';
                  SPECIES.forEach(s => {
                    const owned = profile.ownedSnakes.includes(s.id), sel = profile.selectedSnake === s.id;
                    const card = document.createElement('div'); card.className = 'card-item' + (sel ? ' selected' : '');
                    card.innerHTML = `
                      <div style="display:flex;justify-content:space-between;align-items:center;"><strong style="color:#ffe47a;">${s.name}</strong><span style="width:18px;height:18px;border-radius:50%;background:${s.base};border:2px solid #ffe47a;"></span></div>
                      <div style="font-size:11px;color:#b8d1b4;">${s.trait}</div>
                      <button type="button" class="btn-gold" style="padding:8px;font-size:11px;">${sel ? 'EQUIPPED' : (owned ? 'SELECT' : `UNLOCK ${s.price} 🪙`)}</button>`;
                    card.onclick = () => {
                      if (owned) profile.selectedSnake = s.id;
                      else if (profile.coins >= s.price) { profile.coins -= s.price; profile.ownedSnakes.push(s.id); profile.selectedSnake = s.id; }
                      else return;
                      saveProfile(); Sound.click(); renderProfileModal(); enterLobby();
                    };
                    sg.appendChild(card);
                  });

                  const bg = document.getElementById('biomeGrid'); bg.innerHTML = '';
                  BIOMES.forEach(b => {
                    const sel = profile.selectedBiome === b.id;
                    const card = document.createElement('div'); card.className = 'card-item' + (sel ? ' selected' : '');
                    card.innerHTML = `<strong style="color:var(--gold);">${b.name}</strong><div style="height:24px;border-radius:8px;background:${b.floor};border:1px solid ${b.water};"></div><div style="font-size:11px;color:var(--green);font-weight:800;">${sel ? 'ACTIVE BIOME' : 'TAP TO SELECT'}</div>`;
                    card.onclick = () => { profile.selectedBiome = b.id; saveProfile(); Sound.click(); renderProfileModal(); enterLobby(); };
                    bg.appendChild(card);
                  });
                }

                function openProfileModal(tabId) {
                  renderProfileModal();
                  document.querySelectorAll('#profileTabs .tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
                  document.querySelectorAll('#profileModal .tab-pane').forEach(p => p.classList.toggle('active', p.id === tabId));
                  document.getElementById('profileModal').classList.add('open');
                  Sound.click();
                }

                function handleSplashEnter(e) {
                  if (e) e.stopPropagation();
                  if (splashEntered) return;
                  splashEntered = true;
                  Sound.init(); Sound.click();
                  document.getElementById('tapEnterWrap').style.display = 'none';
                  document.getElementById('loaderWrap').style.display = 'flex';
                  let pct = 0;
                  const fill = document.getElementById('loaderFill'), txt = document.getElementById('loaderPct');
                  const iv = setInterval(() => {
                    pct = Math.min(100, pct + rand(15, 25));
                    fill.style.width = `${pct}%`; txt.textContent = `${Math.floor(pct)}%`;
                    if (pct >= 100) {
                      clearInterval(iv);
                      const sp = document.getElementById('splashScreen');
                      sp.classList.add('fade-out');
                      setTimeout(() => { sp.style.display = 'none'; enterLobby(); }, 320);
                    }
                  }, 85);
                }

                document.getElementById('btnTapEnter').addEventListener('click', handleSplashEnter);
                document.getElementById('splashScreen').addEventListener('click', handleSplashEnter);
                document.getElementById('profileBadge').addEventListener('click', () => openProfileModal('tabProfile'));
                document.getElementById('showcasePill').addEventListener('click', () => openProfileModal('tabSnakes'));
                document.querySelectorAll('[data-open-prof]').forEach(b => b.addEventListener('click', () => openProfileModal(b.dataset.openProf)));
                document.querySelectorAll('#profileTabs .tab-btn').forEach(b => b.addEventListener('click', () => openProfileModal(b.dataset.tab)));
                document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => { document.getElementById(b.dataset.close).classList.remove('open'); Sound.click(); }));
                document.getElementById('prNameIn').addEventListener('input', e => { profile.name = e.target.value.trim() || 'ApexHunter'; saveProfile(); refreshLobbyUI(); });

                document.getElementById('modePill').addEventListener('click', () => {
                  profile.selectedMode = profile.selectedMode === 'br' ? 'endless' : 'br';
                  saveProfile(); refreshLobbyUI(); Sound.click();
                });

                document.getElementById('btnStartMatch').addEventListener('click', () => {
                  Sound.init(); Sound.click();
                  const mm = document.getElementById('matchmakingOverlay'), mt = document.getElementById('mmText');
                  mm.classList.add('open');
