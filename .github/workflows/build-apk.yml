                  c.fillStyle = '#c91c22'; c.beginPath(); c.ellipse(0, 0, r * 0.94, r * 0.66, 0, 0, Math.PI * 2); c.fill();
                  c.strokeStyle = 'rgba(255,215,200,0.6)'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(-r * 0.5, -r * 0.2); c.quadraticCurveTo(0, r * 0.2, r * 0.5, -r * 0.1); c.stroke();
                  c.fillStyle = '#fffdf7'; c.strokeStyle = '#998b78'; c.lineWidth = 1; c.beginPath(); c.arc(-r * 0.28, 0, r * 0.26, 0, Math.PI * 2); c.fill(); c.stroke();
