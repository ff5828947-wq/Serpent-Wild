                  const bCols = ['#ffe85c', '#ff85d4', '#61f0ff', '#ff9947'];
                  ambientFx = Array.from({ length: 28 }, (_, i) => ({ x: rand(0, appW), y: rand(0, appH), vx: rand(-24, 24), vy: rand(18, 46), sz: rand(2.5, 5.5), ph: rand(0, 6.28), col: bCols[i % bCols.length] }));
