name: Build Serpent-Wild v32 PlayStore-Ready AAB & APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Accept Android SDK Licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Generate Upbeat Funky Arcade BGM WAV
        run: |
          mkdir -p app/src/main/res/raw
          python3 - << 'PYEOF'
          import math, wave, struct, random
          sr = 44100
          bpm = 126
          step = 60.0 / bpm / 4.0
          lead = [
              523.25, 0, 659.25, 0, 783.99, 0, 659.25, 587.33,
              523.25, 0, 440.00, 523.25, 587.33, 0, 0, 0,
              659.25, 0, 783.99, 0, 880.00, 0, 783.99, 659.25,
              587.33, 0, 523.25, 587.33, 659.25, 0, 0, 0,
              698.46, 0, 880.00, 0, 783.99, 0, 659.25, 0,
              587.33, 0, 659.25, 587.33, 523.25, 0, 440.00, 0,
              523.25, 587.33, 659.25, 0, 783.99, 0, 1046.50, 0,
              880.00, 0, 783.99, 0, 523.25, 0, 0, 0
          ]
          bass = [
              130.81, 0, 130.81, 196.00, 0, 130.81, 164.81, 196.00,
              146.83, 0, 146.83, 220.00, 0, 146.83, 174.61, 220.00,
              164.81, 0, 164.81, 246.94, 0, 164.81, 196.00, 246.94,
              174.61, 0, 174.61, 261.63, 196.00, 0, 246.94, 196.00,
              174.61, 0, 174.61, 261.63, 0, 174.61, 220.00, 261.63,
              146.83, 0, 146.83, 220.00, 0, 146.83, 196.00, 174.61,
              130.81, 0, 164.81, 0, 196.00, 0, 261.63, 0,
              196.00, 0, 246.94, 0, 130.81, 0, 196.00, 0
          ]
          chords = [
              (261.63, 329.63, 392.00),
              (293.66, 349.23, 440.00),
              (329.63, 392.00, 493.88),
              (349.23, 440.00, 523.25)
          ]
          n_steps = len(lead)
          total_sec = step * n_steps
          n_samples = int(sr * total_sec)
          buf = [0.0] * n_samples
          rng = random.Random(2026)

          for idx in range(n_steps):
              st = int(idx * step * sr)
              if idx % 4 == 0 or idx % 16 == 10:
                  k_len = int(sr * 0.11)
                  for j in range(k_len):
                      if st + j >= n_samples: break
                      t = j / sr
                      f = 135.0 * math.exp(-t * 28.0) + 46.0
                      buf[st + j] += math.sin(2.0 * math.pi * f * t) * math.exp(-t * 24.0) * 0.28
              if idx % 8 == 4:
                  s_len = int(sr * 0.09)
                  for j in range(s_len):
                      if st + j >= n_samples: break
                      t = j / sr
                      env = math.exp(-t * 32.0)
                      noise = (rng.random() * 2.0 - 1.0) * 0.14
                      body = math.sin(2.0 * math.pi * 195.0 * t) * 0.10
                      buf[st + j] += (noise + body) * env
              if idx % 2 == 1:
                  h_len = int(sr * 0.035)
                  for j in range(h_len):
                      if st + j >= n_samples: break
                      t = j / sr
                      buf[st + j] += (rng.random() * 2.0 - 1.0) * math.exp(-t * 85.0) * 0.055
              bf = bass[idx]
              if bf > 0:
                  b_len = int(step * 1.4 * sr)
                  for j in range(b_len):
                      if st + j >= n_samples: break
                      t = j / sr
                      u = j / b_len
                      env = min(1.0, j / (sr * 0.008)) * ((1.0 - u) ** 1.6)
                      val = math.sin(2.0 * math.pi * bf * t) * 0.19 + math.sin(4.0 * math.pi * bf * t) * 0.07
                      buf[st + j] += val * env
              if idx % 4 == 2:
                  cf = chords[(idx // 8) % 4]
                  c_len = int(step * 1.1 * sr)
                  for j in range(c_len):
                      if st + j >= n_samples: break
                      t = j / sr
                      u = j / c_len
                      env = min(1.0, j / (sr * 0.006)) * ((1.0 - u) ** 2.0)
                      s = sum(math.sin(2.0 * math.pi * f * t) for f in cf) * 0.042
                      buf[st + j] += s * env
              lf = lead[idx]
              if lf > 0:
                  l_len = int(step * 1.65 * sr)
                  for j in range(l_len):
                      if st + j >= n_samples: break
                      t = j / sr
                      u = j / l_len
                      env = min(1.0, j / (sr * 0.01)) * ((1.0 - u) ** 1.8)
                      val = (math.sin(2.0 * math.pi * lf * t) * 0.14 +
                             math.sin(4.0 * math.pi * lf * t) * 0.055 +
                             math.sin(6.0 * math.pi * lf * t) * 0.025)
                      buf[st + j] += val * env

          fade = int(sr * 0.04)
          for i in range(fade):
              buf[i] *= (i / fade)
              buf[n_samples - 1 - i] *= (i / fade)

          with wave.open("app/src/main/res/raw/bgm.wav", "w") as wf:
              wf.setnchannels(1)
              wf.setsampwidth(2)
              wf.setframerate(sr)
              data = bytearray()
              for sample in buf:
                  clamped = max(-0.88, min(0.88, sample))
                  data += struct.pack("<h", int(clamped * 32767))
              wf.writeframes(data)
          PYEOF

      - name: Generate Serpent-Wild v32 PlayStore-Ready Project
        run: |
          mkdir -p app/src/main/java/com/apexwild/serpent app/src/main/assets app/src/main/res/values

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SerpentWild"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.9.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat << 'EOF' > app/proguard-rules.pro
          -keepattributes *Annotation*
          -keepclassmembers class * {
              @android.webkit.JavascriptInterface <methods>;
          }
          -keep class com.apexwild.serpent.MainActivity$AudioBridge { *; }
          -keep class com.apexwild.serpent.MainActivity$BillingBridge { *; }
          -keep class com.apexwild.serpent.MainActivity$AdBridge { *; }
          -keep class com.apexwild.serpent.MainActivity$GoogleAuthBridge { *; }

          -keep class com.apexwild.serpent.ReminderReceiver { *; }
          -keep class com.android.billingclient.** { *; }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.apexwild.serpent"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.apexwild.serpent.royale"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 32
                  versionName = "1.0.5"
              }
              signingConfigs {
                  create("release") {
                      storeFile = file("serpent-release.jks")
                      storePassword = System.getenv("SERPENT_STORE_PASS").orEmpty().ifBlank { "Serpent@2026" }
                      keyAlias = System.getenv("SERPENT_KEY_ALIAS").orEmpty().ifBlank { "serpentkey" }
                      keyPassword = System.getenv("SERPENT_KEY_PASS").orEmpty().ifBlank { "Serpent@2026" }
                  }
              }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.android.billingclient:billing-ktx:7.1.1")
              implementation("com.google.android.gms:play-services-ads:24.1.0")
              implementation("com.google.android.gms:play-services-auth:21.3.0")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.SerpentWild" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">#0d4a14</item>
                  <item name="android:colorBackground">#0d4a14</item>
                  <item name="android:statusBarColor">#0d4a14</item>
                  <item name="android:navigationBarColor">#0d4a14</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="com.android.vending.BILLING" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="Serpent Wild: Apex"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar"
                  android:usesCleartextTraffic="false">
                  <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3210967652219044~5142816234" />

                  <receiver android:name=".ReminderReceiver" android:exported="false" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:hardwareAccelerated="true"
                      android:theme="@style/Theme.SerpentWild"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          LOGO_FILE=$(find . -maxdepth 1 \( -iname "wild.png" -o -iname "logo.png" -o -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" \) | head -n 1)
          if [ -n "$LOGO_FILE" ]; then
            mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi
            if command -v convert >/dev/null 2>&1; then
              convert "$LOGO_FILE" -resize 48x48^ -gravity center -extent 48x48 PNG32:app/src/main/res/mipmap-mdpi/ic_launcher.png
              convert "$LOGO_FILE" -resize 72x72^ -gravity center -extent 72x72 PNG32:app/src/main/res/mipmap-hdpi/ic_launcher.png
              convert "$LOGO_FILE" -resize 96x96^ -gravity center -extent 96x96 PNG32:app/src/main/res/mipmap-xhdpi/ic_launcher.png
              convert "$LOGO_FILE" -resize 144x144^ -gravity center -extent 144x144 PNG32:app/src/main/res/mipmap-xxhdpi/ic_launcher.png
              convert "$LOGO_FILE" -resize 192x192^ -gravity center -extent 192x192 PNG32:app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            else
              cp "$LOGO_FILE" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            fi
            sed -i 's/android:label="Serpent Wild: Apex"/android:label="Serpent Wild: Apex" android:icon="@mipmap\/ic_launcher" android:roundIcon="@mipmap\/ic_launcher"/' app/src/main/AndroidManifest.xml
          fi

          cat << 'EOF' > app/src/main/java/com/apexwild/serpent/ReminderReceiver.kt
          package com.apexwild.serpent

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import androidx.core.app.NotificationCompat

          class ReminderReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  showNotification(context)
              }

              companion object {
                  const val CHANNEL_ID = "serpent_wild_reminders"

                  fun showNotification(context: Context) {
                      val nm = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          val ch = NotificationChannel(CHANNEL_ID, "Serpent Wild Reminders", NotificationManager.IMPORTANCE_DEFAULT)
                          ch.description = "Daily arena battle & calendar streak reminders"
                          nm.createNotificationChannel(ch)
                      }
                      val openIntent = Intent(context, MainActivity::class.java).apply {
                          flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                      }
                      val pi = PendingIntent.getActivity(
                          context, 1001, openIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )
                      val iconRes = context.applicationInfo.icon.takeIf { it != 0 } ?: android.R.drawable.sym_def_app_icon
                      val notif = NotificationCompat.Builder(context, CHANNEL_ID)
                          .setSmallIcon(iconRes)
                          .setContentTitle("🐍 Serpent Wild: 36 Unique Glow Snakes!")
                          .setContentText("Your Free Chest & Lucky Wheel Spin are ready! Become World #1!")
                          .setPriority(NotificationCompat.PRIORITY_DEFAULT)
                          .setAutoCancel(true)
                          .setContentIntent(pi)
                          .build()
                      nm.notify(2026, notif)
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/apexwild/serpent/MainActivity.kt
          package com.apexwild.serpent

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ActivityInfo
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.media.MediaPlayer
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import android.os.Build
          import android.os.Bundle
          import android.view.View
          import android.view.WindowManager
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import com.android.billingclient.api.BillingClient
          import com.android.billingclient.api.BillingClientStateListener
          import com.android.billingclient.api.BillingFlowParams
          import com.android.billingclient.api.BillingResult
          import com.android.billingclient.api.ConsumeParams
          import com.android.billingclient.api.PendingPurchasesParams
          import com.android.billingclient.api.ProductDetails
          import com.android.billingclient.api.Purchase
          import com.android.billingclient.api.PurchasesUpdatedListener
          import com.android.billingclient.api.QueryProductDetailsParams
          import com.google.android.gms.ads.AdError
          import com.google.android.gms.ads.AdRequest
          import com.google.android.gms.ads.FullScreenContentCallback
          import com.google.android.gms.ads.LoadAdError
          import com.google.android.gms.ads.MobileAds
          import com.google.android.gms.ads.rewarded.RewardedAd
          import com.google.android.gms.ads.rewarded.RewardedAdLoadCallback
          import com.google.android.gms.auth.api.signin.GoogleSignIn
          import com.google.android.gms.auth.api.signin.GoogleSignInClient
          import com.google.android.gms.auth.api.signin.GoogleSignInOptions
          import com.google.android.gms.common.api.ApiException
          import org.json.JSONObject

          class MainActivity : AppCompatActivity(), PurchasesUpdatedListener {
              private lateinit var webView: WebView
              private var bgmPlayer: MediaPlayer? = null
              private var bgmEnabled = true
              private var bgmVolume = 0.72f
              private var notifEnabled = true
              private var lastBackPressMs = 0L

              private var billingClient: BillingClient? = null
              private val productDetailsMap = mutableMapOf<String, ProductDetails>()
              private val playSkus = listOf("pack_10", "pack_25", "pack_79", "pack_88", "pack_107")
              private var rewardedAd: RewardedAd? = null
              private var isLoadingRewardedAd = false
              private val rewardedAdUnitId = "ca-app-pub-3210967652219044/8395665532"

              private lateinit var googleSignInClient: GoogleSignInClient
              private val googleWebClientId = "433873271111-ui9tipkhgivih0bdnt2vd7ar1j1qk95f.apps.googleusercontent.com"

              private val googleSignInLauncher = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { result ->
                  try {
                      val task = GoogleSignIn.getSignedInAccountFromIntent(result.data)
                      val account = task.getResult(ApiException::class.java)
                      val uid = account?.id.orEmpty()
                      if (uid.isNotBlank()) {
                          val payload = JSONObject().apply {
                              put("id", uid)
                              put("email", account?.email.orEmpty())
                              put("name", account?.displayName.orEmpty())
                          }.toString()
                          val safeJson = JSONObject.quote(payload)
                          webView.post {
                              webView.evaluateJavascript("window.onGoogleSignInSuccess && window.onGoogleSignInSuccess(JSON.parse($safeJson));", null)
                          }
                      } else {
                          webView.post {
                              webView.evaluateJavascript("window.onGoogleSignInFailed && window.onGoogleSignInFailed('No Google account ID');", null)
                          }
                      }
                  } catch (e: ApiException) {
                      val msg = when (e.statusCode) {
                          10 -> "SHA-1 not added in Firebase (Error 10)"
                          12501 -> "Cancelled"
                          else -> "Google Sign-In Error ${e.statusCode}"
                      }
                      val safeMsg = JSONObject.quote(msg)
                      webView.post {
                          webView.evaluateJavascript("window.onGoogleSignInFailed && window.onGoogleSignInFailed($safeMsg);", null)
                      }
                  } catch (e: Exception) {
                      val safeMsg = JSONObject.quote(e.message ?: "Sign-in failed")
                      webView.post {
                          webView.evaluateJavascript("window.onGoogleSignInFailed && window.onGoogleSignInFailed($safeMsg);", null)
                      }
                  }
              }

              private fun setupGoogleSignIn() {
                  val gso = GoogleSignInOptions.Builder(GoogleSignInOptions.DEFAULT_SIGN_IN)
                      .requestIdToken(googleWebClientId)
                      .requestEmail()
                      .build()
                  googleSignInClient = GoogleSignIn.getClient(this, gso)
              }

              inner class GoogleAuthBridge {
                  @JavascriptInterface
                  fun signIn() {
                      runOnUiThread {
                          try {
                              googleSignInClient.signOut().addOnCompleteListener {
                                  googleSignInLauncher.launch(googleSignInClient.signInIntent)
                              }
                          } catch (e: Exception) {
                              Toast.makeText(this@MainActivity, "Sign-In failed: ${e.message}", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }

                  @JavascriptInterface
                  fun signOut() {
                      runOnUiThread {
                          try {
                              googleSignInClient.signOut().addOnCompleteListener {
                                  webView.post {
                                      webView.evaluateJavascript("window.onGoogleSignOut && window.onGoogleSignOut();", null)
                                  }
                              }
                          } catch (_: Exception) {}
                      }
                  }

                  @JavascriptInterface
                  fun getSignedInUser(): String {
                      return try {
                          val acc = GoogleSignIn.getLastSignedInAccount(this@MainActivity)
                          if (acc != null && !acc.id.isNullOrBlank()) {
                              JSONObject().apply {
                                  put("id", acc.id ?: "")
                                  put("email", acc.email ?: "")
                                  put("name", acc.displayName ?: "")
                              }.toString()
                          } else ""
                      } catch (_: Exception) { "" }
                  }
              }

              private fun loadRewardedAd() {
                  if (isLoadingRewardedAd || rewardedAd != null) return
                  isLoadingRewardedAd = true
                  val adRequest = AdRequest.Builder().build()
                  RewardedAd.load(this, rewardedAdUnitId, adRequest, object : RewardedAdLoadCallback() {
                      override fun onAdLoaded(ad: RewardedAd) {
                          rewardedAd = ad
                          isLoadingRewardedAd = false
                      }
                      override fun onAdFailedToLoad(adError: LoadAdError) {
                          rewardedAd = null
                          isLoadingRewardedAd = false
                          webView.postDelayed({ loadRewardedAd() }, 15000L)
                      }
                  })
              }

              inner class AdBridge {
                  @JavascriptInterface
                  fun showRewardedAd() {
                      runOnUiThread {
                          val ad = rewardedAd
                          if (ad != null) {
                              var rewardEarned = false
                              ad.fullScreenContentCallback = object : FullScreenContentCallback() {
                                  override fun onAdDismissedFullScreenContent() {
                                      rewardedAd = null
                                      loadRewardedAd()
                                      val js = if (rewardEarned) {
                                          "window.onRewardedAdComplete && window.onRewardedAdComplete();"
                                      } else {
                                          "window.onRewardedAdCancelled && window.onRewardedAdCancelled();"
                                      }
                                      webView.post { webView.evaluateJavascript(js, null) }
                                  }
                                  override fun onAdFailedToShowFullScreenContent(adError: AdError) {
                                      rewardedAd = null
                                      loadRewardedAd()
                                      webView.post {
                                          webView.evaluateJavascript("window.onRewardedAdFailed && window.onRewardedAdFailed();", null)
                                      }
                                  }
                              }
                              ad.show(this@MainActivity) {
                                  rewardEarned = true
                              }
                          } else {
                              loadRewardedAd()
                              Toast.makeText(this@MainActivity, "Ad is loading, please try again in a moment!", Toast.LENGTH_SHORT).show()
                              webView.post {
                                  webView.evaluateJavascript("window.onRewardedAdFailed && window.onRewardedAdFailed();", null)
                              }
                          }
                      }
                  }
              }

              inner class AudioBridge {
                  @JavascriptInterface
                  fun startBgm(enabled: Boolean, vol: Float) {
                      runOnUiThread {
                          bgmEnabled = enabled
                          bgmVolume = vol.coerceIn(0f, 1f)
                          syncNativeBgm()
                      }
                  }

                  @JavascriptInterface
                  fun updateBgm(enabled: Boolean, vol: Float) {
                      runOnUiThread {
                          bgmEnabled = enabled
                          bgmVolume = vol.coerceIn(0f, 1f)
                          syncNativeBgm()
                      }
                  }

                  @JavascriptInterface
                  fun setNotifications(enabled: Boolean) {
                      runOnUiThread {
                          notifEnabled = enabled
                          if (enabled) {
                              requestNotifPermission()
                              scheduleReminder(6L * 60L * 60L * 1000L)
                          } else {
                              cancelReminder()
                          }
                      }
                  }

                  @JavascriptInterface
                  fun isOnline(): Boolean {
                      return try {
                          val cm = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                          val net = cm.activeNetwork ?: return false
                          val caps = cm.getNetworkCapabilities(net) ?: return false
                          caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                      } catch (_: Exception) { false }
                  }
              }

              inner class BillingBridge {
                  @JavascriptInterface
                  fun purchase(sku: String) {
                      runOnUiThread {
                          val details = productDetailsMap[sku]
                          val bc = billingClient
                          if (bc != null && bc.isReady && details != null) {
                              val params = BillingFlowParams.ProductDetailsParams.newBuilder()
                                  .setProductDetails(details)
                                  .build()
                              val flow = BillingFlowParams.newBuilder()
                                  .setProductDetailsParamsList(listOf(params))
                                  .build()
                              bc.launchBillingFlow(this@MainActivity, flow)
                          } else {
                              Toast.makeText(
                                  this@MainActivity,
                                  "Google Play Billing ready! Create in-app product '$sku' in Play Console to activate.",
                                  Toast.LENGTH_LONG
                              ).show()
                          }
                      }
                  }
              }

              private fun setupPlayBilling() {
                  try {
                      billingClient = BillingClient.newBuilder(this)
                          .setListener(this)
                          .enablePendingPurchases(
                              PendingPurchasesParams.newBuilder().enableOneTimeProducts().build()
                          )
                          .build()
                      billingClient?.startConnection(object : BillingClientStateListener {
                          override fun onBillingSetupFinished(result: BillingResult) {
                              if (result.responseCode == BillingClient.BillingResponseCode.OK) {
                                  queryPlayProducts()
                              }
                          }
                          override fun onBillingServiceDisconnected() {}
                      })
                  } catch (_: Exception) {}
              }

              private fun queryPlayProducts() {
                  val products = playSkus.map { sku ->
                      QueryProductDetailsParams.Product.newBuilder()
                          .setProductId(sku)
                          .setProductType(BillingClient.ProductType.INAPP)
                          .build()
                  }
                  val params = QueryProductDetailsParams.newBuilder()
                      .setProductList(products)
                      .build()
                  billingClient?.queryProductDetailsAsync(params) { result, list ->
                      if (result.responseCode == BillingClient.BillingResponseCode.OK) {
                          list.forEach { pd -> productDetailsMap[pd.productId] = pd }
                      }
                  }
              }

              override fun onPurchasesUpdated(result: BillingResult, purchases: MutableList<Purchase>?) {
                  if (result.responseCode == BillingClient.BillingResponseCode.OK && purchases != null) {
                      for (purchase in purchases) {
                          if (purchase.purchaseState == Purchase.PurchaseState.PURCHASED) {
                              val consumeParams = ConsumeParams.newBuilder()
                                  .setPurchaseToken(purchase.purchaseToken)
                                  .build()
                              billingClient?.consumeAsync(consumeParams) { cRes, _ ->
                                  if (cRes.responseCode == BillingClient.BillingResponseCode.OK) {
                                      val sku = purchase.products.firstOrNull() ?: return@consumeAsync
                                      runOnUiThread {
                                          webView.evaluateJavascript(
                                              "window.onPlayPurchaseSuccess && window.onPlayPurchaseSuccess('$sku');",
                                              null
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  }
              }

              private fun requestNotifPermission() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.POST_NOTIFICATIONS), 101)
                      }
                  }
              }

              private fun scheduleReminder(delayMs: Long) {
                  val am = getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val intent = Intent(this, ReminderReceiver::class.java)
                  val pi = PendingIntent.getBroadcast(
                      this, 3001, intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  am.setInexactRepeating(
                      AlarmManager.RTC_WAKEUP,
                      System.currentTimeMillis() + delayMs,
                      AlarmManager.INTERVAL_HALF_DAY,
                      pi
                  )
              }

              private fun cancelReminder() {
                  val am = getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val intent = Intent(this, ReminderReceiver::class.java)
                  val pi = PendingIntent.getBroadcast(
                      this, 3001, intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  am.cancel(pi)
              }

              private fun ensureBgm() {
                  if (bgmPlayer == null) {
                      bgmPlayer = MediaPlayer.create(this, R.raw.bgm)?.apply {
                          isLooping = true
                      }
                  }
              }

              private fun syncNativeBgm() {
                  ensureBgm()
                  bgmPlayer?.let { mp ->
                      val v = if (bgmEnabled) bgmVolume else 0f
                      mp.setVolume(v, v)
                      if (bgmEnabled && v > 0.01f) {
                          if (!mp.isPlaying) mp.start()
                      } else {
                          if (mp.isPlaying) mp.pause()
                      }
                  }
              }

              private fun isSignatureValid(): Boolean {
                  return try {
                      if (packageName != "com.apexwild.serpent.royale") return false
                      val installer = try {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                              packageManager.getInstallSourceInfo(packageName).installingPackageName
                          } else {
                              @Suppress("DEPRECATION")
                              packageManager.getInstallerPackageName(packageName)
                          }
                      } catch (_: Exception) { null }
                      if (installer == "com.amazon.venezia" || installer == "com.android.vending") return true
                      val expected = "__EXPECTED_SIG_SHA256__"
                      if (expected.startsWith("__")) return true
                      val sigs = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                          packageManager.getPackageInfo(packageName, PackageManager.GET_SIGNING_CERTIFICATES)
                              .signingInfo?.apkContentsSigners
                      } else {
                          @Suppress("DEPRECATION")
                          packageManager.getPackageInfo(packageName, PackageManager.GET_SIGNATURES).signatures
                      } ?: return false
                      val md = java.security.MessageDigest.getInstance("SHA-256")
                      sigs.any { sig ->
                          val hex = md.digest(sig.toByteArray()).joinToString("") { "%02X".format(it) }
                          hex.equals(expected, ignoreCase = true)
                      }
                  } catch (_: Exception) { false }
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (!isSignatureValid()) {
                      finishAffinity()
                      return
                  }

                  requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  hideSystemBars()
                  requestNotifPermission()
                  scheduleReminder(6L * 60L * 60L * 1000L)
                  setupPlayBilling()
                  setupGoogleSignIn()
                  MobileAds.initialize(this) { loadRewardedAd() }

                  webView = WebView(this).apply {
                      setLayerType(View.LAYER_TYPE_HARDWARE, null)
                      setBackgroundColor(Color.parseColor("#0d4a14"))
                      overScrollMode = View.OVER_SCROLL_NEVER
                      isHorizontalScrollBarEnabled = false
                      isVerticalScrollBarEnabled = false
                      settings.apply {
                          javaScriptEnabled = true
                          domStorageEnabled = true
                          databaseEnabled = true
                          allowFileAccess = true
                          allowContentAccess = false
                          mediaPlaybackRequiresUserGesture = false
                          cacheMode = WebSettings.LOAD_DEFAULT
                          useWideViewPort = true
                          loadWithOverviewMode = true
                          mixedContentMode = WebSettings.MIXED_CONTENT_NEVER_ALLOW
                          textZoom = 100
                      }
                      addJavascriptInterface(AudioBridge(), "AndroidAudio")
                      addJavascriptInterface(BillingBridge(), "AndroidBilling")
                      addJavascriptInterface(AdBridge(), "AndroidAds")
                      addJavascriptInterface(object {
                          @android.webkit.JavascriptInterface
                          fun getDeviceId(): String {
                              return try {
                                  android.provider.Settings.Secure.getString(this@MainActivity.contentResolver, android.provider.Settings.Secure.ANDROID_ID) ?: ""
                              } catch (_: Exception) { "" }
                          }
                      }, "DeviceBridge")
                      addJavascriptInterface(GoogleAuthBridge(), "GoogleAuthBridge")

                      webViewClient = WebViewClient()
                      webChromeClient = WebChromeClient()
                  }

                  setContentView(webView)
                  webView.loadUrl("file:///android_asset/index.html")
                  syncNativeBgm()
              }

              private fun hideSystemBars() {
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  val controller = WindowInsetsControllerCompat(window, window.decorView)
                  controller.hide(WindowInsetsCompat.Type.systemBars())
                  controller.systemBarsBehavior =
                      WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) hideSystemBars()
              }

              override fun onPause() {
                  super.onPause()
                  bgmPlayer?.let { if (it.isPlaying) it.pause() }
                  webView.evaluateJavascript("window.pauseGameAudio && window.pauseGameAudio();", null)
                  webView.onPause()
              }

              override fun onStop() {
                  super.onStop()
                  bgmPlayer?.let { if (it.isPlaying) it.pause() }
              }

              override fun onResume() {
                  super.onResume()
                  hideSystemBars()
                  webView.onResume()
                  syncNativeBgm()
                  webView.evaluateJavascript("window.resumeGameAudio && window.resumeGameAudio();", null)
              }

              override fun onDestroy() {
                  billingClient?.endConnection()
                  bgmPlayer?.stop()
                  bgmPlayer?.release()
                  bgmPlayer = null
                  webView.destroy()
                  super.onDestroy()
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  val now = System.currentTimeMillis()
                  if (now - lastBackPressMs < 2000L) {
                      bgmPlayer?.stop()
                      super.onBackPressed()
                  } else {
                      lastBackPressMs = now
                      Toast.makeText(this, "Press back again to exit Serpent Wild", Toast.LENGTH_SHORT).show()
                  }
              }
          }
