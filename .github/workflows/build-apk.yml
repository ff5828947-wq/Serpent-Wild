name: Build Serpent-Wild v7 Ultra Edition APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Accept Android SDK Licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Generate Serpent-Wild v7 Android Project
        run: |
          mkdir -p app/src/main/java/com/apexwild/serpent app/src/main/assets app/src/main/res/values

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SerpentWild"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.9.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.apexwild.serpent"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.apexwild.serpent.royale"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 7
                  versionName = "7.0.0"
              }
              signingConfigs {
                  create("release") {
                      storeFile = file("serpent-release.jks")
                      storePassword = System.getenv("SERPENT_STORE_PASS").orEmpty().ifBlank { "Serpent@2026" }
                      keyAlias = System.getenv("SERPENT_KEY_ALIAS").orEmpty().ifBlank { "serpentkey" }
                      keyPassword = System.getenv("SERPENT_KEY_PASS").orEmpty().ifBlank { "Serpent@2026" }
                  }
              }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = false
                      isShrinkResources = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.SerpentWild" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">#060b07</item>
                  <item name="android:colorBackground">#060b07</item>
                  <item name="android:statusBarColor">#060b07</item>
                  <item name="android:navigationBarColor">#060b07</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="Serpent Wild: Apex"
                  android:theme="@style/Theme.SerpentWild"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:hardwareAccelerated="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          LOGO_FILE=$(find . -maxdepth 1 \( -iname "wild.png" -o -iname "logo.png" -o -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" \) | head -n 1)
          if [ -n "$LOGO_FILE" ]; then
            mkdir -p app/src/main/res/mipmap-xxxhdpi
            if command -v convert >/dev/null 2>&1; then
              convert "$LOGO_FILE" -resize 512x512^ -gravity center -extent 512x512 PNG32:app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            else
              cp "$LOGO_FILE" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            fi
            sed -i 's/android:label="Serpent Wild: Apex"/android:label="Serpent Wild: Apex" android:icon="@mipmap\/ic_launcher" android:roundIcon="@mipmap\/ic_launcher"/' app/src/main/AndroidManifest.xml
          fi

          cat << 'EOF' > app/src/main/java/com/apexwild/serpent/MainActivity.kt
          package com.apexwild.serpent

          import android.annotation.SuppressLint
          import android.content.pm.ActivityInfo
          import android.graphics.Color
          import android.os.Bundle
          import android.view.View
          import android.view.WindowManager
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView
              private var lastBackPressMs = 0L

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  hideSystemBars()

                  webView = WebView(this).apply {
                      setBackgroundColor(Color.parseColor("#060b07"))
                      overScrollMode = View.OVER_SCROLL_NEVER
                      isHorizontalScrollBarEnabled = false
                      isVerticalScrollBarEnabled = false
                      settings.apply {
                          javaScriptEnabled = true
                          domStorageEnabled = true
                          databaseEnabled = true
                          allowFileAccess = true
                          allowContentAccess = true
                          mediaPlaybackRequiresUserGesture = false
                          cacheMode = WebSettings.LOAD_DEFAULT
                          useWideViewPort = true
                          loadWithOverviewMode = true
                          mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                      }
                      webViewClient = WebViewClient()
                      webChromeClient = WebChromeClient()
                  }

                  setContentView(webView)
                  webView.loadUrl("file:///android_asset/index.html")
              }

              private fun hideSystemBars() {
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  val controller = WindowInsetsControllerCompat(window, window.decorView)
                  controller.hide(WindowInsetsCompat.Type.systemBars())
                  controller.systemBarsBehavior =
                      WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) hideSystemBars()
              }

              override fun onPause() {
                  super.onPause()
                  webView.onPause()
                  webView.pauseTimers()
              }

              override fun onResume() {
                  super.onResume()
                  hideSystemBars()
                  webView.resumeTimers()
                  webView.onResume()
              }

              override fun onDestroy() {
                  webView.destroy()
                  super.onDestroy()
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  val now = System.currentTimeMillis()
                  if (now - lastBackPressMs < 2000L) {
                      super.onBackPressed()
                  } else {
                      lastBackPressMs = now
                      Toast.makeText(this, "Press back again to exit Serpent Wild", Toast.LENGTH_SHORT).show()
                  }
              }
          }
          EOF

          cat << 'GAMEHTML' > app/src/main/assets/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
            <title>SERPENT WILD: APEX — v7 Ultra Edition</title>
            <style>
              :root {
                --bg-dark: #060b07;
                --panel-bg: rgba(10, 18, 12, 0.9);
                --panel-border: rgba(164, 224, 124, 0.34);
                --gold: #f6c445;
                --green: #7ce846;
                --cyan: #4de2f0;
                --diamond: #61e4ff;
                --danger: #ff4b3a;
                --text-main: #f2f8f0;
                --text-muted: #98b395;
              }
              * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
              html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg-dark); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
              #gameCanvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; touch-action: none; }
              button, input { touch-action: manipulation; font-family: inherit; }
              .glass { background: var(--panel-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--panel-border); box-shadow: 0 6px 20px rgba(0,0,0,0.55); }
              .btn-gold {
                border: none; border-radius: 11px; padding: 10px 18px;
                background: linear-gradient(135deg, #ffe370 0%, #f5b324 52%, #c9770c 100%);
                color: #1c1202; font-size: 12.5px; font-weight: 900; letter-spacing: 1.1px; text-transform: uppercase;
                cursor: pointer; box-shadow: 0 5px 16px rgba(245,179,36,0.4), inset 0 2px 3px rgba(255,255,255,0.6);
              }
              .btn-gold:active { transform: scale(0.95); }
              .btn-dia {
                border: none; border-radius: 10px; padding: 8px 12px;
                background: linear-gradient(135deg, #9cf4ff 0%, #32c5f4 55%, #0c6e9e 100%);
                color: #031924; font-size: 11px; font-weight: 900; letter-spacing: 0.7px; text-transform: uppercase; cursor: pointer;
              }
              .btn-dia:active { transform: scale(0.95); }
              .btn-inr {
                border: none; border-radius: 10px; padding: 8px 12px;
                background: linear-gradient(135deg, #8cff6e 0%, #2fc44b 55%, #116b25 100%);
                color: #041f0a; font-size: 11.5px; font-weight: 900; letter-spacing: 0.7px; text-transform: uppercase; cursor: pointer;
              }
              .btn-inr:active { transform: scale(0.95); }
              .btn-ghost {
                border: 1px solid rgba(255,255,255,0.22); border-radius: 11px; padding: 9px 15px;
                background: rgba(255,255,255,0.08); color: #dcead7; font-size: 12px; font-weight: 800; text-transform: uppercase; cursor: pointer;
              }

              /* 1. SPLASH SCREEN */
              #splashScreen {
                position: fixed; inset: 0; z-index: 120; display: flex; flex-direction: column;
                align-items: center; justify-content: space-between;
                padding: 18px 24px 24px;
                background: radial-gradient(circle at 50% 40%, rgba(28, 62, 26, 0.92), rgba(5, 10, 6, 0.99) 76%);
                cursor: pointer; transition: opacity 0.4s ease;
              }
              #splashScreen.fade-out { opacity: 0; pointer-events: none; }
              .studio-brand { font-size: 11px; font-weight: 900; letter-spacing: 5px; color: #b7d9a7; text-transform: uppercase; }
              .splash-hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 7px; margin: auto 0; }
              .splash-crest {
                width: 66px; height: 66px; border-radius: 20px;
                background: linear-gradient(145deg, rgba(124,232,70,0.22), rgba(246,196,69,0.14));
                border: 2px solid rgba(246,196,69,0.62); display: flex; align-items: center; justify-content: center;
                box-shadow: 0 0 36px rgba(124,232,70,0.32); animation: pulse 2.2s ease-in-out infinite;
              }
              @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
              .splash-title {
                font-size: clamp(26px, 5vw, 48px); font-weight: 900; letter-spacing: 3px; line-height: 1.05;
                background: linear-gradient(180deg, #fffbe0 0%, #f6c445 52%, #a66912 100%);
                -webkit-background-clip: text; -webkit-text-fill-color: transparent;
              }
              .splash-subtitle { font-size: 11px; font-weight: 900; letter-spacing: 3px; color: var(--green); text-transform: uppercase; }
              #tapEnterWrap { display: flex; flex-direction: column; align-items: center; gap: 7px; width: 100%; max-width: 320px; }
              #btnTapEnter { width: 100%; padding: 13px 22px; font-size: 14.5px; letter-spacing: 1.8px; animation: pulse 1.9s ease-in-out infinite; }
              #loaderWrap { display: none; width: 100%; max-width: 440px; flex-direction: column; gap: 6px; }
              .loader-row { display: flex; justify-content: space-between; font-size: 11.5px; font-weight: 800; color: #d6ead0; }
              .loader-bar { width: 100%; height: 9px; border-radius: 999px; background: rgba(255,255,255,0.1); border: 1px solid rgba(246,196,69,0.45); overflow: hidden; padding: 1px; }
              #loaderFill { width: 0%; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #5ed128, #a7f554, #f6c445); transition: width 0.12s linear; }
              #loaderTip { font-size: 10.5px; color: var(--text-muted); text-align: center; }

              /* 2. LOBBY */
              #lobbyScreen { position: fixed; inset: 0; z-index: 30; display: none; pointer-events: none; }
              #lobbyTopBar { position: absolute; top: 10px; left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right)); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
              #profileBadge { pointer-events: auto; display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; border-radius: 13px; cursor: pointer; }
              .avatar-box { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(145deg,#2d4f27,#132211); border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; font-size: 18px; position: relative; }
              .lvl-tag { position: absolute; bottom: -4px; right: -4px; background: linear-gradient(135deg,#ffe26e,#c98314); color: #171002; font-size: 8px; font-weight: 900; padding: 1px 4px; border-radius: 4px; }
              .top-right-tools { pointer-events: auto; display: flex; align-items: center; gap: 6px; }
              .curr-pill { display: flex; align-items: center; gap: 4px; padding: 5px 9px; border-radius: 10px; font-size: 11.5px; font-weight: 900; cursor: pointer; }
              .curr-pill.dia { border-color: rgba(97,228,255,0.45); color: #9cf4ff; }
              .tool-btn { pointer-events: auto; width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #edf7e8; font-size: 14px; cursor: pointer; }
              #lobbyRail { position: absolute; left: max(12px, env(safe-area-inset-left)); top: 53%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; pointer-events: auto; }
              .rail-item { display: flex; align-items: center; gap: 8px; padding: 8px 13px; border-radius: 11px; color: #ebf5e7; font-size: 10.5px; font-weight: 800; text-transform: uppercase; cursor: pointer; }
              .rail-item.shop-hl { border-color: rgba(97,228,255,0.55); background: linear-gradient(135deg, rgba(20,62,78,0.88), rgba(10,24,20,0.88)); color: #aef6ff; }
              .rail-item:active { transform: scale(0.95); }
              #showcasePill { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); padding: 7px 16px; border-radius: 999px; display: flex; align-items: center; gap: 10px; pointer-events: auto; cursor: pointer; white-space: nowrap; }
              #startCluster { position: absolute; bottom: 14px; right: max(14px, env(safe-area-inset-right)); display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: auto; }
              .mode-pill { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 10px; font-size: 10.5px; font-weight: 800; cursor: pointer; }
              .mode-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
              #btnStartMatch { width: 178px; height: 46px; padding: 0; font-size: 15px; }

              /* MODALS — ZERO OVERLAP FIXED FLEX LAYOUT */
              #matchmakingOverlay, .modal-backdrop, #tacMapOverlay, #payModal { position: fixed; inset: 0; z-index: 80; display: none; align-items: center; justify-content: center; padding: 10px; background: rgba(5,10,6,0.85); backdrop-filter: blur(8px); }
              #payModal { z-index: 100; }
              #matchmakingOverlay.open, .modal-backdrop.open, #tacMapOverlay.open, #payModal.open { display: flex; }
              .mm-card { padding: 20px 26px; border-radius: 18px; text-align: center; max-width: 340px; width: 88%; }
              .mm-spin { width: 42px; height: 42px; margin: 0 auto 10px; border-radius: 50%; border: 4px solid rgba(246,196,69,0.22); border-top-color: var(--gold); animation: spin 0.72s linear infinite; }
              @keyframes spin { to { transform: rotate(360deg); } }

              .modal-box {
                width: 100%; max-width: 820px; height: 90vh; max-height: 90vh; border-radius: 18px;
                display: flex; flex-direction: column; overflow: hidden;
                background: linear-gradient(165deg, rgba(16,27,17,0.99), rgba(9,15,10,0.99));
                border: 1px solid rgba(168,222,128,0.34);
              }
              .modal-head {
                flex-shrink: 0; position: relative; z-index: 10;
                display: flex; align-items: center; justify-content: space-between;
                padding: 10px 14px; background: #0d170e; border-bottom: 1px solid rgba(255,255,255,0.1);
              }
              .modal-title { font-size: 13.5px; font-weight: 900; letter-spacing: 1.3px; text-transform: uppercase; color: var(--gold); }
              .close-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: #fff; font-size: 15px; cursor: pointer; }
              .modal-tabs {
                flex-shrink: 0; position: relative; z-index: 10;
                display: flex; gap: 6px; padding: 8px 12px; background: #0a120b;
                border-bottom: 1px solid rgba(255,255,255,0.08); overflow-x: auto;
              }
              .tab-btn { padding: 7px 13px; border-radius: 9px; border: 1px solid transparent; background: rgba(255,255,255,0.06); color: var(--text-muted); font-size: 10.5px; font-weight: 800; text-transform: uppercase; white-space: nowrap; cursor: pointer; }
              .tab-btn.active { background: rgba(246,196,69,0.22); border-color: var(--gold); color: #fff; }
              .modal-body {
                flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
                padding: 12px 14px; position: relative; z-index: 1;
              }
              .tab-pane { display: none; }
              .tab-pane.active { display: block; }
              .section-lbl { font-size: 10px; font-weight: 800; letter-spacing: 1.1px; text-transform: uppercase; color: var(--text-muted); margin: 8px 0 6px; }
              .text-input { width: 100%; padding: 7px 10px; border-radius: 9px; border: 1px solid rgba(168,222,128,0.36); background: rgba(6,12,7,0.85); color: #fff; font-size: 13px; font-weight: 800; outline: none; }
              .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
              .chip { padding: 5px 10px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.06); color: #dcead7; font-size: 11px; font-weight: 700; cursor: pointer; }
              .chip.selected { border-color: var(--gold); background: rgba(246,196,69,0.24); color: #fff; }
              .armory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: 9px; }
              .card-item { padding: 10px; border-radius: 13px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.12); display: flex; flex-direction: column; gap: 6px; cursor: pointer; position: relative; }
              .card-item.selected { border-color: var(--gold); background: rgba(246,196,69,0.12); }
              .card-item.mythic { border-color: rgba(97,228,255,0.42); background: linear-gradient(150deg, rgba(30,18,52,0.68), rgba(10,22,28,0.75)); }
              .card-item.mythic.selected { border-color: var(--diamond); }
              .card-item.inr-card { border-color: rgba(124,232,70,0.48); background: linear-gradient(150deg, rgba(16,44,24,0.72), rgba(8,18,14,0.8)); }
              .tier-badge { font-size: 8px; font-weight: 900; padding: 2px 6px; border-radius: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
              .price-line { font-size: 10.5px; font-weight: 900; color: #ffe47a; text-align: center; }
              .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; margin-bottom: 10px; }
              .stat-box { padding: 8px; border-radius: 11px; background: rgba(0,0,0,0.34); border: 1px solid rgba(255,255,255,0.08); text-align: center; }
              .stat-val { font-size: 16px; font-weight: 900; color: var(--green); }
              .stat-lbl { font-size: 8.5px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin-top: 2px; }
              .setting-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; border-radius: 11px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); margin-bottom: 7px; gap: 10px; }
              .xp-track { width: 100%; height: 7px; border-radius: 999px; background: rgba(255,255,255,0.1); overflow: hidden; margin-top: 4px; }
              .xp-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #62de3a, #f6c445); }
              .shop-banner { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 12px; background: linear-gradient(135deg, rgba(20,54,68,0.7), rgba(16,32,20,0.7)); border: 1px solid rgba(97,228,255,0.35); margin-bottom: 10px; }

              /* 3. IN-GAME HUD */
              #hud { position: fixed; inset: 0; z-index: 20; display: none; pointer-events: none; }
              #stormVignette { position: absolute; inset: 0; box-shadow: inset 0 0 90px rgba(255,48,36,0.72); opacity: 0; transition: opacity 0.25s; }
              #hudTopLeft { position: absolute; top: 8px; left: max(10px, env(safe-area-inset-left)); display: flex; align-items: flex-start; gap: 8px; }
              #minimapBox {
                pointer-events: auto; cursor: pointer; position: relative;
                width: 96px; height: 96px; border-radius: 14px; padding: 3px;
                background: rgba(8, 15, 10, 0.88); border: 2px solid rgba(164, 224, 124, 0.55);
                box-shadow: 0 6px 20px rgba(0,0,0,0.65); flex-shrink: 0;
              }
              #minimapCanvas { width: 100%; height: 100%; border-radius: 10px; display: block; }
              .map-scale-tag {
                position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%);
                background: #102414; border: 1px solid var(--gold); color: var(--gold);
                font-size: 7.5px; font-weight: 900; padding: 1px 6px; border-radius: 6px; white-space: nowrap;
              }
              .tl-tags { display: flex; flex-direction: column; gap: 4px; }
              #regionPill { padding: 3px 8px; border-radius: 8px; font-size: 9px; font-weight: 900; letter-spacing: 0.6px; text-transform: uppercase; color: #ffe382; width: fit-content; }
              #envPill { padding: 3px 8px; border-radius: 8px; font-size: 8.5px; font-weight: 800; color: #b8e8ff; width: fit-content; }
              #terrainTag { display: none; padding: 3px 8px; border-radius: 8px; font-size: 8.5px; font-weight: 900; text-transform: uppercase; width: fit-content; }
              #fpsPill { display: none; padding: 2px 7px; border-radius: 7px; font-size: 8.5px; font-weight: 900; color: #84ff54; width: fit-content; }

              #hudTopCenter {
                position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
                display: flex; flex-direction: column; align-items: center; gap: 4px; width: 260px;
              }
              .br-stats-bar { display: flex; align-items: center; justify-content: space-around; gap: 8px; width: 100%; padding: 5px 10px; border-radius: 11px; }
              .br-stat { display: flex; align-items: baseline; gap: 4px; font-size: 8.5px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; }
              .br-stat strong { font-size: 13px; font-weight: 900; color: #fff; font-variant-numeric: tabular-nums; }
              .zone-pill { display: flex; align-items: center; gap: 8px; padding: 3px 10px; border-radius: 999px; font-size: 9.5px; font-weight: 800; color: #b8f2ff; }
              #shieldBadge { display: none; padding: 3px 10px; border-radius: 999px; background: rgba(77,226,240,0.22); border: 1px solid var(--cyan); color: #baf8ff; font-size: 9px; font-weight: 900; }
              #dropAlert { display: none; padding: 3px 10px; border-radius: 999px; background: rgba(246,196,69,0.22); border: 1px solid var(--gold); color: #ffe98a; font-size: 9px; font-weight: 900; }

              #hudTopRight { position: absolute; top: 8px; right: max(10px, env(safe-area-inset-right)); display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
              .tr-tools { display: flex; gap: 5px; pointer-events: auto; }
              #killFeed { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; max-width: 195px; }
              .kf-entry { padding: 3px 7px; border-radius: 7px; background: rgba(10,17,11,0.84); border-right: 3px solid var(--gold); font-size: 9px; font-weight: 700; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 195px; }

              .tac-card { padding: 12px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 7px; }
              #tacMapCanvas { width: min(74vh, 360px); height: min(74vh, 360px); border-radius: 12px; border: 2px solid rgba(164,224,124,0.5); background: #0c180d; display: block; }

              #controlsHint {
                position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
                padding: 4px 12px; border-radius: 999px; background: rgba(8,14,9,0.84); border: 1px solid rgba(246,196,69,0.4);
                color: #ffe8a3; font-size: 9.5px; font-weight: 800; white-space: nowrap; transition: opacity 0.8s;
              }
              #floatingJoy { position: absolute; width: 108px; height: 108px; margin-left: -54px; margin-top: -54px; border-radius: 50%; background: rgba(12,24,14,0.44); border: 2px solid rgba(176,232,148,0.48); opacity: 0; pointer-events: none; transition: opacity 0.14s; }
              #floatingJoy.visible { opacity: 1; }
              #floatingJoy.fixed-mode { left: 82px !important; top: calc(100% - 82px) !important; opacity: 0.88 !important; }
              #floatingJoyKnob { position: absolute; top: 50%; left: 50%; width: 42px; height: 42px; border-radius: 50%; transform: translate(-50%,-50%); background: radial-gradient(circle at 35% 30%, #d4ffaa, #589c34 72%, #295218); border: 2px solid rgba(245,255,238,0.85); }
              #btnRecenter { pointer-events: auto; position: absolute; right: 175px; bottom: 18px; width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(77,226,240,0.82); background: rgba(14,34,40,0.88); color: #b8f7ff; font-size: 16px; display: none; align-items: center; justify-content: center; cursor: pointer; }

              #abilityCluster { position: absolute; bottom: 12px; right: max(14px, env(safe-area-inset-right)); width: 152px; height: 146px; pointer-events: none; }
              .ab-btn { pointer-events: auto; position: absolute; border-radius: 50%; border: 2px solid rgba(232,255,214,0.58); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; font-weight: 900; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,0.55); overflow: hidden; }
              .ab-btn:active, .ab-btn.active { transform: scale(0.91); }
              .ab-btn.on-cd { filter: saturate(0.35) brightness(0.72); }
              #btnBoost { width: 72px; height: 72px; right: 2px; bottom: 2px; background: radial-gradient(circle at 30% 25%, #ffc857, #d96b14 72%, #8a3605); }
              #btnVenom { width: 56px; height: 56px; right: 10px; bottom: 82px; background: radial-gradient(circle at 30% 25%, #8cf748, #2da318 72%, #14590a); }
              #btnCamo  { width: 56px; height: 56px; right: 82px; bottom: 10px; background: radial-gradient(circle at 30% 25%, #69d9c6, #1f7d6e 72%, #0e423a); }
              .ab-lbl { font-size: 8px; text-transform: uppercase; margin-top: 2px; }
              .cd-svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); pointer-events: none; }
              .cd-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.55); font-size: 15px; font-weight: 900; opacity: 0; pointer-events: none; }
              .ab-btn.on-cd .cd-num { opacity: 1; }

              #resultsScreen { position: fixed; inset: 0; z-index: 90; display: none; align-items: center; justify-content: center; padding: 14px; background: rgba(5,9,6,0.92); backdrop-filter: blur(8px); }
              #resultsScreen.open { display: flex; }
              .results-box { width: 100%; max-width: 490px; padding: 18px 22px; border-radius: 20px; text-align: center; }
              .res-title { font-size: clamp(20px, 4vw, 28px); font-weight: 900; letter-spacing: 2px; background: linear-gradient(180deg,#fff9d2,#f6c445 55%,#b57210); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
              .res-sub { font-size: 11.5px; color: #ff9c8a; font-weight: 700; margin: 4px 0 10px; }
              .reward-row { display: flex; justify-content: center; gap: 8px; margin: 8px 0 10px; flex-wrap: wrap; }
              .reward-tag { padding: 6px 11px; border-radius: 10px; font-size: 11.5px; font-weight: 900; background: rgba(246,196,69,0.14); border: 1px solid rgba(246,196,69,0.45); color: #ffe382; }
              .res-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
            </style>
          </head>
          <body>
            <canvas id="gameCanvas"></canvas>

            <div id="splashScreen">
