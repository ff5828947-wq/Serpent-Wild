              .prof-rank-9  { border-color: #2ec4b6 !important; animation: prGlow9 2.6s ease-in-out infinite; }
              .prof-rank-10 { border-color: #dce8f5 !important; animation: prGlow10 2.7s ease-in-out infinite; }

              #introScreen {
                position: fixed; inset: 0; z-index: 160; display: flex; flex-direction: column;
                align-items: center; justify-content: center; gap: 10px;
                background: radial-gradient(circle at 50% 45%, #237a27 0%, #0d3d14 60%, #041707 100%);
                transition: opacity 0.45s ease, transform 0.45s ease;
              }
              #introScreen.hide { opacity: 0; transform: scale(1.08); pointer-events: none; }
              #introCanvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
              .intro-logo-ring {
                position: relative; z-index: 2; width: 108px; height: 108px; border-radius: 50%;
                border: 3px solid #ffe259; background: radial-gradient(circle, #32a838, #0f4716);
                display: flex; align-items: center; justify-content: center; font-size: 54px;
                box-shadow: 0 0 36px rgba(105, 240, 58, 0.65);
                animation: introPop 0.9s cubic-bezier(0.22, 1.3, 0.36, 1) forwards;
              }
              @keyframes introPop { 0% { transform: scale(0.3) rotate(-25deg); opacity: 0; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
              .intro-title {
                position: relative; z-index: 2; font-size: clamp(28px, 5.5vw, 52px); font-weight: 900; letter-spacing: 3px;
                background: linear-gradient(180deg, #fffbe0 0%, #ffd23f 55%, #e67e00 100%);
