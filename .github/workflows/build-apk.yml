                  c.fillStyle = 'rgba(0,0,0,0.28)';
                  c.beginPath();
                  c.moveTo(bx + cr + 3, by + 4); c.lineTo(bx + box - cr + 3, by + 4);
                  c.quadraticCurveTo(bx + box + 3, by + 4, bx + box + 3, by + cr + 4);
                  c.lineTo(bx + box + 3, by + box - cr + 4);
                  c.quadraticCurveTo(bx + box + 3, by + box + 4, bx + box - cr + 3, by + box + 4);
                  c.lineTo(tx + tw + 3, by + box + 4); c.lineTo(tx - tw * 0.18 + 3, by + box + th + 4); c.lineTo(tx + 3, by + box + 4);
                  c.lineTo(bx + cr + 3, by + box + 4);
                  c.quadraticCurveTo(bx + 3, by + box + 4, bx + 3, by + box - cr + 4);
                  c.lineTo(bx + 3, by + cr + 4);
                  c.quadraticCurveTo(bx + 3, by + 4, bx + cr + 3, by + 4);
                  c.closePath(); c.fill();

                  c.fillStyle = '#ffffff';
                  c.strokeStyle = em.tier === 'diamond' ? '#ffd23f' : (em.tier === 'glow' ? em.glow : '#1b3554');
                  c.lineWidth = isLobby ? 2.8 : 2.2;
                  c.beginPath();
                  c.moveTo(bx + cr, by); c.lineTo(bx + box - cr, by);
                  c.quadraticCurveTo(bx + box, by, bx + box, by + cr);
                  c.lineTo(bx + box, by + box - cr);
                  c.quadraticCurveTo(bx + box, by + box, bx + box - cr, by + box);
                  c.lineTo(tx + tw, by + box); c.lineTo(tx - tw * 0.18, by + box + th); c.lineTo(tx, by + box);
                  c.lineTo(bx + cr, by + box);
                  c.quadraticCurveTo(bx, by + box, bx, by + box - cr);
                  c.lineTo(bx, by + cr);
                  c.quadraticCurveTo(bx, by, bx + cr, by);
                  c.closePath(); c.fill(); c.stroke();

                  drawCustomEmoji(c, em, cx, cy, box * 0.37, globalTime);
                  c.restore();
                }

