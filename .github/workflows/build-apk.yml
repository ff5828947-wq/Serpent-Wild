                  { id: 'amazon', name: 'Amazon Rainforest', floor: '#1c2b16', moss: 'rgba(54,96,34,0.42)', soil: 'rgba(66,48,29,0.34)', water: 'rgba(26,136,148,0.82)', mud: '#362415' },
