                    c.beginPath(); c.ellipse(0, 0, 16, 11, 0, 0, Math.PI * 2); c.fill(); c.stroke();
                    for (const s of [-1, 1]) { c.fillStyle = '#bfa68e'; c.beginPath(); c.ellipse(-2, s * 10, 10, 3.5, s * 0.35, 0, Math.PI * 2); c.fill(); c.fillStyle = '#f2b8c6'; c.beginPath(); c.ellipse(-2, s * 10, 7, 1.8, s * 0.35, 0, Math.PI * 2); c.fill(); }
                    c.fillStyle = '#ff859b'; c.beginPath(); c.arc(15, 0, 2.8, 0, Math.PI * 2); c.fill();
                    c.fillStyle = '#111'; c.beginPath(); c.arc(10, -5, 2, 0, Math.PI * 2); c.arc(10, 5, 2, 0, Math.PI * 2); c.fill();
                  } else if (p.id === 'mouse') {
                    c.strokeStyle = '#d99898'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(-13, 0); c.lineTo(-28, Math.sin(globalTime * 10 + p.x) * 5); c.stroke();
                    c.fillStyle = '#a89684'; c.strokeStyle = '#423930'; c.lineWidth = 1.1; c.beginPath(); c.ellipse(0, 0, 15, 10, 0, 0, Math.PI * 2); c.fill(); c.stroke();
                    c.fillStyle = '#e3a8a8'; c.beginPath(); c.arc(7, -8, 4.2, 0, Math.PI * 2); c.arc(7, 8, 4.2, 0, Math.PI * 2); c.fill();
                    c.fillStyle = '#ff8a98'; c.beginPath(); c.arc(15, 0, 2.5, 0, Math.PI * 2); c.fill();
                  } else if (p.id === 'gecko') {
                    c.strokeStyle = '#6ec736'; c.lineWidth = 5; c.lineCap = 'round'; c.beginPath(); c.moveTo(-11, 0); c.lineTo(-28, Math.sin(globalTime * 12 + p.y) * 6); c.stroke();
                    c.fillStyle = '#85db42'; c.beginPath(); c.ellipse(0, 0, 15, 7, 0, 0, Math.PI * 2); c.fill();
