                  init() {
                    try {
                      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
                      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
                      this.startBgm();
                    } catch (e) {}
                  },
                  startBgm() {
                    if (this.bgmTimer) return;
                    const melody = [293.66, 349.23, 440.0, 392.0, 349.23, 329.63, 293.66, 220.0, 293.66, 349.23, 440.0, 523.25, 440.0, 392.0, 349.23, 329.63];
                    const bass   = [146.83, 146.83, 174.61, 174.61, 130.81, 130.81, 110.0, 110.0];
                    this.bgmTimer = setInterval(() => {
                      if (!this.ctx || profile.settings.muted || !profile.settings.bgm) return;
                      const vol = profile.settings.sfxVol * 0.045;
                      if (vol <= 0.001) return;
                      const note = melody[this.bgmStep % melody.length];
                      const bNote = bass[Math.floor(this.bgmStep / 2) % bass.length];
                      this.tone(note, note * 0.995, 0.24, 'triangle', vol);
                      if (this.bgmStep % 2 === 0) this.tone(bNote, bNote * 0.98, 0.36, 'sine', vol * 1.15);
                      this.bgmStep++;
                    }, 310);
                  },
                  tone(f1, f2, dur, type = 'sine', g = 0.1) {
                    const v = profile.settings.muted ? 0 : profile.settings.sfxVol;
                    if (v <= 0 || !this.ctx) return;
                    try {
                      const t = this.ctx.currentTime, o = this.ctx.createOscillator(), gn = this.ctx.createGain();
                      o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + dur);
                      gn.gain.setValueAtTime(g * v, t); gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
                      o.connect(gn); gn.connect(this.ctx.destination); o.start(t); o.stop(t + dur);
                    } catch (e) {}
                  },
                  click()  { this.tone(560, 820, 0.05, 'triangle', 0.08); },
                  buy()    { this.tone(520, 880, 0.12, 'triangle', 0.12); setTimeout(() => this.tone(880, 1180, 0.15, 'triangle', 0.12), 80); },
