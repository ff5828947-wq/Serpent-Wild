                function drawSkinAccessory(c, skin, hr, layer) {
                  const acc = skin.acc;
                  c.save();
                  if (layer === 'back') {
                    if (acc === 'foxEars' || acc === 'catEars' || acc === 'horseEars' || acc === 'batEars') {
                      const eLen = acc === 'batEars' ? 1.58 : (acc === 'foxEars' ? 1.38 : 1.26);
                      for (const s of [-1, 1]) {
                        c.fillStyle = acc === 'batEars' ? skin.dark : skin.mid;
                        c.strokeStyle = 'rgba(0,0,0,0.45)'; c.lineWidth = 1.3;
                        c.beginPath(); c.moveTo(-hr * 0.1, s * hr * 0.72); c.lineTo(-hr * 0.85, s * hr * eLen); c.lineTo(-hr * 0.78, s * hr * 0.32); c.closePath(); c.fill(); c.stroke();
                        c.fillStyle = acc === 'catEars' ? '#ff94b8' : skin.accent;
                        c.beginPath(); c.moveTo(-hr * 0.24, s * hr * 0.7); c.lineTo(-hr * 0.68, s * hr * (eLen * 0.82)); c.lineTo(-hr * 0.64, s * hr * 0.45); c.closePath(); c.fill();
                      }
                    } else if (acc === 'frill') {
                      const pulse = 1 + 0.14 * Math.sin(globalTime * 10);
                      for (const s of [-1, 1]) {
