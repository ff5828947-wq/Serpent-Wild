                        if (acc !== 'pandaEars') { c.fillStyle = skin.accent; c.beginPath(); c.arc(-hr * 0.48, s * hr * 0.88, hr * 0.18, 0, Math.PI * 2); c.fill(); }
                      }
                    } else if (acc === 'dragHorn' || acc === 'horns') {
                      c.fillStyle = acc === 'dragHorn' ? skin.accent : '#e8dfd0'; c.strokeStyle = skin.dark; c.lineWidth = 1.3;
                      for (const s of [-1, 1]) {
                        c.beginPath(); c.moveTo(-hr * 0.1, s * hr * 0.68); c.quadraticCurveTo(-hr * 0.85, s * hr * 1.4, -hr * 1.52, s * hr * 1.05);
                        c.quadraticCurveTo(-hr * 0.85, s * hr * 0.92, -hr * 0.55, s * hr * 0.45); c.closePath(); c.fill(); c.stroke();
                      }
