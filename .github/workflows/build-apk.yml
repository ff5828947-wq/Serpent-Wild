                function openCalendar() {
                  const now = new Date();
                  const y = now.getFullYear(), m = now.getMonth(), todayD = now.getDate();
                  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
                  document.getElementById('calMonthLbl').textContent = `${months[m]} ${y}`;

                  let streak = 0;
                  for (let i = 0; i < 60; i++) {
                    const d = new Date(y, m, todayD - i);
                    const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                    if (profile.playedDates.includes(iso)) streak++; else break;
                  }
                  document.getElementById('calStreakLbl').textContent = `🔥 Streak: ${streak} Day${streak === 1 ? '' : 's'}`;

                  const grid = document.getElementById('calGrid');
                  grid.innerHTML = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<div class="cal-hdr">${d}</div>`).join('');
                  const firstDay = new Date(y, m, 1).getDay();
                  const daysInMonth = new Date(y, m + 1, 0).getDate();

                  for (let i = 0; i < firstDay; i++) grid.innerHTML += '<div></div>';
                  for (let d = 1; d <= daysInMonth; d++) {
                    const iso = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    const played = profile.playedDates.includes(iso);
                    const isToday = d === todayD;
                    const isPast = d < todayD;
                    const cls = played ? 'played' : (isPast ? 'missed' : '');
                    const mark = played ? '✅' : (isPast ? '❌' : '·');
                    grid.innerHTML += `<div class="cal-day ${cls}${isToday ? ' today' : ''}"><span>${d}</span><span style="font-size:10px;">${mark}</span></div>`;
                  }
                  document.getElementById('calendarModal').classList.add('open');
                  Sound.play('click');
                }

