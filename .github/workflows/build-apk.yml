                        this.sfxGain = this.ctx.createGain();
                        this.sfxGain.connect(this.ctx.destination);
                        this.bufs.click  = this.makeToneBuf(500, 720, 0.05, 0.14);
                        this.bufs.eat    = this.makeToneBuf(340, 540, 0.06, 0.14);
                        this.bufs.potion = this.makeToneBuf(460, 880, 0.16, 0.18);
                        this.bufs.kill   = this.makeToneBuf(420, 820, 0.16, 0.18);
                        this.bufs.buy    = this.makeToneBuf(520, 980, 0.18, 0.18);
                        this.bufs.drop   = this.makeToneBuf(480, 760, 0.22, 0.16);
                        this.bufs.win    = this.makeToneBuf(523, 1046, 0.35, 0.2);
                        this.bufs.over   = this.makeToneBuf(240, 85, 0.35, 0.2);
                      }
                      if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
                      this.updateVol();
                    } catch (e) {}
                  },
                  pause() { try { if (this.ctx && this.ctx.state === 'running') this.ctx.suspend().catch(() => {}); } catch (e) {} },
                  resume() { try { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); } catch (e) {} },
                  makeToneBuf(f1, f2, dur, vol = 0.16) {
