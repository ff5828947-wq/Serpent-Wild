                  } else if (bt === 'lavaArmor') {
                    const sz = sr * 1.94, magma = 0.6 + 0.4 * Math.sin(t * 8.5 - idx * 0.5);
                    c.fillStyle = '#240b04'; c.strokeStyle = '#ff6b1a'; c.lineWidth = 2.2;
                    c.beginPath(); c.roundRect ? c.roundRect(-sz / 2, -sz / 2, sz, sz, sr * 0.38) : c.rect(-sz / 2, -sz / 2, sz, sz); c.fill(); c.stroke();
                    c.strokeStyle = '#ffae00'; c.lineWidth = 1.8; c.globalAlpha = magma;
                    c.beginPath(); c.moveTo(-sr * 0.65, -sr * 0.5); c.lineTo(0, 0); c.lineTo(sr * 0.65, -sr * 0.45); c.moveTo(0, 0); c.lineTo(0, sr * 0.7); c.stroke();
                    c.fillStyle = '#fff080'; c.beginPath(); c.arc(0, 0, sr * (0.36 + 0.1 * magma), 0, Math.PI * 2); c.fill();
                    c.globalAlpha = 1;
