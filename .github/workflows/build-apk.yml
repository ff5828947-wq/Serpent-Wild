                  init() {
                    try {
                      if (window.AndroidAudio) {
                        window.AndroidAudio.startBgm(!profile.settings.muted && profile.settings.bgm, 0.65);
                        window.AndroidAudio.setNotifications(profile.settings.notifs);
                      }
                      if (!this.ctx) {
                        const AC = window.AudioContext || window.webkitAudioContext;
                        if (!AC) return;
                        this.ctx = new AC();
                        this.sfxGain = this.ctx.createGain();
                        this.sfxGain.connect(this.ctx.destination);
                        this.bufs.click  = this.makeBuf(520, 760, 0.05, 0.14);
                        this.bufs.eat    = this.makeBuf(420, 680, 0.05, 0.12);
                        this.bufs.potion = this.makeBuf(480, 920, 0.16, 0.18);
