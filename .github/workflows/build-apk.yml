                  { id: 'python',   name: 'Shadow Python',       head: 'python',   hood: false, rattle: false, horns: false, base: '#2c253d', dark: '#0d0b14', stripe: '#9970d6', belly: '#524966', eye: '#d68cff', speed: 82, turn: 80, bonusHp: 15, girth: 1.12, trait: 'Oil-Slick Scales • +20% Prey Heal & Mass', price: 450 },
                  { id: 'anaconda', name: 'Golden Anaconda',     head: 'anaconda', hood: false, rattle: false, horns: false, base: '#99892c', dark: '#36300c', stripe: '#1c1908', belly: '#d6c86b', eye: '#ffb829', speed: 77, turn: 76, bonusHp: 40, girth: 1.24, trait: 'Titan Girth • +40 Max HP & Fast Swimmer', price: 700 },
                  { id: 'krait',    name: 'Crimson Krait',       head: 'krait',    hood: false, rattle: false, horns: false, base: '#c41d1d', dark: '#141014', stripe: '#ffdb57', belly: '#e8d8b5', eye: '#ffe954', speed: 90, turn: 88, bonusHp: 10, girth: 0.96, trait: 'Glossy Bands • Fastest Venom Cooldown', price: 900 }
